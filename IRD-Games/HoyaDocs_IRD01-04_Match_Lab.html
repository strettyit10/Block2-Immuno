<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRD01–04 Match Lab · HoyaDocs</title>
<meta name="description" content="HoyaDocs IRD01–04 Match Lab: Immune Foundations, Innate &amp; Cytokines. Rapid Fire matching and Grid Lock charts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* HoyaDocs Match Lab engine v1.0
   Layout: header + mode tabs; Home (mode cards, filters, mastery), Rapid Fire (one match per card), Grid Lock (chart + tile bank).
   Colors are tokens on :root with a dark set. Every view stacks to one column on phones. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#1A3363; --muted:#5B6274; --line:#D3D8E0; --chip:#E6E9EE;
  --navy:#0F2244; --navy2:#1A3363; --onnavy:#F4F1EA; --silver:#6E7787; --tan:#5AAEE6;
  --neuro:#5B4BC4; --path:#1F7F78; --drt:#C4631B; --pharm:#2368A8; --imm:#5B4BC4; --mic:#4D7C2A; --accent:#1D6FA8; --accent-ink:#ffffff;
  --ok:#1d7a3e; --ok-bg:#e3f4e8; --bad:#b3261e; --bad-bg:#fbe7e5; --once:#b7791f; --once-bg:#fdf1dc;
  --hy-bg:#FFF4C2; --hy-line:#D4A300; --hy-ink:#5E4700;
  --k1:#2c55a0; --k2:#6b46c1; --k3:#a02c4f; --k4:#b45309; --k5:#0f6b6b; --k6:#85600f; --k7:#1d7a3e; --k8:#0369a1;
  --given:#f5f7f9; --lock:#e9ecef; --clue-bg:#e3ecfa; --clue-ink:#1d3f7a; --clue-line:#9db6e3;
  --f-display:"Graduate","Rockwell","Georgia",serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#A99CF0; --path:#5CC2B8; --drt:#F0A060; --pharm:#7FB3EA; --imm:#A99CF0; --mic:#8CC06A; --navy:#0A1830; --navy2:#13284d; --onnavy:#F4F1EA; --silver:#9aa6b2; --tan:#5AAEE6; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#A99CF0; --path:#5CC2B8; --drt:#F0A060; --pharm:#7FB3EA; --imm:#A99CF0; --mic:#8CC06A; --navy:#0A1830; --navy2:#13284d; --onnavy:#F4F1EA; --silver:#9aa6b2; --tan:#5AAEE6; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15.5px/1.55 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 56px;display:grid;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:.03em}
h3{font-family:var(--f-mono);font-weight:800;letter-spacing:.03em}
/* HoyaDocs hub shell: wordmark bar, section nav, navy varsity hero */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 0 0}
.word{font-family:var(--f-display);font-size:24px;letter-spacing:.04em;text-decoration:none;color:var(--ink);line-height:1}
.word span{color:var(--silver)}
.rev{font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.topr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.themebtn{background:transparent;border:1.5px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:5px 14px;cursor:pointer}
.themebtn:hover{color:var(--ink);border-color:var(--ink)}
.hubnav{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;border-top:3px solid var(--ink);border-bottom:1px solid var(--line)}
.hubnav::-webkit-scrollbar{display:none}
.hubnav a{flex:none;text-decoration:none;font-family:var(--f-mono);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:11px 12px 9px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
.hubnav a:hover{color:var(--ink)}
.hubnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--tan)}
.hubnav a i{width:9px;height:9px;border-radius:2px;flex:none}
.hubnav .sep{flex:none;width:1px;background:var(--line);margin:9px 6px}
header.hero{background:var(--navy);color:var(--onnavy);border-radius:14px;padding:clamp(20px,3.5vw,36px) clamp(20px,4vw,40px);position:relative;overflow:hidden}
header.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(255,255,255,.045) calc(10% - 1px) 10%),radial-gradient(ellipse at 88% 115%, rgba(90,174,230,.34), transparent 58%)}
header.hero > *{position:relative}
.hero .k{font-family:var(--f-mono);font-weight:700;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:#8FCBF5}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5.4vw,52px);line-height:1.02;letter-spacing:.02em;margin:10px 0 4px;color:#F4F1EA;text-shadow:2px 2px 0 #1A3363,4px 4px 0 #5AAEE6}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.meta{font:500 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
header.top h1{font-size:clamp(1.5rem,3.4vw,2rem)}
header.top .lede{margin:4px 0 0;color:var(--muted);max-width:66ch}
.back{font:600 .8rem var(--f-body);text-decoration:none;color:var(--muted)}
.back:hover{color:var(--ink)}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .86rem var(--f-body);background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:.8rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:700 .82rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:1.15rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.mode-card{display:grid;gap:10px;align-content:start}
.mode-card .k{font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mode-card h2{font-size:1.45rem}
.mode-card p{margin:0;color:var(--muted)}
.opts{display:grid;gap:8px}
.optrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.optrow .lab{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:76px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:600 .8rem var(--f-body);border:0;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .78rem var(--f-body);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.chip[aria-pressed="false"]{opacity:.5;text-decoration:line-through;text-decoration-color:var(--muted)}
.chip .n{font:500 .7rem var(--f-mono);color:var(--muted)}
.statrow{display:flex;flex-wrap:wrap;gap:18px}
.stat b{display:block;font:700 1.25rem var(--f-body);font-variant-numeric:tabular-nums}
.stat span{font:500 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.lecrow{display:grid;grid-template-columns:auto minmax(0,1fr) 120px auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.lecrow:first-of-type{border-top:0}
.lecrow .pct{font:500 .75rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
@media (max-width:560px){.lecrow{grid-template-columns:auto minmax(0,1fr) auto}.lecrow .bar{grid-column:1/-1;order:5}}
.tag{font:600 .68rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;color:#fff;background:var(--lc,var(--neuro));white-space:nowrap}
:root[data-theme="dark"] .tag{color:#0d1520}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag{color:#0d1520} }
.hy{font:700 .66rem var(--f-mono);letter-spacing:.06em;background:var(--hy-bg);color:var(--hy-ink);border:1px solid var(--hy-line);border-radius:5px;padding:1px 6px}
.hybox{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.hybox b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
details.how{font-size:.9rem}
details.how summary{cursor:pointer;font-weight:700}
details.how ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
details.how li{margin:3px 0}

/* Rapid fire */
.rf-top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.timer{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.timer i.low{background:var(--bad)}
.qcard{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kind{font:700 .72rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--kc);border:1.5px solid var(--kc);border-radius:6px;padding:2px 8px}
.qset{font-size:.82rem;color:var(--muted)}
.prompt-lab{font:500 .7rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prompt{font:600 clamp(1.15rem,2.6vw,1.4rem)/1.35 var(--f-body);margin:2px 0 0}
.ask{font-size:.88rem;color:var(--muted);margin:0}
.options{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:.95rem;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .key{font:500 .75rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;height:24px;display:grid;place-items:center}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:8px;font-size:.92rem}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb h3{font:800 1.05rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.fb p{margin:0}
.fb .also{font-size:.86rem;color:var(--muted)}
.fb .also b{color:var(--ink)}
.navrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.kbd{font:500 .72rem var(--f-mono);color:var(--muted)}
/* sequence */
.seq-done{display:grid;gap:6px;counter-reset:s;padding:0;margin:0;list-style:none}
.seq-done li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;background:var(--ok-bg);border:1px solid var(--ok);border-radius:8px;padding:7px 10px;font-size:.92rem}
.seq-done li::before{content:counter(s);font:700 .8rem var(--f-mono);color:var(--ok);text-align:center}
.seq-done li.slot{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.seq-done li.slot::before{color:var(--muted)}
.seq-pool{display:grid;gap:6px}
.seq-pool .opt{grid-template-columns:minmax(0,1fr)}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
/* end */
.end{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.big{font:700 clamp(2rem,6vw,3rem)/1 var(--f-display)}
.misslist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.misslist li{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:8px 12px;font-size:.9rem;background:var(--surface)}
.misslist .a{font-weight:700}
.misslist .b{color:var(--muted)}

/* Grid list */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start}
.gcard:hover{border-color:var(--accent)}
.gcard h3{font-size:1.02rem}
.gcard p{margin:0;font-size:.84rem;color:var(--muted)}
.gcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 .72rem var(--f-mono);color:var(--muted)}
.stars{font-size:.85rem;letter-spacing:1px;color:var(--once)}
.stars .off{color:var(--line)}
/* Grid play */
.gwrap{display:grid;gap:12px}
.gtable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.gt{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
.gt th{font:700 .74rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--sunk);vertical-align:bottom}
.gt th small{display:block;font:500 .66rem var(--f-mono);letter-spacing:.03em;text-transform:none;color:var(--muted);margin-top:2px}
.gt th.clue{background:var(--clue-bg);color:var(--clue-ink)}
.gt th.clue small{color:var(--clue-ink)}
.gt td{padding:5px;border-bottom:1px solid var(--line);vertical-align:top;min-width:120px}
.gt tr:last-child td{border-bottom:0}
.gt td + td,.gt th + th{border-left:1px solid var(--line)}
.cell{width:100%;min-height:44px;border-radius:8px;padding:7px 9px;font-size:.88rem;line-height:1.3;text-align:left;display:flex;align-items:center;gap:6px}
.cell.given{background:var(--given);font-weight:600}
.cell.clue{background:var(--clue-bg);color:var(--clue-ink);border:1px solid var(--clue-line);font-weight:600}
.cell.empty{border:1.5px dashed var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.cell.empty:hover,.cell.empty.drop{border-color:var(--accent);color:var(--ink)}
.cell.sel{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink)}
.cell.locked{background:var(--lock);color:var(--muted);border:1px solid var(--line);cursor:not-allowed;font-size:.78rem}
.cell.locked svg{width:13px;height:13px;flex:none}
.cell.filled{background:var(--ok-bg);border:1px solid var(--ok);font-weight:600}
.cell.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.cell.err{animation:shake .32s;border-color:var(--bad)}
.bank{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:12px;display:grid;gap:8px;scroll-margin-bottom:16px}
.bank .bh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:.86rem}
.bank .bh b{font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow:auto}
.tile{font:600 .84rem var(--f-body);background:var(--sunk);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:grab;display:inline-flex;gap:6px;align-items:center;max-width:100%;text-align:left}
.tile:hover:not([disabled]){border-color:var(--accent)}
.tile .ct{font:500 .7rem var(--f-mono);color:var(--muted)}
.tile.out{opacity:.45;text-decoration:line-through;cursor:default}
.tile.dragging{opacity:.4}
.toast{font-size:.86rem;font-weight:600}
.toast:empty{display:none}
@media (max-width:560px){.tabs .long{display:none}}
.toast.bad{color:var(--bad)}
.toast.ok{color:var(--ok)}
.notes{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.notes li{border-left:3px solid var(--ok);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:.88rem}
.notes li b{font-weight:700}
.gdone{display:grid;gap:12px}
footer{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty-state{color:var(--muted);font-size:.9rem}
/* condensed label sizing (Barlow Condensed reads small) */
.mode-card .k,.optrow .lab,.stat span,.prompt-lab,.gcard .row{font-size:.82rem!important;font-weight:700!important;letter-spacing:.1em!important}
.tag{font-size:.8rem!important;font-weight:800!important}
.hy,.hybox b{font-size:.78rem!important;font-weight:800!important}
.kbd,.lecrow .pct,.chip .n,.tile .ct,.opt .key{font-size:.85rem!important;font-weight:600!important}
.gt th small{font-size:.76rem!important;font-weight:600!important}
.seq-done li::before{font-size:.95rem!important}
.btn,.seg button,.chip,.tabs button,.kind,.gt th{font-family:var(--f-mono)!important;letter-spacing:.06em;text-transform:uppercase}
.btn{font-size:.95rem!important;font-weight:700!important}
.btn.sm{font-size:.85rem!important}
.seg button{font-size:.88rem!important;font-weight:700!important}
.chip{font-size:.86rem!important;font-weight:700!important;text-transform:none;letter-spacing:.03em}
.tabs button{font-size:15px!important;letter-spacing:.08em}

<script>
const DATA = {"id": "ird01-04", "code": "IRD01–04", "prefix": "IRD", "title": "Immune Foundations, Innate & Cytokines", "lectures": [{"k": "01", "name": "Introduction to the Immune System", "disc": "imm"}, {"k": "02", "name": "Overview of Immunology: Cells & Tissues", "disc": "imm"}, {"k": "03", "name": "Innate Immunity & Complement", "disc": "imm"}, {"k": "04", "name": "Introduction to Cytokines", "disc": "imm"}], "los": {"01.1": "Innate vs specific (adaptive) immunity; physical and chemical barriers to infection", "01.2": "Innate response: pathogen recognition, phagocytosis, cytokines, inflammation, acute phase", "01.3": "Complement system: its functions and how it is triggered", "01.4": "Dendritic cells start specific immunity; roles of Th, CTLs, B/plasma cells and antibodies", "02.1": "Function of the immune system: defend against foreign and domestic threats (self vs non-self)", "02.2": "Innate vs adaptive immunity: compare their roles and how they interact", "02.3": "Cells and soluble factors of innate and adaptive immunity and their functions", "02.4": "Steps from pathogen exposure to clearance", "02.5": "Primary and secondary lymphoid organs and tissues and their roles in immunity", "03.1": "Innate myeloid and lymphoid cells: how they are activated; anti-pathogen and anti-tumor actions", "03.2": "Complement cascade; compare classical, alternative and lectin activation pathways", "03.3": "Immediate vs induced phases of the innate immune response", "03.4": "How soluble and cellular innate components interact with each other and with adaptive immunity", "03.5": "Diseases caused by defects in innate immune processes, recognized by clinical presentation", "04.1": "General role of cytokines in the immune response and inflammation", "04.2": "Autocrine, paracrine and endocrine signaling, with cytokine examples of each", "04.3": "Receptor classes that bind cytokines and chemokines", "04.4": "Source, target, function and class (inflammatory, regulatory, growth, chemotactic) of cytokines", "04.X": "Clinical correlates & extras"}, "sets": [{"id": "s01", "lec": "01", "lo": "01.1", "kind": "cause-effect", "title": "Barrier failure → lost defense", "left": "Clinical setting", "right": "Defense that failed", "pairs": [{"a": "Extensive partial-thickness burns, Pseudomonas wound infection on day 5", "b": "Physical barrier of intact keratinized skin", "why": "Burns strip away the skin barrier, so Pseudomonas and S. aureus colonize the wound. Skin is the largest physical barrier.", "hy": true}, {"a": "Six years of daily omeprazole, recurrent Salmonella gastroenteritis", "b": "Chemical barrier of gastric hydrochloric acid", "why": "PPIs raise gastric pH, removing the acid barrier → ↑ Salmonella, Campylobacter and C. difficile infections.", "hy": true}, {"a": "Clindamycin for a dental abscess, then C. difficile colitis", "b": "Microbiological barrier of commensal gut flora", "why": "Antibiotics wipe out normal flora that compete for nutrients and niches; C. difficile overgrows. Normal flora = the third (microbiological) barrier type.", "hy": true}, {"a": "Cystic fibrosis with repeated Pseudomonas pneumonias", "b": "Mucociliary clearance blocked by thick, dehydrated mucus", "why": "CFTR defect → dehydrated, sticky mucus that cilia cannot move → Pseudomonas and S. aureus lung infections."}, {"a": "Primary ciliary dyskinesia with chronic sinusitis and bronchiectasis", "b": "Dynein-driven beating of airway cilia", "why": "Here the mucus is normal but the cilia are immotile (dynein arm defect), so the mucociliary escalator stalls. Contrast with CF, where the mucus is the problem."}, {"a": "Sjögren syndrome with dry eyes and recurrent conjunctivitis", "b": "Flushing tear flow carrying lysozyme", "why": "Tears both wash the eye (mechanical) and deliver lysozyme (chemical), which cleaves peptidoglycan. Loss of tear flow removes both."}]}, {"id": "s02", "lec": "01", "lo": "01.2", "kind": "term-def", "title": "Innate response term → meaning", "left": "Term", "right": "Meaning", "pairs": [{"a": "Opsonin", "b": "Coating molecule that lets phagocytes grip and engulf a microbe", "why": "Major opsonins: IgG, C3b and CRP. Phagocytes have receptors for the Fc region of IgG and for C3b.", "hy": true}, {"a": "Phagolysosome", "b": "Fused vesicle where lysosomal enzymes kill and digest the ingested microbe", "why": "Pattern receptor binds → engulfment → phagosome → fusion with lysosomes = phagolysosome → digestion."}, {"a": "Acute phase response", "b": "Systemic effects of macrophage cytokines carried in the blood", "why": "IL-1, IL-6 and TNF-α spill into the circulation → fever, liver acute phase proteins (CRP, fibrinogen, complement) and leukocytosis.", "hy": true}, {"a": "Chemokine", "b": "Small chemotactic cytokine that guides leukocytes into infected tissue", "why": "Chemokines (e.g., CXCL8 = IL-8) bind G protein–coupled receptors; CXCL8 recruits neutrophils from the blood."}, {"a": "Endogenous pyrogen", "b": "Host cytokine that acts on the hypothalamus to raise body temperature", "why": "IL-1 is the classic endogenous pyrogen (IL-6 and TNF-α contribute) → hypothalamic PGE2 → higher set point.", "hy": true}, {"a": "Monocyte", "b": "Circulating blood cell that enters inflamed tissue and becomes a macrophage", "why": "Monocyte (blood) → macrophage (tissue). Monocytes are recruited during the induced phase."}, {"a": "Pattern recognition receptor", "b": "Germline-encoded receptor such as a TLR that binds conserved microbial structures", "why": "PRRs (TLRs, mannose receptor) let one innate cell recognize many microbes; they bind PAMPs/MAMPs."}]}, {"id": "s03", "lec": "01", "lo": "01.4", "kind": "term-app", "title": "Antibody function → example", "left": "Function", "right": "Example", "pairs": [{"a": "Neutralization", "b": "Booster-induced IgG binds tetanus toxin so it cannot engage its receptor", "why": "Toxoid vaccines (tetanus, diphtheria) protect by inducing neutralizing IgG; neutralizing antibody also blocks viral attachment.", "hy": true}, {"a": "Opsonization", "b": "IgG-coated bacteria bound by Fc receptors on neutrophils and macrophages", "why": "The Fc (constant) region binds Fc receptors on phagocytes; the Fab region binds antigen.", "hy": true}, {"a": "Agglutination", "b": "Pentameric IgM cross-links many bacteria into clumps", "why": "Multivalent antibodies (IgM pentamer) bridge several microbes, clumping them for easier clearance."}, {"a": "Complement activation", "b": "IgM or IgG on a microbe binds C1q and starts the classical pathway", "why": "Classical pathway = antibody-dependent. IgM is the strongest activator; IgA and IgE do not fix complement this way."}, {"a": "Antibody-dependent cellular cytotoxicity", "b": "IgG on an infected cell is bound by CD16 on an NK cell, which kills it", "why": "ADCC: innate NK cells use FcγRIII (CD16) to kill IgG-coated targets; many therapeutic antibodies kill tumor cells this way."}, {"a": "Mast cell sensitization", "b": "IgE bound to FcεRI is cross-linked by allergen, triggering degranulation", "why": "IgE arms mast cells and basophils; allergen cross-linking → histamine release (allergy, but also anti-helminth defense)."}]}, {"id": "s04", "lec": "02", "lo": "02.1", "kind": "term-def", "title": "Immunology term → definition", "left": "Term", "right": "Definition", "pairs": [{"a": "Antigen", "b": "Anything that can stimulate an immune response", "why": "Antigens can be microbial, environmental or self; the part an antibody or TCR actually binds is the epitope."}, {"a": "Humoral immunity", "b": "Defense by soluble components such as antibodies and complement", "why": "Humoral = in body fluids (antibodies, complement); transferable with serum.", "hy": true}, {"a": "Cellular immunity", "b": "Defense carried out directly by cells such as T cells and macrophages", "why": "Cell-mediated immunity handles intracellular microbes (Th1 → macrophages; CTLs → infected cells)."}, {"a": "Passive immunity", "b": "Protection from preformed antibody given to the host; immediate but no memory", "why": "Antitoxin, IVIG, maternal IgG, monoclonals: instant, short-lived. Animal antiserum can cause serum sickness.", "hy": true}, {"a": "Active immunity", "b": "Protection built by the host's own lymphocytes after infection or vaccination", "why": "Slow to develop (days–weeks) but leaves memory — the basis of vaccines."}, {"a": "Autoimmunity", "b": "Immune attack on the host's own tissue", "why": "A failure to tolerate self. The other immune failures: allergy (harmless non-self), cancer, persistent infection."}, {"a": "Allergy", "b": "Harmful immune response to harmless environmental non-self such as pollen", "why": "Allergy is overreaction to innocuous antigens, typically IgE-mediated (type I hypersensitivity)."}]}, {"id": "s05", "lec": "02", "lo": "02.2", "kind": "term-app", "title": "Innate vs adaptive concept → example", "left": "Concept", "right": "Example", "pairs": [{"a": "Clonality", "b": "Each T cell displays receptors of one single antigen specificity", "why": "Adaptive lymphocytes are clonal: one rearranged receptor specificity per cell. Innate cells lack clonality.", "hy": true}, {"a": "Pattern recognition", "b": "One macrophage's TLRs detect LPS, flagellin and viral RNA alike", "why": "Innate cells carry many germline receptor types, each recognizing structures shared by many microbes."}, {"a": "DAMP sensing", "b": "Sterile crush injury of muscle triggers redness and neutrophil influx", "why": "DAMPs (released from damaged host cells) and MAMPs/PAMPs (on microbes) are both sensed by innate pattern receptors.", "hy": true}, {"a": "Immunologic memory", "b": "No illness when re-exposed to chickenpox 20 years after childhood infection", "why": "Memory lymphocytes give a faster, larger secondary response — the defining adaptive feature.", "hy": true}, {"a": "Primary response lag", "b": "First influenza: fever on day 1, specific antibody only around day 7–10", "why": "Rare antigen-specific lymphocytes must be activated, proliferate and differentiate, so the first adaptive response takes days to weeks."}, {"a": "Innate → adaptive bridge", "b": "Conventional dendritic cell carries skin antigen to the draining lymph node", "why": "cDCs are the most potent activators of naive T cells. pDCs make IFN-α; follicular DCs hold antigen for B cells."}, {"a": "Adaptive → innate boost", "b": "Antibody on a microbe activates complement and directs phagocytes and NK cells", "why": "Antibodies make innate effectors more effective: complement activation, opsonization, ADCC."}]}, {"id": "s06", "lec": "02", "lo": "02.5", "kind": "structure-function", "title": "Lymphoid structure → function", "left": "Structure", "right": "Function", "pairs": [{"a": "Bone marrow", "b": "Primary organ where hematopoiesis and B-cell maturation occur", "why": "Primary (central) lymphoid organs = bone marrow (B cells) + thymus (T cells). Long-lived plasma cells also reside in marrow.", "hy": true}, {"a": "Thymus", "b": "Primary organ where T cells mature and undergo selection", "why": "Absent thymic shadow + hypocalcemia + conotruncal defect = DiGeorge (22q11.2; 3rd/4th pouches) → T-cell deficiency.", "hy": true}, {"a": "Lymph node paracortex", "b": "T-cell zone where dendritic cells present antigen to naive T cells", "why": "Tissue DCs arrive by afferent lymphatics and settle in the paracortex; B-cell follicles are in the cortex."}, {"a": "Spleen", "b": "Filters blood and clears opsonized encapsulated bacteria", "why": "Asplenia → S. pneumoniae, H. influenzae b, N. meningitidis sepsis; Howell-Jolly bodies on smear; vaccinate.", "hy": true}, {"a": "Peyer's patches", "b": "Unencapsulated gut MALT that samples luminal antigen through M cells", "why": "MALT (tonsils, adenoids, Peyer's patches, appendix) is the largest collection of lymphoid tissue; drives secretory IgA."}, {"a": "High endothelial venule", "b": "Specialized vessel where naive lymphocytes leave blood to enter a node", "why": "HEV entry: L-selectin rolling → CCR7 chemokine activation → LFA-1/ICAM-1 firm adhesion → diapedesis."}, {"a": "Afferent lymphatic", "b": "Vessel carrying antigen-laden dendritic cells from tissue into the node", "why": "Afferent lymph brings DCs and antigen in; efferent lymph carries lymphocytes out (exit needs the S1P receptor)."}]}, {"id": "s07", "lec": "03", "lo": "03.1", "kind": "structure-function", "title": "Pattern receptor → ligand", "left": "Receptor", "right": "Ligand", "pairs": [{"a": "TLR4", "b": "Lipopolysaccharide (LPS) of gram-negative bacteria", "why": "LPS → TLR4 (with CD14/MD-2) → MyD88 → NF-κB → IL-1, IL-6, TNF-α: the trigger of gram-negative septic shock.", "hy": true}, {"a": "TLR2", "b": "Lipoteichoic acid and lipoproteins of gram-positive bacteria", "why": "Surface TLR2 (pairing with TLR1 or TLR6) senses cell-wall lipoproteins and lipoteichoic acid."}, {"a": "TLR5", "b": "Bacterial flagellin", "why": "Surface TLR5 detects flagellin of motile bacteria."}, {"a": "TLR3", "b": "Double-stranded viral RNA in endosomes", "why": "Endosomal TLRs (3, 7, 8, 9) sense nucleic acids; surface TLRs (1, 2, 4, 5, 6) sense cell-wall components."}, {"a": "TLR7", "b": "Single-stranded viral RNA in endosomes of plasmacytoid DCs", "why": "TLR7 (and TLR8) bind ssRNA; pDCs use TLR7/9 to pour out IFN-α."}, {"a": "TLR9", "b": "Unmethylated CpG DNA of bacteria and DNA viruses", "why": "Microbial DNA is rich in unmethylated CpG motifs, unlike host DNA; TLR9 is endosomal."}, {"a": "Dectin-1", "b": "β-glucan in fungal cell walls", "why": "A C-type lectin receptor on macrophages and DCs that recognizes fungal β-glucan."}]}, {"id": "s08", "lec": "03", "lo": "03.1", "kind": "term-def", "title": "NK cell molecule → role", "left": "Molecule / concept", "right": "Role in NK function", "pairs": [{"a": "Perforin", "b": "Forms pores in the target membrane so granzymes can enter", "why": "Granule exocytosis is the main NK (and CTL) killing route.", "hy": true}, {"a": "Granzyme B", "b": "Serine protease that activates caspases to trigger apoptosis", "why": "Granzymes enter through perforin pores and cleave caspases → target-cell apoptosis."}, {"a": "TRAIL", "b": "Ligand for DR4/DR5 death receptors that activates caspase 8", "why": "A second NK killing route: death-receptor engagement → caspase 8 → apoptosis."}, {"a": "CD16 (FcγRIII)", "b": "Binds the Fc of IgG on a target cell to trigger ADCC", "why": "CD16 links adaptive IgG to innate NK killing. NK markers: CD16+, CD56+, no TCR/BCR."}, {"a": "Inhibitory receptor (KIR)", "b": "Recognizes MHC class I on healthy cells and blocks killing", "why": "NK inhibitory receptors see MHC I only, not MHC II.", "hy": true}, {"a": "Missing self", "b": "Loss of MHC class I removes inhibition so the cell is killed", "why": "Viruses (CMV) and tumors that downregulate MHC I to escape CD8 T cells become NK targets.", "hy": true}, {"a": "IL-15", "b": "Cytokine that drives NK development and boosts antitumor activity", "why": "IL-15 (with IL-12 and IFN-α/β) activates NK cells; TGF-β in tumors suppresses them."}]}, {"id": "s09", "lec": "03", "lo": "03.1", "kind": "term-def", "title": "Phagocyte killing tool → action", "left": "Tool", "right": "Action", "pairs": [{"a": "NADPH oxidase", "b": "Generates superoxide in the respiratory burst", "why": "Defect = chronic granulomatous disease: no burst → catalase-positive infections (S. aureus, Aspergillus) + granulomas.", "hy": true}, {"a": "Superoxide dismutase", "b": "Converts superoxide to hydrogen peroxide", "why": "O2⁻ → H2O2. In CGD, catalase-positive microbes destroy their own H2O2, so the phagocyte has nothing to use."}, {"a": "Myeloperoxidase", "b": "Combines H2O2 with chloride to make hypochlorous acid (bleach)", "why": "MPO deficiency: NBT test normal (burst intact); mostly asymptomatic, some Candida infections.", "hy": true}, {"a": "Inducible nitric oxide synthase", "b": "Produces nitric oxide inside activated macrophages", "why": "IFN-γ-activated macrophages upregulate iNOS; NO helps kill intracellular microbes."}, {"a": "Lactoferrin", "b": "Sequesters iron so microbes cannot grow", "why": "Nutrient deprivation is an oxygen-independent killing mechanism."}, {"a": "Neutrophil extracellular traps", "b": "Extruded chromatin and granule proteins that trap microbes outside the cell", "why": "NETs let neutrophils catch extracellular bacteria and fungi even as the cell dies (NETosis)."}, {"a": "Phagolysosome acidification", "b": "Lowers vacuole pH to activate hydrolases and inhibit microbes", "why": "Acid pH activates lysosomal enzymes; some microbes (e.g., mycobacteria) survive by blocking phagosome maturation."}]}, {"id": "s10", "lec": "03", "lo": "03.2", "kind": "structure-function", "title": "Complement component → role in activation", "left": "Component", "right": "Role", "pairs": [{"a": "C1q", "b": "Binds Fc of antigen-bound IgM or IgG, CRP or lipoteichoic acid", "why": "C1q starts the classical pathway; IgM > IgG (IgG3 > IgG1 > IgG2). Natural IgM can trigger it before any specific response.", "hy": true}, {"a": "MASP-2", "b": "Protease activated when MBL or ficolin binds microbial sugars", "why": "Lectin pathway: MBL/ficolin + MASPs replace C1 and cleave C4 and C2."}, {"a": "C4b2a", "b": "C3 convertase of the classical and lectin pathways", "why": "Classical and lectin pathways converge on C4b2a. C2 is the exception to 'b binds': the bound protease is C2a.", "hy": true}, {"a": "C3bBb", "b": "C3 convertase of the alternative pathway", "why": "Alternative pathway convertase; Bb is the protease from factor B. It amplifies C3b made by all three pathways."}, {"a": "C4b2a3b", "b": "C5 convertase of the classical and lectin pathways", "why": "Adding one more C3b to a C3 convertase makes a C5 convertase (C4b2a3b or C3bBb3b)."}, {"a": "C3(H2O)", "b": "Spontaneously hydrolyzed C3 that starts tickover", "why": "Alternative pathway tickover: C3(H2O) binds factor B, which factor D cleaves → fluid-phase convertase."}, {"a": "Factor D", "b": "Plasma protease that cleaves factor B bound to C3b", "why": "Factor D circulates in active form and cleaves bound factor B into Ba (released) and Bb (protease)."}, {"a": "Properdin", "b": "Stabilizes the alternative pathway C3 convertase on microbial surfaces", "why": "Properdin (factor P) prolongs C3bBb, boosting the amplification loop."}]}, {"id": "s11", "lec": "03", "lo": "03.2", "kind": "term-def", "title": "Complement effector / regulator → function", "left": "Molecule", "right": "Function", "pairs": [{"a": "C3b", "b": "Principal opsonin; also joins convertases to amplify the cascade", "why": "Opsonization by C3b clears more microbes than any other complement function; C3 deficiency is the most severe.", "hy": true}, {"a": "C5a", "b": "Anaphylatoxin that is also a powerful neutrophil chemoattractant", "why": "Anaphylatoxins C3a, C4a, C5a degranulate mast cells; C5a also recruits neutrophils (with CXCL8 and LTB4).", "hy": true}, {"a": "C5b–C9", "b": "Membrane attack complex that punches lytic pores", "why": "C9 polymerizes to finish the MAC. Most critical against Neisseria; many pathogens resist the MAC."}, {"a": "C1 inhibitor", "b": "Dissociates C1r and C1s from C1q and also inhibits kallikrein", "why": "C1-INH deficiency → hereditary angioedema: low C4, bradykinin-mediated swelling; ACE inhibitors contraindicated.", "hy": true}, {"a": "DAF (CD55)", "b": "Membrane protein that speeds dissociation of C3 and C5 convertases on host cells", "why": "CD55 and CD59 are GPI-anchored; loss of the anchor (PIGA mutation) = paroxysmal nocturnal hemoglobinuria."}, {"a": "CD59", "b": "Membrane protein that blocks C9 polymerization into the MAC on host cells", "why": "Also called protectin/MIRL. CD59 loss drives complement lysis of RBCs in PNH."}, {"a": "Factor H", "b": "Soluble cofactor helping factor I cleave C3b on host surfaces", "why": "Host cells are spared by rapid fluid-phase C3b decay plus regulators (factor H, DAF, CD59)."}]}, {"id": "s12", "lec": "03", "lo": "03.4", "kind": "cause-effect", "title": "Innate scenario → mechanism", "left": "Scenario", "right": "Mechanism", "pairs": [{"a": "Fever and rigors 6 h after penicillin for secondary syphilis", "b": "Killed spirochetes release MAMPs that trigger a cytokine surge", "why": "Jarisch–Herxheimer reaction: transient, self-limited, within 24 h of treating syphilis or Lyme.", "hy": true}, {"a": "E. coli bacteremia with hypotension and diffuse microthrombi", "b": "Systemic TNF-α causing body-wide endothelial activation", "why": "Locally, clotting contains infection; systemically, TNF-α (with IL-1) → septic shock and DIC.", "hy": true}, {"a": "Lobar pneumonia with neutrophilia and band forms", "b": "Macrophage G-CSF driving marrow neutrophil production", "why": "G-CSF → marrow neutrophil output (filgrastim is its drug form)."}, {"a": "CMV-infected graft cells with low MHC I are still killed", "b": "NK cells lose inhibitory signaling and kill the cells", "why": "Missing self: MHC I downregulation escapes CD8 T cells but unleashes NK cells."}, {"a": "Classical pathway active within an hour of a first-ever exposure", "b": "Pre-existing natural IgM binding the microbe and C1q", "why": "Natural IgM (low-affinity, made without prior exposure) can start the classical pathway early."}, {"a": "Antibody-coated schistosomula too large to engulf are damaged", "b": "Eosinophils degranulate major basic protein and ROS onto the worm", "why": "Eosinophils do antibody-dependent degranulation against helminths; they also promote collagen deposition/granulomas."}, {"a": "Hives after holding an ice cube on the forearm", "b": "Physical stimulus directly degranulating mast cells", "why": "Mast cells degranulate to IgE cross-linking, C3a/C5a and physical stimuli (cold urticaria, dermatographism)."}]}, {"id": "s13", "lec": "03", "lo": "03.3", "kind": "structure-function", "title": "Antimicrobial chemical → key fact", "left": "Molecule", "right": "Key fact", "pairs": [{"a": "Lysozyme", "b": "Hydrolyzes peptidoglycan; best against gram-positive bacteria", "why": "Gram-positive bacteria have a thick, exposed peptidoglycan layer; lysozyme is in tears, saliva and sweat.", "hy": true}, {"a": "Secretory phospholipase A2", "b": "Enters the bacterial wall and hydrolyzes membrane phospholipids", "why": "Partner enzyme of lysozyme in tears and intestinal secretions."}, {"a": "α-Defensins (cryptdins)", "b": "Pore-forming peptides secreted by Paneth cells of the small intestine", "why": "Defensins are made as inactive precursors, cleaved to amphipathic peptides that disrupt microbial membranes.", "hy": true}, {"a": "Cathelicidin", "b": "Precursor stored in neutrophil granules, cleaved to the LL-37 peptide", "why": "Another pore-forming antimicrobial peptide from neutrophils and epithelia."}, {"a": "Histatins", "b": "Salivary peptides active mainly against oral fungi", "why": "Histatins act mostly against pathogenic fungi such as Candida in the mouth."}, {"a": "Membrane cholesterol", "b": "Protects host cells from pore-forming antimicrobial peptides", "why": "Sterols in eukaryotic membranes make them resistant, so defensins and cathelicidins spare host cells."}, {"a": "Pulmonary surfactant proteins", "b": "Alveolar collectins that bind and opsonize inhaled microbes", "why": "SP-A and SP-D are chemical defenses in the alveoli."}]}, {"id": "s14", "lec": "04", "lo": "04.4", "kind": "term-def", "title": "Innate & Th1 cytokine → main action", "left": "Cytokine", "right": "Main action", "pairs": [{"a": "IL-1β", "b": "Classic endogenous pyrogen that resets the hypothalamic set point", "why": "IL-1β → hypothalamic PGE2 → fever. 'Hot T-bone stEAK': IL-1 = hot.", "hy": true}, {"a": "TNF-α", "b": "Vasodilation and capillary leak in septic shock; cachexia", "why": "TNF-α also induces endothelial tissue factor (DIC) and maintains granulomas — anti-TNF reactivates TB.", "hy": true}, {"a": "IL-6", "b": "Main signal for hepatic CRP, fibrinogen and hepcidin", "why": "IL-6 → acute phase proteins (↑ ESR via fibrinogen; hepcidin → anemia of inflammation); also supports Th17.", "hy": true}, {"a": "CXCL8 (IL-8)", "b": "Chemokine recruiting neutrophils to the site of infection", "why": "'Clean up on aisle 8.' Neutrophil chemoattractants: CXCL8, C5a, LTB4."}, {"a": "IL-12", "b": "Activates NK cells and drives naive CD4 T cells to Th1", "why": "IL-12R defects → disseminated mycobacteria/Salmonella (e.g., after BCG).", "hy": true}, {"a": "IFN-γ", "b": "Activates macrophages to kill intracellular microbes and form granulomas", "why": "From Th1 and NK cells; basis of the interferon-γ release assay for TB."}, {"a": "IFN-α/β", "b": "Made by virus-infected cells and pDCs to block viral replication nearby", "why": "Type I IFNs come from virally infected cells and pDCs; they also activate NK cells."}, {"a": "G-CSF", "b": "Stimulates marrow production of neutrophils", "why": "G-CSF = neutrophils only (filgrastim); GM-CSF = granulocytes + macrophages (sargramostim)."}]}, {"id": "s15", "lec": "04", "lo": "04.4", "kind": "term-def", "title": "Type 2 & B-cell help molecule → action", "left": "Molecule", "right": "Main action", "pairs": [{"a": "IL-4", "b": "Switches B cells to IgE and drives Th2 differentiation", "why": "From Th2 and TFH cells. IL-4 → IgE; TGF-β → IgA; IFN-γ → IgG.", "hy": true}, {"a": "IL-5", "b": "Drives eosinophil production and activation", "why": "'5 = E for Eosinophil.' Helminths → eosinophilia; mepolizumab blocks IL-5.", "hy": true}, {"a": "IL-13", "b": "Main driver of airway mucus hypersecretion and hyperreactivity", "why": "IL-13 shares IL-4Rα with IL-4, so dupilumab blocks both."}, {"a": "IL-21", "b": "Most potent driver of germinal center B-cell proliferation and plasma cells", "why": "Signature TFH cytokine; IL-21R uses the common γ chain."}, {"a": "CD40L", "b": "TNF-family T-cell ligand required for germinal centers and class switching", "why": "CD40L defect → X-linked hyper-IgM syndrome (high IgM, low IgG/IgA/IgE).", "hy": true}, {"a": "BAFF", "b": "DC-derived B-cell survival factor promoting IgG2 to polysaccharides", "why": "BAFF supports T-independent (TI-2) responses to encapsulated bacteria; belimumab blocks BAFF in lupus."}, {"a": "TGF-β", "b": "Switches mucosal B cells to IgA and induces Tregs", "why": "TGF-β also lowers costimulatory molecules — the main inhibitory cytokine."}, {"a": "IL-33", "b": "Epithelial alarmin released by damaged cells that activates ILC2s", "why": "IL-25, IL-33 and TSLP act upstream of IL-4/5/13 to start Th2 polarization."}]}, {"id": "s16", "lec": "04", "lo": "04.X", "kind": "drug-mech", "title": "Cytokine drug → target", "left": "Drug", "right": "Target / action", "pairs": [{"a": "Tocilizumab", "b": "Blocks the IL-6 receptor", "why": "Used in giant cell arteritis, RA and CAR-T cytokine release syndrome.", "hy": true}, {"a": "Infliximab", "b": "Neutralizes TNF-α", "why": "Anti-TNF → reactivation of latent TB (screen with IGRA first) because TNF maintains granulomas.", "hy": true}, {"a": "Mepolizumab", "b": "Neutralizes IL-5", "why": "Reduces eosinophils in severe eosinophilic asthma."}, {"a": "Dupilumab", "b": "Blocks IL-4Rα, inhibiting IL-4 and IL-13 signaling", "why": "Treats atopic dermatitis and type 2 asthma."}, {"a": "Belimumab", "b": "Neutralizes BAFF", "why": "Lowers B-cell survival in systemic lupus erythematosus."}, {"a": "Filgrastim", "b": "Recombinant G-CSF that raises neutrophil counts", "why": "Given for chemotherapy-induced neutropenia.", "hy": true}, {"a": "Sargramostim", "b": "Recombinant GM-CSF stimulating granulocytes and macrophages", "why": "GM-CSF acts more broadly than G-CSF."}, {"a": "Tacrolimus", "b": "Calcineurin inhibitor that blocks T-cell IL-2 production", "why": "Calcineurin → NFAT → IL-2 gene; tacrolimus (and cyclosporine) block this in transplant patients.", "hy": true}]}, {"id": "s17", "lec": "04", "lo": "04.3", "kind": "structure-function", "title": "Cytokine receptor family → key feature", "left": "Receptor family", "right": "Key feature / example", "pairs": [{"a": "Common γ chain (type I) receptors", "b": "Shared by IL-2, IL-4, IL-7, IL-9, IL-15, IL-21; mutated in X-SCID", "why": "γc mutation → T−B+NK− X-linked SCID (no IL-7 → no T cells; no IL-15 → no NK cells).", "hy": true}, {"a": "Type II (interferon-family) receptors", "b": "Bind IFN-α/β, IFN-γ and IL-10 and signal through JAK–STAT", "why": "Type I and type II cytokine receptors lack intrinsic kinase activity; associated JAKs phosphorylate STATs.", "hy": true}, {"a": "Chemokine receptors (CXCR, CCR)", "b": "Seven-transmembrane G protein–coupled receptors", "why": "Chemokine binding → GDP→GTP exchange → cytoskeletal rearrangement → chemotaxis. CXCL8 uses CXCR1/2."}, {"a": "TNF receptor superfamily", "b": "Trimeric receptors for TNF-α, Fas ligand and CD40 ligand", "why": "Depending on the cell, TNFR signaling triggers caspase-driven apoptosis or NF-κB inflammatory genes."}, {"a": "TGF-β receptors", "b": "Serine/threonine kinase receptors that activate SMADs", "why": "TGF-β, the main inhibitory cytokine, uses its own kinase class rather than JAK–STAT."}, {"a": "IL-1 receptor family", "b": "TIR-domain receptors using MyD88, like the Toll-like receptors", "why": "IL-1β, IL-18 and IL-33 (via ST2) signal through MyD88 → NF-κB."}, {"a": "Receptor tyrosine kinases", "b": "Intrinsic kinase receptors for M-CSF and stem cell factor", "why": "CSF1R (M-CSF) and KIT (SCF; needed by mast cells) phosphorylate themselves."}]}, {"id": "s18", "lec": "04", "lo": "04.1", "kind": "term-app", "title": "Cytokine signaling concept → example", "left": "Concept", "right": "Example", "pairs": [{"a": "Autocrine signaling", "b": "IL-2 from a CD4 T cell drives that same cell to proliferate", "why": "Autocrine = acts on the secreting cell itself.", "hy": true}, {"a": "Paracrine signaling", "b": "IL-2 from a CD4 T cell lets a neighboring CD8 T cell proliferate", "why": "CD8 T cells make little IL-2 of their own and depend on nearby helpers. Most cytokine signaling is short-range.", "hy": true}, {"a": "Endocrine signaling", "b": "Lung macrophage IL-1β, IL-6 and TNF-α act on hypothalamus and liver", "why": "At high levels the inflammatory triad acts like a hormone: fever, CRP, leukocytosis.", "hy": true}, {"a": "Pleiotropy", "b": "IL-4 acts on B cells, T cells and mast cells, with a different effect on each", "why": "One cytokine acts on many cell types — which is why cytokine drugs (e.g., high-dose IL-2) have widespread side effects."}, {"a": "Redundancy", "b": "Blocking one cytokine only partly removes a response other cytokines also drive", "why": "Many cytokines share effects (e.g., IL-1β, IL-6, TNF-α all cause fever)."}, {"a": "Antagonism", "b": "IFN-γ from Th1 cells suppresses IL-4–driven Th2 differentiation", "why": "Cross-regulation enforces polarization: IFN-γ inhibits Th2; IL-4/IL-10 inhibit Th1."}, {"a": "Selective IL-2 response", "b": "Only antigen-activated T cells express the high-affinity IL-2 receptor", "why": "IL-2Rα (CD25) is induced on activation, so IL-2 favors recently stimulated neighbors."}, {"a": "Response shutdown", "b": "IL-10 and TGF-β rise late as IL-2 falls and effector T cells die", "why": "IL-2 withdrawal → ↓Bcl-2 → effector apoptosis; IL-7 maintains memory T cells. Unchecked cytokines → cytokine storm."}]}], "seqs": [{"id": "q01", "lec": "01", "lo": "01.4", "title": "From skin infection to antibody", "prompt": "Put the events in order, starting from an infection in the skin (first → last).", "steps": ["Dendritic cell picks up antigen at the infection site", "Dendritic cell migrates through lymphatics to a lymph node", "CD4 T cell recognizes antigen on HLA class II and becomes a T helper cell", "T helper cell signals a B cell that bound the same antigen", "B cell becomes a plasma cell that secretes antibody"], "why": "DC = bridge from innate to adaptive. Th cells also help CD8 T cells become CTLs and activate macrophages at the site.", "hy": true}, {"id": "q02", "lec": "01", "lo": "01.2", "title": "Phagocytosis", "prompt": "Put the steps of phagocytosis by a macrophage in order (first → last).", "steps": ["Pattern receptor binds a PAMP on the pathogen", "Cell membrane surrounds and engulfs the pathogen", "Pathogen is enclosed in a phagosome", "Phagosome fuses with lysosomes", "Lysosomal enzymes digest the pathogen"], "why": "Recognition → engulfment → phagosome → phagolysosome → killing/digestion. Opsonins (IgG, C3b, CRP) speed the first step."}, {"id": "q03", "lec": "01", "lo": "01.3", "title": "Membrane attack complex", "prompt": "Put the terminal complement steps in order (first → last).", "steps": ["C3 convertase binds an extra C3b to form a C5 convertase", "C5 convertase cleaves C5", "C5b binds the surface and recruits C6, C7 and C8", "C9 polymerizes to complete the MAC pore"], "why": "MAC = C5b–C9. Terminal component deficiency → recurrent Neisseria infections; C5a released here is a potent anaphylatoxin and neutrophil attractant.", "hy": true}, {"id": "q04", "lec": "02", "lo": "02.4", "title": "Exposure to clearance", "prompt": "Order the events after a virus breaches the skin (first → last).", "steps": ["Antimicrobial proteins and complement act within minutes", "Macrophages and dendritic cells take up the invader and release cytokines", "NK cells and neutrophils are recruited and attack", "Dendritic cell reaches the draining lymph node", "Antigen-specific T cells are activated", "B cells make antibody and the pathogen is cleared", "Memory cells remain for faster future responses"], "why": "Innate (minutes–days) → DC to lymph node → T cells → B cells/antibody (days–weeks) → memory."}, {"id": "q05", "lec": "02", "lo": "02.5", "title": "Naive T-cell recirculation", "prompt": "Order the route a newly matured naive T cell takes while searching for its antigen (first → last).", "steps": ["Completes maturation in the thymus", "Enters the bloodstream", "Crosses high endothelial venules into a lymph node", "Scans dendritic cells in the paracortex", "Leaves in efferent lymph if it finds no antigen", "Returns to the blood via the thoracic duct"], "why": "HEV entry uses L-selectin, CCR7 and LFA-1; exit needs the S1P receptor. Naive cells that never meet antigen die after a few weeks."}, {"id": "q06", "lec": "03", "lo": "03.2", "title": "Classical pathway", "prompt": "Put the steps of the classical complement pathway in order (first → last).", "steps": ["C1q binds antibody, CRP or a microbial surface", "C1r cleaves and activates C1s", "C1s cleaves C4; C4b binds the surface", "C4b recruits C2, which C1s cleaves", "C4b2a cleaves many C3 molecules", "C3b coats the microbe and forms C5 convertase"], "why": "C1qrs → C4 → C2 → C4b2a → C3. The lectin pathway enters at C4 via MBL/MASP-2; the alternative pathway uses C3bBb.", "hy": true}, {"id": "q07", "lec": "04", "lo": "04.2", "title": "Local infection to fever", "prompt": "Order the events linking a tissue bacterial infection to fever (first → last).", "steps": ["Tissue macrophage TLRs detect bacterial PAMPs", "NF-κB is activated in the macrophage", "IL-1β, IL-6 and TNF-α are secreted", "The cytokines spill into the circulation", "Hypothalamic PGE2 raises the temperature set point"], "why": "Local paracrine action becomes endocrine when the triad enters the blood: fever (brain), CRP (liver), leukocytosis (marrow).", "hy": true}, {"id": "q08", "lec": "04", "lo": "04.3", "title": "JAK–STAT signaling", "prompt": "Put the steps of JAK–STAT signaling in order (first → last).", "steps": ["Cytokine binds its receptor chains", "Receptor chains come together, bringing associated JAKs close", "JAKs phosphorylate each other and receptor tyrosines", "STATs dock on phosphotyrosines and are phosphorylated", "Phosphorylated STATs dimerize and enter the nucleus"], "why": "Tyrosine phosphorylation is the key event. JAK3 binds the common γ chain, so JAK3 deficiency causes autosomal recessive SCID resembling X-SCID.", "hy": true}], "grids": [{"id": "g01", "lec": "01", "lo": "01.1", "title": "Innate vs adaptive immunity", "blurb": "Hard: from the feature alone, fill both the innate and the adaptive version.", "cols": [{"h": "Feature"}, {"h": "Innate"}, {"h": "Adaptive"}], "rows": [["Speed of first response", "Minutes to hours", "Days to weeks"], ["Receptor genes", "Germline-encoded (e.g., TLRs)", "Rearranged by V(D)J (TCR, BCR)"], ["Specificities per cell", "Many types per cell (no clonality)", "One specificity per cell (clonal)"], ["Memory", "None; same response each time", "Faster, stronger on re-exposure"], ["Location before infection", "Already at the site", "Waiting in lymph nodes and MALT"], ["Main cells", "Macrophages, neutrophils, NK cells", "T cells and B cells"], ["Soluble factors", "Complement, acute-phase proteins", "Antibodies"]], "easyGiven": [0], "hardGiven": [0], "decoys": {"1": ["Somatic hypermutation", "Requires MHC presentation", "Weeks to months"], "2": ["Shared by all lymphocytes", "Lysozyme and defensins", "Seconds after entry"]}, "notes": ["Innate acts immediately; the first adaptive response takes days to weeks, the second is faster.", "TLRs and other pattern receptors are germline-encoded; TCR/BCR genes undergo V(D)J recombination.", "Clonality: each lymphocyte carries one specificity; one macrophage carries many receptor types.", "Memory is the defining adaptive feature and the basis of vaccination.", "Innate defenses are pre-positioned; naive T and B cells wait in secondary lymphoid tissue.", "NK cells are lymphoid-lineage but innate; T and B cells are the adaptive cells.", "Complement is innate, antibodies adaptive — and antibodies activate complement (classical pathway)."], "hy": "Memory and clonality are adaptive; speed and pattern recognition are innate. NK cells = innate lymphocytes."}, {"id": "g02", "lec": "02", "lo": "02.3", "title": "CD4 T-helper subset chart", "blurb": "Hard: use the polarizing cytokines to name the subset, then fill its products, job and disease.", "cols": [{"h": "Subset", "dep": 1}, {"h": "Polarizing cytokines"}, {"h": "Effector products", "dep": 0}, {"h": "Main job", "dep": 0}, {"h": "Defect / excess", "dep": 0}], "rows": [["Th1", "IL-12 (+ IFN-γ)", "IFN-γ, lymphotoxin-α", "Macrophage activation", "Disseminated mycobacteria"], ["Th2", "IL-4 (+ IL-25, IL-33, TSLP)", "IL-4, IL-5, IL-13", "Helminths; allergy", "Asthma, eosinophilia, ↑ IgE"], ["Th17", "IL-6, IL-23, TGF-β", "IL-17, IL-22", "Extracellular bacteria and fungi", "Mucocutaneous candidiasis"], ["Treg", "TGF-β (+ IL-2)", "IL-10, TGF-β", "Suppress self-reactive T cells", "IPEX (FOXP3 mutation)"], ["TFH", "IL-6, IL-21", "IL-21, CD40L, IL-4", "Help B cells in germinal centers", "Hyper-IgM (CD40L defect)"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Th9", "CD8 CTL", "γδ T cell"], "2": ["IL-2, IL-3", "TNF-α, IL-8", "IL-12, IL-18"], "3": ["Kill MHC I-low cells", "Present antigen to CD8 cells"], "4": ["Recurrent Neisseria", "Hereditary angioedema"]}, "notes": ["IL-12 from macrophages/DCs → Th1 → IFN-γ → macrophage activation: the loop that controls TB.", "Epithelial alarmins (IL-25, IL-33, TSLP) start Th2 polarization upstream of IL-4.", "Th17 loss (e.g., STAT3 hyper-IgE syndrome) → Candida and staph abscesses; IL-22 drives epithelial antimicrobial peptides.", "IPEX: immune dysregulation, polyendocrinopathy, enteropathy, X-linked (infant boy with diarrhea, eczema, T1DM).", "TFH provide IL-21 and CD40L for germinal centers and switch cytokines such as IL-4 for IgE."], "hy": "Th1 = IFN-γ (TB, granulomas); Th2 = IL-4/5/13 (helminths, allergy); Th17 = IL-17 (Candida); Treg = FOXP3, IL-10/TGF-β (IPEX); TFH = IL-21, CD40L (hyper-IgM)."}, {"id": "g03", "lec": "02", "lo": "02.5", "title": "Lymphoid organ chart", "blurb": "Hard: use the classic clue to name the organ, then classify it and give its main role.", "cols": [{"h": "Organ / tissue", "dep": 1}, {"h": "Classic clue"}, {"h": "Type", "dep": 0}, {"h": "Main role", "dep": 0}], "rows": [["Bone marrow", "Hematopoietic stem cells reside here", "Primary", "B-cell development"], ["Thymus", "Shadow absent in DiGeorge syndrome", "Primary", "T-cell maturation and selection"], ["Lymph node", "HEVs in the paracortex", "Secondary", "Filters lymph; DCs meet T cells"], ["Spleen", "Howell-Jolly bodies when absent", "Secondary", "Clears encapsulated bacteria from blood"], ["Peyer's patches", "M cells sample the gut lumen", "Secondary (MALT)", "Intestinal secretory IgA responses"], ["Tonsils and adenoids", "Pharyngeal lymphoid ring", "Secondary (MALT)", "Sample inhaled and ingested antigens"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Liver", "Thoracic duct"], "2": ["Tertiary (ectopic)", "Not lymphoid tissue"], "3": ["Produces acute-phase proteins", "Makes complement proteins"]}, "notes": ["Bone marrow: hematopoiesis, B-cell maturation and a niche for long-lived plasma cells.", "DiGeorge (22q11.2): thymic aplasia → T-cell deficiency + hypocalcemia + conotruncal heart defects.", "Naive lymphocytes enter through HEVs; DCs arrive by afferent lymphatics into the paracortex.", "Asplenia → S. pneumoniae, Hib, N. meningitidis sepsis; vaccinate before elective splenectomy.", "MALT (largest lymphoid tissue) is unencapsulated; Peyer's patches drive secretory IgA.", "Tonsils and adenoids form Waldeyer's ring of unencapsulated MALT."], "hy": "Primary = marrow + thymus; secondary = nodes, spleen, MALT. DiGeorge → no thymus; asplenia → encapsulated bacteria + Howell-Jolly bodies."}, {"id": "g04", "lec": "03", "lo": "03.1", "title": "Innate cell chart", "blurb": "Hard: use the classic clue to name the cell, then fill its trigger and main weapon.", "cols": [{"h": "Cell", "dep": 1}, {"h": "Classic clue"}, {"h": "Key trigger / receptor", "dep": 0}, {"h": "Main weapon", "dep": 0}], "rows": [["Neutrophil", "First cell recruited; forms NETs", "CXCL8 and C5a receptors", "NADPH oxidase ROS, NETs"], ["Macrophage", "Tissue phagocyte from blood monocyte", "TLRs; IFN-γ from Th1 cells", "Phagolysosome, NO; IL-1, IL-6, TNF"], ["Eosinophil", "Bilobed; anti-helminth", "IL-5; Fc receptors on coated worms", "Major basic protein, ROS"], ["Mast cell", "Tissue-resident; KIT/SCF dependent", "FcεRI-IgE, C3a/C5a, cold or pressure", "Histamine, tryptase; then LTs, PGD2"], ["Basophil", "Rarest blood granulocyte; ↑ in CML", "IL-3; allergen cross-links FcεRI-IgE", "Histamine; IL-4 release"], ["NK cell", "CD16+ CD56+, no TCR or BCR", "Missing MHC I; IL-12, IL-15", "Perforin/granzyme, TRAIL, ADCC"], ["Plasmacytoid DC", "Main type I IFN factory", "Endosomal TLR7 and TLR9", "Massive IFN-α secretion"], ["ILC2", "Innate counterpart of Th2 cells", "IL-25, IL-33, TSLP", "IL-5 and IL-13"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Monocyte", "Langerhans cell", "ILC3"], "2": ["TCR on MHC II", "CD40L from TFH"], "3": ["Antibody secretion", "IL-17 and IL-22"]}, "notes": ["Neutrophils handle extracellular bacteria and fungi; CGD = no NADPH oxidase burst.", "Macrophages: main tissue sensor; secrete the IL-1/IL-6/TNF triad plus CXCL8, IL-12 and G-CSF.", "Eosinophils kill antibody-coated helminths too large to phagocytose; also allergy/asthma.", "Preformed (early): histamine, heparin, tryptase. Newly synthesized (late): leukotrienes, PGD2.", "Basophil = blood; mast cell = tissue; both carry FcεRI and release histamine.", "NK inhibitory receptors see MHC I only; IL-15 boosts NK antitumor activity.", "pDCs sense viral nucleic acids with TLR7/9 and make large amounts of IFN-α.", "ILCs have no antigen receptor and respond to cytokines: ILC1 ≈ Th1, ILC2 ≈ Th2, ILC3 ≈ Th17, NK ≈ CD8."], "hy": "CGD = NADPH oxidase (catalase-positive organisms, abnormal NBT/DHR). NK cells kill MHC I-low cells. Eosinophils = helminths (IL-5). Mast cell/basophil = FcεRI-IgE."}, {"id": "g05", "lec": "03", "lo": "03.5", "title": "Complement deficiency chart", "blurb": "Hard: use the classic presentation to name the deficiency, then fill the lab pattern and key consequence.", "cols": [{"h": "Deficiency", "dep": 1}, {"h": "Classic clue"}, {"h": "Lab pattern", "dep": 0}, {"h": "Key consequence", "dep": 0}], "rows": [["C2 (early classical)", "Young adult with malar rash, arthritis", "CH50 absent, AH50 normal", "SLE-like immune complex disease"], ["C3", "Toddler, recurrent pneumococcal sepsis", "CH50 and AH50 both absent", "Most severe pyogenic infections"], ["C5–C9 (terminal)", "Teen, second meningococcal meningitis", "CH50 and AH50 both absent", "Recurrent Neisseria (no MAC)"], ["C1 inhibitor", "Lip swelling after dental work, no hives", "Low C4, normal C3", "Bradykinin-mediated angioedema"], ["MBL", "Common and usually silent", "Normal CH50 and AH50", "Infections only if immunity impaired"], ["CD55/CD59 (PNH)", "Dark morning urine, thrombosis", "Flow: CD55/CD59-negative RBCs", "Complement lysis of RBCs"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Factor D", "Myeloperoxidase"], "2": ["Low C3, normal C4", "Elevated CH50"], "3": ["Catalase-positive infections", "Disseminated mycobacteria"]}, "notes": ["Early classical deficiency (C1q, C2, C4): poor immune complex clearance → SLE-like disease; the lectin pathway also uses C2/C4.", "C3 deficiency is the most severe: loss of the main opsonin; early childhood, same organism repeatedly.", "MAC deficiency → Neisseria meningitidis/gonorrhoeae in teens; vaccinate.", "HAE: no urticaria; low C4 with normal C3; avoid ACE inhibitors; treat with C1-INH concentrate or icatibant.", "MBL deficiency is in ~10% of people and mostly matters when other immunity is impaired.", "PNH: PIGA mutation → no GPI anchor → loss of CD55/CD59 → intravascular hemolysis."], "hy": "C3 = pyogenic infections; C5–C9 = Neisseria; C1q/C2/C4 = SLE-like; C1-INH = angioedema with low C4; CD55/CD59 = PNH."}, {"id": "g06", "lec": "04", "lo": "04.4", "title": "Cytokine source → target → class", "blurb": "Hard: use the classic clue to name the cytokine, then fill its source, target/effect and class.", "cols": [{"h": "Cytokine", "dep": 1}, {"h": "Classic clue"}, {"h": "Main source", "dep": 0}, {"h": "Target → effect", "dep": 0}, {"h": "Class", "dep": 0}], "rows": [["IL-1β", "Classic endogenous pyrogen", "Macrophages, DCs", "Hypothalamus → fever", "Pro-inflammatory"], ["TNF-α", "Blocker therapy reactivates TB", "Macrophages, DCs", "Endothelium → leak, shock", "Pro-inflammatory"], ["IL-6", "Blocked by tocilizumab", "Macrophages, DCs", "Liver → CRP, fibrinogen", "Pro-inflammatory"], ["CXCL8", "'Clean up on aisle 8'", "Macrophages, epithelium", "Neutrophils → chemotaxis", "Chemotactic"], ["IFN-γ", "Basis of TB release assay", "Th1 and NK cells", "Macrophages → activation", "Pro-inflammatory"], ["IL-10", "Rises late to end the response", "Tregs, macrophages", "Macrophages, DCs → ↓ activation", "Regulatory"], ["IL-7", "Keeps memory T cells alive", "Marrow stroma, thymic epithelium", "Lymphoid progenitors → development", "Growth-inducing"], ["G-CSF", "Filgrastim is its drug form", "Macrophages, marrow stroma", "Marrow → neutrophil production", "Growth-inducing"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["IL-2", "IL-17", "GM-CSF"], "2": ["Plasma cells", "Hepatocytes"], "3": ["B cells → IgE switch", "Eosinophils → activation"], "4": ["Hematopoietic inhibitor", "Anaphylatoxin"]}, "notes": ["IL-1β → PGE2 in the hypothalamus → fever.", "TNF-α: septic shock, cachexia, DIC; maintains granulomas, so anti-TNF reactivates latent TB.", "IL-6 → CRP, fibrinogen (↑ ESR), hepcidin; also supports Th17.", "CXCL8 binds GPCRs CXCR1/2; neutrophil attractants also include C5a and LTB4.", "IFN-γ: Th1 macrophage activation and granulomas; IL-12R/IFN-γR defects → disseminated mycobacteria.", "IL-10 and TGF-β are the regulatory (anti-inflammatory) pair.", "IL-7 uses the common γ chain — loss of IL-7 signaling explains absent T cells in X-SCID.", "G-CSF = neutrophils; GM-CSF = granulocytes and macrophages."], "hy": "Inflammatory triad IL-1β/IL-6/TNF-α → fever, CRP, shock. CXCL8 = neutrophils. IFN-γ = macrophage activation. IL-10/TGF-β = regulatory. G-CSF, GM-CSF, IL-7 = growth."}]};

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const DISC={neuro:"Neuro",path:"Path",drt:"Radiology",pharm:"Pharm",imm:"Immuno",mic:"Micro"};
const KIND={
  "term-def":{l:"Term → Definition",c:"--k1"},
  "term-app":{l:"Term → Application",c:"--k2"},
  "disease-finding":{l:"Disease → Finding",c:"--k3"},
  "cause-effect":{l:"Cause → Effect",c:"--k4"},
  "lesion-deficit":{l:"Lesion → Deficit",c:"--k5"},
  "drug-mech":{l:"Drug → Mechanism",c:"--k6"},
  "structure-function":{l:"Structure → Function",c:"--k7"},
  "image-finding":{l:"Image → Finding",c:"--k8"},
  "sequence":{l:"Put in Order",c:"--k4"}
};
const LOCK='<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M5 7V5a3 3 0 0 1 6 0v2h.5A1.5 1.5 0 0 1 13 8.5v5A1.5 1.5 0 0 1 11.5 15h-7A1.5 1.5 0 0 1 3 13.5v-5A1.5 1.5 0 0 1 4.5 7H5zm1.5 0h3V5a1.5 1.5 0 0 0-3 0v2z"/></svg>';
const lecOf=k=>DATA.lectures.find(l=>l.k===k)||{k,name:"",disc:"imm"};
const lecTag=k=>{const L=lecOf(k);return `<span class="tag" style="--lc:var(--${L.disc})" title="${esc(L.name)}">${esc(lecLabel(k))}</span>`;};
const lecLabel=k=>(DATA.prefix||"IRD")+k;

/* ---------- storage (per-viewer convenience only) ---------- */
const SKEY="hoyadocs-matchlab-"+DATA.id;
let S={items:{},grids:{},best:0,rounds:0};
try{const raw=localStorage.getItem(SKEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}

const itemStat=k=>S.items[k]||(S.items[k]={n:0,ok:0,run:0,last:null});

/* ---------- theme ---------- */
let theme="auto";
try{theme=localStorage.getItem("hoyadocs-theme")||"auto";}catch(e){}

function confirmReset(){const b=$("#resetBtn");if(b.dataset.arm){delete b.dataset.arm;b.textContent="Reset progress";return true;}b.dataset.arm="1";b.textContent="Tap again to reset";setTimeout(()=>{if(b.dataset.arm){delete b.dataset.arm;b.textContent="Reset progress";}},3000);return false;}

/* ---------- static header ---------- */
document.title=`${DATA.code} Match Lab · HoyaDocs`;
$("#revLine").textContent=`${META.block} · ${DATA.code} · Rev ${META.rev} · Updated ${META.updated}`;

$("#heroK").textContent=`${DATA.code} · ${[...new Set(DATA.lectures.map(l=>DISCN[l.disc]||l.disc))].join(" · ")} · Match Lab`;

/* ---------- item pool ---------- */
const ITEMS=[];
DATA.sets.forEach(s=>s.pairs.forEach((p,i)=>ITEMS.push({t:"pair",key:s.id+":"+i,set:s,p,i,lec:s.lec,kind:s.kind,lo:s.lo})));
DATA.seqs.forEach(q=>ITEMS.push({t:"seq",key:q.id,q,lec:q.lec,kind:"sequence",lo:q.lo}));

/* ---------- filters / settings ---------- */
const F={lecs:new Set(DATA.lectures.map(l=>l.k)),kinds:new Set(Object.keys(KIND)),len:"20",timer:"off",dir:"mixed",focus:"all",diff:"easy"};
const pool=()=>ITEMS.filter(it=>F.lecs.has(it.lec)&&F.kinds.has(it.kind)&&(F.focus==="all"||(F.focus==="new"?!mastered(it.key):(S.items[it.key]&&S.items[it.key].last===false))));

/* ---------- router ---------- */
let view="home";
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>go(b.dataset.view));
function go(v,arg){
  stopTimer();
  view=v;
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===(v==="rfplay"||v==="rfend"?"rf":v==="grid"?"glist":v))));
  if(v==="home")renderHome();
  else if(v==="rf")renderRFSetup();
  else if(v==="rfplay")renderQ();
  else if(v==="rfend")renderEnd();
  else if(v==="glist")renderGList();
  else if(v==="grid")startGrid(arg);
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- shared bits ---------- */
function segHTML(name,label,opts,cur){return `<div class="optrow"><span class="lab">${label}</span><div class="seg" role="group" aria-label="${label}">${opts.map(([v,t])=>`<button type="button" data-${name}="${v}" aria-pressed="${v===cur}">${t}</button>`).join("")}</div></div>`;}
function bindSeg(root,name,cb){root.querySelectorAll(`[data-${name}]`).forEach(b=>b.onclick=()=>{F[name]=b.dataset[name];root.querySelectorAll(`[data-${name}]`).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));cb&&cb();});}
function lecChips(){return `<div class="optrow"><span class="lab">Lectures</span><div class="chips">${DATA.lectures.map(l=>`<button type="button" class="chip" data-lec="${l.k}" aria-pressed="${F.lecs.has(l.k)}" style="--c:var(--${l.disc})"><i></i>${esc(lecLabel(l.k))} · ${esc(l.name)}</button>`).join("")}</div></div>`;}
function kindChips(){const present=[...new Set(ITEMS.map(i=>i.kind))];return `<div class="optrow"><span class="lab">Match types</span><div class="chips">${present.map(k=>`<button type="button" class="chip" data-kind="${k}" aria-pressed="${F.kinds.has(k)}" style="--c:var(${KIND[k].c})"><i></i>${KIND[k].l} <span class="n">${ITEMS.filter(i=>i.kind===k).length}</span></button>`).join("")}</div></div>`;}
function bindChips(root,cb){
  root.querySelectorAll("[data-lec]").forEach(b=>b.onclick=()=>{const k=b.dataset.lec;if(F.lecs.has(k)){if(F.lecs.size>1)F.lecs.delete(k);}else F.lecs.add(k);b.setAttribute("aria-pressed",String(F.lecs.has(k)));cb&&cb();});
  root.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{const k=b.dataset.kind;if(F.kinds.has(k)){const vis=[...F.kinds].filter(x=>ITEMS.some(i=>i.kind===x));if(vis.length>1)F.kinds.delete(k);}else F.kinds.add(k);b.setAttribute("aria-pressed",String(F.kinds.has(k)));cb&&cb();});
}
function stars(n){return `<span class="stars" aria-label="${n} of 3 stars">${[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("")}</span>`;}

  <section class="panel opts">
    <h2>Rapid Fire setup</h2>
    ${lecChips()}
    ${kindChips()}
    ${segHTML("len","Length",[["10","10"],["20","20"],["40","40"],["all","All"]],F.len)}
