<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRD10–12 Match Lab · HoyaDocs</title>
<meta name="description" content="HoyaDocs IRD10–12 Match Lab: Tolerance, Hypersensitivity &amp; Mucosal Immunity. Rapid Fire matching and Grid Lock charts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* HoyaDocs Match Lab engine v1.0
   Layout: header + mode tabs; Home (mode cards, filters, mastery), Rapid Fire (one match per card), Grid Lock (chart + tile bank).
   Colors are tokens on :root with a dark set. Every view stacks to one column on phones. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#1A3363; --muted:#5B6274; --line:#D3D8E0; --chip:#E6E9EE;
  --navy:#0F2244; --navy2:#1A3363; --onnavy:#F4F1EA; --silver:#6E7787; --tan:#5AAEE6;
  --neuro:#5B4BC4; --path:#1F7F78; --drt:#C4631B; --pharm:#2368A8; --imm:#5B4BC4; --mic:#4D7C2A; --accent:#1D6FA8; --accent-ink:#ffffff;
  --ok:#1d7a3e; --ok-bg:#e3f4e8; --bad:#b3261e; --bad-bg:#fbe7e5; --once:#b7791f; --once-bg:#fdf1dc;
  --hy-bg:#FFF4C2; --hy-line:#D4A300; --hy-ink:#5E4700;
  --k1:#2c55a0; --k2:#6b46c1; --k3:#a02c4f; --k4:#b45309; --k5:#0f6b6b; --k6:#85600f; --k7:#1d7a3e; --k8:#0369a1;
  --given:#f5f7f9; --lock:#e9ecef; --clue-bg:#e3ecfa; --clue-ink:#1d3f7a; --clue-line:#9db6e3;
  --f-display:"Graduate","Rockwell","Georgia",serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#A99CF0; --path:#5CC2B8; --drt:#F0A060; --pharm:#7FB3EA; --imm:#A99CF0; --mic:#8CC06A; --navy:#0A1830; --navy2:#13284d; --onnavy:#F4F1EA; --silver:#9aa6b2; --tan:#5AAEE6; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#A99CF0; --path:#5CC2B8; --drt:#F0A060; --pharm:#7FB3EA; --imm:#A99CF0; --mic:#8CC06A; --navy:#0A1830; --navy2:#13284d; --onnavy:#F4F1EA; --silver:#9aa6b2; --tan:#5AAEE6; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15.5px/1.55 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 56px;display:grid;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:.03em}
h3{font-family:var(--f-mono);font-weight:800;letter-spacing:.03em}
/* HoyaDocs hub shell: wordmark bar, section nav, navy varsity hero */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 0 0}
.word{font-family:var(--f-display);font-size:24px;letter-spacing:.04em;text-decoration:none;color:var(--ink);line-height:1}
.word span{color:var(--silver)}
.rev{font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.topr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.themebtn{background:transparent;border:1.5px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:5px 14px;cursor:pointer}
.themebtn:hover{color:var(--ink);border-color:var(--ink)}
.hubnav{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;border-top:3px solid var(--ink);border-bottom:1px solid var(--line)}
.hubnav::-webkit-scrollbar{display:none}
.hubnav a{flex:none;text-decoration:none;font-family:var(--f-mono);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:11px 12px 9px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
.hubnav a:hover{color:var(--ink)}
.hubnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--tan)}
.hubnav a i{width:9px;height:9px;border-radius:2px;flex:none}
.hubnav .sep{flex:none;width:1px;background:var(--line);margin:9px 6px}
header.hero{background:var(--navy);color:var(--onnavy);border-radius:14px;padding:clamp(20px,3.5vw,36px) clamp(20px,4vw,40px);position:relative;overflow:hidden}
header.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(255,255,255,.045) calc(10% - 1px) 10%),radial-gradient(ellipse at 88% 115%, rgba(90,174,230,.34), transparent 58%)}
header.hero > *{position:relative}
.hero .k{font-family:var(--f-mono);font-weight:700;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:#8FCBF5}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5.4vw,52px);line-height:1.02;letter-spacing:.02em;margin:10px 0 4px;color:#F4F1EA;text-shadow:2px 2px 0 #1A3363,4px 4px 0 #5AAEE6}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.meta{font:500 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
header.top h1{font-size:clamp(1.5rem,3.4vw,2rem)}
header.top .lede{margin:4px 0 0;color:var(--muted);max-width:66ch}
.back{font:600 .8rem var(--f-body);text-decoration:none;color:var(--muted)}
.back:hover{color:var(--ink)}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .86rem var(--f-body);background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:.8rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:700 .82rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:1.15rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.mode-card{display:grid;gap:10px;align-content:start}
.mode-card .k{font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mode-card h2{font-size:1.45rem}
.mode-card p{margin:0;color:var(--muted)}
.opts{display:grid;gap:8px}
.optrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.optrow .lab{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:76px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:600 .8rem var(--f-body);border:0;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .78rem var(--f-body);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.chip[aria-pressed="false"]{opacity:.5;text-decoration:line-through;text-decoration-color:var(--muted)}
.chip .n{font:500 .7rem var(--f-mono);color:var(--muted)}
.statrow{display:flex;flex-wrap:wrap;gap:18px}
.stat b{display:block;font:700 1.25rem var(--f-body);font-variant-numeric:tabular-nums}
.stat span{font:500 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.lecrow{display:grid;grid-template-columns:auto minmax(0,1fr) 120px auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.lecrow:first-of-type{border-top:0}
.lecrow .pct{font:500 .75rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
@media (max-width:560px){.lecrow{grid-template-columns:auto minmax(0,1fr) auto}.lecrow .bar{grid-column:1/-1;order:5}}
.tag{font:600 .68rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;color:#fff;background:var(--lc,var(--neuro));white-space:nowrap}
:root[data-theme="dark"] .tag{color:#0d1520}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag{color:#0d1520} }
.hy{font:700 .66rem var(--f-mono);letter-spacing:.06em;background:var(--hy-bg);color:var(--hy-ink);border:1px solid var(--hy-line);border-radius:5px;padding:1px 6px}
.hybox{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.hybox b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
details.how{font-size:.9rem}
details.how summary{cursor:pointer;font-weight:700}
details.how ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
details.how li{margin:3px 0}

/* Rapid fire */
.rf-top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.timer{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.timer i.low{background:var(--bad)}
.qcard{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kind{font:700 .72rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--kc);border:1.5px solid var(--kc);border-radius:6px;padding:2px 8px}
.qset{font-size:.82rem;color:var(--muted)}
.prompt-lab{font:500 .7rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prompt{font:600 clamp(1.15rem,2.6vw,1.4rem)/1.35 var(--f-body);margin:2px 0 0}
.ask{font-size:.88rem;color:var(--muted);margin:0}
.options{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:.95rem;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .key{font:500 .75rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;height:24px;display:grid;place-items:center}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:8px;font-size:.92rem}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb h3{font:800 1.05rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.fb p{margin:0}
.fb .also{font-size:.86rem;color:var(--muted)}
.fb .also b{color:var(--ink)}
.navrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.kbd{font:500 .72rem var(--f-mono);color:var(--muted)}
/* sequence */
.seq-done{display:grid;gap:6px;counter-reset:s;padding:0;margin:0;list-style:none}
.seq-done li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;background:var(--ok-bg);border:1px solid var(--ok);border-radius:8px;padding:7px 10px;font-size:.92rem}
.seq-done li::before{content:counter(s);font:700 .8rem var(--f-mono);color:var(--ok);text-align:center}
.seq-done li.slot{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.seq-done li.slot::before{color:var(--muted)}
.seq-pool{display:grid;gap:6px}
.seq-pool .opt{grid-template-columns:minmax(0,1fr)}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
/* end */
.end{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.big{font:700 clamp(2rem,6vw,3rem)/1 var(--f-display)}
.misslist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.misslist li{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:8px 12px;font-size:.9rem;background:var(--surface)}
.misslist .a{font-weight:700}
.misslist .b{color:var(--muted)}

/* Grid list */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start}
.gcard:hover{border-color:var(--accent)}
.gcard h3{font-size:1.02rem}
.gcard p{margin:0;font-size:.84rem;color:var(--muted)}
.gcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 .72rem var(--f-mono);color:var(--muted)}
.stars{font-size:.85rem;letter-spacing:1px;color:var(--once)}
.stars .off{color:var(--line)}
/* Grid play */
.gwrap{display:grid;gap:12px}
.gtable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.gt{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
.gt th{font:700 .74rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--sunk);vertical-align:bottom}
.gt th small{display:block;font:500 .66rem var(--f-mono);letter-spacing:.03em;text-transform:none;color:var(--muted);margin-top:2px}
.gt th.clue{background:var(--clue-bg);color:var(--clue-ink)}
.gt th.clue small{color:var(--clue-ink)}
.gt td{padding:5px;border-bottom:1px solid var(--line);vertical-align:top;min-width:120px}
.gt tr:last-child td{border-bottom:0}
.gt td + td,.gt th + th{border-left:1px solid var(--line)}
.cell{width:100%;min-height:44px;border-radius:8px;padding:7px 9px;font-size:.88rem;line-height:1.3;text-align:left;display:flex;align-items:center;gap:6px}
.cell.given{background:var(--given);font-weight:600}
.cell.clue{background:var(--clue-bg);color:var(--clue-ink);border:1px solid var(--clue-line);font-weight:600}
.cell.empty{border:1.5px dashed var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.cell.empty:hover,.cell.empty.drop{border-color:var(--accent);color:var(--ink)}
.cell.sel{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink)}
.cell.locked{background:var(--lock);color:var(--muted);border:1px solid var(--line);cursor:not-allowed;font-size:.78rem}
.cell.locked svg{width:13px;height:13px;flex:none}
.cell.filled{background:var(--ok-bg);border:1px solid var(--ok);font-weight:600}
.cell.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.cell.err{animation:shake .32s;border-color:var(--bad)}
.bank{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:12px;display:grid;gap:8px;scroll-margin-bottom:16px}
.bank .bh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:.86rem}
.bank .bh b{font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow:auto}
.tile{font:600 .84rem var(--f-body);background:var(--sunk);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:grab;display:inline-flex;gap:6px;align-items:center;max-width:100%;text-align:left}
.tile:hover:not([disabled]){border-color:var(--accent)}
.tile .ct{font:500 .7rem var(--f-mono);color:var(--muted)}
.tile.out{opacity:.45;text-decoration:line-through;cursor:default}
.tile.dragging{opacity:.4}
.toast{font-size:.86rem;font-weight:600}
.toast:empty{display:none}
@media (max-width:560px){.tabs .long{display:none}}
.toast.bad{color:var(--bad)}
.toast.ok{color:var(--ok)}
.notes{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.notes li{border-left:3px solid var(--ok);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:.88rem}
.notes li b{font-weight:700}
.gdone{display:grid;gap:12px}
footer{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty-state{color:var(--muted);font-size:.9rem}
/* condensed label sizing (Barlow Condensed reads small) */
.mode-card .k,.optrow .lab,.stat span,.prompt-lab,.gcard .row{font-size:.82rem!important;font-weight:700!important;letter-spacing:.1em!important}
.tag{font-size:.8rem!important;font-weight:800!important}
.hy,.hybox b{font-size:.78rem!important;font-weight:800!important}
.kbd,.lecrow .pct,.chip .n,.tile .ct,.opt .key{font-size:.85rem!important;font-weight:600!important}
.gt th small{font-size:.76rem!important;font-weight:600!important}
.seq-done li::before{font-size:.95rem!important}
.btn,.seg button,.chip,.tabs button,.kind,.gt th{font-family:var(--f-mono)!important;letter-spacing:.06em;text-transform:uppercase}
.btn{font-size:.95rem!important;font-weight:700!important}
.btn.sm{font-size:.85rem!important}
.seg button{font-size:.88rem!important;font-weight:700!important}
.chip{font-size:.86rem!important;font-weight:700!important;text-transform:none;letter-spacing:.03em}
.tabs button{font-size:15px!important;letter-spacing:.08em}

const DATA = {"id": "ird10-12", "code": "IRD10–12", "prefix": "IRD", "title": "Tolerance, Hypersensitivity & Mucosal Immunity", "lectures": [{"k": "10", "name": "Mechanisms of Autoimmunity", "disc": "imm"}, {"k": "11", "name": "Hypersensitivity Reactions", "disc": "imm"}, {"k": "12", "name": "Mucosal & Skin Immune System", "disc": "imm"}], "los": {"10.1": "Describe mechanisms of immune tissue injury (Gell and Coombs) and the layers of self-tolerance", "10.2": "Explain sequestered or immune-privileged sites", "10.3": "Describe proposed mechanisms for the initiation of autoimmunity", "10.4": "Describe the role of infection and pattern recognition receptors in autoimmunity", "10.5": "Describe autoantibodies and their diagnostic use in SLE, Sjögren, thyroid, celiac and JIA", "10.6": "Describe the genetics of autoimmunity (HLA associations)", "11.1": "Describe the four hypersensitivity types: immune processes, effector mechanisms and triggers", "11.2": "Classify a hypersensitivity reaction by type when given its mechanism", "11.3": "Give examples of each hypersensitivity type (classic diseases and vignettes)", "12.1": "Describe the distinctive features of the mucosal immune system", "12.2": "Describe the role of the epithelium in mucosal immunity (barrier, sensing, alarmins)", "12.3": "Describe unique mucosal effector mechanisms, including IELs and lymphocyte homing", "12.4": "Describe the production, transport and functions of secretory IgA", "12.5": "Describe how antigens are sampled and recognized at mucosal sites", "12.6": "Explain the role of commensal bacteria in homeostasis and mucosal disease"}, "sets": [{"id": "s01", "lec": "10", "lo": "10.1", "kind": "term-def", "title": "Layer of self-tolerance → what it does", "left": "Tolerance layer", "right": "What it does", "pairs": [{"a": "Clonal deletion (central)", "b": "Strongly self-reactive developing lymphocytes die in the thymus or marrow", "why": "Negative selection. In the thymus, AIRE lets medullary epithelium express tissue antigens so self-reactive T cells can be removed; AIRE loss → APS-1.", "hy": true}, {"a": "Receptor editing", "b": "A developing B cell swaps its self-reactive light chain for a new one", "why": "B-cell central tolerance in the bone marrow: light-chain genes rearrange again. AIRE plays no role in B-cell tolerance."}, {"a": "Antigen segregation", "b": "Physical barriers keep lymphocytes from ever meeting certain self-antigens", "why": "Examples: blood–brain and blood–retina barriers. Immune privilege is the extreme form of segregation."}, {"a": "Peripheral anergy", "b": "Self-peptide seen without co-stimulation leaves the T cell unresponsive", "why": "Signal 1 (TCR–peptide–MHC) without signal 2 (B7–CD28) → anergy. Infection can supply the missing co-stimulation.", "hy": true}, {"a": "Regulatory (infectious) tolerance", "b": "One suppressor cell silences T cells seeing other antigens of the same tissue or APC", "why": "Tregs (natural from the thymus, or induced by TGF-β) suppress neighbors that share the tissue or APC, so one Treg specificity protects a whole organ.", "hy": true}, {"a": "Cytokine deviation", "b": "CD4 cells are pushed toward TH2, limiting inflammatory cytokine release", "why": "Shifting away from TH1 lowers IFN-γ-driven inflammation and favors suppressive cytokines."}, {"a": "Clonal exhaustion", "b": "Activated self-reactive cells die by apoptosis after repeated stimulation", "why": "Activation-induced death occurs mainly at sites of inflammation but also in secondary lymphoid organs."}]}, {"id": "s02", "lec": "10", "lo": "10.2", "kind": "cause-effect", "title": "Privileged-site feature or breach → consequence", "left": "Feature or event", "right": "Consequence", "pairs": [{"a": "No conventional lymphatic drainage", "b": "Tissue antigen rarely reaches draining lymph nodes to prime naive T cells", "why": "Privileged sites (brain, eye, testis, pregnant uterus) lack conventional lymphatics, so antigen is not carried to lymph nodes."}, {"a": "Blood–tissue barrier (e.g., blood–retina)", "b": "Naive lymphocytes are physically kept out of the tissue", "why": "Barriers sequester the tissue so immune cells cannot make direct contact and start a response."}, {"a": "Fas ligand on tissue cells", "b": "Fas-bearing lymphocytes that enter the site undergo apoptosis", "why": "Active suppression: FasL kills infiltrating Fas+ effector cells before they cause damage.", "hy": true}, {"a": "TGF-β in the local milieu", "b": "Antigen leaving the site induces tolerance rather than inflammation", "why": "Antigens leave privileged sites together with anti-inflammatory cytokines such as TGF-β, which favors Tregs."}, {"a": "Penetrating injury to one eye", "b": "Autoimmune inflammation of the uninjured eye weeks later", "why": "Sympathetic ophthalmia: sequestered eye antigens are released and prime autoreactive T cells that attack both eyes.", "hy": true}, {"a": "Testicular trauma or vasectomy", "b": "Anti-sperm antibodies and infertility", "why": "Sperm antigens first appear at puberty, after tolerance forms, and sit behind the blood–testis barrier. Privilege is not absolute."}]}, {"id": "s03", "lec": "10", "lo": "10.3", "kind": "term-app", "title": "How tolerance breaks → example", "left": "Initiating mechanism", "right": "Example", "pairs": [{"a": "Molecular mimicry", "b": "Antibodies to streptococcal M protein cross-react with cardiac myosin", "why": "Rheumatic fever is the classic mimicry disease (type II). Sydenham chorea is the basal-ganglia version.", "hy": true}, {"a": "Epitope spreading", "b": "Lupus antibodies widen from one nucleosome epitope to histones and DNA", "why": "Self-reactive B cells take up the whole complex and present new self-peptides, recruiting new T-cell help over time.", "hy": true}, {"a": "Release of sequestered antigen", "b": "Trauma exposes eye antigens that prime autoreactive T cells", "why": "Antigens never shown to the immune system during tolerance induction are treated as foreign once exposed."}, {"a": "Aberrant MHC class II expression", "b": "IFN-γ induces class II on thyroid cells, which present self-peptide to CD4 cells", "why": "Non-immune cells that start expressing MHC II become antigen-presenting cells for their own proteins."}, {"a": "Polyclonal activation", "b": "TSST-1 bridges MHC II and TCR Vβ, activating up to 20% of all T cells", "why": "Superantigens (and mitogens) act outside the peptide groove, unmasking autoreactive clones nonspecifically."}, {"a": "Infection-driven co-stimulation", "b": "A low-affinity self-reactive T cell is activated once APCs raise B7", "why": "Infection boosts APC co-stimulators while self-peptide is displayed, converting ignorance into activation."}]}, {"id": "s04", "lec": "10", "lo": "10.4", "kind": "cause-effect", "title": "Infection or PRR → autoimmune link", "left": "Infection or sensor", "right": "Autoimmune link", "pairs": [{"a": "TLR9", "b": "Endosomal sensor of self DNA in lupus B cells and pDCs", "why": "Self nucleic acids from dying cells reach endosomes and act like PAMPs. TLR3 = dsRNA, TLR7/8 = ssRNA, TLR9 = CpG DNA.", "hy": true}, {"a": "TLR7", "b": "Endosomal sensor of self single-stranded RNA in lupus", "why": "RNA-containing immune complexes trigger TLR7 in pDCs and B cells, driving type I interferon and autoantibodies."}, {"a": "DAMPs", "b": "Molecules from damaged or dying host cells that engage the same PRRs", "why": "PAMP = pathogen-derived; DAMP = damage-derived. Both activate innate sensors and can launch autoimmune inflammation."}, {"a": "Epstein–Barr virus", "b": "Lifelong latency in B cells (via CD21); strongly linked to MS", "why": "EBV is also associated with SLE, RA and Sjögren. HSV-1 is latent in ganglia, not B cells.", "hy": true}, {"a": "Group A streptococcal pharyngitis", "b": "Rheumatic carditis or Sydenham chorea weeks to months later", "why": "Cross-reactive antibodies hit cardiac myosin (carditis) or basal-ganglia neurons (chorea). PSGN, by contrast, is immune-complex (type III).", "hy": true}, {"a": "Enteroviral infection", "b": "Suspected trigger of islet autoimmunity and type 1 diabetes", "why": "Islet autoantibodies (GAD65, IA-2, insulin) appear months to years before hyperglycemia; the β-cell injury itself is T-cell (type IV)."}]}, {"id": "s05", "lec": "10", "lo": "10.5", "kind": "disease-finding", "title": "Autoantibody → disease significance", "left": "Autoantibody", "right": "Significance", "pairs": [{"a": "ANA", "b": "Sensitive SLE screen (95–98%) with poor specificity", "why": "Negative ANA effectively rules lupus out (SnOut); a positive one needs a specific test to confirm.", "hy": true}, {"a": "Anti-dsDNA", "b": "SLE-specific; rises with lupus nephritis and disease activity", "why": "Found in ~60% of patients; titers track flares, especially renal and CNS disease.", "hy": true}, {"a": "Anti-Smith (anti-Sm)", "b": "Most specific SLE antibody, yet present in only 10–30%", "why": "A positive anti-Sm rules lupus in (SpIn), but its low sensitivity makes it a poor screen."}, {"a": "Anti-Ro/SSA", "b": "Maternal IgG that causes congenital heart block in neonatal lupus", "why": "IgG crosses the placenta and binds the Ro-expressing fetal conduction system. Anti-Ro also binds UV-activated keratinocytes (photosensitive rash).", "hy": true}, {"a": "Anti-SSB/La", "b": "Sjögren antibody that usually accompanies anti-Ro", "why": "Sicca (dry eyes, dry mouth, caries) with anti-Ro and anti-La; Sjögren carries a higher lymphoma risk."}, {"a": "Anti-TPO (anti-microsomal)", "b": "Hashimoto thyroiditis with gland destruction and hypothyroidism", "why": "Usually with anti-thyroglobulin; often accompanies other autoimmunity such as type 1 diabetes."}, {"a": "TSH-receptor antibody", "b": "Stimulates the receptor: hyperthyroidism, goiter and exophthalmos", "why": "Graves disease: non-cytotoxic type II. Antibody acting in orbital fat also drives the eye disease."}, {"a": "IgA anti-tissue transglutaminase", "b": "Celiac serology; falsely negative in selective IgA deficiency", "why": "tTG is the endomysial antigen. Always check total IgA; HLA-DQ2/DQ8 is nearly universal in celiac disease.", "hy": true}, {"a": "Anti-CCP", "b": "Erosive RF-positive polyarthritis (adult-type RA)", "why": "In a child, RF+/anti-CCP+ symmetric small-joint arthritis = RF-positive polyarticular JIA, the counterpart of adult RA (DR4)."}]}, {"id": "s06", "lec": "10", "lo": "10.5", "kind": "term-app", "title": "Serology scenario → interpretation", "left": "Scenario", "right": "Interpretation", "pairs": [{"a": "Negative ANA in a woman with fatigue and joint pain", "b": "Lupus effectively ruled out: sensitive test is negative (SnOut)", "why": "Sensitivity is not positive predictive value; a highly sensitive test is most useful when negative.", "hy": true}, {"a": "Positive anti-Sm in a woman with rash and arthritis", "b": "Lupus ruled in: highly specific test is positive (SpIn)", "why": "Specific tests rarely turn positive in people without the disease, so a positive result confirms."}, {"a": "ANA-positive 5-year-old with one swollen knee for 2 months", "b": "Oligoarticular JIA: start regular slit-lamp screening for uveitis", "why": "ANA+ oligoarticular JIA carries a high risk of silent anterior uveitis that can cause blindness.", "hy": true}, {"a": "Malabsorption, negative IgA anti-tTG and recurrent Giardia", "b": "Measure total IgA: deficiency gives false-negative serology", "why": "Selective IgA deficiency is associated with celiac disease; use IgG-based tests if total IgA is absent."}, {"a": "Normoglycemic sibling with GAD65 and IA-2 antibodies", "b": "Islet autoimmunity can precede hyperglycemia by months to years", "why": "Autoantibodies are markers of an ongoing T-cell attack on β cells before clinical diabetes."}, {"a": "Lupus patient with new proteinuria and rising anti-dsDNA", "b": "Nephritis flare; expect low C3 and C4 from complement consumption", "why": "Immune complexes deposit in glomeruli (type III) and consume complement.", "hy": true}]}, {"id": "s07", "lec": "10", "lo": "10.6", "kind": "disease-finding", "title": "HLA allele → associated disease", "left": "HLA allele", "right": "Disease (relative risk)", "pairs": [{"a": "HLA-B27", "b": "Ankylosing spondylitis (RR >150), reactive arthritis, anterior uveitis", "why": "MHC class I. Inflammation along the body's center: spine, sacroiliac joints, anterior eye, aortic valve. Seronegative.", "hy": true}, {"a": "HLA-DR4", "b": "Rheumatoid arthritis (RR 6–9)", "why": "DR4 shared-epitope alleles predispose to RA; DR3/DR4 together also raise type 1 diabetes risk.", "hy": true}, {"a": "HLA-DR3", "b": "Graves, Hashimoto, myasthenia gravis and Addison disease", "why": "DR3 is a broad autoimmunity allele (RR ~2–7); with DR2 it also raises SLE risk."}, {"a": "HLA-DQ2/DQ8", "b": "Celiac disease (RR ≈ 30)", "why": "These class II molecules bind deamidated gliadin tightly. DQ8 is also linked to type 1 diabetes.", "hy": true}, {"a": "HLA-DQ6.02", "b": "Narcolepsy (RR >40) and multiple sclerosis", "why": "DQ6.02 travels on the DR15 (DR2) haplotype that is the classic MS risk allele."}, {"a": "HLA-Cw6", "b": "Psoriasis vulgaris (RR ≈ 7)", "why": "A class I (HLA-C) association; psoriatic arthritis also links to B27."}, {"a": "HLA-B35", "b": "Subacute thyroiditis (RR ≈ 14)", "why": "Painful, often post-viral thyroiditis; a class I association."}, {"a": "HLA-DR8", "b": "Juvenile arthritis (RR ≈ 8)", "why": "Class II association with juvenile idiopathic arthritis."}]}, {"id": "s08", "lec": "11", "lo": "11.1", "kind": "structure-function", "title": "Hypersensitivity mediator → role", "left": "Mediator", "right": "Role", "pairs": [{"a": "Histamine", "b": "Preformed amine causing vasodilation and leak within minutes", "why": "Released on mast-cell degranulation; makes the wheal (edema from permeability) and flare (erythema from vasodilation).", "hy": true}, {"a": "Leukotrienes", "b": "Newly made lipid mediators sustaining late-phase bronchoconstriction", "why": "Late phase (8–12 h): eosinophils and TH2 cells plus leukotrienes; responds to corticosteroids, not antihistamines.", "hy": true}, {"a": "Tryptase", "b": "Mast-cell protease measured in serum to confirm anaphylaxis", "why": "Most specific marker of mast-cell degranulation; draw 1–2 h after onset."}, {"a": "IL-4 and IL-13", "b": "TH2 cytokines that switch B cells to IgE", "why": "Sensitization: APC → TH2 → IL-4/IL-13 → IgE → binds FcεRI on mast cells and basophils."}, {"a": "IL-5", "b": "Recruits and activates eosinophils", "why": "Eosinophils dominate the late-phase reaction and chronic allergic inflammation."}, {"a": "C5a", "b": "Anaphylatoxin drawing neutrophils to antibody or complex deposits", "why": "In types II and III, C5a-recruited neutrophils release enzymes and ROS; frustrated phagocytosis of deposits causes damage."}, {"a": "C5b–9 (MAC)", "b": "Pore complex that lyses antibody-coated cells", "why": "One cytotoxic arm of type II, e.g., ABO IgM fixing complement on transfused RBCs → intravascular hemolysis."}, {"a": "IFN-γ", "b": "TH1 cytokine that activates macrophages in delayed reactions", "why": "Type IV CD4 arm: TH1 → IFN-γ → macrophages release TNF-α, IL-1, enzymes and ROS. Also drives granulomas.", "hy": true}, {"a": "IL-17", "b": "T-cell cytokine recruiting neutrophils in delayed reactions", "why": "TH17 arm of type IV; IL-6 drives TH17 differentiation."}]}, {"id": "s09", "lec": "11", "lo": "11.2", "kind": "disease-finding", "title": "Disease → hypersensitivity type and mechanism", "left": "Disease", "right": "Type and mechanism", "pairs": [{"a": "Myasthenia gravis", "b": "Type II: antibody blocks the acetylcholine receptor", "why": "Non-cytotoxic type II: function is lost while the cell survives.", "hy": true}, {"a": "Graves disease", "b": "Type II: antibody stimulates the TSH receptor", "why": "Non-cytotoxic type II with a gain of function (agonist antibody)."}, {"a": "Goodpasture (anti-GBM) disease", "b": "Type II: IgG against collagen IV α3 chain, linear deposits", "why": "Linear IF = antibody against a fixed membrane antigen; lung and kidney basement membranes share the target.", "hy": true}, {"a": "Post-streptococcal glomerulonephritis", "b": "Type III: granular glomerular complexes with low C3", "why": "Granular IF = deposited complexes. Contrast rheumatic fever (type II mimicry).", "hy": true}, {"a": "Serum sickness", "b": "Type III: systemic complexes 1–2 weeks after foreign serum", "why": "Antibody to horse proteins (antivenom) or chimeric antibodies forms complexes with residual drug: fever, rash, arthralgia, proteinuria, low C3."}, {"a": "Arthus reaction", "b": "Type III: local complexes and neutrophil vasculitis at injection site", "why": "Hours (4–12 h) after injecting antigen into a sensitized person with high antibody levels, e.g., an extra tetanus booster."}, {"a": "Poison ivy contact dermatitis", "b": "Type IV: urushiol-modified skin proteins activate TH1 cells", "why": "Hapten-modified self proteins; vesicular rash 1–3 days after contact."}, {"a": "Peanut anaphylaxis", "b": "Type I: allergen cross-links IgE on mast cells", "why": "Needs prior sensitization; onset in minutes. First-line treatment is IM epinephrine."}]}, {"id": "s10", "lec": "11", "lo": "11.3", "kind": "term-app", "title": "Hypersensitivity vignette → diagnosis", "left": "Vignette clue", "right": "Diagnosis", "pairs": [{"a": "Anaphylaxis during transfusion; recurrent sinusitis and giardiasis", "b": "Anti-IgA antibodies in selective IgA deficiency", "why": "Patients lacking IgA make anti-IgA; give IgA-depleted products. Same risk with IVIG.", "hy": true}, {"a": "Fever, flank pain and dark urine 15 minutes into a transfusion", "b": "ABO-incompatible acute hemolytic reaction", "why": "Preformed anti-A/B IgM fixes complement → intravascular hemolysis; direct Coombs positive (type II).", "hy": true}, {"a": "Hydropic, anemic second child of an Rh-negative mother", "b": "Hemolytic disease of the newborn from anti-RhD IgG", "why": "First Rh+ pregnancy sensitizes; IgG crosses the placenta in the next. RhoGAM at 28 weeks and within 72 h of delivery.", "hy": true}, {"a": "Itchy morbilliform rash 8 days after starting amoxicillin", "b": "Delayed T-cell drug eruption (type IV)", "why": "Immediate urticaria = type I; delayed morbilliform rash or SJS/TEN = type IV."}, {"a": "Wheezing returns 10 hours after cat exposure, no re-exposure", "b": "Late-phase type I reaction (eosinophils, leukotrienes)", "why": "Recruited eosinophils and TH2 cells sustain inflammation 8–12 h later; corticosteroids prevent it."}, {"a": "Dry cough, erythema nodosum and bilateral hilar adenopathy", "b": "Sarcoidosis: noncaseating granulomas from TH1/IFN-γ", "why": "Granulomas are type IV; TNF-α maintains them (anti-TNF therapy can reactivate TB)."}, {"a": "Positive direct Coombs and hemolysis on high-dose IV penicillin", "b": "Drug-hapten type II hemolytic anemia", "why": "Penicillin binds the RBC membrane; IgG against the drug–membrane complex opsonizes the cells."}, {"a": "Red, swollen injection site 6 hours after an extra tetanus booster", "b": "Arthus reaction: local immune-complex vasculitis", "why": "High preexisting antibody meets injected antigen locally → complexes, complement, neutrophils, fibrinoid necrosis."}]}, {"id": "s11", "lec": "11", "lo": "11.1", "kind": "term-def", "title": "Test or finding → what it shows", "left": "Test or finding", "right": "What it shows", "pairs": [{"a": "Direct Coombs test", "b": "IgG or complement already bound to the patient's RBCs", "why": "Direct = antibody ON the cells (AIHA, HDN, transfusion reaction).", "hy": true}, {"a": "Indirect Coombs test", "b": "Free anti-RBC antibody circulating in the patient's serum", "why": "Indirect = patient serum + reagent RBCs + anti-human globulin (pre-transfusion and prenatal screening)."}, {"a": "PPD induration at 48–72 hours", "b": "Memory TH1 response with IFN-γ-activated macrophages", "why": "Measure induration, not redness. A classic type IV reaction."}, {"a": "Interferon-γ release assay", "b": "In vitro TB T-cell test not affected by prior BCG", "why": "Uses TB-specific antigens absent from BCG, so vaccinated people are not falsely positive."}, {"a": "Elevated serum tryptase", "b": "Recent widespread mast-cell degranulation", "why": "Supports anaphylaxis when drawn 1–2 h after onset."}, {"a": "Low serum C3 and C4", "b": "Active consumption of classical-pathway complement in serum", "why": "Active lupus nephritis, serum sickness; PSGN mainly lowers C3. Complement is consumed, not raised.", "hy": true}, {"a": "Linear IgG along a basement membrane", "b": "Antibody bound to a fixed matrix antigen (type II)", "why": "Anti-GBM disease. Contrast granular (lumpy-bumpy) deposits of type III.", "hy": true}, {"a": "Granular glomerular IgG and C3 deposits", "b": "Immune complexes trapped in the glomerular wall (type III)", "why": "PSGN, lupus nephritis, serum sickness."}, {"a": "Wheal and flare 15 minutes after skin prick", "b": "IgE sensitization to the tested allergen", "why": "Wheal = edema from increased permeability; flare = erythema from vasodilation."}]}, {"id": "s12", "lec": "12", "lo": "12.2", "kind": "structure-function", "title": "Epithelial cell → mucosal job", "left": "Epithelial cell", "right": "Mucosal job", "pairs": [{"a": "Paneth cell", "b": "Crypt-base cell secreting α-defensins and lysozyme", "why": "Eosinophilic granules at the crypt base. NOD2 variants impair Paneth-cell function in Crohn disease.", "hy": true}, {"a": "Goblet cell", "b": "Makes mucus and opens passages delivering soluble antigen to DCs", "why": "Mucus traps microbes and holds SIgA and antimicrobial peptides; IL-13 increases its output."}, {"a": "M cell", "b": "Carries luminal antigen into Peyer's patches; exploited by Salmonella", "why": "Thin mucus, few microvilli; also exploited by Shigella, Yersinia and poliovirus.", "hy": true}, {"a": "Tuft cell", "b": "Chemosensory cell that detects worm succinate and releases IL-25", "why": "IL-25 activates ILC2s → IL-13 'weep and sweep' worm expulsion."}, {"a": "Healthy absorptive enterocyte", "b": "Sealed by tight junctions; senses invasion with basolateral TLRs", "why": "TLRs sit basolaterally and in endosomes, so they detect invasion rather than harmless colonization."}, {"a": "Stressed or infected enterocyte", "b": "Displays MIC-A/B and secretes IL-15 to activate IELs", "why": "Stress signals mark the cell for NKG2D+ IEL killing (central in celiac disease)."}]}, {"id": "s13", "lec": "12", "lo": "12.3", "kind": "structure-function", "title": "Mucosal immune cell → role", "left": "Cell", "right": "Role", "pairs": [{"a": "Lamina propria macrophage", "b": "Kills microbes quietly: makes IL-10 but no TNF or IL-1", "why": "Resident gut macrophages are phagocytic but lack TLR4/CD14 signaling and FcRs, so they do not inflame.", "hy": true}, {"a": "Newly recruited blood monocyte", "b": "Main source of inflammatory cytokines in invasive infection", "why": "In invasive Salmonella, monocytes entering from blood (not resident macrophages) drive inflammation."}, {"a": "ILC2", "b": "Responds to IL-25, IL-33 and TSLP by releasing IL-5 and IL-13", "why": "Innate type 2 cell behind worm expulsion and the start of allergic airway inflammation."}, {"a": "ILC3", "b": "Innate source of IL-22 that drives epithelial repair", "why": "IL-22 maintains barrier integrity and antimicrobial peptide production."}, {"a": "CD8αα intraepithelial lymphocyte", "b": "Uses NKG2D to kill MIC-A-expressing stressed epithelium", "why": "Innate-like IELs (αβ or γδ TCR) recognize stress ligands rather than a specific peptide.", "hy": true}, {"a": "Eosinophil", "b": "Releases MMPs that activate latent TGF-β for IgA switching", "why": "Eosinophil-deficient mice have markedly reduced gut IgA."}, {"a": "Lamina propria plasma cell", "b": "Secretes J-chain-linked dimeric IgA", "why": "The dimer is then carried across the epithelium by pIgR."}, {"a": "Induced Treg", "b": "TGF-β-induced FoxP3+ cell keeping food and commensals tolerated", "why": "The gut default when the barrier is intact; enterocytes are vulnerable to IFN-γ and TNF, so Tregs are favored."}]}, {"id": "s14", "lec": "12", "lo": "12.3", "kind": "cause-effect", "title": "Mucosal cytokine → effect", "left": "Cytokine", "right": "Source or effect", "pairs": [{"a": "IL-25", "b": "Tuft-cell signal released after sensing helminth succinate", "why": "First step of the anti-worm type 2 response (IL-25 → ILC2)."}, {"a": "IL-33 and TSLP", "b": "Alarmins from directly damaged epithelium (smoke, allergen, worm bites)", "why": "They activate ILC2s and TH2 cells; allergy and asthma begin at a damaged epithelium."}, {"a": "IL-13", "b": "Increases goblet-cell mucus and smooth-muscle contraction", "why": "'Weep and sweep' expels worms; also central in asthma.", "hy": true}, {"a": "IL-17", "b": "TH17 signature cytokine that induces epithelial defensins", "why": "TH17 response, promoted by segmented filamentous bacteria or barrier breach (IL-1, IL-6)."}, {"a": "IL-22", "b": "ILC3 cytokine that drives epithelial repair and barrier integrity", "why": "Made by ILC3s (and TH17/TH22 cells)."}, {"a": "IL-15", "b": "Made by stressed or infected epithelium to activate IELs", "why": "Also raises MIC-A; key in celiac disease and viral enteritis (e.g., norovirus).", "hy": true}, {"a": "IL-1 and IL-18", "b": "Inflammasome (caspase-1) products of infected enterocytes", "why": "They activate myeloid cells and increase barrier integrity."}, {"a": "TGF-β", "b": "Default gut signal for Treg differentiation and IgA switching", "why": "With retinoic acid (and APRIL for IgA). Breach shifts to TH17; worms and damage shift to TH2.", "hy": true}]}, {"id": "s15", "lec": "12", "lo": "12.3", "kind": "structure-function", "title": "Homing or transport molecule → role", "left": "Molecule", "right": "Role", "pairs": [{"a": "α4β7 integrin", "b": "Gut-homing integrin on primed lymphocytes; blocked by vedolizumab", "why": "Imprinted by gut DCs during priming in GALT.", "hy": true}, {"a": "MAdCAM-1", "b": "Addressin on mucosal venules that captures α4β7+ cells", "why": "Lets gut-primed cells leave blood into the lamina propria of the gut and other mucosae."}, {"a": "CCR9", "b": "Chemokine receptor imprinted by gut DCs for small-intestine entry", "why": "Retinoic acid from gut DCs induces CCR9 and α4β7."}, {"a": "CCL25", "b": "Small-intestine chemokine that attracts CCR9+ cells", "why": "Ligand of CCR9, made by small-intestine epithelium."}, {"a": "αEβ7 (CD103)", "b": "Integrin binding E-cadherin to hold IELs in the epithelium", "why": "Retention rather than homing from blood."}, {"a": "NKG2D", "b": "Activating IEL receptor for the stress ligands MIC-A/B", "why": "Drives enterocyte killing in celiac disease."}, {"a": "Poly-Ig receptor (pIgR)", "b": "Basolateral receptor that transcytoses dimeric IgA", "why": "Cleaved at the apical face, leaving secretory component on SIgA.", "hy": true}, {"a": "FcRn", "b": "Shuttles IgG–antigen complexes across the epithelium to DCs", "why": "This sampling route works only if IgG to the antigen already exists."}]}, {"id": "s16", "lec": "12", "lo": "12.5", "kind": "term-def", "title": "Antigen-sampling route → defining feature", "left": "Route", "right": "Defining feature", "pairs": [{"a": "M-cell transcytosis", "b": "Nonspecific uptake of free microbes over Peyer's patches; Salmonella entry", "why": "M cells are antigen 'mailboxes'; Peyer's patches have no afferent lymphatics.", "hy": true}, {"a": "Goblet-cell-associated passages", "b": "Deliver small soluble proteins to lamina propria DCs", "why": "Soluble food proteins reach DCs this way."}, {"a": "Transepithelial DC dendrites", "b": "Extended between enterocytes to sample the lumen directly", "why": "DCs keep tight-junction contacts while reaching into the lumen."}, {"a": "FcRn-mediated transport", "b": "Requires preexisting IgG against the antigen", "why": "IgG–antigen complexes are shuttled from the lumen to DCs."}, {"a": "Apoptotic epithelial blebs", "b": "Dying virus-infected enterocytes (e.g., rotavirus) handed to DCs", "why": "DCs engulf fragments of dead infected cells and cross-present viral antigen."}]}, {"id": "s17", "lec": "12", "lo": "12.6", "kind": "cause-effect", "title": "Microbiota factor → immune outcome", "left": "Factor", "right": "Outcome", "pairs": [{"a": "Segmented filamentous bacteria", "b": "TH17 differentiation (via serum amyloid A)", "why": "Sensed through flagellin/TLR5 and SAA; promote a protective TH17 tone.", "hy": true}, {"a": "Fiber-fermenting Clostridium species", "b": "Butyrate-driven FoxP3+ Treg induction", "why": "High-fiber diet → butyrate → TGF-β and colonic Tregs."}, {"a": "Broad-spectrum antibiotics", "b": "Loss of colonization resistance and C. difficile overgrowth", "why": "Commensals normally outcompete pathogens and make their own antimicrobials.", "hy": true}, {"a": "Germ-free (sterile) gut", "b": "Poorly developed Peyer's patches and MALT", "why": "Commensals prime normal development of mucosal lymphoid tissue."}, {"a": "Loss-of-function NOD2 variant", "b": "Crohn disease from failed bacterial sensing and autophagy", "why": "NOD2 (CARD15) is the strongest Crohn risk gene; bacteria that enter the mucosa are not cleared.", "hy": true}, {"a": "CD45RBhi naive CD4 cells into RAG-deficient mice", "b": "Severe colitis unless CD45RBlo Tregs are co-transferred", "why": "Shows that Tregs (and TGF-β) restrain T-cell responses to commensals. CD45RBhi = naive."}]}, {"id": "s18", "lec": "12", "lo": "12.4", "kind": "term-def", "title": "Secretory IgA fact → detail", "left": "IgA feature", "right": "Detail", "pairs": [{"a": "Secretory component", "b": "Cleaved extracellular fragment of pIgR wrapped around SIgA", "why": "Made by the epithelial cell; protects SIgA from proteases and anchors it in mucus.", "hy": true}, {"a": "J chain", "b": "Plasma-cell polypeptide linking two IgA monomers", "why": "Needed for pIgR binding; also joins IgM pentamers."}, {"a": "IgA class-switch signals", "b": "TGF-β plus retinoic acid and APRIL", "why": "Contrast IL-4 for IgE. Eosinophil MMPs activate latent TGF-β.", "hy": true}, {"a": "Serum IgA subclasses", "b": "Mostly monomeric; about 95% IgA1", "why": "Serum IgA is made mainly in the bone marrow."}, {"a": "Secretory IgA subclasses", "b": "Dimeric; IgA1:IgA2 about 1:1", "why": "IgA2 resists bacterial IgA1 proteases. IgA is the most-produced antibody (several grams per day)."}, {"a": "Selective IgA deficiency", "b": "Sinopulmonary infections, giardiasis and transfusion anaphylaxis", "why": "Most common primary immunodeficiency; also false-negative IgA celiac serology.", "hy": true}, {"a": "Why SIgA does not cause inflammation", "b": "It neutralizes without activating complement", "why": "Lets SIgA handle huge antigen loads daily: neutralizes in the lumen, inside endosomes, and exports antigen from the lamina propria."}]}], "seqs": [{"id": "q01", "lec": "10", "lo": "10.3", "title": "Epitope spreading in lupus", "prompt": "Put the steps of epitope spreading in order (first → last).", "steps": ["Self-reactive B cell binds a nucleosome and gets a TLR9 signal", "B cell internalizes the whole nucleosome complex", "B cell presents several different self-peptides on MHC II", "T cells specific for those new peptides are activated", "These T cells help other B cells make antibody to new epitopes"], "why": "Activated B cells act as APCs for every peptide in the complex they swallow, so the autoimmune response widens over time (lupus, pemphigus).", "hy": true}, {"id": "q02", "lec": "11", "lo": "11.1", "title": "Type I hypersensitivity", "prompt": "Put the steps of a type I (allergic) reaction in order (first → last).", "steps": ["APC presents allergen on MHC II with co-stimulation", "Naive CD4 T cell becomes a TH2 cell", "IL-4/IL-13 switch B cells to IgE", "IgE binds FcεRI on mast cells and basophils", "Re-exposure: allergen cross-links bound IgE", "Mast cell degranulates, releasing histamine"], "why": "First exposure only sensitizes. Cross-linking of two or more FcεRI-bound IgE triggers degranulation; serum IgE is low because most sits on mast cells.", "hy": true}, {"id": "q03", "lec": "11", "lo": "11.1", "title": "Type III immune-complex injury", "prompt": "Put the steps of type III injury in order (first → last).", "steps": ["IgG binds a soluble antigen, forming circulating complexes", "Small complexes made in antigen excess escape clearance", "Complexes deposit in vessel walls and basement membranes", "Deposits activate complement (C3a, C5a)", "C5a-recruited neutrophils release enzymes and ROS", "Vasculitis, glomerulonephritis or arthritis develops"], "why": "Large lattices are cleared via CR1 on RBCs to the spleen; small ones lodge. Complement is consumed, so C3/C4 fall.", "hy": true}, {"id": "q04", "lec": "11", "lo": "11.3", "title": "Poison ivy contact dermatitis", "prompt": "Put the events of poison ivy contact dermatitis in order (first → last).", "steps": ["Urushiol binds skin proteins, creating new epitopes", "Skin APCs prime naive CD4 T cells in the lymph node", "IL-12 drives TH1 differentiation and memory forms", "On re-exposure, memory TH1 cells release IFN-γ at the site", "Activated macrophages release TNF-α, enzymes and ROS", "Itchy vesicular rash appears 1–3 days after contact"], "why": "Type IV is 'delayed' because memory T cells and macrophages must be recruited, which takes 1–3 days."}, {"id": "q05", "lec": "11", "lo": "11.2", "title": "Reaction timing", "prompt": "Arrange these reactions by typical onset after exposure (fastest → slowest).", "steps": ["Anaphylaxis (type I early phase)", "Type I late-phase reaction", "Tuberculin skin reaction (type IV)", "Serum sickness after a first dose of foreign serum"], "why": "Minutes (type I) → 8–12 h (late phase) → 48–72 h (type IV) → 1–2 weeks (serum sickness, while antibody is first being made).", "hy": true}, {"id": "q06", "lec": "12", "lo": "12.1", "title": "Gut wall from lumen inward", "prompt": "Put these layers in order from the gut lumen inward (first → last).", "steps": ["Commensal bacteria in the central lumen", "Mucus layer with antimicrobial peptides and SIgA", "Epithelial cells joined by tight junctions", "Lamina propria with IgA plasma cells, DCs and macrophages", "Lymphatics draining to mesenteric lymph nodes"], "why": "Commensals are kept in the lumen by mucus, SIgA and peptides; the epithelium separates them from a lamina propria primed for tolerance."}, {"id": "q07", "lec": "12", "lo": "12.4", "title": "IgA transport into the lumen", "prompt": "Put the steps of IgA transport into the gut lumen in order (first → last).", "steps": ["Plasma cell secretes J-chain-linked dimeric IgA", "Dimeric IgA binds pIgR on the basolateral epithelium", "The complex is endocytosed and transcytosed", "pIgR is cleaved, releasing SIgA with secretory component", "SIgA binds to the mucus layer"], "why": "Cleaving pIgR makes transport one-way; the leftover fragment is secretory component.", "hy": true}, {"id": "q08", "lec": "12", "lo": "12.3", "title": "Mucosal lymphocyte homing", "prompt": "Put the journey of a lymphocyte primed in a Peyer's patch in order (first → last).", "steps": ["Luminal antigen activates a naive lymphocyte in a Peyer's patch", "The activated cell is imprinted to express α4β7 and CCR9", "It leaves via mesenteric node and thoracic duct", "It circulates in the blood", "It binds MAdCAM-1 and enters the gut lamina propria"], "why": "Primed in the gut → home to the gut (and other mucosae). This is why oral vaccines best protect against enteric pathogens.", "hy": true}], "grids": [{"id": "g01", "lec": "11", "lo": "11.1", "title": "Gell & Coombs master chart", "blurb": "Hard: read the classic clue, name the type, then fill its effector, mechanism and a classic example.", "cols": [{"h": "Type", "dep": 1}, {"h": "Classic clue"}, {"h": "Effector", "dep": 0}, {"h": "Mechanism", "dep": 0}, {"h": "Example", "dep": 0}], "rows": [["Type I", "Wheal and flare within minutes", "IgE on mast cells", "Allergen cross-links IgE → degranulation", "Peanut anaphylaxis"], ["Type II, cytotoxic", "Positive direct Coombs, hemolysis", "IgG/IgM marking cells for killing", "Complement lysis, opsonization, ADCC", "Hemolytic disease of newborn"], ["Type II, non-cytotoxic", "Receptor blocked or stimulated", "IgG agonist or blocker of a receptor", "Alters receptor function; cell survives", "Myasthenia gravis, Graves"], ["Type III", "Low C3, granular deposits", "IgG–soluble antigen complexes", "Deposition → C5a → neutrophils", "PSGN, serum sickness"], ["Type IV, CD4", "Induration at 48–72 hours", "TH1/TH17 cells", "IFN-γ activates macrophages", "PPD, contact dermatitis"], ["Type IV, CD8", "CD8 cells beside dying target cells", "Cytotoxic T cells", "Perforin/granzyme, Fas–FasL", "Type 1 diabetes insulitis"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Type I, late phase", "Type V"], "2": ["IgA on epithelium", "NK cells alone", "IgD on naive B cells"], "3": ["Superantigen binds TCR Vβ", "Direct toxin damage", "Bradykinin excess"], "4": ["Hereditary angioedema", "Chronic granulomatous disease", "Selective IgA deficiency"]}, "notes": ["Sensitization first (TH2 → IgE); re-exposure cross-links FcεRI-bound IgE. Treat anaphylaxis with IM epinephrine.", "Antibody against a fixed cell or matrix antigen; Rh HDN, AIHA, ITP, ABO transfusion reaction, Goodpasture.", "Same antibody class, but the cell is not destroyed: MG blocks AChR, Graves stimulates TSH-R.", "Antigen is soluble, so damage appears wherever complexes lodge (kidney, joints, vessels, skin).", "Only T cells transfer it (not serum). Granulomas, PPD, contact dermatitis, Hashimoto, graft rejection.", "Direct killing by CD8 CTLs; T1D, and part of transplant rejection and viral hepatitis injury."], "hy": "ACID: Allergic (I), Cytotoxic (II), Immune complex (III), Delayed (IV). Types I–III = antibody; IV = T cells. Autoimmune injury uses II, III and IV, never I."}, {"id": "g02", "lec": "11", "lo": "11.3", "title": "Classic disease → type → key finding", "blurb": "Hard: use the clinical clue to name the disease, then fill its hypersensitivity type and key finding.", "cols": [{"h": "Disease", "dep": 1}, {"h": "Clinical clue"}, {"h": "Type", "dep": 0}, {"h": "Key finding or test", "dep": 0}], "rows": [["Goodpasture syndrome", "Smoker with hemoptysis and hematuria", "Type II", "Linear IgG along the GBM"], ["Post-strep GN", "Cola urine 2 weeks after sore throat", "Type III", "Granular IgG/C3, low C3"], ["Hemolytic disease of newborn", "Hydropic second baby, Rh-neg mother", "Type II", "Positive direct Coombs in infant"], ["Pemphigus vulgaris", "Flaccid oral and skin blisters", "Type II", "Intercellular IgG (desmoglein 3)"], ["Serum sickness", "Fever, rash, arthralgia after antivenom", "Type III", "Systemic complexes, low C3 and C4"], ["Anaphylaxis", "Hives and hypotension after peanuts", "Type I", "Raised serum tryptase"], ["Sarcoidosis", "Hilar nodes and erythema nodosum", "Type IV", "Noncaseating granulomas"], ["Allergic contact dermatitis", "Rash under a watch buckle 2 days later", "Type IV", "Positive patch test"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Bullous pemphigoid", "Hereditary angioedema", "Acute rheumatic fever"], "2": ["Non-immune (toxic)", "Innate only"], "3": ["Linear IgG at the DEJ", "Caseating granulomas", "Low C1 esterase inhibitor"]}, "notes": ["Anti-collagen IV α3 antibody hits lung and kidney basement membranes; linear IF = type II.", "Immune complexes after nephritogenic strep; granular 'lumpy-bumpy' IF, low C3. Rheumatic fever is the type II strep sequel.", "Maternal anti-RhD IgG crosses the placenta; prevent with RhoGAM at 28 weeks and within 72 h of delivery.", "Antibody against desmoglein (desmosomes) → acantholysis; pemphigoid targets hemidesmosomes (linear at the DEJ).", "Antibody to horse or chimeric proteins forms complexes with residual drug; systemic type III.", "IgE-mediated mast-cell degranulation in minutes; IM epinephrine first.", "TH1 → IFN-γ → epithelioid macrophages; TNF-α maintains granulomas.", "Nickel or poison ivy hapten; delayed 1–3 days, so not type I."], "hy": "Linear IF = type II (antibody to fixed antigen); granular IF + low C3 = type III. Strep: rheumatic fever = II (mimicry), PSGN = III."}, {"id": "g03", "lec": "10", "lo": "10.5", "title": "Autoantibody chart", "blurb": "Hard: use the clinical clue to pick the autoantibody, then fill the disease and the key pearl.", "cols": [{"h": "Autoantibody", "dep": 1}, {"h": "Clinical clue"}, {"h": "Disease", "dep": 0}, {"h": "Key pearl", "dep": 0}], "rows": [["ANA", "First screen for suspected lupus", "SLE screen; many diseases", "Sensitive, not specific (SnOut)"], ["Anti-dsDNA", "Lupus flare with new proteinuria", "SLE", "Tracks activity and nephritis"], ["Anti-Smith", "Rarely positive but rules lupus in", "SLE", "Most specific, only 10–30%"], ["Anti-Ro/SSA", "Newborn with complete heart block", "Neonatal lupus (heart block)", "Maternal IgG crosses placenta"], ["Anti-SSB/La", "Dry eyes, dry mouth, new caries", "Sjögren (with anti-Ro)", "Higher lymphoma risk"], ["Anti-TPO (microsomal)", "Goiter, cold intolerance, high TSH", "Hashimoto thyroiditis", "Destroys gland → hypothyroid"], ["TSH-receptor antibody", "Exophthalmos with suppressed TSH", "Graves disease", "Stimulates receptor (type II)"], ["IgA anti-tTG", "Fatty stools and blunted villi", "Celiac disease", "Check total IgA too"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Anti-centromere", "Anti-Jo-1", "Anti-histone"], "2": ["Drug-induced lupus", "Systemic sclerosis", "Dermatomyositis"], "3": ["Blocks the AChR", "Marks drug-induced lupus", "Rises only in pregnancy"]}, "notes": ["Peripheral or speckled IF pattern; 95–98% sensitive, so a negative ANA rules lupus out.", "Specific for SLE (~60%); titers rise with nephritis and CNS flares, with falling C3/C4.", "Highest specificity but low sensitivity: a positive result rules lupus in (SpIn).", "Fetal conduction tissue expresses Ro; mother may be asymptomatic or have sicca symptoms.", "Accompanies anti-Ro in Sjögren; watch for parotid enlargement and lymphoma.", "With anti-thyroglobulin; type IV thyroid destruction; associated with DR3 and with type 1 diabetes.", "Agonist antibody → hyperthyroidism, goiter, eye disease from orbital fat involvement.", "tTG deamidates gliadin; the antibody is diagnostic, not the cause of villous damage."], "hy": "ANA = screen (sensitive); anti-dsDNA and anti-Sm = confirm (specific). Anti-Ro → congenital heart block. IgA anti-tTG → always check total IgA."}, {"id": "g04", "lec": "10", "lo": "10.6", "title": "HLA risk chart", "blurb": "Hard: from the disease, recall the HLA allele, then fill its relative risk and MHC class.", "cols": [{"h": "HLA allele", "dep": 1}, {"h": "Disease"}, {"h": "Relative risk", "dep": 0}, {"h": "MHC class", "dep": 0}], "rows": [["HLA-B27", "Ankylosing spondylitis", ">150", "Class I"], ["HLA-B35", "Subacute thyroiditis", "≈14", "Class I"], ["HLA-Cw6", "Psoriasis vulgaris", "≈7", "Class I"], ["HLA-DR3", "Addison disease", "5–7", "Class II"], ["HLA-DR4", "Rheumatoid arthritis", "6–9", "Class II"], ["HLA-DR8", "Juvenile arthritis", "≈8", "Class II"], ["HLA-DQ2/DQ8", "Celiac disease", "≈30", "Class II"], ["HLA-DQ6.02", "Narcolepsy", ">40", "Class II"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["HLA-A3", "HLA-DR5", "HLA-B51"], "1": ["Hemochromatosis", "Behçet disease", "Pemphigus vulgaris"], "2": ["≈1", "≈100", "≈500"], "3": ["Class III", "Nonclassical (HLA-E)"]}, "notes": ["Spine, sacroiliac joints, anterior uveitis and aortic valve; seronegative spondyloarthritis.", "Painful thyroiditis, often after a viral illness.", "HLA-C class I allele; psoriatic arthritis also links to B27.", "DR3 also: Graves, Hashimoto, myasthenia gravis; DR2/DR3 for SLE; DR3/DR4 for type 1 diabetes.", "Shared-epitope alleles; RF+/anti-CCP+ erosive arthritis.", "Juvenile idiopathic arthritis association.", "DQ2/DQ8 bind let RF=null, timerId=null;
