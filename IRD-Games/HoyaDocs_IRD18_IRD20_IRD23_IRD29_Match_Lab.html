<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRD18 · 20 · 23 · 29 Match Lab · HoyaDocs</title>
<meta name="description" content="HoyaDocs IRD18 · 20 · 23 · 29 Match Lab: Skin: Rashes, Blisters &amp; Tumors. Rapid Fire matching and Grid Lock charts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* HoyaDocs Match Lab engine v1.0
   Layout: header + mode tabs; Home (mode cards, filters, mastery), Rapid Fire (one match per card), Grid Lock (chart + tile bank).
   Colors are tokens on :root with a dark set. Every view stacks to one column on phones. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#1A3363; --muted:#5B6274; --line:#D3D8E0; --chip:#E6E9EE;
  --navy:#0F2244; --navy2:#1A3363; --onnavy:#F4F1EA; --silver:#6E7787; --tan:#5AAEE6;
  --neuro:#5B4BC4; --path:#1F7F78; --drt:#C4631B; --pharm:#2368A8; --imm:#5B4BC4; --mic:#4D7C2A; --accent:#1D6FA8; --accent-ink:#ffffff;
  --ok:#1d7a3e; --ok-bg:#e3f4e8; --bad:#b3261e; --bad-bg:#fbe7e5; --once:#b7791f; --once-bg:#fdf1dc;
  --hy-bg:#FFF4C2; --hy-line:#D4A300; --hy-ink:#5E4700;
  --k1:#2c55a0; --k2:#6b46c1; --k3:#a02c4f; --k4:#b45309; --k5:#0f6b6b; --k6:#85600f; --k7:#1d7a3e; --k8:#0369a1;
  --given:#f5f7f9; --lock:#e9ecef; --clue-bg:#e3ecfa; --clue-ink:#1d3f7a; --clue-line:#9db6e3;
  --f-display:"Graduate","Rockwell","Georgia",serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#A99CF0; --path:#5CC2B8; --drt:#F0A060; --pharm:#7FB3EA; --imm:#A99CF0; --mic:#8CC06A; --navy:#0A1830; --navy2:#13284d; --onnavy:#F4F1EA; --silver:#9aa6b2; --tan:#5AAEE6; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#A99CF0; --path:#5CC2B8; --drt:#F0A060; --pharm:#7FB3EA; --imm:#A99CF0; --mic:#8CC06A; --navy:#0A1830; --navy2:#13284d; --onnavy:#F4F1EA; --silver:#9aa6b2; --tan:#5AAEE6; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15.5px/1.55 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 56px;display:grid;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:.03em}
h3{font-family:var(--f-mono);font-weight:800;letter-spacing:.03em}
/* HoyaDocs hub shell: wordmark bar, section nav, navy varsity hero */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 0 0}
.word{font-family:var(--f-display);font-size:24px;letter-spacing:.04em;text-decoration:none;color:var(--ink);line-height:1}
.word span{color:var(--silver)}
.rev{font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.topr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.themebtn{background:transparent;border:1.5px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:5px 14px;cursor:pointer}
.themebtn:hover{color:var(--ink);border-color:var(--ink)}
.hubnav{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;border-top:3px solid var(--ink);border-bottom:1px solid var(--line)}
.hubnav::-webkit-scrollbar{display:none}
.hubnav a{flex:none;text-decoration:none;font-family:var(--f-mono);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:11px 12px 9px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
.hubnav a:hover{color:var(--ink)}
.hubnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--tan)}
.hubnav a i{width:9px;height:9px;border-radius:2px;flex:none}
.hubnav .sep{flex:none;width:1px;background:var(--line);margin:9px 6px}
header.hero{background:var(--navy);color:var(--onnavy);border-radius:14px;padding:clamp(20px,3.5vw,36px) clamp(20px,4vw,40px);position:relative;overflow:hidden}
header.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(255,255,255,.045) calc(10% - 1px) 10%),radial-gradient(ellipse at 88% 115%, rgba(90,174,230,.34), transparent 58%)}
header.hero > *{position:relative}
.hero .k{font-family:var(--f-mono);font-weight:700;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:#8FCBF5}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5.4vw,52px);line-height:1.02;letter-spacing:.02em;margin:10px 0 4px;color:#F4F1EA;text-shadow:2px 2px 0 #1A3363,4px 4px 0 #5AAEE6}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.meta{font:500 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
header.top h1{font-size:clamp(1.5rem,3.4vw,2rem)}
header.top .lede{margin:4px 0 0;color:var(--muted);max-width:66ch}
.back{font:600 .8rem var(--f-body);text-decoration:none;color:var(--muted)}
.back:hover{color:var(--ink)}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .86rem var(--f-body);background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:.8rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:700 .82rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:1.15rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.mode-card{display:grid;gap:10px;align-content:start}
.mode-card .k{font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mode-card h2{font-size:1.45rem}
.mode-card p{margin:0;color:var(--muted)}
.opts{display:grid;gap:8px}
.optrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.optrow .lab{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:76px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:600 .8rem var(--f-body);border:0;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .78rem var(--f-body);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.chip[aria-pressed="false"]{opacity:.5;text-decoration:line-through;text-decoration-color:var(--muted)}
.chip .n{font:500 .7rem var(--f-mono);color:var(--muted)}
.statrow{display:flex;flex-wrap:wrap;gap:18px}
.stat b{display:block;font:700 1.25rem var(--f-body);font-variant-numeric:tabular-nums}
.stat span{font:500 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.lecrow{display:grid;grid-template-columns:auto minmax(0,1fr) 120px auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.lecrow:first-of-type{border-top:0}
.lecrow .pct{font:500 .75rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
@media (max-width:560px){.lecrow{grid-template-columns:auto minmax(0,1fr) auto}.lecrow .bar{grid-column:1/-1;order:5}}
.tag{font:600 .68rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;color:#fff;background:var(--lc,var(--neuro));white-space:nowrap}
:root[data-theme="dark"] .tag{color:#0d1520}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag{color:#0d1520} }
.hy{font:700 .66rem var(--f-mono);letter-spacing:.06em;background:var(--hy-bg);color:var(--hy-ink);border:1px solid var(--hy-line);border-radius:5px;padding:1px 6px}
.hybox{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.hybox b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
details.how{font-size:.9rem}
details.how summary{cursor:pointer;font-weight:700}
details.how ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
details.how li{margin:3px 0}

/* Rapid fire */
.rf-top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.timer{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.timer i.low{background:var(--bad)}
.qcard{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kind{font:700 .72rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--kc);border:1.5px solid var(--kc);border-radius:6px;padding:2px 8px}
.qset{font-size:.82rem;color:var(--muted)}
.prompt-lab{font:500 .7rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prompt{font:600 clamp(1.15rem,2.6vw,1.4rem)/1.35 var(--f-body);margin:2px 0 0}
.ask{font-size:.88rem;color:var(--muted);margin:0}
.options{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:.95rem;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .key{font:500 .75rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;height:24px;display:grid;place-items:center}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:8px;font-size:.92rem}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb h3{font:800 1.05rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.fb p{margin:0}
.fb .also{font-size:.86rem;color:var(--muted)}
.fb .also b{color:var(--ink)}
.navrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.kbd{font:500 .72rem var(--f-mono);color:var(--muted)}
/* sequence */
.seq-done{display:grid;gap:6px;counter-reset:s;padding:0;margin:0;list-style:none}
.seq-done li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;background:var(--ok-bg);border:1px solid var(--ok);border-radius:8px;padding:7px 10px;font-size:.92rem}
.seq-done li::before{content:counter(s);font:700 .8rem var(--f-mono);color:var(--ok);text-align:center}
.seq-done li.slot{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.seq-done li.slot::before{color:var(--muted)}
.seq-pool{display:grid;gap:6px}
.seq-pool .opt{grid-template-columns:minmax(0,1fr)}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
/* end */
.end{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.big{font:700 clamp(2rem,6vw,3rem)/1 var(--f-display)}
.misslist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.misslist li{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:8px 12px;font-size:.9rem;background:var(--surface)}
.misslist .a{font-weight:700}
.misslist .b{color:var(--muted)}

/* Grid list */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start}
.gcard:hover{border-color:var(--accent)}
.gcard h3{font-size:1.02rem}
.gcard p{margin:0;font-size:.84rem;color:var(--muted)}
.gcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 .72rem var(--f-mono);color:var(--muted)}
.stars{font-size:.85rem;letter-spacing:1px;color:var(--once)}
.stars .off{color:var(--line)}
/* Grid play */
.gwrap{display:grid;gap:12px}
.gtable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.gt{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
.gt th{font:700 .74rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--sunk);vertical-align:bottom}
.gt th small{display:block;font:500 .66rem var(--f-mono);letter-spacing:.03em;text-transform:none;color:var(--muted);margin-top:2px}
.gt th.clue{background:var(--clue-bg);color:var(--clue-ink)}
.gt th.clue small{color:var(--clue-ink)}
.gt td{padding:5px;border-bottom:1px solid var(--line);vertical-align:top;min-width:120px}
.gt tr:last-child td{border-bottom:0}
.gt td + td,.gt th + th{border-left:1px solid var(--line)}
.cell{width:100%;min-height:44px;border-radius:8px;padding:7px 9px;font-size:.88rem;line-height:1.3;text-align:left;display:flex;align-items:center;gap:6px}
.cell.given{background:var(--given);font-weight:600}
.cell.clue{background:var(--clue-bg);color:var(--clue-ink);border:1px solid var(--clue-line);font-weight:600}
.cell.empty{border:1.5px dashed var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.cell.empty:hover,.cell.empty.drop{border-color:var(--accent);color:var(--ink)}
.cell.sel{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink)}
.cell.locked{background:var(--lock);color:var(--muted);border:1px solid var(--line);cursor:not-allowed;font-size:.78rem}
.cell.locked svg{width:13px;height:13px;flex:none}
.cell.filled{background:var(--ok-bg);border:1px solid var(--ok);font-weight:600}
.cell.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.cell.err{animation:shake .32s;border-color:var(--bad)}
.bank{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:12px;display:grid;gap:8px;scroll-margin-bottom:16px}
.bank .bh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:.86rem}
.bank .bh b{font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow:auto}
.tile{font:600 .84rem var(--f-body);background:var(--sunk);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:grab;display:inline-flex;gap:6px;align-items:center;max-width:100%;text-align:left}
.tile:hover:not([disabled]){border-color:var(--accent)}
.tile .ct{font:500 .7rem var(--f-mono);color:var(--muted)}
.tile.out{opacity:.45;text-decoration:line-through;cursor:default}
.tile.dragging{opacity:.4}
.toast{font-size:.86rem;font-weight:600}
.toast:empty{display:none}
@media (max-width:560px){.tabs .long{display:none}}
.toast.bad{color:var(--bad)}
.toast.ok{color:var(--ok)}
.notes{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.notes li{border-left:3px solid var(--ok);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:.88rem}
.notes li b{font-weight:700}
.gdone{display:grid;gap:12px}
footer{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty-state{color:var(--muted);font-size:.9rem}
/* condensed label sizing (Barlow Condensed reads small) */
.mode-card .k,.optrow .lab,.stat span,.prompt-lab,.gcard .row{font-size:.82rem!important;font-weight:700!important;letter-spacing:.1em!important}
.tag{font-size:.8rem!important;font-weight:800!important}
.hy,.hybox b{font-size:.78rem!important;font-weight:800!important}
.kbd,.lecrow .pct,.chip .n,.tile .ct,.opt .key{font-size:.85rem!important;font-weight:600!important}
.gt th small{font-size:.76rem!important;font-weight:600!important}
.seq-done li::before{font-size:.95rem!important}
.btn,.seg button,.chip,.tabs button,.kind,.gt th{font-family:var(--f-mono)!important;letter-spacing:.06em;text-transform:uppercase}
.btn{font-size:.95rem!important;font-weight:700!important}
.btn.sm{font-size:.85rem!important}
.seg button{font-size:.88rem!important;font-weight:700!important}
.chip{font-size:.86rem!important;font-weight:700!important;text-transform:none;letter-spacing:.03em}
.tabs button{font-size:15px!important;letter-spacing:.08em}

const DATA = {"id": "ird18-29", "code": "IRD18 · 20 · 23 · 29", "prefix": "IRD", "title": "Skin: Rashes, Blisters & Tumors", "lectures": [{"k": "18", "name": "Derm Inflammatory Diseases & Topical Medicines", "disc": "path"}, {"k": "20", "name": "Derm Neoplastic Diseases", "disc": "path"}, {"k": "23", "name": "IRD Pathology Lab", "disc": "path"}, {"k": "29", "name": "Viral Exanthems", "disc": "mic"}], "los": {"18.1": "Psoriasis: clinical types, pathogenesis, triggers, risk factors and treatment principles", "18.2": "Atopic dermatitis: features, pathogenesis, first plan for a child; topical steroid risks", "18.3": "Acne: pathogenesis, morphologic subtypes, drug mechanisms and the treatment ladder", "18.4": "Drug rashes: immediate vs delayed, exanthem vs SJS/TEN, drug timeline to find the culprit", "18.5": "Immunobullous disease: pemphigus vs pemphigoid features, pathogenesis and diagnostic tests", "18.6": "Drugs to know: topical steroid potency/vehicle; tretinoin, clindamycin, BPO, doxy, isotretinoin", "20.1": "Skin cancer overview: etiologies, risk by Fitzpatrick skin type, presentation across skin tones", "20.2": "Basal cell carcinoma: subtypes, hedgehog pathway, histology, behavior, treatment, Gorlin", "20.3": "SCC spectrum: AK, SCC in situ, invasive SCC, keratoacanthoma, verrucous carcinoma", "20.4": "Melanoma: risk factors, molecular pathogenesis, clinical subtypes and the ABCDE approach", "20.5": "Melanoma: histology, Breslow depth, prognostic factors and management", "23.1": "Correlate normal skin histology and describe the cells of each epidermal layer", "23.2": "Acne vulgaris, atopic (eczematous) dermatitis and psoriasis: pathogenesis, pathology, treatment", "23.3": "Differentiate pemphigus vulgaris and bullous pemphigoid clinically and pathologically", "23.4": "BCC, keratoacanthoma, SCC and melanoma: risk factors, clinical, pathologic, molecular features", "29.1": "Identify exanthem types (scarlatiniform vs morbilliform) and skin signs of viral infections", "29.2": "Clinical manifestations of measles, rubella, varicella/zoster, parvovirus B19, roseola, mumps", "29.3": "Clinical manifestations of enterovirus infections, incl. coxsackievirus (hand-foot-mouth)", "29.4": "Clinical manifestations of scarlet fever and its mimic, Kawasaki disease", "29.5": "Identify specific viral exanthems in people of color"}, "sets": [{"id": "s01", "lec": "18", "lo": "18.1", "kind": "disease-finding", "title": "Psoriasis form → presentation", "left": "Form", "right": "Presentation", "pairs": [{"a": "Plaque psoriasis", "b": "Sharply demarcated red plaques with silvery scale on elbows, knees, scalp and lower back", "why": "The most common form. Extensor plaques plus the Auspitz sign (pinpoint bleeding when scale is lifted) and Koebner phenomenon (new plaques at sites of trauma).", "hy": true}, {"a": "Guttate (eruptive) psoriasis", "b": "Dozens of small drop-like scaly papules on the trunk about 2 weeks after strep pharyngitis", "why": "Guttate = 'drop'. Classic trigger is group A strep pharyngitis in a child or young adult; can be the first presentation of psoriasis.", "hy": true}, {"a": "Pustular psoriasis", "b": "Fever with widespread sterile pustules on red skin after a systemic steroid taper or in pregnancy", "why": "Withdrawal of systemic corticosteroids is a classic trigger, which is why systemic steroids are avoided in psoriasis. The pustules are sterile (neutrophils, no organisms).", "hy": true}, {"a": "Erythrodermic psoriasis", "b": "Near-total-body redness and scaling with loss of heat, fluid and protein", "why": "A severe, generalized form; patients can lose heat, fluid and protein through the inflamed skin. Also can be triggered by steroid withdrawal."}, {"a": "Nail psoriasis", "b": "Pits in the nail plate and yellow-brown 'oil spots' in the nail bed", "why": "Pits = defective keratinization of the nail matrix; oil spots = psoriasis of the nail bed. Nail disease is a marker of increased psoriatic arthritis risk."}, {"a": "Psoriatic arthritis", "b": "Asymmetric DIP-joint arthritis with sausage-shaped digits (dactylitis)", "why": "Seronegative spondyloarthropathy; HLA-B27 (axial) and HLA-C*06:02 (skin) associations. DIP involvement and dactylitis separate it from rheumatoid arthritis."}]}, {"id": "s02", "lec": "18", "lo": "18.1", "kind": "drug-mech", "title": "Psoriasis drug → mechanism", "left": "Drug", "right": "Mechanism / key fact", "pairs": [{"a": "Calcipotriene", "b": "Topical vitamin D analog that slows keratinocyte growth (often used on steroid-free days)", "why": "Vitamin D analog; a common pattern is topical steroid on weekdays and calcipotriene on weekends to spare steroid side effects."}, {"a": "Tazarotene", "b": "Topical vitamin A derivative (retinoid) applied to plaques", "why": "Tazarotene = topical retinoid (vitamin A). Like all retinoids, avoid in pregnancy; it is irritating, so it is often paired with a steroid."}, {"a": "Acitretin", "b": "Oral retinoid that is teratogenic but not immunosuppressive", "why": "Oral retinoid used for pustular and severe psoriasis. Teratogenic, so strict contraception is required; it does not suppress immunity."}, {"a": "Apremilast", "b": "Oral phosphodiesterase-4 inhibitor that is not immunosuppressive", "why": "PDE-4 inhibition ↑ cAMP and lowers inflammatory cytokine output. Main side effects are GI upset and weight loss; no lab monitoring for infection risk."}, {"a": "Cyclosporine", "b": "Oral calcineurin inhibitor; hypertension and nephrotoxicity limit long-term use", "why": "Blocks calcineurin → ↓ NFAT → ↓ IL-2. Works fast for flares but is limited to short courses because of HTN and renal toxicity."}, {"a": "Secukinumab", "b": "Antibody to IL-17A; can worsen IBD and raise Candida risk", "why": "IL-17 is the effector cytokine of Th17 cells and is needed for mucocutaneous antifungal defense, so blockade ↑ Candida. IL-17 blockers can unmask or worsen Crohn disease.", "hy": true}, {"a": "Ustekinumab", "b": "Antibody to the shared p40 subunit, blocking both IL-12 and IL-23", "why": "p40 is shared by IL-12 (Th1) and IL-23 (Th17). Used in psoriasis, psoriatic arthritis and IBD."}, {"a": "Guselkumab", "b": "Antibody to the IL-23 p19 subunit, sparing IL-12", "why": "Anti-p19 drugs (guselkumab, risankizumab, tildrakizumab) block IL-23 only, cutting off Th17 maintenance."}]}, {"id": "s03", "lec": "18", "lo": "18.6", "kind": "term-app", "title": "Topical steroid or vehicle → best use", "left": "Agent / vehicle", "right": "Potency or best use", "pairs": [{"a": "Clobetasol propionate 0.05%", "b": "Class 1 super-potent steroid for thick plaques on the body, used in short courses", "why": "Look at the class, not the percentage: clobetasol 0.05% is far stronger than hydrocortisone 2.5%. Never use chronically on the face, folds or groin.", "hy": true}, {"a": "Triamcinolone acetonide 0.1%", "b": "Medium-potency workhorse steroid for the trunk and limbs", "why": "Mid-potency; the strength of a given product also depends on its vehicle (ointment > cream > lotion)."}, {"a": "Hydrocortisone 2.5%", "b": "Class 7, least potent steroid; safe choice for face, skin folds and infants", "why": "Thin skin (face, eyelids, folds, groin) and infants absorb more steroid, so they need the lowest-potency agents or a nonsteroid such as a calcineurin inhibitor."}, {"a": "Ointment vehicle", "b": "Most potent and least irritating vehicle, but greasy", "why": "Occlusion increases penetration, so the same drug at the same % is strongest as an ointment. Few preservatives → least stinging."}, {"a": "Cream vehicle", "b": "Better tolerated cosmetically, but less potent and more likely to sting", "why": "Creams are water-based emulsions; they rub in and are less greasy, but contain preservatives that can irritate and penetrate less than ointments."}, {"a": "Lotion vehicle", "b": "Least potent, thin liquid vehicle that spreads easily over hairy areas", "why": "Same drug, same %: ointment > cream > lotion. Liquids (lotions, solutions, foams) are useful on the scalp."}, {"a": "Tachyphylaxis", "b": "Loss of a topical steroid's effect after continuous daily use", "why": "A proposed (controversial) adverse effect of chronic topical steroid use, alongside atrophy, telangiectasias, steroid acne and adrenal suppression."}]}, {"id": "s04", "lec": "18", "lo": "18.2", "kind": "drug-mech", "title": "Atopic dermatitis therapy → role", "left": "Therapy", "right": "Mechanism / role", "pairs": [{"a": "Emollients", "b": "Barrier repair used at every step, even when the skin is clear", "why": "AD starts with a barrier defect (filaggrin loss → xerosis, allergen entry). Emollients plus gentle skin care are the base of every AD plan.", "hy": true}, {"a": "Low-potency topical steroid", "b": "Short course to control a flare in a child", "why": "First plan for a child: emollients + gentle care + a short course of a low-potency topical steroid for flares, then steroid-sparing maintenance."}, {"a": "Tacrolimus or pimecrolimus", "b": "Topical calcineurin inhibitor for eyelids and face that does not thin the skin", "why": "Topical calcineurin inhibitors block T-cell activation without causing atrophy, so they are ideal for maintenance on thin skin."}, {"a": "Dupilumab", "b": "Antibody to IL-4 receptor α, blocking both IL-4 and IL-13 signaling", "why": "AD is Th2-skewed (IL-4, IL-13, IgE). IL-4Rα is shared by the IL-4 and IL-13 receptors, so one antibody blocks both. Common side effect: conjunctivitis.", "hy": true}, {"a": "Tralokinumab", "b": "Antibody that neutralizes IL-13 alone", "why": "IL-13 is a key Th2 effector cytokine in AD skin; tralokinumab blocks it but not IL-4."}, {"a": "Upadacitinib", "b": "Oral JAK inhibitor for refractory moderate–severe disease", "why": "Oral JAK inhibitors (upadacitinib, abrocitinib) block signaling from many Th2 cytokines; boxed warnings include infection, thrombosis and MACE."}, {"a": "Ruxolitinib cream", "b": "Topical JAK inhibitor applied to limited areas", "why": "A topical JAK1/2 inhibitor, a steroid-sparing option for mild–moderate AD."}]}, {"id": "s05", "lec": "18", "lo": "18.4", "kind": "disease-finding", "title": "Drug reaction → defining feature", "left": "Reaction", "right": "Defining feature", "pairs": [{"a": "Immediate drug reaction", "b": "Hives and lip swelling within an hour of a dose; IgE-mediated (type I)", "why": "Immediate (<1 h) = urticaria, angioedema, anaphylaxis via IgE on mast cells. Delayed reactions (exanthem, SJS/TEN) are T-cell mediated (type IV).", "hy": true}, {"a": "Exanthematous (morbilliform) drug eruption", "b": "Itchy pink rash starting on the trunk 7–10 days after a new drug; skin only", "why": "The most common drug rash. Stop the drug, give topical steroids and antihistamines, and reassure. Antibiotics are the usual culprits.", "hy": true}, {"a": "Stevens-Johnson syndrome", "b": "Dusky painful macules and mucosal erosions with detachment of <10% of body surface", "why": "SJS and TEN are one disease spectrum graded by detached (or detachable) BSA: SJS <10%, overlap 10–30%, TEN >30%.", "hy": true}, {"a": "SJS/TEN overlap", "b": "Epidermal detachment involving 10–30% of body surface", "why": "Overlap is the middle category. Management is the same: stop all non-essential drugs, burn-unit care, early ophthalmology."}, {"a": "Toxic epidermal necrolysis", "b": "Sheets of sloughing skin over >30% of body surface", "why": "Full-thickness keratinocyte necrosis. Sepsis is a major cause of death; culprits include sulfonamides, allopurinol, anticonvulsants and NSAIDs.", "hy": true}]}, {"id": "s06", "lec": "18", "lo": "18.5", "kind": "term-def", "title": "Immunobullous term → meaning", "left": "Term", "right": "Meaning", "pairs": [{"a": "Desmoglein 3", "b": "Desmosomal cadherin targeted by IgG in mucosa-predominant pemphigus vulgaris", "why": "Dsg3 is the main mucosal desmoglein, so anti-Dsg3 gives oral erosions; adding anti-Dsg1 brings skin blisters. Type II hypersensitivity.", "hy": true}, {"a": "BP180 (collagen XVII)", "b": "Hemidesmosome protein targeted by IgG in bullous pemphigoid", "why": "BP180 and BP230 anchor basal keratinocytes to the basement membrane, so the split is subepidermal and the blister is tense.", "hy": true}, {"a": "Tombstoning", "b": "Row of basal keratinocytes left standing on the basement membrane after a suprabasal split", "why": "Seen in pemphigus vulgaris: basal cells stay attached by hemidesmosomes while desmosomes above them fail."}, {"a": "Fishnet direct immunofluorescence", "b": "Intercellular IgG outlining every keratinocyte", "why": "The net-like pattern of pemphigus: IgG bound to desmosomes between keratinocytes.", "hy": true}, {"a": "Linear direct immunofluorescence", "b": "Continuous IgG and C3 band along the basement membrane zone", "why": "Pemphigoid pattern. Remember BP = Below the epidermis + Basement membrane + linear."}, {"a": "Nikolsky sign", "b": "Lateral pressure on normal-looking skin shears off the epidermis", "why": "Positive in pemphigus (and SJS/TEN) where epidermal cohesion is lost; negative in bullous pemphigoid."}, {"a": "Perilesional biopsy", "b": "Sample of normal-appearing skin beside a blister, sent for direct IF", "why": "Bound antibody is best preserved next to the lesion. The H&E biopsy is taken from the edge of a fresh blister to show the level of the split."}, {"a": "Rituximab", "b": "Anti-CD20 added to systemic steroids as first-line for moderate–severe pemphigus", "why": "Depleting B cells lowers anti-desmoglein production and gives durable remission in pemphigus vulgaris."}]}, {"id": "s07", "lec": "20", "lo": "20.1", "kind": "cause-effect", "title": "Gene or repair defect → skin tumor link", "left": "Gene / defect", "right": "Tumor link", "pairs": [{"a": "PTCH1 inactivation", "b": "Basal cell carcinoma via constitutive hedgehog signaling (sporadic or Gorlin)", "why": "PTCH1 is a tumor suppressor that normally inhibits SMO. Loss (or SMO gain) → GLI on → growth. Germline loss = Gorlin syndrome (AD).", "hy": true}, {"a": "TP53 mutation from UVB thymine dimers", "b": "Early driver of cutaneous squamous cell carcinoma", "why": "Chronic UVB makes cyclobutane pyrimidine (thymine) dimers; TP53 mutation is an early event in AK → SCC.", "hy": true}, {"a": "BRAF V600E", "b": "Found in about half of cutaneous melanomas; target of BRAF + MEK inhibitors", "why": "Common in melanoma on intermittently sun-exposed skin (and in benign nevi). Vemurafenib/dabrafenib plus a MEK inhibitor.", "hy": true}, {"a": "KIT mutation", "b": "Driver typical of acral and mucosal melanoma", "why": "Acral and mucosal melanomas are not UV-driven and more often carry KIT than BRAF mutations; may respond to imatinib."}, {"a": "Germline CDKN2A", "b": "Familial melanoma with pancreatic cancer in relatives", "why": "CDKN2A encodes p16 (Rb pathway) and p14ARF (p53 pathway). Familial atypical mole/melanoma + pancreatic cancer."}, {"a": "MC1R variants", "b": "Red hair, fair skin and poor tanning with ↑ melanoma risk", "why": "MC1R loss shifts melanin production to red pheomelanin, which protects poorly against UV."}, {"a": "HRAS mutation", "b": "Keratoacanthoma, with cyclin D1 up and p16 intact", "why": "KA arises from follicular epithelium and can regress; HRAS mutations and BRAF-inhibitor therapy are linked to it."}, {"a": "Nucleotide excision repair defect", "b": "Xeroderma pigmentosum with skin cancers in childhood", "why": "AR defect in repairing UV-induced pyrimidine dimers → extreme photosensitivity and SCC, BCC and melanoma at a young age."}]}, {"id": "s08", "lec": "20", "lo": "20.3", "kind": "disease-finding", "title": "Keratinocyte lesion → clue", "left": "Lesion", "right": "Classic clue", "pairs": [{"a": "Actinic keratosis", "b": "Rough, sandpaper-like scaly papule on sun-damaged skin; partial-thickness atypia", "why": "The most common precancer in dermatology; risk of progression to SCC is low (<1 in 1000 per year). Treat with cryotherapy or field therapy (5-FU, imiquimod).", "hy": true}, {"a": "SCC in situ (Bowen disease)", "b": "Sharply marginated scaly red plaque; full-thickness atypia with intact basement membrane", "why": "Often misdiagnosed as eczema or psoriasis because it does not respond to steroids. Full thickness but no invasion.", "hy": true}, {"a": "Conventional invasive SCC", "b": "Keratotic nodule whose atypical keratinocytes breach the basement membrane, forming keratin pearls", "why": "Invasion through the basement membrane defines SCC. Cutaneous SCC metastasizes <5%, more than BCC; lip, ear and scar sites are high-risk."}, {"a": "Keratoacanthoma", "b": "Dome-shaped crateriform nodule that grows within weeks and may involute", "why": "Rapid growth then regression over months, with a central keratin core. Debated SCC variant; treated by excision like SCC."}, {"a": "Verrucous carcinoma", "b": "Cauliflower-like warty tumor on the sole that erodes bone but rarely metastasizes", "why": "HPV-linked, very well-differentiated, low-grade SCC with high recurrence and local destruction. Excise; radiation is avoided."}]}, {"id": "s09", "lec": "20", "lo": "20.4", "kind": "disease-finding", "title": "Melanoma subtype → clue", "left": "Subtype", "right": "Classic clue", "pairs": [{"a": "Superficial spreading melanoma", "b": "Most common subtype; back of men, legs of women; radial then vertical growth", "why": "60–70% of melanomas in fair skin. A new nodule within an old irregular lesion signals the vertical growth phase.", "hy": true}, {"a": "Nodular melanoma", "b": "Symmetric blue-black nodule with vertical growth only, thick at diagnosis", "why": "No radial phase, so it is deep when found and carries a worse prognosis. May fail ABCDE; think EFG (elevated, firm, growing).", "hy": true}, {"a": "Lentigo maligna melanoma", "b": "Slowly enlarging tan-brown patch on the sun-damaged cheek of an elderly person", "why": "About 10% of melanomas; chronic sun exposure on the face of older adults; only ~5% of lentigo maligna (in situ) becomes invasive."}, {"a": "Acral lentiginous melanoma", "b": "Palm, sole or nail lesion, not UV-related; up to 70% of melanoma in skin of color", "why": "About 5% of melanoma overall but the most common type in darker skin; often diagnosed late (mistaken for a bruise). Hutchinson sign = pigment on the nail fold.", "hy": true}, {"a": "Amelanotic melanoma", "b": "Pink, pigment-poor papule that mimics BCC but has the same prognosis", "why": "Can be any subtype. Lack of pigment delays diagnosis; confirm with S-100, SOX10, HMB-45 or Melan-A."}]}, {"id": "s10", "lec": "20", "lo": "20.5", "kind": "term-def", "title": "Melanoma staging & therapy term → meaning", "left": "Term", "right": "Meaning", "pairs": [{"a": "Breslow depth", "b": "Thickness from the granular layer to the deepest tumor cell; #1 prognostic factor", "why": "Vertical depth predicts metastasis better than anything else; T stage = depth + ulceration.", "hy": true}, {"a": "Ulceration", "b": "Loss of overlying epidermis that upstages the T category at any thickness", "why": "Second most important primary-tumor factor after Breslow depth; it moves a tumor from 'a' to 'b' in its T category."}, {"a": "Sentinel lymph node biopsy", "b": "Nodal staging step offered for tumors T1b and thicker", "why": "Melanoma management: wide local excision with margins set by depth, plus SLNB for T1b+, then surveillance.", "hy": true}, {"a": "Pagetoid scatter", "b": "Atypical melanocytes climbing singly into the upper epidermis", "why": "Histologic hallmark of melanoma, along with lack of maturation with depth and dermal mitoses. Benign nevi stay at the dermal–epidermal junction."}, {"a": "Pembrolizumab", "b": "Anti-PD-1 antibody that stops tumor PD-L1 from switching off T cells", "why": "Checkpoint inhibitors (anti-PD-1: pembrolizumab, nivolumab) are first-line for advanced melanoma; side effects are immune-related (colitis, thyroiditis, pneumonitis)."}, {"a": "Ipilimumab", "b": "Anti-CTLA-4 antibody that removes an early brake on T-cell priming", "why": "CTLA-4 competes with CD28 for B7. Blocking it boosts priming; more autoimmune toxicity than anti-PD-1."}, {"a": "Vemurafenib", "b": "BRAF V600E kinase inhibitor given with a MEK inhibitor", "why": "Targeted therapy for BRAF-mutant melanoma. Used alone it can cause keratoacanthomas and cutaneous SCCs (paradoxical MAPK activation)."}]}, {"id": "s11", "lec": "23", "lo": "23.1", "kind": "term-def", "title": "Dermatopathology term → definition", "left": "Term", "right": "Definition", "pairs": [{"a": "Acanthosis", "b": "Thickening of the epidermis, mainly the stratum spinosum", "why": "Trap: acanthosis is NOT a thick stratum corneum (that is hyperkeratosis). Regular acanthosis is a psoriasis feature.", "hy": true}, {"a": "Hyperkeratosis", "b": "Thickening of the stratum corneum", "why": "Seen in actinic keratosis, warts and many chronic dermatoses."}, {"a": "Parakeratosis", "b": "Retained nuclei in the stratum corneum", "why": "Normal corneum is anucleate. Rapid turnover (psoriasis: ~4 days instead of ~1 month) leaves nuclei behind.", "hy": true}, {"a": "Spongiosis", "b": "Edema fluid between keratinocytes within the epidermis", "why": "The defining feature of eczematous dermatitis; severe spongiosis forms intraepidermal vesicles."}, {"a": "Acantholysis", "b": "Loss of desmosomal connections, so keratinocytes round up and separate", "why": "Due to desmosome failure, as in pemphigus vulgaris (anti-desmoglein IgG)."}, {"a": "Peripheral palisading", "b": "Tumor nuclei lined up like a fence at the edge of each nest", "why": "Classic for basal cell carcinoma, together with basaloid cells, retraction clefts and mucinous stroma."}, {"a": "Keratin pearl", "b": "Concentric whorl of keratinized squamous cells", "why": "Marks a well-differentiated squamous cell carcinoma."}]}, {"id": "s12", "lec": "23", "lo": "23.3", "kind": "disease-finding", "title": "Blister or split histology → diagnosis", "left": "Histology", "right": "Diagnosis", "pairs": [{"a": "Suprabasal cleft with acantholysis and a 'tombstone' basal row", "b": "Pemphigus vulgaris", "why": "IgG vs desmogleins 3 (± 1) → intraepidermal suprabasal split → flaccid bullae, Nikolsky +, oral erosions.", "hy": true}, {"a": "Subepidermal non-acantholytic blister with eosinophils and fibrin", "b": "Bullous pemphigoid", "why": "IgG vs BP180/BP230 → whole epidermis lifts off → tense bullae in the elderly, Nikolsky −.", "hy": true}, {"a": "Many small intraepidermal vesicles formed by spongiosis", "b": "Eczematous (spongiotic) dermatitis", "why": "Eczema = spongiosis with perivascular lymphocytes (± eosinophils), usually type IV. PV gives one suprabasal cleft instead of many vesicles."}, {"a": "Subcorneal split from loss of desmoglein 1", "b": "Pemphigus foliaceus", "why": "Dsg1 dominates the upper epidermis and is absent from mucosa, so there are crusted superficial erosions without oral lesions."}, {"a": "Neutrophil microabscesses at the dermal papillary tips", "b": "Dermatitis herpetiformis", "why": "IgA vs epidermal transglutaminase in celiac disease; DIF shows granular IgA in dermal papillae; very itchy grouped vesicles on extensors."}, {"a": "Full-thickness epidermal necrosis with sheet-like detachment", "b": "Toxic epidermal necrolysis", "why": "Cytotoxic T cells kill keratinocytes (type IV drug reaction); >30% BSA detached. No autoantibody, so DIF is negative."}]}, {"id": "s13", "lec": "23", "lo": "23.4", "kind": "disease-finding", "title": "Tumor histology → diagnosis", "left": "Histology", "right": "Diagnosis", "pairs": [{"a": "Basaloid lobules with peripheral palisading and retraction clefts", "b": "Basal cell carcinoma", "why": "Blue basaloid nests in fibromucinous stroma; clefts form as stroma retracts from the tumor. Clinically a pearly papule with telangiectasias.", "hy": true}, {"a": "Atypia limited to the lower epidermis beneath dense hyperkeratosis", "b": "Actinic keratosis", "why": "Partial-thickness atypia on sun-damaged skin; full-thickness atypia would be SCC in situ."}, {"a": "Full-thickness keratinocyte atypia with an intact basement membrane", "b": "SCC in situ (Bowen disease)", "why": "The basement membrane defines invasion: intact = in situ; breached = invasive SCC."}, {"a": "Nests of pink keratinizing cells with keratin pearls invading the dermis", "b": "Invasive squamous cell carcinoma", "why": "Keratin pearls + intercellular bridges + invasion. Usually localized for years, but can metastasize (<5%).", "hy": true}, {"a": "Cup-shaped lesion with a central keratin plug and glassy pink cells", "b": "Keratoacanthoma", "why": "Endophytic crater with minimally atypical glassy squamous cells; can regress. Molecularly distinct from SCC (HRAS, cyclin D1 up, p16 intact)."}, {"a": "Single atypical melanocytes scattered up through the epidermis", "b": "Melanoma", "why": "Pagetoid scatter of atypical melanocytes; large pleomorphic cells with prominent nucleoli. Stains: S-100, HMB-45, SOX10.", "hy": true}]}, {"id": "s14", "lec": "29", "lo": "29.2", "kind": "term-def", "title": "Exanthem virus → classification", "left": "Virus", "right": "Classification", "pairs": [{"a": "Measles (rubeola) virus", "b": "Negative-sense ssRNA paramyxovirus (morbillivirus)", "why": "Enveloped (−)ssRNA; fusion protein makes multinucleated giant cells (Warthin-Finkeldey). Highly contagious by airborne spread.", "hy": true}, {"a": "Rubella virus", "b": "Positive-sense ssRNA togavirus (now a matonavirus)", "why": "Enveloped (+)ssRNA. Mild in children but teratogenic in the first trimester (congenital rubella syndrome)."}, {"a": "Varicella-zoster virus", "b": "dsDNA alpha-herpesvirus (HHV-3) latent in sensory ganglia", "why": "Primary infection = chickenpox; reactivation from dorsal root or cranial nerve ganglia = zoster.", "hy": true}, {"a": "Parvovirus B19", "b": "Nonenveloped ssDNA virus that infects erythroid precursors", "why": "The only ssDNA virus that causes human disease; uses the P antigen on red cell precursors."}, {"a": "HHV-6", "b": "dsDNA beta-herpesvirus that infects T lymphocytes", "why": "Cause of roseola (exanthem subitum); HHV-7 can cause a similar illness."}, {"a": "Coxsackievirus A16", "b": "Nonenveloped (+)ssRNA picornavirus spread fecal–oral", "why": "An enterovirus; the classic cause of hand-foot-and-mouth disease, peaking in summer and fall."}]}, {"id": "s15", "lec": "29", "lo": "29.1", "kind": "disease-finding", "title": "Classic sign → diagnosis", "left": "Sign", "right": "Diagnosis", "pairs": [{"a": "Koplik spots (blue-gray spots on buccal mucosa)", "b": "Measles", "why": "Appear in the prodrome, just before the rash; pathognomonic. Prodrome = cough, coryza, conjunctivitis.", "hy": true}, {"a": "Soft-palate petechiae with tender postauricular and occipital nodes", "b": "Rubella", "why": "Forchheimer spots plus posterior auricular/occipital lymphadenopathy and a mild pink rash = rubella; adults get arthralgia. Palatal petechiae alone also occur in strep pharyngitis."}, {"a": "Slapped-cheek erythema sparing the nasolabial folds", "b": "Erythema infectiosum (parvovirus B19)", "why": "Fifth disease: bright red cheeks, then a lacy reticular rash on the limbs. The child is no longer contagious once the rash appears.", "hy": true}, {"a": "Pastia lines (rash accentuated in skin folds)", "b": "Scarlet fever", "why": "Group A strep pyrogenic exotoxin; sandpaper rash, strawberry tongue and circumoral pallor."}, {"a": "Vesicle on the tip of the nose with forehead zoster", "b": "Herpes zoster ophthalmicus", "why": "Hutchinson sign: nasociliary branch of V1 → high risk of ocular involvement; urgent ophthalmology.", "hy": true}, {"a": "Rash appearing as a 3–5 day high fever breaks", "b": "Roseola (exanthem subitum)", "why": "HHV-6 in a child under 2; fever first, then a pink truncal rash. Febrile seizures can occur during the fever."}, {"a": "Macules, papules, vesicles and crusts all present at once", "b": "Varicella (chickenpox)", "why": "Asynchronous crops ('dew drop on a rose petal'), trunk-centered. Smallpox lesions are synchronous."}, {"a": "Ear-canal vesicles with ipsilateral facial palsy and taste loss", "b": "Ramsay Hunt syndrome", "why": "VZV reactivation in the geniculate ganglion (CN VII): ear pain, vesicles, facial weakness, loss of taste."}]}, {"id": "s16", "lec": "29", "lo": "29.2", "kind": "cause-effect", "title": "Infection → classic complication", "left": "Infection / setting", "right": "Complication", "pairs": [{"a": "Measles", "b": "Subacute sclerosing panencephalitis years later", "why": "Rare, fatal late complication. Acute measles also causes giant cell pneumonia (main cause of death) and encephalitis; give vitamin A.", "hy": true}, {"a": "Maternal rubella in the first trimester", "b": "Deafness, cataracts and patent ductus arteriosus in the newborn", "why": "Congenital rubella syndrome: sensorineural deafness, cataracts, PDA, 'blueberry muffin' rash, intellectual disability.", "hy": true}, {"a": "Parvovirus B19 in sickle cell disease", "b": "Transient aplastic crisis with reticulocytes near zero", "why": "B19 halts erythropoiesis for days; with short RBC survival the hemoglobin crashes.", "hy": true}, {"a": "Parvovirus B19 in pregnancy", "b": "Fetal anemia leading to hydrops fetalis", "why": "Fetal RBCs have short lifespans; check maternal serology after exposure and monitor the fetus."}, {"a": "Mumps after puberty", "b": "Epididymo-orchitis (20–30% of males)", "why": "Mumps = POM: parotitis, orchitis (oophoritis), meningitis, plus pancreatitis. Paramyxovirus."}, {"a": "Roseola (HHV-6)", "b": "Febrile seizures during the high-fever phase", "why": "The fever reaches about 40°C before the rash appears."}, {"a": "Herpes zoster in an older adult", "b": "Post-herpetic neuralgia persisting after the rash heals", "why": "Risk rises with age; antivirals within 72 h and the recombinant zoster vaccine (≥50 y) reduce it."}, {"a": "Maternal chickenpox from 5 days before to 2 days after delivery", "b": "Severe disseminated varicella in the newborn", "why": "The baby is exposed before maternal antibody can cross the placenta; give VariZIG to the newborn. Adults with chickenpox instead risk varicella pneumonia."}]}, {"id": "s17", "lec": "29", "lo": "29.3", "kind": "cause-effect", "title": "Enterovirus picture → classic virus", "left": "Clinical picture", "right": "Enterovirus", "pairs": [{"a": "Classic hand-foot-and-mouth disease in a daycare toddler", "b": "Coxsackievirus A16", "why": "Oral vesicles/erosions + oval vesicles on hands and feet (palms/soles). Fecal–oral and oral-secretion spread; summer–fall.", "hy": true}, {"a": "Hand-foot-and-mouth outbreaks complicated by brainstem encephalitis", "b": "Enterovirus 71", "why": "EV71 causes HFM-type vesicular rash but is notorious for severe neurologic disease (brainstem encephalitis, flaccid paralysis)."}, {"a": "Boston exanthem: roseola-like rash as the fever subsides", "b": "Echovirus 16", "why": "Echovirus 16 is the classic cause of the roseoliform Boston exanthem (coxsackie B1/B5 and echo 11/25 can do the same)."}, {"a": "Petechial or purpuric rash that mimics meningococcemia", "b": "Echovirus 9", "why": "Echovirus 9 can give a rubelliform or petechial rash. A petechial rash with fever must first be treated as meningococcemia until proven otherwise."}, {"a": "Myocarditis and pericarditis", "b": "Coxsackievirus B", "why": "Coxsackie B = B for 'body' organs: heart (myocarditis), pleura (pleurodynia), pancreas. Coxsackie A = mucocutaneous (HFM, herpangina)."}]}, {"id": "s18", "lec": "29", "lo": "29.5", "kind": "term-app", "title": "Rash in darker skin → what to look for", "left": "Condition", "right": "What to look for", "pairs": [{"a": "Exanthem erythema in general", "b": "Color looks violaceous, red-brown or hyperpigmented and may be subtle", "why": "Pink-red erythema is hard to see in darker skin, so rely on texture, palpation, mucosa, palms and soles and lesion shape.", "hy": true}, {"a": "Scarlet fever", "b": "Rough sandpaper texture felt more than seen, accentuated in skin folds", "why": "When the color is subtle, run a hand over the trunk: tiny papules give the sandpaper feel. Look for Pastia lines and a strawberry tongue."}, {"a": "Hand-foot-and-mouth disease", "b": "Firm gray-white to skin-colored papulovesicles on palms and soles", "why": "The red halo may be invisible; the oval gray-white papulovesicles and oral erosions are the clues."}, {"a": "Kawasaki disease", "b": "Peeling just beneath the nails after a week of fever with red eyes", "why": "Periungual desquamation in the subacute phase; recognize it to order an echocardiogram for coronary aneurysms."}, {"a": "Measles", "b": "Blue-gray buccal spots in the prodrome, since the dusky rash is easy to miss", "why": "Koplik spots and the cough–coryza–conjunctivitis prodrome are reliable at any skin tone."}]}], "seqs": [{"id": "q01", "lec": "18", "lo": "18.1", "title": "The psoriatic inflammatory loop", "prompt": "Put the steps of the psoriatic loop in order (first → last).", "steps": ["Trigger (trauma, infection, drug) activates dermal dendritic cells", "Dendritic cells secrete IL-23 and IL-12", "Th17 (and Th1) cells expand and release IL-17, IL-22 and TNF-α", "Keratinocytes hyperproliferate and release neutrophil-attracting chemokines", "Thick scaly plaque: acanthosis, parakeratosis, neutrophils in the epidermis"], "why": "IL-23 → Th17 → IL-17/TNF-α → keratinocytes, which then re-stimulate dendritic cells and keep the loop going. Every biologic class (anti-TNF, anti-p40, anti-IL-17, anti-p19) cuts one link.", "hy": true}, {"id": "q02", "lec": "23", "lo": "23.2", "title": "Making an inflammatory acne lesion", "prompt": "Put the steps in acne pathogenesis in order (first → last).", "steps": ["Androgens at puberty increase sebum production", "Sebum and keratin debris plug the follicle (comedone)", "Cutibacterium acnes proliferates in the plugged follicle", "Bacterial lipases release irritating fatty acids → inflammation", "Follicle ruptures into the dermis → nodule or cyst, possible scarring"], "why": "Four factors: sebum (androgens), follicular hyperkeratinization, C. acnes, inflammation. Retinoids target the plug, BPO and antibiotics target C. acnes, spironolactone targets androgens; isotretinoin hits most of them.", "hy": true}, {"id": "q03", "lec": "18", "lo": "18.4", "title": "Building a drug timeline", "prompt": "Put the steps for finding a culprit drug in order (first → last).", "steps": ["Start: set the date the rash first appeared as Day 0", "List every medication with start and stop dates", "Plot each drug backward and forward from Day 0", "Flag drugs started within the latency window (≈7–10 d exanthem; up to 8 wk SJS/TEN)", "Stop the most likely culprit and document the reaction"], "why": "Timing relative to drug start is the single most useful data point in a suspected drug rash. Antibiotics are the usual culprits for exanthems; sulfonamides, allopurinol and anticonvulsants for SJS/TEN."}, {"id": "q04", "lec": "20", "lo": "20.2", "title": "Hedgehog pathway activation", "prompt": "Put the steps of hedgehog signaling in order (first → last).", "steps": ["Sonic hedgehog (SHH) binds the PTCH1 receptor", "PTCH1 releases its inhibition of Smoothened (SMO)", "Activated SMO signals to the GLI proteins", "GLI transcription factors enter the nucleus and switch on growth genes", "Cell proliferation increases"], "why": "In BCC the pathway is on without ligand: PTCH1 loss (tumor suppressor; germline in Gorlin) or SMO gain (proto-oncogene). Vismodegib blocks SMO.", "hy": true}, {"id": "q05", "lec": "20", "lo": "20.3", "title": "From sun damage to invasive SCC", "prompt": "Put the steps of cutaneous SCC development in order (first → last).", "steps": ["Chronic UVB forms thymine dimers in keratinocyte DNA", "Early TP53 mutation lets damaged keratinocytes escape apoptosis", "Actinic keratosis: partial-thickness atypia", "SCC in situ: full-thickness atypia, basement membrane intact", "Invasive SCC: atypical keratinocytes breach the basement membrane"], "why": "AK → SCC in situ → invasive SCC; the basement membrane defines invasion. Only a small fraction of AKs progress.", "hy": true}, {"id": "q06", "lec": "20", "lo": "20.4", "title": "Melanoma progression", "prompt": "Put the stages of melanoma progression in order (first → last).", "steps": ["Benign nevus with a BRAF mutation", "Dysplastic (atypical) nevus", "Radial growth phase: melanoma spreads within the epidermis", "Vertical growth phase: a dermal nodule invades deeply", "Spread to lymph nodes and distant sites"], "why": "Metastatic potential arrives with the vertical growth phase, which is why Breslow depth is the #1 prognostic factor. Nodular melanoma skips the radial phase."}, {"id": "q07", "lec": "29", "lo": "29.2", "title": "Course of measles", "prompt": "Put the events of a typical measles infection in order (first → last).", "steps": ["Respiratory exposure; ~13-day incubation", "Prodrome of fever, cough, coryza and conjunctivitis", "Koplik spots on the buccal mucosa", "Maculopapular rash begins on the face", "Rash spreads to trunk and limbs, then fades over 7–10 days"], "why": "Koplik spots precede the rash; the rash spreads head to toe. Contagious from 5 days before to 4 days after the rash, so isolate early.", "hy": true}, {"id": "q08", "lec": "23", "lo": "23.1", "title": "Epidermal layers", "prompt": "Put the epidermal layers in order (deepest → most superficial).", "steps": ["Stratum basale", "Stratum spinosum", "Stratum granulosum", "Stratum lucidum", "Stratum corneum"], "why": "'Be Sure Good Lovers Come.' Basal cells reach the corneum in about a month (about 4 days in psoriasis). The lucidum is present only in thick palm and sole skin."}], "grids": [{"id": "g01", "lec": "18", "lo": "18.5", "title": "Blistering disease chart", "blurb": "Hard: only the target antigen is shown. Name the disease, then fill split level, DIF and blister type.", "cols": [{"h": "Disease", "dep": 1}, {"h": "Target antigen"}, {"h": "Split level", "dep": 0}, {"h": "DIF pattern", "dep": 0}, {"h": "Blister / Nikolsky", "dep": 0}], "rows": [["Pemphigus vulgaris", "Desmoglein 3 (± 1)", "Suprabasal (intraepidermal)", "Fishnet IgG, whole/lower epidermis", "Flaccid + oral erosions; Nikolsky +"], ["Pemphigus foliaceus", "Desmoglein 1 only", "Subcorneal (granular layer)", "Fishnet IgG, upper epidermis", "Scaly crusts, mouth spared; Nikolsky +"], ["Bullous pemphigoid", "BP180 / BP230 (hemidesmosome)", "Subepidermal, along hemidesmosomes", "Linear IgG + C3 along BMZ", "Large tense bullae; Nikolsky −"], ["Dermatitis herpetiformis", "Epidermal transglutaminase", "Subepidermal, papillary-tip abscesses", "Granular IgA in dermal papillae", "Itchy grouped vesicles; Nikolsky −"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Linear IgA disease", "Epidermolysis bullosa acquisita"], "2": ["Within dermal collagen", "Spongiotic vesicles"], "3": ["Perivascular C3 only", "Linear IgA along BMZ"], "4": ["Tense; Nikolsky +", "Flaccid; Nikolsky −"]}, "notes": ["Oral erosions often come first (Dsg3 is the mucosal desmoglein). Acantholysis with tombstone basal cells; high-dose steroids then rituximab.", "Dsg1 is concentrated in the upper epidermis and absent from mucosa, so the blisters are very superficial and the mouth is spared.", "Elderly patient, months of itch or urticarial plaques, tense bullae; eosinophils in a subepidermal blister. Drug triggers include gliptins and furosemide.", "Associated with celiac disease (gluten); IgA deposits at dermal papillary tips; treat with a gluten-free diet and dapsone."], "hy": "Desmosome (intraepidermal, flaccid, Nikolsky +, fishnet) = pemphigus. Hemidesmosome (subepidermal, tense, Nikolsky −, linear) = pemphigoid. Granular IgA + celiac = dermatitis herpetiformis."}, {"id": "g02", "lec": "18", "lo": "18.3", "title": "Acne drug chart", "blurb": "Hard: only the key adverse effect or trap is shown. Name the drug, then fill its mechanism and practice rule.", "cols": [{"h": "Drug", "dep": 2}, {"h": "Mechanism", "dep": 0}, {"h": "Key adverse effect / trap"}, {"h": "Practice rule", "dep": 0}], "rows": [["Tretinoin (topical)", "Topical retinoid: normalizes shedding", "Local irritation, peeling, photosensitivity", "Nightly to whole area; 2–3 mo to work"], ["Benzoyl peroxide", "Free radicals kill C. acnes", "Bleaches towels, fabric and hair", "No resistance; pair with any antibiotic"], ["Clindamycin (topical)", "50S ribosome block (lincosamide)", "Resistant C. acnes if used alone", "Topical antibiotic; never use alone"], ["Doxycycline", "30S ribosome block + anti-inflammatory", "GI upset and photosensitivity", "Oral step for moderate inflammatory acne"], ["Spironolactone", "Androgen receptor blocker → ↓ sebum", "Hyperkalemia, menstrual irregularity", "Women with premenstrual jawline flares"], ["Isotretinoin", "Oral retinoid: shrinks sebaceous glands", "Teratogen; ↑ triglycerides and LFTs", "iPLEDGE + 2 forms of contraception"]], "easyGiven": [0], "hardGiven": [2], "decoys": {"0": ["Minocycline", "Azithromycin", "Adapalene"], "1": ["Cell wall synthesis block", "5α-reductase inhibitor"], "3": ["Use as monotherapy for 6 months", "Safe in pregnancy; no monitoring"]}, "notes": ["First-line for comedonal acne (blackheads/whiteheads); prevents new comedones rather than killing bacteria.", "Oxidizes C. acnes proteins; bacteria cannot become resistant, so BPO is the partner for every acne antibiotic.", "Never use any acne antibiotic (topical or oral) alone; BPO prevents resistance.", "Add for papulopustular acne on face, chest and back that fails topicals. Minocycline instead causes vertigo and blue-gray pigmentation. Do not combine tetracyclines with isotretinoin (pseudotumor cerebri).", "Hormonal option for women; avoid in pregnancy (feminizes a male fetus) and in cis men.", "For scarring nodulocystic acne that fails antibiotics and topicals; one 5–6 month course. Also dry skin and cheilitis."], "hy": "Acne drug traps: BPO with every antibiotic (resistance); isotretinoin = teratogen (iPLEDGE) + ↑TG/LFT + no tetracyclines (pseudotumor cerebri); doxy = photosensitivity; spironolactone = hyperkalemia."}, {"id": "g03", "lec": "20", "lo": "20.1", "title": "Fitzpatrick skin type chart", "blurb": "Hard: only the sun response is shown. Name the Fitzpatrick type, then the typical appearance.", "cols": [{"h": "Fitzpatrick type", "dep": 1}, {"h": "Sun response"}, {"h": "Typical appearance", "dep": 0}], "rows": [["Type I", "Always burns, never tans", "Very pale skin, red hair, freckles"], ["Type II", "Usually burns, tans minimally", "Fair skin, often blond hair"], ["Type III", "Sometimes burns, tans gradually", "Light-to-medium skin"], ["Type IV", "Rarely burns, tans easily", "Olive or light brown skin"], ["Type V", "Very rarely burns, tans darkly", "Brown skin"], ["Type VI", "Never burns, deeply pigmented", "Dark brown to black skin"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Type 0", "Type VII"], "2": ["Albinism with no melanin", "Vitiligo patches"]}, "notes": ["Highest UV skin cancer risk; MC1R variants (pheomelanin) are common.", "High risk; burns easily and needs strict sun protection.", "Intermediate risk; still develops UV-related BCC and SCC.", "Lower risk, but skin cancer still occurs and is often diagnosed later.", "In darker skin, SCC is the most common skin cancer (scars, chronic wounds, HPV, immunosuppression).", "Acral lentiginous melanoma is the leading melanoma type; UV plays a small role."], "hy": "Skin phenotype (UV susceptibility) is the single biggest skin cancer risk factor; type I = highest risk. In skin of color: SCC most common, late diagnosis, acral lentiginous melanoma."}, {"id": "g04", "lec": "20", "lo": "20.2", "title": "Basal cell carcinoma subtype chart", "blurb": "Hard: only the clinical look is shown. Name the subtype, then the typical setting and treatment.", "cols": [{"h": "Subtype / syndrome", "dep": 1}, {"h": "Clinical look"}, {"h": "Typical site / setting", "dep": 0}, {"h": "Treatment", "dep": 0}], "rows": [["Nodular BCC", "Pearly papule with arborizing vessels", "Nose and face; most common type", "Standard excision (Mohs if on face)"], ["Superficial BCC", "Thin red scaly plaque mimicking eczema", "Trunk and limbs of younger patients", "Imiquimod, 5-FU, cryo or ED&C"], ["Morpheaform (sclerosing) BCC", "Scar-like white plaque, ill-defined border", "Face; deep subclinical spread", "Mohs required (ill-defined margins)"], ["Pigmented BCC", "Brown-black but still shiny and pearly", "Nodular or superficial; mimics melanoma", "Biopsy first to exclude melanoma"], ["Gorlin syndrome", "Dozens of BCCs in a teen + jaw cysts", "AD germline PTCH1 loss", "Vismodegib + close surveillance"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Infiltrative SCC", "Xeroderma pigmentosum"], "2": ["Palms and soles only", "Mucosa of the mouth"], "3": ["BRAF + MEK inhibitor", "Oral isotretinoin"]}, "notes": ["Shiny pearly nodule, rolled border when ulcerated; about 80% of BCCs are on the head and neck.", "Often treated as eczema first; superficial, so topical and destructive therapies work.", "Aggressive, infiltrating strands with unclear margins, so margin-controlled Mohs is preferred.", "Heavy melanin can mimic melanoma, but the lesion keeps the pearly sheen and often ulcerates.", "Not a BCC subtype: an inherited predisposition (palmar pits, odontogenic keratocysts, falx calcification). SMO inhibitor for many or advanced tumors."], "hy": "BCC: PTCH1/SMO → constitutive hedgehog; pearly papule + telangiectasias; palisading + retraction clefts; locally destructive, almost never metastasizes; vismodegib (SMO inhibitor) for advanced disease or Gorlin."}, {"id": "g05", "lec": "23", "lo": "23.4", "title": "Skin tumor chart", "blurb": "Hard: only the classic clue is shown. Name the lesion, then fill cell of origin, histology and behavior.", "cols": [{"h": "Lesion", "dep": 1}, {"h": "Classic clue"}, {"h": "Cell of origin", "dep": 0}, {"h": "Histology", "dep": 0}, {"h": "Behavior", "dep": 0}], "rows": [["Basal cell carcinoma", "Pe <script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);

};

const lecOf=k=>DATA.lectures.find(l=>l.k===k)||{k,name:"",disc:"imm"};

/* ---------- storage (per-viewer convenience only) ---------- */
const SKEY="hoyadocs-matchlab-"+DATA.id;
let S={items:{},grids:{},best:0,rounds:0};
try{const raw=localStorage.getItem(SKEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}

const itemStat=k=>S.items[k]||(S.items[k]={n:0,ok:0,run:0,last:null});

/* ---------- theme ---------- */

applyTheme();
$("#resetBtn").onclick=()=>{if(!confirmReset())return;S={items:{},grids:{},best:0,rounds:0};save();go("home");};

/* ---------- static header ---------- */
document.title=`${DATA.code} Match Lab · HoyaDocs`;
$("#revLine").textContent=`${META.block} · ${DATA.code} · Rev ${META.rev} · Updated ${META.updated}`;
$("#title").textContent=DATA.title;
const DISCN={neuro:"Neuroscience",path:"Pathology",drt:"DRT",pharm:"Pharmacology",imm:"Immunology",mic:"Microbiology"};
$("#heroK").textContent=`${DATA.code} · ${[...new Set(DATA.lectures.map(l=>DISCN[l.disc]||l.disc))].join(" · ")} · Match Lab`;

/* ---------- item pool ---------- */

DATA.sets.forEach(s=>s.pairs.forEach((p,i)=>ITEMS.push({t:"pair",key:s.id+":"+i,set:s,p,i,lec:s.lec,kind:s.kind,lo:s.lo})));
DATA.seqs.forEach(q=>ITEMS.push({t:"seq",key:q.id,q,lec:q.lec,kind:"sequence",lo:q.lo}));

/* ---------- filters / settings ---------- */
const F={lecs:new Set(DATA.lectures.map(l=>l.k)),kinds:new Set(Object.keys(KIND)),len:"20",timer:"off",dir:"mixed",focus:"all",diff:"easy"};
const pool=()=>ITEMS.filter(it=>F.lecs.has(it.lec)&&F.kinds.has(it.kind)&&(F.focus==="all"||(F.focus==="new"?!mastered(it.key):(S.items[it.key]&&S.items[it.key].last===false))));

/* ---------- router ---------- */
let view="home";
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>go(b.dataset.view));
function go(v,arg){
  stopTimer();
  view=v;
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===(v==="rfplay"||v==="rfend"?"rf":v==="grid"?"glist":v))));
  if(v==="home")renderHome();
  else if(v==="rf")renderRFSetup();
  else if(v==="rfplay")renderQ();
  else if(v==="rfend")renderEnd();
  else if(v==="glist")renderGList();
  else if(v==="grid")startGrid(arg);
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- shared bits ---------- */
function segHTML(name,label,opts,cur){return `<div class="optrow"><span class="lab">${label}</span><div class="seg" role="group" aria-label="${label}">${opts.map(([v,t])=>`<button type="button" data-${name}="${v}" aria-pressed="${v===cur}">${t}</button>`).join("")}</div></div>`;}
function bindSeg(root,name,cb){root.querySelectorAll(`[data-${name}]`).forEach(b=>b.onclick=()=>{F[name]=b.dataset[name];root.querySelectorAll(`[data-${name}]`).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));cb&&cb();});}
function lecChips(){return `<div class="optrow"><span class="lab">Lectures</span><div class="chips">${DATA.lectures.map(l=>`<button type="button" class="chip" data-lec="${l.k}" aria-pressed="${F.lecs.has(l.k)}" style="--c:var(--${l.disc})"><i></i>${esc(lecLabel(l.k))} · ${esc(l.name)}</button>`).join("")}</div></div>`;}
function kindChips(){const present=[...new Set(ITEMS.map(i=>i.kind))];return `<div class="optrow"><span class="lab">Match types</span><div class="chips">${present.map(k=>`<button type="button" class="chip" data-kind="${k}" aria-pressed="${F.kinds.has(k)}" style="--c:var(${KIND[k].c})"><i></i>${KIND[k].l} <span class="n">${ITEMS.filter(i=>i.kind===k).length}</span></button>`).join("")}</div></div>`;}
function bindChips(root,cb){
  root.querySelectorAll("[data-lec]").forEach(b=>b.onclick=()=>{const k=b.dataset.lec;if(F.lecs.has(k)){if(F.lecs.size>1)F.lecs.delete(k);}else F.lecs.add(k);b.setAttribute("aria-pressed",String(F.lecs.has(k)));cb&&cb();});
  root.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{const k=b.dataset.kind;if(F.kinds.has(k)){const vis=[...F.kinds].filter(x=>ITEMS.some(i=>i.kind===x));if(vis.length>1)F.kinds.delete(k);}else F.kinds.add(k);b.setAttribute("aria-pressed",String(F.kinds.has(k)));cb&&cb();});
}
function stars(n){return `<span class="stars" aria-label="${n} of 3 stars">${[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("")}</span>`;}

/* ---------- HOME ---------- */

  const total=ITEMS.length, m=ITEMS.filter(i=>mastered(i.key)).length;
  const gs=DATA.grids.length, ge=DATA.grids.filter(g=>(S.grids[g.id]||{}).easy).length, gh=DATA.grids.filter(g=>(S.grids[g.id]||{}).hard).length;
  const kindsUsed=[...new Set(ITEMS.map(i=>i.kind))];
  $("#app").innerHTML=`
  <div class="grid2">
    <section class="panel mode-card">
      <span class="k">Mode 1</span>
      <h2>Rapid Fire</h2>
      <p>One match at a time, four choices, streak bonus, optional shot clock. Missed items come back later in the round, and every wrong pick shows you what that option actually matches.</p>
      <div class="statrow"><div class="stat"><b>${ITEMS.filter(i=>i.t==="pair").length}</b><span>Matches</span></div><div class="stat"><b>${DATA.seqs.length}</b><span>Order-the-steps</span></div><div class="stat"><b>${S.best||0}</b><span>Best streak</span></div></div>

    </section>
    <section class="panel mode-card">

      <div class="statrow"><div class="stat"><b>${gs}</b><span>Grids</span></div><div class="stat"><b>${ge}/${gs}</b><span>Solved easy</span></div><div class="stat"><b>${gh}/${gs}</b><span>Solved hard</span></div></div>
      <div><button class="btn primary" type="button" id="goG">Play Grid Lock &rarr;</button></div>

  </div>
  <section class="panel">

/* ---------- RAPID FIRE: play ---------- */
let RF=null, timerId=null;
function stopTimer(){if(timerId){cancelAnimationFrame(timerId);timerId=null;}}
function startRF(){
  let p=shuffle(pool());
  // interleave so the same set doesn't come back to back
  const out=[];while(p.length){let i=p.findIndex(x=>!out.length||sid(x)!==sid(out[out.length-1]));if(i<0)i=0;out.push(p.splice(i,1)[0]);}
  const n=F.len==="all"?out.length:Math.min(out.length,+F.len);
  RF={q:out.slice(0,n).map(it=>({it,retry:false})),i:0,score:0,streak:0,best:0,first:0,firstOk:0,misses:[],answered:false};

/* ---------- GRID LOCK: play ---------- */
let G=null;
function startGrid(id){
  const g=DATA.grids.find(x=>x.id===id); if(!g){go("glist");return;}
  const hard=F.diff==="hard", given=new Set(hard?g.hardGiven:g.easyGiven);
  const cells=g.rows.map(r=>r.map((v,c)=>({v,given:given.has(c),filled:false})));
  if(!hard){ // reveal ~30% of the remaining cells, but leave at least 2 blanks per column
    g.cols.forEach((_,c)=>{if(given.has(c))return;const idx=shuffle(g.rows.map((_,r)=>r));const k=Math.min(Math.floor(g.rows.length*.3+Math.random()*.6),g.rows.length-2);idx.slice(0,Math.max(0,k)).forEach(r=>cells[r][c].given=true);});
  }
  const tileOrder={};g.cols.forEach((_,c)=>{tileOrder[c]=shuffle([...new Set(g.rows.map(r=>r[c])),...((g.decoys||{})[c]||[])]);});
  G={g,hard,cells,sel:null,mistakes:0,hints:0,t0:Date.now(),tried:{},tileOrder,doneRows:new Set(),done:false,msg:"",msgCls:""};
  g.rows.forEach((_,r)=>{if(rowDone(r))G.doneRows.add(r);});

}
const isOk=(r,c)=>G.cells[r][c].given||G.cells[r][c].filled;

function nextOpen(from){const R=G.g.rows.length,C=G.g.cols.length,N=R*C;for(let k=1;k<=N;k++){const x=(from+k)%N,r=Math.floor(x/C),c=x%C;if(from<0&&k===N+1)break;if(open(r,c))return [r,c];}return null;}

function drawGrid(){
  const g=G.g,C=g.cols.length;

  const givenCols=new Set(G.hard?g.hardGiven:g.easyGiven);
  const head=g.cols.map((col,c)=>{const clue=G.hard&&givenCols.has(c);const dep=col.dep;return `<th scope="col" class="${clue?"clue":""}">${esc(col.h)}${clue?"<small>Clue · given</small>":G.hard&&dep!=null?`<small>${LOCK.replace('aria-hidden','style="width:10px;height:10px;vertical-align:-1px" aria-hidden')} after ${esc(g.cols[dep].h)}</small>`:""}</th>`;}).join("");
  const body=g.rows.map((row,r)=>`<tr>${row.map((v,c)=>{
    const cl=G.cells[r][c];
    if(cl.given){const clue=G.hard&&givenCols.has(c);return `<td><div class="cell ${clue?"clue":"given"}">${esc(v)}</div></td>`;}
    if(cl.filled)return `<td><div class="cell filled${cl.pop?" pop":""}">${esc(v)}</div></td>`;
    if(locked(r,c))return `<td><button type="button" class="cell locked" disabled title="Solve ${esc(g.cols[g.cols[c].dep].h)} for this row first">${LOCK}<span>${esc(g.cols[g.cols[c].dep].h)} first</span></button></td>`;
    const sel=G.sel&&G.sel[0]===r&&G.sel[1]===c;
    return `<td><button type="button" class="cell empty${sel?" sel":""}${cl.err?" err":""}" data-r="${r}" data-c="${c}" aria-label="${esc(g.cols[c].h)}, row ${r+1}, empty">${sel?"Pick a tile":"—"}</button></td>`;
  }).join("")}</tr>`).join("");
  g.rows.forEach((_,r)=>g.cols.forEach((_,c)=>{G.cells[r][c].pop=false;G.cells[r][c].err=false;}));

  }

    <div class="rf-top">
      <div>${lecTag(g.lec)} <span class="qset">${G.hard?"Hard":"Easy"}</span><h2 style="margin-top:4px">${esc(g.title)}</h2><p class="ask">${esc(g.blurb)}</p></div>
      <div class="statrow"><div class="stat"><b>${done}/${tot}</b><span>Cells</span></div><div class="stat"><b>${G.mistakes}</b><span>Mistakes</span></div><div class="stat"><b>${G.hints}</b><span>Hints</span></div><div class="stat"><b id="clock">${fmt(elapsed)}</b><span>Time</span></div></div>
    </div>
    <div class="navrow"><button class="btn sm" type="button" id="gBack">&larr; All grids</button><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="button" id="gHint" ${G.done?"disabled":""}>Hint (fill one cell)</button><button class="btn sm" type="button" id="gRestart">Restart</button><button class="btn sm" type="button" id="gSwap">Switch to ${G.hard?"Easy":"Hard"}</button></div></div>

    ${G.done?doneHTML():bank}
    ${notes&&!G.done?`<div><h3 style="font-size:1rem;margin-bottom:6px">Solved rows</h3><ul class="notes">${notes}</ul></div>`:""}
  </section>`;
  $("#gBack").onclick=()=>go("glist");

  });
  document.querySelectorAll(".tile[data-v]").forEach(t=>{

    t.ondragstart=e=>{e.dataTransfer.setData("text/plain",t.dataset.v);t.classList.add("dragging");};
    t.ondragend=()=>t.classList.remove("dragging");
  });
  const d=$("#gDone");if(d)d.onclick=()=>go("glist");
  const h=$("#gHard");if(h)h.onclick=()=>{F.diff="hard";startGrid(g.id);};
  const nx=$("#gNext");if(nx)nx.onclick=()=>{const L=DATA.grids;const i=L.indexOf(g);go("grid",L[(i+1)%L.length].id);};
  tickClock();
}
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
let clockT=null;
function tickClock(){clearTimeout(clockT);if(view!=="grid"||!G||G.done)return;clockT=setTimeout(()=>{const el=$("#clock");if(el)el.textContent=fmt(Math.round((Date.now()-G.t0)/1000));tickClock();},1000);}
function place(r,c,v){
  if(G.done||!open(r,c))return;
  const g=G.g;
  if(g.rows[r][c]===v){
    G.cells[r][c].filled=true;G.cells[r][c].pop=true;
    G.msg="Correct.";G.msgCls="ok";
    if(!G.doneRows.has(r)&&rowDone(r))G.doneRows.add(r);
    const C=g.cols.length;G.sel=nextOpen(r*C+c);
    if(!G.sel&&g.rows.every((_,rr)=>rowDone(rr)))finishGrid();
  } else {
    G.mistakes++;G.cells[r][c].err=true;G.msgCls="bad";
    const inCol=g.rows.some(rr=>rr[c]===v);
    if(inCol){G.msg=`“${v}” belongs in this column, but not this row.`;}
    else{(G.tried[c]=G.tried[c]||new Set()).add(v);G.msg=`“${v}” is a decoy. It isn't in this chart.`;}

  G.hints++;G.cells[t[0]][t[1]].filled=true;G.cells[t[0]][t[1]].pop=true;
  if(rowDone(t[0]))G.doneRows.add(t[0]);
  G.msg=`Hint: filled “${G.g.rows[t[0]][t[1]]}”.`;G.msgCls="";
  const C=G.g.cols.length;G.sel=nextOpen(t[0]*C+t[1]);

function finishGrid(){
  G.done=true;G.secs=Math.round((Date.now()-G.t0)/1000);
  const pen=G.mistakes+2*G.hints;G.stars=pen===0?3:pen<=2?2:1;
  const st=S.grids[G.g.id]||(S.grids[G.g.id]={});const k=G.hard?"hard":"easy";st[k]=Math.max(st[k]||0,G.stars);save();
}
function doneHTML(){
  const g=G.g;
  return `<section class="panel gdone">
    <div class="statrow" style="align-items:center"><h2>Grid solved</h2>${stars(G.stars)}<span class="ask">${fmt(G.secs)} · ${G.mistakes} mistake${G.mistakes===1?"":"s"} · ${G.hints} hint${G.hints===1?"":"s"}</span></div>
    ${g.hy?`<div class="hybox"><b>High yield · Step 1</b>${esc(g.hy)}</div>`:""}
    <ul class="notes">${g.rows.map((row,r)=>g.notes&&g.notes[r]?`<li><b>${esc(row[g.easyGiven[0]])}:</b> ${esc(g.notes[r])}</li>`:"").join("")}</ul>
    <div class="navrow"><button class="btn" type="button" id="gDone">All grids</button><div style="display:flex;gap:8px;flex-wrap:wrap">${G.hard?"":'<button class="btn" type="button" id="gHard">Try it on Hard</button>'}<button class="btn primary" type="button" id="gNext">Next grid &rarr;</button></div></div>
  </section>`;
}

go("home");
})();
</script>
