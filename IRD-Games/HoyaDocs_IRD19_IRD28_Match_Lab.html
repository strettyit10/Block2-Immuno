<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRD19 · 28 Match Lab · HoyaDocs</title>
<meta name="description" content="HoyaDocs IRD19 · 28 Match Lab: Immunodeficiency &amp; Transplantation. Rapid Fire matching and Grid Lock charts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* HoyaDocs Match Lab engine v1.0
   Layout: header + mode tabs; Home (mode cards, filters, mastery), Rapid Fire (one match per card), Grid Lock (chart + tile bank).
   Colors are tokens on :root with a dark set. Every view stacks to one column on phones. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#1A3363; --muted:#5B6274; --line:#D3D8E0; --chip:#E6E9EE;
  --navy:#0F2244; --navy2:#1A3363; --onnavy:#F4F1EA; --silver:#6E7787; --tan:#5AAEE6;
  --neuro:#5B4BC4; --path:#1F7F78; --drt:#C4631B; --pharm:#2368A8; --imm:#5B4BC4; --mic:#4D7C2A; --accent:#1D6FA8; --accent-ink:#ffffff;
  --ok:#1d7a3e; --ok-bg:#e3f4e8; --bad:#b3261e; --bad-bg:#fbe7e5; --once:#b7791f; --once-bg:#fdf1dc;
  --hy-bg:#FFF4C2; --hy-line:#D4A300; --hy-ink:#5E4700;
  --k1:#2c55a0; --k2:#6b46c1; --k3:#a02c4f; --k4:#b45309; --k5:#0f6b6b; --k6:#85600f; --k7:#1d7a3e; --k8:#0369a1;
  --given:#f5f7f9; --lock:#e9ecef; --clue-bg:#e3ecfa; --clue-ink:#1d3f7a; --clue-line:#9db6e3;
  --f-display:"Graduate","Rockwell","Georgia",serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#A99CF0; --path:#5CC2B8; --drt:#F0A060; --pharm:#7FB3EA; --imm:#A99CF0; --mic:#8CC06A; --navy:#0A1830; --navy2:#13284d; --onnavy:#F4F1EA; --silver:#9aa6b2; --tan:#5AAEE6; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#A99CF0; --path:#5CC2B8; --drt:#F0A060; --pharm:#7FB3EA; --imm:#A99CF0; --mic:#8CC06A; --navy:#0A1830; --navy2:#13284d; --onnavy:#F4F1EA; --silver:#9aa6b2; --tan:#5AAEE6; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15.5px/1.55 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 56px;display:grid;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:.03em}
h3{font-family:var(--f-mono);font-weight:800;letter-spacing:.03em}
/* HoyaDocs hub shell: wordmark bar, section nav, navy varsity hero */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 0 0}
.word{font-family:var(--f-display);font-size:24px;letter-spacing:.04em;text-decoration:none;color:var(--ink);line-height:1}
.word span{color:var(--silver)}
.rev{font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.topr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.themebtn{background:transparent;border:1.5px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:5px 14px;cursor:pointer}
.themebtn:hover{color:var(--ink);border-color:var(--ink)}
.hubnav{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;border-top:3px solid var(--ink);border-bottom:1px solid var(--line)}
.hubnav::-webkit-scrollbar{display:none}
.hubnav a{flex:none;text-decoration:none;font-family:var(--f-mono);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:11px 12px 9px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
.hubnav a:hover{color:var(--ink)}
.hubnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--tan)}
.hubnav a i{width:9px;height:9px;border-radius:2px;flex:none}
.hubnav .sep{flex:none;width:1px;background:var(--line);margin:9px 6px}
header.hero{background:var(--navy);color:var(--onnavy);border-radius:14px;padding:clamp(20px,3.5vw,36px) clamp(20px,4vw,40px);position:relative;overflow:hidden}
header.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(255,255,255,.045) calc(10% - 1px) 10%),radial-gradient(ellipse at 88% 115%, rgba(90,174,230,.34), transparent 58%)}
header.hero > *{position:relative}
.hero .k{font-family:var(--f-mono);font-weight:700;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:#8FCBF5}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5.4vw,52px);line-height:1.02;letter-spacing:.02em;margin:10px 0 4px;color:#F4F1EA;text-shadow:2px 2px 0 #1A3363,4px 4px 0 #5AAEE6}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.meta{font:500 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
header.top h1{font-size:clamp(1.5rem,3.4vw,2rem)}
header.top .lede{margin:4px 0 0;color:var(--muted);max-width:66ch}
.back{font:600 .8rem var(--f-body);text-decoration:none;color:var(--muted)}
.back:hover{color:var(--ink)}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .86rem var(--f-body);background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:.8rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:700 .82rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:1.15rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.mode-card{display:grid;gap:10px;align-content:start}
.mode-card .k{font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mode-card h2{font-size:1.45rem}
.mode-card p{margin:0;color:var(--muted)}
.opts{display:grid;gap:8px}
.optrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.optrow .lab{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:76px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:600 .8rem var(--f-body);border:0;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .78rem var(--f-body);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.chip[aria-pressed="false"]{opacity:.5;text-decoration:line-through;text-decoration-color:var(--muted)}
.chip .n{font:500 .7rem var(--f-mono);color:var(--muted)}
.statrow{display:flex;flex-wrap:wrap;gap:18px}
.stat b{display:block;font:700 1.25rem var(--f-body);font-variant-numeric:tabular-nums}
.stat span{font:500 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.lecrow{display:grid;grid-template-columns:auto minmax(0,1fr) 120px auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.lecrow:first-of-type{border-top:0}
.lecrow .pct{font:500 .75rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
@media (max-width:560px){.lecrow{grid-template-columns:auto minmax(0,1fr) auto}.lecrow .bar{grid-column:1/-1;order:5}}
.tag{font:600 .68rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;color:#fff;background:var(--lc,var(--neuro));white-space:nowrap}
:root[data-theme="dark"] .tag{color:#0d1520}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag{color:#0d1520} }
.hy{font:700 .66rem var(--f-mono);letter-spacing:.06em;background:var(--hy-bg);color:var(--hy-ink);border:1px solid var(--hy-line);border-radius:5px;padding:1px 6px}
.hybox{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.hybox b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
details.how{font-size:.9rem}
details.how summary{cursor:pointer;font-weight:700}
details.how ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
details.how li{margin:3px 0}

/* Rapid fire */
.rf-top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.timer{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.timer i.low{background:var(--bad)}
.qcard{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kind{font:700 .72rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--kc);border:1.5px solid var(--kc);border-radius:6px;padding:2px 8px}
.qset{font-size:.82rem;color:var(--muted)}
.prompt-lab{font:500 .7rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prompt{font:600 clamp(1.15rem,2.6vw,1.4rem)/1.35 var(--f-body);margin:2px 0 0}
.ask{font-size:.88rem;color:var(--muted);margin:0}
.options{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:.95rem;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .key{font:500 .75rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;height:24px;display:grid;place-items:center}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:8px;font-size:.92rem}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb h3{font:800 1.05rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.fb p{margin:0}
.fb .also{font-size:.86rem;color:var(--muted)}
.fb .also b{color:var(--ink)}
.navrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.kbd{font:500 .72rem var(--f-mono);color:var(--muted)}
/* sequence */
.seq-done{display:grid;gap:6px;counter-reset:s;padding:0;margin:0;list-style:none}
.seq-done li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;background:var(--ok-bg);border:1px solid var(--ok);border-radius:8px;padding:7px 10px;font-size:.92rem}
.seq-done li::before{content:counter(s);font:700 .8rem var(--f-mono);color:var(--ok);text-align:center}
.seq-done li.slot{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.seq-done li.slot::before{color:var(--muted)}
.seq-pool{display:grid;gap:6px}
.seq-pool .opt{grid-template-columns:minmax(0,1fr)}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
/* end */
.end{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.big{font:700 clamp(2rem,6vw,3rem)/1 var(--f-display)}
.misslist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.misslist li{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:8px 12px;font-size:.9rem;background:var(--surface)}
.misslist .a{font-weight:700}
.misslist .b{color:var(--muted)}

/* Grid list */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start}
.gcard:hover{border-color:var(--accent)}
.gcard h3{font-size:1.02rem}
.gcard p{margin:0;font-size:.84rem;color:var(--muted)}
.gcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 .72rem var(--f-mono);color:var(--muted)}
.stars{font-size:.85rem;letter-spacing:1px;color:var(--once)}
.stars .off{color:var(--line)}
/* Grid play */
.gwrap{display:grid;gap:12px}
.gtable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.gt{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
.gt th{font:700 .74rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--sunk);vertical-align:bottom}
.gt th small{display:block;font:500 .66rem var(--f-mono);letter-spacing:.03em;text-transform:none;color:var(--muted);margin-top:2px}
.gt th.clue{background:var(--clue-bg);color:var(--clue-ink)}
.gt th.clue small{color:var(--clue-ink)}
.gt td{padding:5px;border-bottom:1px solid var(--line);vertical-align:top;min-width:120px}
.gt tr:last-child td{border-bottom:0}
.gt td + td,.gt th + th{border-left:1px solid var(--line)}
.cell{width:100%;min-height:44px;border-radius:8px;padding:7px 9px;font-size:.88rem;line-height:1.3;text-align:left;display:flex;align-items:center;gap:6px}
.cell.given{background:var(--given);font-weight:600}
.cell.clue{background:var(--clue-bg);color:var(--clue-ink);border:1px solid var(--clue-line);font-weight:600}
.cell.empty{border:1.5px dashed var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.cell.empty:hover,.cell.empty.drop{border-color:var(--accent);color:var(--ink)}
.cell.sel{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink)}
.cell.locked{background:var(--lock);color:var(--muted);border:1px solid var(--line);cursor:not-allowed;font-size:.78rem}
.cell.locked svg{width:13px;height:13px;flex:none}
.cell.filled{background:var(--ok-bg);border:1px solid var(--ok);font-weight:600}
.cell.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.cell.err{animation:shake .32s;border-color:var(--bad)}
.bank{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:12px;display:grid;gap:8px;scroll-margin-bottom:16px}
.bank .bh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:.86rem}
.bank .bh b{font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow:auto}
.tile{font:600 .84rem var(--f-body);background:var(--sunk);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:grab;display:inline-flex;gap:6px;align-items:center;max-width:100%;text-align:left}
.tile:hover:not([disabled]){border-color:var(--accent)}
.tile .ct{font:500 .7rem var(--f-mono);color:var(--muted)}
.tile.out{opacity:.45;text-decoration:line-through;cursor:default}
.tile.dragging{opacity:.4}
.toast{font-size:.86rem;font-weight:600}
.toast:empty{display:none}
@media (max-width:560px){.tabs .long{display:none}}
.toast.bad{color:var(--bad)}
.toast.ok{color:var(--ok)}
.notes{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.notes li{border-left:3px solid var(--ok);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:.88rem}
.notes li b{font-weight:700}
.gdone{display:grid;gap:12px}
footer{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty-state{color:var(--muted);font-size:.9rem}
/* condensed label sizing (Barlow Condensed reads small) */
.mode-card .k,.optrow .lab,.stat span,.prompt-lab,.gcard .row{font-size:.82rem!important;font-weight:700!important;letter-spacing:.1em!important}
.tag{font-size:.8rem!important;font-weight:800!important}
.hy,.hybox b{font-size:.78rem!important;font-weight:800!important}
.kbd,.lecrow .pct,.chip .n,.tile .ct,.opt .key{font-size:.85rem!important;font-weight:600!important}
.gt th small{font-size:.76rem!important;font-weight:600!important}
.seq-done li::before{font-size:.95rem!important}
.btn,.seg button,.chip,.tabs button,.kind,.gt th{font-family:var(--f-mono)!important;letter-spacing:.06em;text-transform:uppercase}
.btn{font-size:.95rem!important;font-weight:700!important}
.btn.sm{font-size:.85rem!important}
.seg button{font-size:.88rem!important;font-weight:700!important}
.chip{font-size:.86rem!important;font-weight:700!important;text-transform:none;letter-spacing:.03em}
.tabs button{font-size:15px!important;letter-spacing:.08em}

<script>
const DATA = {"id": "ird19-28", "code": "IRD19 · 28", "prefix": "IRD", "title": "Immunodeficiency & Transplantation", "lectures": [{"k": "19", "name": "Immunodeficiency Diseases", "disc": "imm"}, {"k": "28", "name": "Transplantation Immunology", "disc": "imm"}], "los": {"19.1": "Clinical presentations of primary and secondary immunodeficiency disorders by immune arm", "19.2": "Systematic diagnostic approach: warning signs, screening labs, DHR, TRECs, genetics", "19.3": "Management: infection control/prophylaxis, Ig replacement, HSCT, gene therapy, IFN-γ", "28.1": "Types of transplantation: autograft, isograft (syngeneic), allograft, xenograft", "28.2": "Histocompatibility antigens (ABO, HLA class I/II, minor H) and their role in transplantation", "28.3": "Alloimmunity and direct, indirect and semi-direct pathways of alloimmune recognition", "28.4": "Immune responses in graft rejection (first/second set, hyperacute, acute, chronic) and GVHD", "28.5": "Preventing rejection and GVHD: HLA matching, induction, triple maintenance, AMR therapy"}, "sets": [{"id": "s01", "lec": "19", "lo": "19.1", "kind": "cause-effect", "title": "Phagocyte disorder → core defect", "left": "Disorder", "right": "Core defect", "pairs": [{"a": "Leukocyte adhesion deficiency type I", "b": "Absent CD18 (β2 integrin), so no firm adhesion to ICAM-1", "why": "LAD I (AR, ITGB2) removes the shared β chain of LFA-1 and Mac-1: neutrophils roll but cannot stick and exit, so blood neutrophilia with no pus.", "hy": true}, {"a": "Leukocyte adhesion deficiency type II", "b": "No fucosylated selectin ligand (sialyl-Lewis X), so no rolling", "why": "LAD II is a GDP-fucose transporter/fucosylation defect: selectins have no ligand. The same defect removes the H antigen (Bombay phenotype) and causes developmental delay."}, {"a": "Chronic granulomatous disease", "b": "Absent NADPH oxidase activity, so no respiratory burst", "why": "No superoxide → no H2O2 → no HOCl. Catalase-positive organisms destroy their own H2O2, so they survive inside phagocytes and get walled off in granulomas.", "hy": true}, {"a": "Myeloperoxidase deficiency", "b": "Lacks the enzyme that turns H2O2 + Cl− into bleach; often silent", "why": "MPO deficiency blocks only the last step of oxygen-dependent killing; the respiratory burst is intact, so it is usually mild (occasional Candida)."}, {"a": "Chédiak-Higashi syndrome", "b": "LYST mutation impairs lysosomal trafficking, forming giant granules", "why": "AR LYST defect hits neutrophil, melanosome, platelet dense-granule, NK/CTL and neuronal trafficking: pyogenic infections, partial albinism, bleeding, neuropathy.", "hy": true}, {"a": "Severe congenital neutropenia", "b": "Too few neutrophils produced (ANC often < 500/μL)", "why": "Quantitative phagocyte defect. Neutropenia = ANC < 1,500/μL; < 500 is severe with bacterial and fungal infections. Treated with G-CSF."}, {"a": "Mendelian susceptibility to mycobacterial disease", "b": "Broken IL-12/IFN-γ loop, so macrophages cannot kill intracellular bacilli", "why": "Mutations in IL-12, IL-12Rβ1, IFN-γR1/R2 or STAT1 → disseminated BCG, nontuberculous mycobacteria, Salmonella. Ig, DHR and complement are normal."}]}, {"id": "s02", "lec": "19", "lo": "19.1", "kind": "disease-finding", "title": "Classic presentation → diagnosis", "left": "Presentation", "right": "Diagnosis", "pairs": [{"a": "Teen with a second Neisseria meningitis; CH50 undetectable", "b": "Terminal complement (C5–C9) deficiency", "why": "Neisseria are controlled mainly by MAC lysis, so late-component loss → recurrent, often disseminated neisserial disease in adolescents and adults.", "hy": true}, {"a": "Boy with S. aureus liver abscess and Aspergillus pneumonia; normal Ig", "b": "Chronic granulomatous disease", "why": "Catalase-positive organisms (S. aureus, Aspergillus, Serratia, Burkholderia, Nocardia) with normal lymphocytes and Ig → NADPH oxidase defect; confirm with DHR.", "hy": true}, {"a": "Infant with disseminated BCG; Ig, DHR and complement normal", "b": "IL-12/IFN-γ axis defect", "why": "Mycobacteria require macrophage activation by IFN-γ (from Th1/NK cells driven by IL-12). Normal Ig, DHR and complement point to this cytokine loop."}, {"a": "Child with sickle cell disease, pneumococcal sepsis and Howell-Jolly bodies", "b": "Functional asplenia", "why": "Repeated splenic infarction (autosplenectomy) removes splenic macrophages that clear opsonized encapsulated bacteria; Howell-Jolly bodies are the smear clue."}, {"a": "Cord still attached at 5 weeks; neutrophilia; infection without pus", "b": "Leukocyte adhesion deficiency type I", "why": "Delayed umbilical cord separation (> 30 days), very high blood neutrophils and pus-free infections → CD18 deficiency."}, {"a": "Boy well until 6 months, then pneumococcal otitis; tiny tonsils", "b": "X-linked agammaglobulinemia", "why": "Maternal IgG protects for ~6 months; then pyogenic sinopulmonary infections. No mature B cells → no tonsils, follicles or germinal centers.", "hy": true}, {"a": "Adult with Giardia, immune thrombocytopenia and poor vaccine response", "b": "Common variable immunodeficiency", "why": "CVID: B cells present but fail to become plasma cells; onset in the 20s–30s with sinopulmonary infection, Giardia, autoimmunity and lymphoma risk."}, {"a": "Patient with celiac disease who has anaphylaxis at first transfusion", "b": "Selective IgA deficiency", "why": "Most common PID; anti-IgA antibodies react with IgA in donor plasma or IVIG. Associated with celiac disease, atopy and Giardia.", "hy": true}]}, {"id": "s03", "lec": "19", "lo": "19.1", "kind": "structure-function", "title": "Lymphocyte gene product → normal function", "left": "Gene product", "right": "Normal function", "pairs": [{"a": "Common γ chain (IL2RG)", "b": "Shared receptor chain for IL-2, -4, -7, -9, -15 and -21", "why": "X-linked SCID (most common SCID): no IL-7 signal → no T cells; no IL-15 signal → no NK cells; B cells present but unhelped (T−B+NK−).", "hy": true}, {"a": "JAK3", "b": "Tyrosine kinase that signals downstream of γc-containing receptors", "why": "JAK3 deficiency phenocopies X-SCID (T−B+NK−) but is autosomal recessive, so girls can be affected."}, {"a": "Adenosine deaminase", "b": "Purine salvage enzyme whose loss lets dATP poison lymphocytes", "why": "dATP inhibits ribonucleotide reductase → no DNA synthesis → T, B and NK cells die (T−B−NK−). Treated with HSCT, PEG-ADA or gene therapy.", "hy": true}, {"a": "RAG1/RAG2", "b": "Recombinase that cuts DNA to start V(D)J recombination", "why": "Without V(D)J recombination neither TCR nor BCR forms → T−B−NK+ SCID; NK cells do not rearrange receptor genes."}, {"a": "Artemis", "b": "Nuclease that repairs V(D)J double-strand breaks", "why": "Artemis works in non-homologous end joining after RAG cuts → T−B−NK+ SCID; patients are also radiosensitive."}, {"a": "Bruton tyrosine kinase (BTK)", "b": "Kinase relaying pre-BCR signals so pre-B cells can mature", "why": "BTK loss arrests B cells at the pre-B stage → X-linked agammaglobulinemia with almost no CD19+ cells or antibody of any class.", "hy": true}, {"a": "CD40 ligand", "b": "Activated CD4 T-cell surface molecule that triggers B-cell class switching", "why": "X-linked hyper-IgM: IgM normal/↑, IgG/IgA/IgE ↓, no germinal centers; CD40L also activates macrophages, so Pneumocystis and Cryptosporidium occur."}, {"a": "Activation-induced cytidine deaminase (AID)", "b": "B-cell enzyme that edits DNA for class switching and hypermutation", "why": "AR hyper-IgM: B cells cannot switch despite T-cell help; no opportunistic infections and LARGE germinal centers with lymphadenopathy."}, {"a": "WAS protein (WASp)", "b": "Links T-cell receptor signaling to the actin cytoskeleton", "why": "Wiskott-Aldrich (X-linked): thrombocytopenia with small platelets, eczema, recurrent encapsulated infections; ↓IgM, ↑IgA/IgE."}]}, {"id": "s04", "lec": "19", "lo": "19.1", "kind": "cause-effect", "title": "Secondary immunodeficiency → mechanism", "left": "Cause", "right": "Mechanism", "pairs": [{"a": "Nephrotic syndrome", "b": "IgG lost in the urine", "why": "Protein loss is a classic secondary (acquired) cause of hypogammaglobulinemia; the immune genes are normal.", "hy": true}, {"a": "Protein-losing enteropathy", "b": "IgG lost through the gut", "why": "Same idea as nephrotic syndrome, different route: IgG leaks into the bowel lumen."}, {"a": "Sickle cell disease", "b": "Repeated splenic infarction (autosplenectomy)", "why": "Functional asplenia → fulminant sepsis from S. pneumoniae, H. influenzae type b and N. meningitidis; Howell-Jolly bodies on smear.", "hy": true}, {"a": "HIV infection", "b": "Progressive loss of CD4 T cells", "why": "The most important acquired immunodeficiency worldwide; HIV testing belongs in the workup of opportunistic infections."}, {"a": "Eculizumab therapy", "b": "C5 blockade prevents membrane attack complex formation", "why": "Drug-induced terminal complement deficiency carries the same Neisseria risk as inherited C5–C9 deficiency; vaccinate against meningococcus."}, {"a": "Extreme prematurity", "b": "Birth before most maternal IgG has crossed the placenta", "why": "Extremes of age are secondary causes; transplacental IgG transfer rises late in gestation, so premature infants have low IgG."}, {"a": "Cytotoxic chemotherapy", "b": "Marrow suppression causing neutropenia", "why": "Chemotherapy and radiation are leading secondary causes; ANC < 500/μL brings bacterial and fungal infection risk."}]}, {"id": "s05", "lec": "19", "lo": "19.1", "kind": "disease-finding", "title": "Defective immune arm → infection pattern", "left": "Defective arm", "right": "Typical infections", "pairs": [{"a": "Antibody (B-cell) deficiency", "b": "Encapsulated pyogenic bacteria, sinopulmonary, starting after ~6 months", "why": "Maternal IgG covers the first ~6 months; antibody defects are ~65% of PIDs, so recurrent sinopulmonary infection is the commonest PID picture.", "hy": true}, {"a": "T-cell or combined deficiency", "b": "Viral, fungal (thrush) and Pneumocystis infections before 6 months", "why": "Maternal antibody cannot replace T cells, so infections start early with failure to thrive and diarrhea.", "hy": true}, {"a": "Neutrophil oxidative-burst defect", "b": "Catalase-positive abscesses: S. aureus, Aspergillus, Serratia", "why": "CGD: Aspergillus is the leading cause of death. Catalase-negative streptococci are handled because they donate H2O2 to MPO."}, {"a": "Terminal complement (C5–C9) deficiency", "b": "Recurrent, disseminated Neisseria infection", "why": "MAC lysis is the main defense against thin-walled Neisseria; screen with CH50/AH50."}, {"a": "Early classical complement (C1q, C2, C4) deficiency", "b": "Pyogenic infection plus SLE-like immune-complex disease", "why": "Early components coat immune complexes for clearance; C1q deficiency carries the highest lupus risk.", "hy": true}, {"a": "Asplenia", "b": "Fulminant encapsulated-organism sepsis with Howell-Jolly bodies", "why": "Splenic macrophages clear opsonized encapsulated bacteria from blood; loss → overwhelming post-splenectomy infection."}, {"a": "IL-12/IFN-γ axis defect", "b": "Disseminated mycobacteria (BCG) and Salmonella", "why": "Macrophages need IFN-γ to kill intracellular bacteria; granulomas are poorly formed."}]}, {"id": "s06", "lec": "19", "lo": "19.1", "kind": "disease-finding", "title": "Disorder → smear or tissue finding", "left": "Disorder", "right": "Finding", "pairs": [{"a": "X-linked agammaglobulinemia", "b": "Absent tonsils and lymph-node follicles; no CD19+ cells", "why": "No mature B cells → no follicles, germinal centers, plasma cells or tonsils; T-cell paracortex is preserved.", "hy": true}, {"a": "Complete DiGeorge syndrome", "b": "Depleted lymph-node paracortex and splenic PALS", "why": "No thymus → T cells never seed T-cell zones; B-cell follicles are relatively preserved (the reverse of XLA)."}, {"a": "Chronic granulomatous disease", "b": "Necrotizing granulomas with multinucleated giant cells", "why": "Undigested organisms inside phagocytes drive chronic macrophage activation; granulomas can obstruct gastric outlet or ureter."}, {"a": "Chédiak-Higashi syndrome", "b": "Giant cytoplasmic granules in neutrophils", "why": "Fused giant granules on the smear plus ash-gray hair and bleeding = LYST defect."}, {"a": "Leukocyte adhesion deficiency type I", "b": "Marked blood neutrophilia with no pus at infected sites", "why": "Neutrophils cannot leave vessels, so they pile up in blood (often > 20,000/μL) and never form abscesses."}, {"a": "Wiskott-Aldrich syndrome", "b": "Thrombocytopenia with abnormally small platelets", "why": "Small platelets distinguish WAS from ITP (large platelets). Triad: thrombocytopenia, eczema, recurrent infections.", "hy": true}, {"a": "CD40L deficiency (X-linked hyper-IgM)", "b": "B cells present but lymph nodes lack germinal centers", "why": "B cells cannot receive the CD40 signal to form germinal centers and class switch; IgM is normal or high."}, {"a": "AID deficiency", "b": "Lymphadenopathy with large germinal centers", "why": "T-cell help is intact, so germinal centers form and enlarge, but B cells cannot complete class switching."}]}, {"id": "s07", "lec": "19", "lo": "19.2", "kind": "term-def", "title": "Immunology test → what it measures", "left": "Test", "right": "What it measures", "pairs": [{"a": "Dihydrorhodamine (DHR) flow cytometry", "b": "ROS from stimulated neutrophils oxidize a dye to fluorescent rhodamine", "why": "Most sensitive CGD test: normal cells shift right after PMA; CGD shows no shift; X-linked carrier mothers show two populations.", "hy": true}, {"a": "Nitroblue tetrazolium (NBT) test", "b": "Normal phagocytes reduce a yellow dye to blue formazan", "why": "Older CGD screen by color: CGD neutrophils stay NBT-negative (no blue)."}, {"a": "TREC quantification", "b": "Excised TCR-rearrangement DNA circles marking recent thymic emigrants", "why": "Newborn dried-blood-spot PCR; absent or very low TRECs → SCID (or complete DiGeorge), allowing HSCT before infections.", "hy": true}, {"a": "CH50", "b": "Serum lysis of antibody-coated sheep RBCs via the classical pathway", "why": "Screens C1–C9; near zero → missing classical or terminal component."}, {"a": "AH50", "b": "Lytic activity of the alternative complement pathway", "why": "Paired with CH50: low CH50 with normal AH50 → early classical defect; both low → C3 or terminal defect."}, {"a": "Vaccine antibody titers", "b": "Ability to make a specific antibody response (tetanus, pneumococcus)", "why": "Functional antibody test; poor responses define CVID and specific antibody deficiency even when Ig levels are near normal."}, {"a": "Lymphocyte phenotyping", "b": "Counts of T, B and NK subsets by surface markers (CD3, CD19, CD56)", "why": "First targeted test for opportunistic infections; the missing subsets (e.g., T−B+NK−) guide genetic testing."}, {"a": "Lymphocyte proliferation assay", "b": "Functional T-cell response to mitogens or antigens", "why": "Tests whether T cells that are present can actually proliferate; used with phenotyping for cell-mediated defects."}]}, {"id": "s08", "lec": "19", "lo": "19.2", "kind": "term-app", "title": "Presentation → best initial targeted test", "left": "Presentation", "right": "Initial test", "pairs": [{"a": "Recurrent bacterial sinusitis and otitis in a 4-year-old", "b": "Quantitative IgG/IgA/IgM plus vaccine titers", "why": "Recurrent typical infections point to antibody deficiency (the most common PID category); check levels AND function.", "hy": true}, {"a": "Pneumocystis pneumonia and severe CMV in a 2-year-old", "b": "Lymphocyte subsets and function, plus HIV testing", "why": "Opportunistic or severe viral infections → T-cell/combined defect workup.", "hy": true}, {"a": "Recurrent S. aureus abscesses and Aspergillus pneumonia", "b": "Dihydrorhodamine (DHR) flow cytometry", "why": "Catalase-positive infections → CGD; DHR is the gold-standard screen, then genetics identifies the subunit."}, {"a": "Recurrent meningococcal disease", "b": "CH50 and AH50 complement screens", "why": "Neisseria recurrences → terminal complement deficiency until proven otherwise."}, {"a": "Neonatal seizure with low calcium and truncus arteriosus", "b": "22q11.2 deletion testing", "why": "Hypocalcemia + conotruncal defect → DiGeorge; lymphopenia confirms thymic deficiency.", "hy": true}, {"a": "Delayed cord separation with neutrophilia", "b": "Flow cytometry for CD18 on leukocytes", "why": "Newborn pearl: delayed cord separation → pursue leukocyte adhesion deficiency."}]}, {"id": "s09", "lec": "19", "lo": "19.3", "kind": "term-app", "title": "Disorder → key management", "left": "Disorder", "right": "Key management", "pairs": [{"a": "X-linked agammaglobulinemia", "b": "Lifelong IVIG (~400 mg/kg monthly) or weekly subcutaneous Ig", "why": "Ig replacement supplies IgG only (not IgA/IgM), so infections still need prompt antibiotics; avoid live vaccines.", "hy": true}, {"a": "Chronic granulomatous disease", "b": "IFN-γ plus TMP-SMX and itraconazole prophylaxis", "why": "IFN-γ boosts remaining phagocyte killing and lowers severe infections; HSCT is curative.", "hy": true}, {"a": "ADA-deficient SCID (disease-specific therapy)", "b": "PEG-ADA enzyme replacement; first disease treated by gene therapy", "why": "Options: HSCT, PEG-ADA and gene therapy, all aimed at removing toxic deoxyadenosine metabolites."}, {"a": "Complete DiGeorge syndrome", "b": "Thymus transplantation", "why": "The defect is the thymic environment, not the stem cell, so thymic tissue is transplanted."}, {"a": "Severe congenital neutropenia", "b": "G-CSF to drive neutrophil production", "why": "Granulocyte colony-stimulating factor raises the ANC and cuts bacterial/fungal infections."}, {"a": "Terminal complement deficiency", "b": "Meningococcal vaccination and prompt antibiotics", "why": "Vaccination reduces but does not abolish risk; fever needs urgent evaluation."}, {"a": "Selective IgA deficiency", "b": "IgA-depleted products, washed RBCs or IgA-deficient donors", "why": "Prevents anaphylaxis from anti-IgA antibodies; most patients need no other treatment."}, {"a": "SCID infant who needs a transfusion", "b": "Irradiated, CMV-negative blood products only", "why": "Viable donor T cells in non-irradiated blood can engraft and cause fatal transfusion-associated GVHD.", "hy": true}]}, {"id": "s10", "lec": "28", "lo": "28.1", "kind": "term-app", "title": "Graft scenario → type and outcome", "left": "Scenario", "right": "Type and outcome", "pairs": [{"a": "Burn patient's own thigh skin grafted onto his forearm", "b": "Autograft — accepted", "why": "Self tissue moved to another site in the same person is syngeneic and accepted.", "hy": true}, {"a": "Kidney from a monozygotic twin", "b": "Isograft — syngeneic, accepted without immunosuppression", "why": "Identical twins share ABO, HLA and minor antigens, so recipient T cells see nothing foreign.", "hy": true}, {"a": "Kidney from an HLA-identical non-twin sibling", "b": "Allograft — slow rejection via minor antigens", "why": "Even with full HLA match, minor histocompatibility antigens differ, so immunosuppression is still needed."}, {"a": "Pig kidney into a human", "b": "Xenograft — strongest barrier, preformed natural antibodies", "why": "Xenogeneic (different species) grafts face preformed antibodies against foreign carbohydrates."}, {"a": "Strain A mouse skin onto an (A × B) F1 hybrid", "b": "Accepted — F1 already expresses all A antigens", "why": "Law of transplantation: a graft is accepted only if the recipient expresses every donor histocompatibility antigen; expression is codominant."}, {"a": "(A × B) F1 mouse skin onto a strain A parent", "b": "Rejected — B antigens are foreign to strain A", "why": "The F1 graft carries B antigens the A parent lacks. Same logic underlies HLA matching."}]}, {"id": "s11", "lec": "28", "lo": "28.2", "kind": "term-def", "title": "Histocompatibility term → meaning", "left": "Term", "right": "Meaning", "pairs": [{"a": "ABO antigens", "b": "Carbohydrates on RBCs and endothelium; mismatch causes hyperacute rejection", "why": "Natural anti-A/anti-B IgM (and IgG) exist by ~6 months, triggered by cross-reactive gut bacteria. ABO compatibility is the first donor rule.", "hy": true}, {"a": "HLA class I (A, B, C)", "b": "On all nucleated cells; presents cytosolic peptides to CD8 T cells", "why": "Most kidney parenchymal cells express only class I allo-HLA."}, {"a": "HLA class II (DR, DQ, DP)", "b": "On APCs and endothelium; presents exogenous peptides to CD4 T cells", "why": "Donor dendritic cells scattered through the organ carry class II, which drives strong CD4 alloresponses.", "hy": true}, {"a": "Minor histocompatibility antigens", "b": "Polymorphic self-peptides on HLA causing slow rejection despite HLA match", "why": "Example: H-Y antigens from Y-chromosome genes (female recipient, male donor). Defined by cell-mediated rejection; key in matched HSCT (GVHD)."}, {"a": "HLA haplotype", "b": "Linked HLA alleles inherited together, giving siblings a 25% full-match chance", "why": "Each child gets one haplotype from each parent → 1/4 chance two siblings share both."}, {"a": "Codominant expression", "b": "Both parental HLA alleles are displayed on every cell", "why": "Together with polymorphism and polygeny, codominance makes unrelated full matches rare."}, {"a": "Crossmatch", "b": "Recipient serum tested against donor cells for preformed antibody", "why": "A positive crossmatch predicts hyperacute/antibody-mediated rejection, so that donor is avoided."}, {"a": "Panel-reactive antibody (PRA)", "b": "Percentage of a population donor panel a candidate's serum reacts with", "why": "High PRA = highly sensitized (pregnancy, transfusion, prior transplant) and harder to match."}]}, {"id": "s12", "lec": "28", "lo": "28.3", "kind": "term-def", "title": "Alloimmunity concept → explanation", "left": "Concept", "right": "Explanation", "pairs": [{"a": "Alloreactivity", "b": "Up to 1–10% of T cells respond to a foreign MHC through TCR cross-reactivity", "why": "Self-MHC-restricted TCRs cross-react with donor MHC + peptide; each allo-MHC engages many clones at once.", "hy": true}, {"a": "Passenger leukocytes", "b": "Donor dendritic cells that leave the graft for the recipient's lymph node", "why": "They drive the direct pathway; because they are finite, direct recognition wanes over time."}, {"a": "DAMPs from ischemia–reperfusion", "b": "Signals through PRRs that mature graft dendritic cells", "why": "Surgical/ischemic injury plus IL-1β upregulate MHC, B7 and CCR7 on DCs — innate immunity amplifies rejection."}, {"a": "Allosensitization", "b": "Prior exposure to allo-HLA via pregnancy, transfusion or transplant", "why": "Infection/vaccination can also generate cross-reactive memory T cells. Sensitized patients have preformed anti-HLA antibody.", "hy": true}, {"a": "Alloreactive memory T cells", "b": "Need little costimulation and respond poorly to immunosuppressants", "why": "Memory cells act directly in inflamed grafts and make sensitized patients harder to protect."}, {"a": "Signal 2 (costimulation)", "b": "CD28 on the T cell binding B7 (CD80/86) on the dendritic cell", "why": "Signal 1 = TCR–MHC; signal 2 = CD28–B7; IL-2 then drives proliferation."}, {"a": "CD40L–CD40 help", "b": "T-cell signal that drives germinal centers and class-switched donor-specific IgG", "why": "Activated CD4 T cells help B cells (→ complement-fixing alloantibody) and macrophages (→ DTH)."}]}, {"id": "s13", "lec": "28", "lo": "28.4", "kind": "cause-effect", "title": "Rejection process → mechanism", "left": "Process", "right": "Mechanism", "pairs": [{"a": "Hyperacute rejection", "b": "Preformed anti-ABO or anti-HLA antibody fixes complement on endothelium within minutes", "why": "Graft turns mottled and blue on the table; irreversible. Prevented by ABO matching and a negative crossmatch.", "hy": true}, {"a": "Acute cellular rejection", "b": "Host CD4 and CD8 T cells, mostly via direct recognition, invade within weeks", "why": "75–80% of rejections; tubulitis and interstitial lymphocytes; usually reversible with pulse steroids or ATG."}, {"a": "Acute antibody-mediated rejection", "b": "Weeks after transplant, donor-specific anti-HLA antibody inflames capillaries", "why": "20–30% of rejections; capillaritis, glomerulitis and C4d+ peritubular capillaries.", "hy": true}, {"a": "Chronic rejection", "b": "Continuous indirect-pathway T-cell and antibody assault over months to years", "why": "> 3 months; graft arteriosclerosis and interstitial fibrosis; irreversible and the main cause of late graft loss."}, {"a": "First-set rejection", "b": "Skin graft on a naive mouse rejected by a primary response in about 14 days", "why": "Revascularization (days 3–7) → infiltration (7–10) → thrombosis and necrosis (12–14)."}, {"a": "Second-set rejection", "b": "Repeat skin graft from the same donor strain rejected by memory in about 6 days", "why": "Shows memory and specificity; a graft from an unrelated strain is rejected at first-set speed. Transfer of spleen T cells transfers it."}, {"a": "Graft-versus-host disease", "b": "Donor T cells attack host HLA and minor antigens in skin, liver and gut", "why": "The alloimmune response in reverse: rash (palms/soles), cholestasis/↑bilirubin, diarrhea after allogeneic HSCT.", "hy": true}]}, {"id": "s14", "lec": "28", "lo": "28.4", "kind": "cause-effect", "title": "GVHD / HSCT factor → effect", "left": "Factor", "right": "Effect", "pairs": [{"a": "Graft-versus-leukemia effect", "b": "Donor T cells eliminate residual host leukemic cells", "why": "The benefit side of alloreactivity — why removing all donor T cells raises relapse."}, {"a": "Transfusion-associated GVHD", "b": "Viable T cells in non-irradiated blood engraft in an immunodeficient host", "why": "Prevent with irradiated products in SCID, HSCT and other severely immunocompromised patients."}, {"a": "T-cell depletion of the stem-cell graft", "b": "Less GVHD, but more relapse, graft failure and EBV lymphoproliferation", "why": "The bubble-boy lesson: T-cell–depleted marrow carried EBV that drove fatal B-cell lymphoma.", "hy": true}, {"a": "Non-myeloablative conditioning", "b": "Less tissue damage, so fewer DAMPs and a smaller cytokine storm", "why": "Reduced-intensity regimens are a GVHD-prevention strategy."}, {"a": "Myeloablative chemotherapy/irradiation", "b": "Ablates host marrow and releases DAMPs, PAMPs and TNF-α/IL-1/IL-6", "why": "Phase 1 of acute GVHD: tissue damage activates host APCs that then prime donor T cells."}, {"a": "Regulatory T cells", "b": "Restrain donor effector T cells; their shortage worsens GVHD", "why": "Tregs normally temper the Th1/Th17 and CD8 expansion that drives tissue attack."}, {"a": "Intact recipient immunity after kidney transplant", "b": "Eliminates the few donor T cells, so GVHD rarely occurs", "why": "GVHD needs immunocompetent graft cells, host antigens the donor lacks, and a host unable to reject them.", "hy": true}]}, {"id": "s15", "lec": "28", "lo": "28.5", "kind": "drug-mech", "title": "Target → transplant drug that blocks it", "left": "Target", "right": "Drug", "pairs": [{"a": "CD52 on mature T and B cells", "b": "Alemtuzumab (Campath)", "why": "Humanized anti-CD52 induction agent → massive lymphocyte depletion.", "hy": true}, {"a": "IL-2 receptor α chain (CD25) on activated T cells", "b": "Basiliximab (Simulect)", "why": "Chimeric anti-CD25 blocks IL-2 signaling without depleting cells; it targets the receptor, not IL-2 itself.", "hy": true}, {"a": "Calcineurin, after the drug binds FKBP-12", "b": "Tacrolimus (Prograf)", "why": "Calcineurin inhibitor → NFAT stays phosphorylated → no IL-2 transcription."}, {"a": "Calcineurin, after the drug binds cyclophilin", "b": "Cyclosporine (Neoral)", "why": "Same end effect as tacrolimus (↓IL-2 synthesis) through a different immunophilin."}, {"a": "IMPDH-driven de novo GMP synthesis", "b": "Mycophenolate mofetil (CellCept)", "why": "Lymphocytes depend on the de novo purine pathway, so IMPDH inhibition selectively stops their proliferation.", "hy": true}, {"a": "Purine synthesis via a 6-mercaptopurine metabolite", "b": "Azathioprine (Imuran)", "why": "Prodrug → 6-MP; xanthine oxidase metabolizes 6-MP, so allopurinol raises toxicity; check TPMT."}, {"a": "NF-κB-driven cytokine gene transcription", "b": "Prednisolone", "why": "Glucocorticoid receptor in the nucleus inhibits NF-κB/AP-1 → ↓IL-1, IL-2, TNF-α. Pulse steroids treat ACR."}, {"a": "CD20 on B cells (plasma-cell precursors)", "b": "Rituximab (Rituxan)", "why": "Used for antibody-mediated rejection; misses mature plasma cells, which lose CD20."}, {"a": "Proteasome clearance of misfolded Ig in plasma cells", "b": "Bortezomib (Velcade)", "why": "Unfolded-protein stress kills antibody-secreting plasma cells — useful when rituximab fails.", "hy": true}]}, {"id": "s16", "lec": "28", "lo": "28.5", "kind": "drug-mech", "title": "Transplant drug → signature toxicity", "left": "Drug", "right": "Signature toxicity", "pairs": [{"a": "Cyclosporine", "b": "Nephrotoxicity plus gingival hyperplasia and hirsutism", "why": "Both calcineurin inhibitors are nephrotoxic and cause hypertension; gum overgrowth and hirsutism point to cyclosporine.", "hy": true}, {"a": "Tacrolimus", "b": "Nephrotoxicity with more neurotoxicity and post-transplant diabetes than cyclosporine", "why": "Tacrolimus has a higher rate of new-onset diabetes and tremor/neurotoxicity; no gingival hyperplasia.", "hy": true}, {"a": "Mycophenolate mofetil", "b": "GI upset and diarrhea; strict pregnancy prevention", "why": "Also GI upset and cytopenias; switch before conception."}, {"a": "Azathioprine", "b": "Marrow suppression, worse with allopurinol or low TPMT activity", "why": "6-MP is cleared by xanthine oxidase and TPMT; blocking either raises active drug levels."}, {"a": "Prednisolone", "b": "Hyperglycemia, osteoporosis and Cushingoid features", "why": "Long-term steroid toxicities also include hypertension and infection."}, {"a": "Thymoglobulin", "b": "Cytokine release and serum sickness from a rabbit protein", "why": "Polyclonal rabbit antithymocyte globulin is foreign protein → type III hypersensitivity (serum sickness)."}, {"a": "Bortezomib", "b": "Peripheral neuropathy", "why": "The proteasome inhibitor's main use is multiple myeloma; neuropathy is its dose-limiting toxicity."}]}], "seqs": [{"id": "q01", "lec": "19", "lo": "19.1", "title": "Neutrophil egress", "prompt": "Put the steps of neutrophil egress from blood into infected tissue in order (first → last).", "steps": ["Rolling on endothelial selectins", "Chemokine activation on the endothelium", "Tight adhesion: LFA-1 (CD18) binds ICAM-1", "Diapedesis between endothelial cells", "Chemotaxis through tissue toward microbes"], "why": "LAD II (no fucosylated selectin ligand) breaks step 1; LAD I (no CD18) breaks step 3 — rolling occurs but no tight adhesion.", "hy": true}, {"id": "q02", "lec": "19", "lo": "19.1", "title": "Oxygen-dependent killing", "prompt": "Order the oxygen-dependent killing steps in the neutrophil phagolysosome (first → last).", "steps": ["NADPH oxidase subunits assemble on the phagosome membrane", "NADPH oxidase reduces O2 to superoxide (respiratory burst)", "Superoxide dismutase converts superoxide to H2O2", "Myeloperoxidase combines H2O2 with Cl− to form HOCl"], "why": "CGD blocks the oxidase step so nothing downstream forms; MPO deficiency blocks only the last step and is usually mild.", "hy": true}, {"id": "q03", "lec": "19", "lo": "19.1", "title": "B-cell development", "prompt": "Put the stages of B-cell development in order (first → last).", "steps": ["Hematopoietic stem cell in bone marrow", "Pro-B cell (heavy-chain rearrangement)", "Pre-B cell (pre-BCR signals through BTK)", "Immature B cell (surface IgM)", "Mature naïve B cell (IgM + IgD)", "Antibody-secreting plasma cell"], "why": "XLA (BTK) arrests at the pre-B stage; CVID fails at the last step (plasma-cell differentiation) with B cells present."}, {"id": "q04", "lec": "19", "lo": "19.2", "title": "Immunodeficiency workup", "prompt": "Order a systematic evaluation for suspected immunodeficiency (first → last).", "steps": ["History: infection pattern, family history, autoimmune symptoms", "Physical exam: skin, heart, lymphoid tissue, nodes", "Screening labs: CBC/diff, IgG/IgA/IgM, vaccine titers, subsets", "Targeted tests and genetic testing with specialist referral", "Diagnosis, management plan, education and follow-up"], "why": "History and exam drive which arm to test; genetics confirms the inborn error and enables targeted therapy."}, {"id": "q05", "lec": "28", "lo": "28.3", "title": "T-cell–mediated rejection", "prompt": "Order the events leading to T-cell–mediated rejection of a solid organ (first → last).", "steps": ["Surgical and ischemic injury releases DAMPs in the graft", "Graft dendritic cells mature and migrate to the lymph node", "Recipient T cells get signal 1 (TCR–MHC), signal 2 (CD28–B7) and IL-2", "Effector CD4 and CD8 T cells traffic back to the graft", "Recruited macrophages and neutrophils amplify graft damage"], "why": "Innate immunity (DAMPs, IL-1β) starts DC maturation; adaptive T cells execute rejection; innate cells amplify it.", "hy": true}, {"id": "q06", "lec": "28", "lo": "28.5", "title": "Calcineurin pathway", "prompt": "Order the T-cell signaling steps blocked by tacrolimus and cyclosporine (first → last).", "steps": ["TCR engagement raises intracellular Ca2+", "Ca2+–calmodulin activates calcineurin", "Calcineurin dephosphorylates NFAT", "NFAT enters the nucleus", "IL-2 gene is transcribed, driving T-cell proliferation"], "why": "Cyclosporine–cyclophilin and tacrolimus–FKBP-12 complexes inhibit calcineurin, so NFAT stays cytoplasmic and IL-2 is not made.", "hy": true}, {"id": "q07", "lec": "28", "lo": "28.4", "title": "Acute GVHD phases", "prompt": "Order the phases of acute GVHD after allogeneic HSCT (first → last e novo)", "T cells ↓; calcium ↓"], ["Wiskott-Aldrich syndrome", "Eczema, petechiae, small platelets", "X-linked", "↓IgM, ↑IgA/IgE, ↓platelets"], ["X-linked SCID", "Thrush + PCP at 3 mo; no thymus", "X-linked", "T−B+NK−; Ig ↓"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Hyper-IgE (Job) syndrome", "Chédiak-Higashi syndrome", "Ataxia-telangiectasia"], "2": ["Mitochondrial", "X-linked dominant", "Y-linked"], "3": ["IgE ↑↑ with eosinophilia", "Neutrophilia; no pus", "Absent CH50"]}, "notes": ["BTK block at pre-B stage; maternal IgG protects ~6 months, then encapsulated sinopulmonary infections.", "B cells fail to become plasma cells; onset 20s–30s, autoimmunity (ITP, AIHA) and lymphoma risk.", "Most common PID; anti-IgA antibodies cause transfusion/IVIG anaphylaxis.", "CD40L also activates macrophages, so opportunistic infections (Pneumocystis, Cryptosporidium) occur.", "T-cell help is intact but B cells cannot switch; lymphoid hyperplasia, no opportunistic infections.", "3rd/4th pouch failure: thymus + parathyroids, conotruncal heart, cleft palate. NOT X-linked.", "WASp links TCR signaling to actin; small platelets distinguish it from ITP.", "γc loss: no IL-7 (T) or IL-15 (NK) signaling; B cells present but unhelped."], "hy": "X-linked PIDs to know: XLA (BTK), X-SCID (γc), CD40L hyper-IgM, Wiskott-Aldrich and gp91phox CGD. DiGeorge is 22q11.2, not X-linked."}, {"id": "g02", "lec": "19", "lo": "19.1", "title": "SCID forms", "blurb": "Hard: use the molecular mechanism to name the SCID form, then fill its T/B/NK phenotype and inheritance.", "cols": [{"h": "SCID form", "dep": 1}, {"h": "Mechanism"}, {"h": "Phenotype", "dep": 0}, {"h": "Inheritance", "dep": 0}], "rows": [["Common γ chain (IL2RG)", "γc of IL-2/4/7/9/15/21 receptors", "T−B+NK−", "X-linked"], ["JAK3", "Kinase downstream of γc receptors", "T−B+NK−", "Autosomal recessive"], ["Adenosine deaminase", "dATP blocks ribonucleotide reductase", "T−B−NK−", "Autosomal recessive"], ["RAG1/RAG2", "No DNA cutting evere pyogenic infections from infancy", "C3", "Low C3; CH50 and AH50 ~0"], ["Terminal complement", "Recurrent Neisseria", "C5–C9 (MAC)", "CH50 and AH50 ~0; C3 normal"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Myeloperoxidase deficiency", "Wiskott-Aldrich syndrome", "Hereditary angioedema"], "2": ["Myeloperoxidase", "BTK", "WAS protein"], "3": ["Howell-Jolly bodies", "Absent TRECs", "Small platelets"]}, "notes": ["β2 integrin loss → no firm adhesion to ICAM-1; omphalitis and periodontitis; HSCT curative.", "No rolling; same fucosylation defect removes H antigen (Bombay phenotype).", "gp91phox (Xp21, X-linked) ~65%; p47phox (AR) most common in girls. IFN-γ + TMP-SMX + itraconazole.", "Giant granules plus albinism and bleeding; risk of lymphoproliferative accelerated phase.", "Immune complexes are not cleared → SLE; C1q deficiency has the highest lupus risk.", "All three pathways converge at C3: no opsonin, no C5a, no MAC.", "MAC lysis controls Neisseria; eculizumab (anti-C5) creates the same risk."], "hy": "Catalase-positive infections → CGD (DHR). Recurrent Neisseria → C5–C9 (CH50). Delayed cord separation → LAD I (CD18). Giant granules → Chédiak-Higashi."}, {"id": "g04", "lec": "28", "lo": "28.2", "title": "Histocompatibility antigens", "blurb": "Hard: from where the antigen is found, name it, then fill who recognizes it and what mismatch causes.", "cols": [{"h": "Antigen", "dep": 1}, {"h": "Where found"}, {"h": "Recognized by", "dep": 0}, {"h": "Mismatch causes", "dep": 0}], "rows": [["ABO blood group", "RBCs and vascular endothelium", "Preformed natural IgM/IgG", "Hyperacute rejection"], ["HLA class I (A, B, C)", "All nucleated cells", "CD8 T cells (and DSA)", "Acute cellular/antibody rejection"], ["HLA class II (DR, DQ, DP)", "APCs (DC, B cell, macrophage)", "CD4 T cells (and DSA)", "Acute cellular/antibody rejection"], ["Minor histocompatibility", "Polymorphic self-peptides on HLA", "T cells (cell-mediated)", "Slow rejection; GVHD in matched HSCT"], ["H-Y antigens", "Y-chromosome proteins of male cells", "T cells (cell-mediated)", "Slow rejection; GVHD in matched HSCT"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Rh(D) antigen", "CD1d", "HLA-G"], "2": ["NK cells via KIR only", "Complement alone"], "3": ["No effect on graft survival", "Second-set rejection only"]}, "notes": ["Carbohydrate determinants; natural antibodies appear by ~6 months. ABO compatibility is the first donor rule.", "Presents endogenous (cytosolic) peptides; most kidney parenchyma expresses only class I.", "Presents exogenous peptides; also on vascular endothelium and donor dendritic cells.", "Each minor antigen alone causes slow rejection; humoral responses are generally not detected.", "Classic minor antigen: male donor → female recipient, whose T cells see H-Y peptides on HLA."], "hy": "HLA (chromosome 6) is polygenic, highly polymorphic and codominant; siblings have a 25% chance of an HLA-identical match. Kidney matching focuses on HLA-A, -B, -DR."}, {"id": "g05", "lec": "28", "lo": "28.3", "title": "Direct vs indirect vs semi-direct allorecognition", "blurb": "For each property, fill in how the three alloimmune recognition pathways differ.", "cols": [{"h": "Property"}, {"h": "Direct", "dep": 0}, {"h": "Indirect", "dep": 0}, {"h": "Semi-direct", "dep": 0}], "rows": [["Presenting cell", "Donor DC or parenchymal cell", "Recipient APC", "Recipient APC"], ["What the TCR sees", "Intact donor MHC", "Donor-HLA peptide on self MHC", "Intact donor MHC"], ["How donor MHC gets there", "Native to the donor cell", "Endocytosed and processed", "Transferred via exosomes"], ["Kinetics", "High early, then wanes", "Low early, rises, stays high", "High early, gradually wanes"], ["Main rejection role", "Acute cellular rejection", "Chronic rejection; alloantibody", "Contributes to acute and chronic"]], "easyGiven": [0], "hardGiven": [0], "decoys": {"1": ["Recipient B cell", "Lifelong, never wanes"], "2": ["Donor passenger DC", "Intact donor MHC only"], "3": ["Donor parenchymal cell", "Native to the donor cell only"]}, "notes": ["Direct uses donor cells; indirect and semi-direct use recipient APCs.", "Direct and semi-direct show intact donor MHC; indirect is classic self-MHC restriction.", "Semi-direct: dying donor DCs shed exosomes carrying intact HLA onto recipient DCs.", "Donor DCs are finite, so direct fades; recipient APCs are replenished, so indirect persists.", "Indirect CD4 help drives donor-specific antibody and chronic rejection."], "hy": "Direct = early acute rejection (donor passenger DCs). Indirect = chronic rejection and DSA (recipient APCs, lifelong)."}, {"id": "g06", "lec": "28", "lo": "28.4", "title": "Rejection types: timing → mechanism → histology", "blurb": "Hard: from the histology, name the rejection type, then fill timing, effector and reversibility.", "cols": [{"h": "Rejection type", "dep": 3}, {"h": "Timing", "dep": 0}, {"h": "Effector", "dep": 0}, {"h": "Histology"}, {"h": "Reversible?", "dep": 0}], "rows": [["Hyperacute", "Minutes", "Preformed anti-ABO/HLA Ab", "Capillary thrombosis, neutrophils", "No — remove graft"], ["Acute cellular", "~2–21 days", "CD4/CD8 T cells (direct)", "Tubulitis, interstitial lymphocytes", "Usually — steroids, ATG"], ["Acute antibody-mediated", "~2–21 days", "DSA made after transplant", "Capillaritis, glomerulitis, C4d+", "Often — PLEX, IVIG, rituximab"], ["Chronic", "> 3 months", "Mixed; indirect pathway", "Intimal thickening, fibrosis", "No — main late graft loss"]], "easyGiven": [0], "hardGiven": [3], "decoys": {"0": ["Second-set skin rejection", "Graft-versus-host disease"], "1": ["~6 months to 1 year only", "Before reperfusion"], "2": ["NK cells alone", "Donor T cells vs host"], "4": ["Resolves without treatment", "Yes — reverses spontaneously"]}, "notes": ["Graft mottled and blue on unclamping; prevented by ABO matching and negative crossmatch.", "75–80% of rejections; may involve vessels (endothelialitis).", "20–30% of rejections; C4d = classic /* ---------- RAPID FIRE: play ---------- */
let RF=null, timerId=null;
function stopTimer(){if(timerId){cancelAnimationFrame(timerId);timerId=null;}}
function startRF(){
  let p=shuffle(pool());
  // interleave so the same set doesn't come back to back
  const out=[];while(p.length){let i=p.findIndex(x=>!out.length||sid(x)!==sid(out[out.length-1]));if(i<0)i=0;out.push(p.splice(i,1)[0]);}
  const n=F.len==="all"?out.length:Math.min(out.length,+F.len);
  RF={q:out.slice(0,n).map(it=>({it,retry:false})),i:0,score:0,streak:0,best:0,first:0,firstOk:0,misses:[],answered:false};
  go("rfplay");
}
const sid=it=>it.t==="pair"?it.set.id:it.q.id;
function topBar(){
  const tot=RF.q.length;
  return `<div class="rf-top">
    <div class="statrow">
      <div class="stat"><b>${Math.min(RF.i+1,tot)}/${tot}</b><span>Card</span></div>
      <div class="stat"><b>${RF.score}</b><span>Score</span></div>
      <div class="stat"><b>${RF.streak}</b><span>Streak</span></div>
      <div class="stat"><b>${RF.first?Math.round(100*RF.firstOk/RF.first)+"%":"—"}</b><span>First-try accuracy</span></div>
    </div>
    <button class="btn sm" type="button" id="quitRF">End round</button>
  </div>
  <div class="bar"><i style="width:${100*RF.i/tot}%;background:var(--accent)"></i></div>`;
}
function renderQ(){
  if(RF.i>=RF.q.length){go("rfend");return;}
  const cur=RF.q[RF.i]; RF.answered=false;
  if(cur.it.t==="seq")return renderSeq(cur);
  const it=cur.it,s=it.set,p=it.p;
  if(cur.rev===undefined)cur.rev=F.dir==="mixed"&&Math.random()<.3;
  if(!cur.opts){
    const others=shuffle(s.pairs.filter((_,j)=>j!==it.i)).slice(0,3);
    cur.opts=shuffle([p,...others]);
  }
  const K=KIND[s.kind]||KIND["term-def"];
  const promptLab=cur.rev?s.right:s.left, ansLab=cur.rev?s.left:s.right;
  $("#app").innerHTML=`${topBar()}
  <section class="qcard panel">
    <div class="qhead"><span class="kind" style="--kc:var(${K.c})">${cur.rev?esc(K.l.split(" → ").reverse().join(" → ")):K.l}</span>${lecTag(it.lec)}<span class="qset">${esc(s.title)}</span>${cur.retry?'<span class="hy" style="background:var(--once-bg);border-color:var(--once);color:var(--ink)">Retry</span>':""}</div>
    ${F.timer!=="off"?'<div class="timer" aria-hidden="true"><i id="tbar"></i></div>':""}
    <div><div class="prompt-lab">${esc(promptLab)}</div><p class="prompt">${esc(cur.rev?p.b:p.a)}</p></div>
    <p class="ask">Pick the matching ${esc(ansLab.toLowerCase())}.</p>
    <div class="options" role="group" aria-label="Answer choices">
      ${cur.opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}"><span class="key">${k+1}</span><span>${esc(cur.rev?o.a:o.b)}</span></button>`).join("")}
    </div>
    <div id="fbSlot"></div>
  </section>`;
  $("#quitRF").onclick=()=>go("rfend");
  document.querySelectorAll(".opt[data-k]").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if(F.timer!=="off")runTimer(+F.timer,()=>answer(-1));
}
function runTimer(sec,onEnd){
  const t0=performance.now();
  const tick=now=>{const f=Math.max(0,1-(now-t0)/(sec*1000));const bar=$("#tbar");if(bar){bar.style.width=(f*100)+"%";bar.classList.toggle("low",f<.3);}RF.tleft=f;if(f<=0){timerId=null;onEnd();return;}timerId=requestAnimationFrame(tick);};
  timerId=requestAnimationFrame(tick);
}
function record(cur,ok){
  const st=itemStat(cur.it.key);st.n++;if(ok){st.ok++;st.run++;}else st.run=0;st.last=ok;
  if(!cur.retry){RF.first++;if(ok)RF.firstOk++;}
  if(ok){RF.streak++;RF.best=Math.max(RF.best,RF.streak);S.best=Math.max(S.best||0,RF.best);}else{RF.streak=0;}
  if(!ok){
    if(!RF.misses.includes(cur.it))RF.misses.push(cur.it);
    if(!cur.retry){const at=Math.min(RF.q.length,RF.i+3+Math.floor(Math.random()*3));RF.q.splice(at,0,{it:cur.it,retry:true});}
  }
  save();
}
function answer(k){
  if(RF.answered)return;RF.answered=true;stopTimer();
  const cur=RF.q[RF.i],it=cur.it,s=it.set,p=it.p;
  const chosen=k>=0?cur.opts[k]:null, ok=chosen===p;
  let pts=0;if(ok){pts=100+Math.min(50,RF.streak*10);if(F.timer!=="off")pts+=Math.round(50*(RF.tleft||0));}
  RF.score+=pts;record(cur,ok);
  document.querySelectorAll(".opt[data-k]").forEach(b=>{const o=cur.opts[+b.dataset.k];b.disabled=true;if(o===p)b.classList.add("correct");else if(o===chosen)b.classList.add("wrong");else b.classList.add("dim");});
  const ansTxt=cur.rev?p.a:p.b;
  let also="";
  if(chosen&&!ok)also=`<p class="also">You picked <b>${esc(cur.rev?chosen.a:chosen.b)}</b>, which matches <b>${esc(cur.rev?chosen.b:chosen.a)}</b>.</p>`;
  $("#fbSlot").innerHTML=`<div class="fb ${ok?"ok":"bad"}">
    <h3>${ok?`Correct · +${pts}`:k<0?"Time's up":"Not quite"}</h3>
    ${ok?"":`<p>Correct match: <b>${esc(ansTxt)}</b></p>`}
    ${p.why?`<p>${esc(p.why)}</p>`:""}
    ${also}
    ${p.hy?`<div class="hybox"><b>High yield · Step 1</b>${esc(p.a)} → ${esc(p.b)}</div>`:""}
    <div class="navrow"><span class="kbd">${ok?"":"This one comes back later in the round. "}Enter = next</span><button class="btn primary" id="nextQ" type="button">Next &rarr;</button></div>
  </div>`;
  $("#nextQ").onclick=next;$("#nextQ").focus({preventScroll:true});
  $("#fbSlot").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){RF.i++;renderQ();}
function renderSeq(cur){
  const q=cur.it.q;
  if(!cur.order){cur.order=shuffle(q.steps.map((_,i)=>i));if(cur.order.every((v,i)=>v===i)&&q.steps.length>1)cur.order.reverse();}
  cur.placed=0;cur.err=0;
  const draw=()=>{
    $("#app").innerHTML=`${topBar()}
    <section class="qcard panel">
      <div class="qhead"><span class="kind" style="--kc:var(${KIND.sequence.c})">${KIND.sequence.l}</span>${lecTag(q.lec)}<span class="qset">${esc(q.title)}</span>${cur.retry?'<span class="hy" style="background:var(--once-bg);border-color:var(--once);color:var(--ink)">Retry</span>':""}</div>
      ${F.timer!=="off"?'<div class="timer" aria-hidden="true"><i id="tbar"></i></div>':""}
      <p class="prompt">${esc(q.prompt)}</p>
      <ol class="seq-done">${q.steps.map((s,i)=>i<cur.placed?`<li>${esc(s)}</li>`:i===cur.placed?`<li class="slot">Tap step ${i+1}…</li>`:"").join("")}</ol>
      <div class="seq-pool" role="group" aria-label="Steps to place">${cur.order.filter(i=>i>=cur.placed).map(i=>`<button type="button" class="opt" data-s="${i}"><span>${esc(q.steps[i])}</span></button>`).join("")}</div>
      <div class="navrow"><span class="kbd">Mistakes: ${cur.err}</span><button class="btn sm" type="button" id="giveUp">Show order</button></div>
      <div id="fbSlot"></div>
    </section>`;
    $("#quitRF").onclick=()=>go("rfend");
    $("#giveUp").onclick=()=>{cur.err=Math.max(cur.err,3);cur.placed=q.steps.length;finishSeq(cur,true);};
    document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.s;
      if(i===cur.placed){cur.placed++;if(cur.placed>=q.steps.length){finishSeq(cur);}else draw();}
      else{cur.err++;b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");$(".navrow .kbd").textContent="Mistakes: "+cur.err;}
    });
  };
  draw();
  if(F.timer!=="off")runTimer(+F.timer*2,()=>{cur.err=Math.max(cur.err,3);cur.placed=q.steps.length;finishSeq(cur,true);});
}
function finishSeq(cur,gaveUp){
  if(RF.answered)return;RF.answered=true;stopTimer();
  const q=cur.it.q, ok=!gaveUp&&cur.err===0;
  const pts=gaveUp?0:Math.max(0,100-25*cur.err)+(ok?Math.min(50,RF.streak*10):0);
  RF.score+=pts;record(cur,ok);
  $("#app").querySelector(".seq-done").innerHTML=q.steps.map(s=>`<li>${esc(s)}</li>`).join("");
  $("#app").querySelector(".seq-pool").innerHTML="";
  $("#giveUp").remove();
  $("#fbSlot").innerHTML=`<div class="fb ${ok?"ok":"bad"}">
    <h3>${ok?`Perfect order · +${pts}`:gaveUp?"Here's the order":`Done with ${cur.err} mistake${cur.err===1?"":"s"} · +${pts}`}</h3>
    ${q.why?`<p>${esc(q.why)}</p>`:""}
    ${q.hy?`<div class="hybox"><b>High yield · Step 1</b>${esc(q.title)}: know this order cold.</div>`:""}
    <div class="navrow"><span class="kbd">${ok?"":"This one comes back later in the round. "}Enter = next</span><button class="btn primary" id="nextQ" type="button">Next &rarr;</button></div>
  </div>`;
  $("#nextQ").onclick=next;$("#nextQ").focus({preventScroll:true});
}
document.addEventListener("keydown",e=>{
  if(view!=="rfplay"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-4]$/.test(e.key)&&!RF.answered){const b=$(`.opt[data-k="${+e.key-1}"]`);if(b){e.preventDefault();b.click();}}
  else if(e.key==="Enter"&&RF.answered&&document.activeElement&&document.activeElement.id!=="quitRF"){const n=$("#nextQ");if(n&&document.activeElement!==n){e.preventDefault();n.click();}}
});

function renderEnd(){
