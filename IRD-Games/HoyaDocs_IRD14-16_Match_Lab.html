<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRD14–16 Match Lab · HoyaDocs</title>
<meta name="description" content="HoyaDocs IRD14–16 Match Lab: NSAIDs, Acetaminophen &amp; Glucocorticoids. Rapid Fire matching and Grid Lock charts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* HoyaDocs Match Lab engine v1.0
   Layout: header + mode tabs; Home (mode cards, filters, mastery), Rapid Fire (one match per card), Grid Lock (chart + tile bank).
   Colors are tokens on :root with a dark set. Every view stacks to one column on phones. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#1A3363; --muted:#5B6274; --line:#D3D8E0; --chip:#E6E9EE;
  --navy:#0F2244; --navy2:#1A3363; --onnavy:#F4F1EA; --silver:#6E7787; --tan:#5AAEE6;
  --neuro:#5B4BC4; --path:#1F7F78; --drt:#C4631B; --pharm:#2368A8; --imm:#5B4BC4; --mic:#4D7C2A; --accent:#1D6FA8; --accent-ink:#ffffff;
  --ok:#1d7a3e; --ok-bg:#e3f4e8; --bad:#b3261e; --bad-bg:#fbe7e5; --once:#b7791f; --once-bg:#fdf1dc;
  --hy-bg:#FFF4C2; --hy-line:#D4A300; --hy-ink:#5E4700;
  --k1:#2c55a0; --k2:#6b46c1; --k3:#a02c4f; --k4:#b45309; --k5:#0f6b6b; --k6:#85600f; --k7:#1d7a3e; --k8:#0369a1;
  --given:#f5f7f9; --lock:#e9ecef; --clue-bg:#e3ecfa; --clue-ink:#1d3f7a; --clue-line:#9db6e3;
  --f-display:"Graduate","Rockwell","Georgia",serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#A99CF0; --path:#5CC2B8; --drt:#F0A060; --pharm:#7FB3EA; --imm:#A99CF0; --mic:#8CC06A; --navy:#0A1830; --navy2:#13284d; --onnavy:#F4F1EA; --silver:#9aa6b2; --tan:#5AAEE6; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#A99CF0; --path:#5CC2B8; --drt:#F0A060; --pharm:#7FB3EA; --imm:#A99CF0; --mic:#8CC06A; --navy:#0A1830; --navy2:#13284d; --onnavy:#F4F1EA; --silver:#9aa6b2; --tan:#5AAEE6; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15.5px/1.55 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 56px;display:grid;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:.03em}
h3{font-family:var(--f-mono);font-weight:800;letter-spacing:.03em}
/* HoyaDocs hub shell: wordmark bar, section nav, navy varsity hero */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 0 0}
.word{font-family:var(--f-display);font-size:24px;letter-spacing:.04em;text-decoration:none;color:var(--ink);line-height:1}
.word span{color:var(--silver)}
.rev{font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.topr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.themebtn{background:transparent;border:1.5px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:5px 14px;cursor:pointer}
.themebtn:hover{color:var(--ink);border-color:var(--ink)}
.hubnav{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;border-top:3px solid var(--ink);border-bottom:1px solid var(--line)}
.hubnav::-webkit-scrollbar{display:none}
.hubnav a{flex:none;text-decoration:none;font-family:var(--f-mono);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:11px 12px 9px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
.hubnav a:hover{color:var(--ink)}
.hubnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--tan)}
.hubnav a i{width:9px;height:9px;border-radius:2px;flex:none}
.hubnav .sep{flex:none;width:1px;background:var(--line);margin:9px 6px}
header.hero{background:var(--navy);color:var(--onnavy);border-radius:14px;padding:clamp(20px,3.5vw,36px) clamp(20px,4vw,40px);position:relative;overflow:hidden}
header.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(255,255,255,.045) calc(10% - 1px) 10%),radial-gradient(ellipse at 88% 115%, rgba(90,174,230,.34), transparent 58%)}
header.hero > *{position:relative}
.hero .k{font-family:var(--f-mono);font-weight:700;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:#8FCBF5}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5.4vw,52px);line-height:1.02;letter-spacing:.02em;margin:10px 0 4px;color:#F4F1EA;text-shadow:2px 2px 0 #1A3363,4px 4px 0 #5AAEE6}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.meta{font:500 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
header.top h1{font-size:clamp(1.5rem,3.4vw,2rem)}
header.top .lede{margin:4px 0 0;color:var(--muted);max-width:66ch}
.back{font:600 .8rem var(--f-body);text-decoration:none;color:var(--muted)}
.back:hover{color:var(--ink)}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .86rem var(--f-body);background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:.8rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:700 .82rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:1.15rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.mode-card{display:grid;gap:10px;align-content:start}
.mode-card .k{font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mode-card h2{font-size:1.45rem}
.mode-card p{margin:0;color:var(--muted)}
.opts{display:grid;gap:8px}
.optrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.optrow .lab{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:76px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:600 .8rem var(--f-body);border:0;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .78rem var(--f-body);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.chip[aria-pressed="false"]{opacity:.5;text-decoration:line-through;text-decoration-color:var(--muted)}
.chip .n{font:500 .7rem var(--f-mono);color:var(--muted)}
.statrow{display:flex;flex-wrap:wrap;gap:18px}
.stat b{display:block;font:700 1.25rem var(--f-body);font-variant-numeric:tabular-nums}
.stat span{font:500 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.lecrow{display:grid;grid-template-columns:auto minmax(0,1fr) 120px auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.lecrow:first-of-type{border-top:0}
.lecrow .pct{font:500 .75rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
@media (max-width:560px){.lecrow{grid-template-columns:auto minmax(0,1fr) auto}.lecrow .bar{grid-column:1/-1;order:5}}
.tag{font:600 .68rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;color:#fff;background:var(--lc,var(--neuro));white-space:nowrap}
:root[data-theme="dark"] .tag{color:#0d1520}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag{color:#0d1520} }
.hy{font:700 .66rem var(--f-mono);letter-spacing:.06em;background:var(--hy-bg);color:var(--hy-ink);border:1px solid var(--hy-line);border-radius:5px;padding:1px 6px}
.hybox{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.hybox b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
details.how{font-size:.9rem}
details.how summary{cursor:pointer;font-weight:700}
details.how ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
details.how li{margin:3px 0}

/* Rapid fire */
.rf-top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.timer{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.timer i.low{background:var(--bad)}
.qcard{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kind{font:700 .72rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--kc);border:1.5px solid var(--kc);border-radius:6px;padding:2px 8px}
.qset{font-size:.82rem;color:var(--muted)}
.prompt-lab{font:500 .7rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prompt{font:600 clamp(1.15rem,2.6vw,1.4rem)/1.35 var(--f-body);margin:2px 0 0}
.ask{font-size:.88rem;color:var(--muted);margin:0}
.options{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:.95rem;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .key{font:500 .75rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;height:24px;display:grid;place-items:center}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:8px;font-size:.92rem}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb h3{font:800 1.05rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.fb p{margin:0}
.fb .also{font-size:.86rem;color:var(--muted)}
.fb .also b{color:var(--ink)}
.navrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.kbd{font:500 .72rem var(--f-mono);color:var(--muted)}
/* sequence */
.seq-done{display:grid;gap:6px;counter-reset:s;padding:0;margin:0;list-style:none}
.seq-done li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;background:var(--ok-bg);border:1px solid var(--ok);border-radius:8px;padding:7px 10px;font-size:.92rem}
.seq-done li::before{content:counter(s);font:700 .8rem var(--f-mono);color:var(--ok);text-align:center}
.seq-done li.slot{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.seq-done li.slot::before{color:var(--muted)}
.seq-pool{display:grid;gap:6px}
.seq-pool .opt{grid-template-columns:minmax(0,1fr)}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
/* end */
.end{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.big{font:700 clamp(2rem,6vw,3rem)/1 var(--f-display)}
.misslist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.misslist li{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:8px 12px;font-size:.9rem;background:var(--surface)}
.misslist .a{font-weight:700}
.misslist .b{color:var(--muted)}

/* Grid list */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start}
.gcard:hover{border-color:var(--accent)}
.gcard h3{font-size:1.02rem}
.gcard p{margin:0;font-size:.84rem;color:var(--muted)}
.gcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 .72rem var(--f-mono);color:var(--muted)}
.stars{font-size:.85rem;letter-spacing:1px;color:var(--once)}
.stars .off{color:var(--line)}
/* Grid play */
.gwrap{display:grid;gap:12px}
.gtable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.gt{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
.gt th{font:700 .74rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--sunk);vertical-align:bottom}
.gt th small{display:block;font:500 .66rem var(--f-mono);letter-spacing:.03em;text-transform:none;color:var(--muted);margin-top:2px}
.gt th.clue{background:var(--clue-bg);color:var(--clue-ink)}
.gt th.clue small{color:var(--clue-ink)}
.gt td{padding:5px;border-bottom:1px solid var(--line);vertical-align:top;min-width:120px}
.gt tr:last-child td{border-bottom:0}
.gt td + td,.gt th + th{border-left:1px solid var(--line)}
.cell{width:100%;min-height:44px;border-radius:8px;padding:7px 9px;font-size:.88rem;line-height:1.3;text-align:left;display:flex;align-items:center;gap:6px}
.cell.given{background:var(--given);font-weight:600}
.cell.clue{background:var(--clue-bg);color:var(--clue-ink);border:1px solid var(--clue-line);font-weight:600}
.cell.empty{border:1.5px dashed var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.cell.empty:hover,.cell.empty.drop{border-color:var(--accent);color:var(--ink)}
.cell.sel{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink)}
.cell.locked{background:var(--lock);color:var(--muted);border:1px solid var(--line);cursor:not-allowed;font-size:.78rem}
.cell.locked svg{width:13px;height:13px;flex:none}
.cell.filled{background:var(--ok-bg);border:1px solid var(--ok);font-weight:600}
.cell.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.cell.err{animation:shake .32s;border-color:var(--bad)}
.bank{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:12px;display:grid;gap:8px;scroll-margin-bottom:16px}
.bank .bh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:.86rem}
.bank .bh b{font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow:auto}
.tile{font:600 .84rem var(--f-body);background:var(--sunk);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:grab;display:inline-flex;gap:6px;align-items:center;max-width:100%;text-align:left}
.tile:hover:not([disabled]){border-color:var(--accent)}
.tile .ct{font:500 .7rem var(--f-mono);color:var(--muted)}
.tile.out{opacity:.45;text-decoration:line-through;cursor:default}
.tile.dragging{opacity:.4}
.toast{font-size:.86rem;font-weight:600}
.toast:empty{display:none}
@media (max-width:560px){.tabs .long{display:none}}
.toast.bad{color:var(--bad)}
.toast.ok{color:var(--ok)}
.notes{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.notes li{border-left:3px solid var(--ok);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:.88rem}
.notes li b{font-weight:700}
.gdone{display:grid;gap:12px}
footer{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty-state{color:var(--muted);font-size:.9rem}
/* condensed label sizing (Barlow Condensed reads small) */
.mode-card .k,.optrow .lab,.stat span,.prompt-lab,.gcard .row{font-size:.82rem!important;font-weight:700!important;letter-spacing:.1em!important}
.tag{font-size:.8rem!important;font-weight:800!important}
.hy,.hybox b{font-size:.78rem!important;font-weight:800!important}
.kbd,.lecrow .pct,.chip .n,.tile .ct,.opt .key{font-size:.85rem!important;font-weight:600!important}
.gt th small{font-size:.76rem!important;font-weight:600!important}
.seq-done li::before{font-size:.95rem!important}
.btn,.seg button,.chip,.tabs button,.kind,.gt th{font-family:var(--f-mono)!important;letter-spacing:.06em;text-transform:uppercase}
.btn{font-size:.95rem!important;font-weight:700!important}
.btn.sm{font-size:.85rem!important}
.seg button{font-size:.88rem!important;font-weight:700!important}
.chip{font-size:.86rem!important;font-weight:700!important;text-transform:none;letter-spacing:.03em}
.tabs button{font-size:15px!important;letter-spacing:.08em}

<script>
const DATA = {"id": "ird14-16", "code": "IRD14–16", "prefix": "IRD", "title": "NSAIDs, Acetaminophen & Glucocorticoids", "lectures": [{"k": "14", "name": "NSAIDs I", "disc": "pharm"}, {"k": "15", "name": "NSAIDs II", "disc": "pharm"}, {"k": "16", "name": "Adrenal Steroids (Glucocorticoids)", "disc": "pharm"}], "los": {"14.1": "General properties and chemical classification of NSAIDs; approved indication groups", "14.2": "Anti-inflammatory, analgesic and antipyretic mechanisms of NSAIDs (COX-1 vs COX-2)", "14.3": "NSAID use in primary dysmenorrhea, fever (Reye syndrome) and patent ductus arteriosus", "14.4": "Prophylactic low-dose aspirin in unstable angina and after myocardial infarction", "14.5": "Adverse effects at therapeutic doses: cardiovascular, GI and COX-2 selective inhibitors", "14.6": "Contraindications and precautions: peri-operative NSAID use and GI protection", "15.5": "Adverse effects at therapeutic and toxic doses: NSAID hypersensitivity (aspirin-induced asthma)", "15.6": "Contraindications and precautions: asthma/hypersensitivity, pregnancy, ketorolac", "15.7": "Renal effects of NSAIDs", "15.8": "Drug–drug and drug–disease interactions of NSAIDs", "15.9": "General pharmacology of individual NSAIDs (salicylates, propionic/acetic acids, acetaminophen)", "15.10": "Relative therapeutic efficacy of NSAIDs vs aspirin (analgesic ceiling, half-life)", "15.11": "Signs, symptoms and treatment of aspirin vs acetaminophen overdose", "16.1": "HPA axis and regulation of plasma adrenocorticoid levels (CBG, albumin, metabolism)", "16.2": "Circadian rhythm of plasma cortisol and its therapeutic implications", "16.3": "Therapeutic indications for glucocorticoids in nonadrenal disorders", "16.4": "Anti-inflammatory and immunosuppressive mechanisms of glucocorticoids", "16.5": "Anti-inflammatory vs salt-retaining activity; structure, activation and inactivation", "16.6": "Relative duration of action of commonly used corticosteroids", "16.7": "Complications and side effects of corticosteroid therapy; contraindications", "16.8": "Strategies to minimize side effects of chronic corticosteroid therapy", "16.9": "Pharmacological management of adrenocortical hypo- and hyperfunction"}, "sets": [{"id": "s01", "lec": "14", "lo": "14.1", "kind": "term-def", "title": "NSAID chemical class → members", "left": "Chemical class", "right": "Drugs in the class", "pairs": [{"a": "Salicylates", "b": "Aspirin and diflunisal", "why": "Aspirin (acetylsalicylic acid) is deacetylated to salicylate; diflunisal is a difluorophenyl salicylic acid derivative that is NOT metabolized to salicylate.", "hy": true}, {"a": "Propionic acids", "b": "Ibuprofen, naproxen, ketoprofen, fenoprofen", "why": "The \"-profens\" plus naproxen: the OTC workhorses. Ibuprofen, naproxen and ketoprofen have higher analgesic ceilings than aspirin.", "hy": true}, {"a": "Acetic acids", "b": "Indomethacin, sulindac, ketorolac, diclofenac", "why": "Also etodolac, tolmetin and nabumetone (a prodrug of naphthylacetic acid). Indomethacin is an indole acetic acid; ketorolac a pyrrolo-acetic acid."}, {"a": "Anthranilic acids (fenamates)", "b": "Mefenamic acid", "why": "Fenamates are another carboxylic acid branch of the NSAID tree."}, {"a": "Oxicams (enolic acids)", "b": "Piroxicam", "why": "Oxicams are enolic rather than carboxylic acids; piroxicam has a long half-life and high GI-bleeding odds."}, {"a": "COX-2 selective inhibitors (coxibs)", "b": "Celecoxib; rofecoxib and valdecoxib withdrawn", "why": "Rofecoxib (2004) and valdecoxib (2005), ~300× COX-2 selective, were withdrawn for CV events; celecoxib (~30×) remains with a black box warning."}, {"a": "Para-aminophenol derivative", "b": "Acetaminophen", "why": "Acetaminophen is a weak, largely central COX inhibitor: analgesic and antipyretic, poor anti-inflammatory, no antiplatelet effect."}]}, {"id": "s02", "lec": "14", "lo": "14.2", "kind": "term-def", "title": "COX pharmacology concept → meaning", "left": "Concept", "right": "Meaning", "pairs": [{"a": "COX-1", "b": "Constitutive housekeeping enzyme in stomach, kidney and platelets", "why": "COX-1 maintains gastric mucosal defense, renal function and platelet TxA2. Its inhibition drives NSAID GI and bleeding toxicity.", "hy": true}, {"a": "COX-2", "b": "Inducible enzyme up-regulated by cytokines and endotoxin at inflamed sites", "why": "COX-2 is massively induced in macrophages and synoviocytes (and is basal in brain, kidney, uterus). Glucocorticoids reduce its expression.", "hy": true}, {"a": "Phospholipase A2", "b": "Frees arachidonic acid from membrane phospholipids", "why": "PLA2 is the upstream step for both COX and lipoxygenase products; glucocorticoids inhibit it via lipocortin-1, NSAIDs do not."}, {"a": "5-Lipoxygenase", "b": "Converts arachidonic acid to leukotrienes; not blocked by NSAIDs", "why": "With COX blocked, more arachidonic acid can flow down the 5-LO branch (the shunt behind aspirin-exacerbated respiratory disease)."}, {"a": "Analgesic ceiling", "b": "Dose above which more NSAID adds toxicity but no extra analgesia", "why": "Every NSAID has a ceiling, but ceilings differ. COX potency does not predict the ceiling; adding an opioid raises achievable analgesia.", "hy": true}, {"a": "Anti-inflammatory efficacy", "b": "Maximal effect that is equivalent to aspirin's for every NSAID", "why": "Potency (dose needed) differs among NSAIDs, but no NSAID exceeds aspirin's maximal anti-inflammatory efficacy."}, {"a": "PGE2-driven hyperalgesia", "b": "Prostaglandin lowering nociceptor threshold to bradykinin", "why": "PGs sensitize rather than directly fire nociceptors, so NSAIDs work best for mild inflammatory pain."}]}, {"id": "s03", "lec": "14", "lo": "14.3", "kind": "term-app", "title": "Clinical scenario → drug of choice", "left": "Scenario", "right": "Best choice", "pairs": [{"a": "Crampy pelvic pain with nausea in first 2 days of menses; normal pelvis", "b": "NSAID such as naproxen, started at onset of menses", "why": "Primary dysmenorrhea is PG-mediated (uterine contraction, ischemia, nociceptor sensitization). Acetaminophen and aspirin have minimal efficacy.", "hy": true}, {"a": "Fever in a 7-year-old recovering from varicella", "b": "Acetaminophen; never aspirin (Reye risk)", "why": "Aspirin during a viral illness (influenza, varicella) in children risks Reye syndrome: encephalopathy with microvesicular fatty liver.", "hy": true}, {"a": "Premature neonate with machine-like murmur and bounding pulses", "b": "Indomethacin to block PGE2 and close the ductus", "why": "PGE2 keeps the ductus open; indomethacin is the NSAID approved for PDA closure.", "hy": true}, {"a": "Newborn with ductal-dependent heart lesion awaiting surgery", "b": "Alprostadil (PGE1) infusion to keep the ductus open", "why": "The opposite goal of indomethacin: a PG analog maintains ductal patency until repair."}, {"a": "Discharge after NSTEMI, no contraindications", "b": "Low-dose aspirin 81 mg daily, long term", "why": "Aspirin is the only NSAID approved for prophylaxis in unstable angina and after MI (~50% fewer recurrent MIs)."}, {"a": "Moderate bone pain persisting despite maximal-dose ibuprofen", "b": "Add a weak opioid such as codeine", "why": "WHO ladder: at the NSAID ceiling more NSAID adds toxicity only; NSAID + opioid is additive and dose-sparing."}, {"a": "NPO after femur fixation; needs parenteral non-opioid analgesia", "b": "IM or IV ketorolac for a short course", "why": "IM ketorolac has efficacy comparable to morphine; it is analgesic-only and limited to short-term use (generally ≤5 days)."}]}, {"id": "s04", "lec": "14", "lo": "14.4", "kind": "cause-effect", "title": "Antiplatelet observation → explanation", "left": "Observation", "right": "Explanation", "pairs": [{"a": "Aspirin's antiplatelet effect lasts 8–10 days", "b": "Irreversible COX acetylation in anucleate platelets", "why": "Platelets cannot make new COX, so TxA2 synthesis is lost for the platelet's lifespan.", "hy": true}, {"a": "Endothelial prostacyclin recovers within hours of low-dose aspirin", "b": "Nucleated endothelial cells resynthesize COX", "why": "This TxA2 suppression with PGI2 sparing is the protective balance unique to low-dose aspirin.", "hy": true}, {"a": "Cardioprotection is lost at high aspirin doses", "b": "Endothelial prostacyclin is suppressed as well", "why": "Only the low dose range (60–325 mg/day recommended; 81 mg typical) is protective; high doses add GI and bleeding toxicity."}, {"a": "Ibuprofen need be stopped only ~1 day before surgery", "b": "Reversible inhibition gone after ~5 half-lives", "why": "Ibuprofen t½ 2–4 h; 5 half-lives clears ~97%. Aspirin must be stopped at least 7 days ahead (one platelet lifespan).", "hy": true}, {"a": "Acetaminophen does not prolong bleeding time", "b": "No meaningful platelet COX inhibition", "why": "That is why acetaminophen is the preferred non-opioid analgesic around surgery with bleeding risk."}, {"a": "Daily aspirin not started for primary prevention at age 66", "b": "Bleeding risk outweighs benefit at ≥60 years", "why": "The proven benefit is secondary prevention (post-MI, unstable angina). USPSTF (2022) advises against starting at ≥60 years."}]}, {"id": "s05", "lec": "14", "lo": "14.5", "kind": "cause-effect", "title": "Adverse effect → mechanism", "left": "Adverse effect", "right": "Mechanism", "pairs": [{"a": "Gastric ulcer during chronic naproxen use", "b": "Loss of COX-1 mucosal PGs plus topical acid injury", "why": "PGE2/PGI2 maintain mucus, bicarbonate and mucosal blood flow; the acidic drug also concentrates in gastric epithelium.", "hy": true}, {"a": "Prolonged bleeding time on ibuprofen; normal PT/PTT", "b": "Reversible fall in platelet thromboxane A2", "why": "Bleeding time tests the platelet plug; PT/PTT test the coagulation cascade and stay normal."}, {"a": "MI or stroke on rofecoxib", "b": "Platelet TxA2 spared while endothelial PGI2 falls", "why": "Highly selective COX-2 inhibition spares platelet COX-1 but removes COX-2-derived prostacyclin → prothrombotic imbalance.", "hy": true}, {"a": "Blood pressure rises in a patient on hydrochlorothiazide", "b": "Vasoconstriction and Na+ retention blunt the diuretic", "why": "Pharmacodynamic interaction: diuretics, β-blockers and ACE inhibitors partly rely on renal and vascular PGs."}, {"a": "Hyperkalemia in diabetic kidney disease", "b": "Less PG-stimulated renin → hypoaldosteronism", "why": "Macula densa COX-2 drives renin; NSAIDs cause hyporeninemic hypoaldosteronism plus ↓ distal flow."}, {"a": "Wheezing and rhinorrhea minutes after ibuprofen", "b": "Arachidonic acid shunted to cysteinyl leukotrienes", "why": "Pseudoallergic, non-IgE reaction; all COX inhibitors cross-react.", "hy": true}, {"a": "Vomiting, coma and fatty liver in a child after a viral illness", "b": "Idiosyncratic aspirin injury to liver and brain mitochondria", "why": "Reye syndrome is not dose-related salicylate toxicity; it follows ordinary doses during influenza or varicella."}]}, {"id": "s06", "lec": "14", "lo": "14.6", "kind": "drug-mech", "title": "GI-protection strategy → how it works", "left": "Strategy", "right": "How it works / evidence", "pairs": [{"a": "Proton pump inhibitor", "b": "Blocks parietal H+/K+-ATPase; most widely used adjunct", "why": "PPIs (and H2 antagonists) reduce acid; they are the standard co-therapy for high-risk chronic NSAID users.", "hy": true}, {"a": "H2 receptor antagonist", "b": "Blocks histamine-stimulated parietal acid secretion", "why": "Ranitidine and cimetidine lower acid but are less effective than PPIs for NSAID ulcer prevention."}, {"a": "Sucralfate", "b": "Forms a physical gel coat over ulcer bases", "why": "A local barrier, not an acid suppressant or PG replacement."}, {"a": "Misoprostol", "b": "PGE1 analog replacing the mucosal PGs that NSAIDs remove", "why": "Increases mucus and bicarbonate and reduces acid. Abortifacient (contraindicated in pregnancy); diarrhea is common.", "hy": true}, {"a": "Enteric-coated or buffered formulation", "b": "Alters the tablet itself so less drug irritates the mucosa", "why": "Formulation is one of three strategies, along with NSAID choice and adjuvant drugs."}, {"a": "Choosing ibuprofen over ketoprofen", "b": "Selects the NSAID with the lowest GI-bleeding odds", "why": "Ibuprofen's odds ratio for GI bleeding is lowest; ketoprofen, piroxicam and azapropazone are several- to >20-fold higher."}, {"a": "Prodrugs such as sulindac or nabumetone", "b": "Designed to be GI-sparing but not proven beneficial", "why": "Systemic COX inhibition still removes mucosal PGs, so avoiding topical exposure was not enough."}]}, {"id": "s07", "lec": "15", "lo": "15.5", "kind": "term-def", "title": "NSAID hypersensitivity term → fact", "left": "Term", "right": "Fact", "pairs": [{"a": "Samter triad (AERD)", "b": "Asthma + nasal polyps + NSAID sensitivity", "why": "Aspirin-exacerbated respiratory disease: bronchospasm, rhinorrhea and flushing after any COX inhibitor.", "hy": true}, {"a": "Shunt theory", "b": "COX block diverts arachidonate to 5-LO → excess cysteinyl leukotrienes", "why": "LTC4, LTD4 and LTE4 are potent bronchoconstrictors; asthmatics have high baseline lipoxygenase activity and lose bronchoprotective PGE2.", "hy": true}, {"a": "Pseudoallergic reaction", "b": "Mimics drug allergy with no IgE or other immune mechanism", "why": "It looks like allergy (bronchospasm, urticaria, angioedema) but results from pharmacologic COX inhibition."}, {"a": "Incidence in asthmatics", "b": "10–20%, versus 1–2% of the general population", "why": "Asthma (especially with nasal polyps) is the major risk factor."}, {"a": "Cross-reactivity", "b": "All COX-inhibiting NSAIDs, regardless of chemical class", "why": "Because the trigger is COX inhibition, switching from a salicylate to a propionic acid does not help.", "hy": true}, {"a": "Safe analgesic/antipyretic alternative", "b": "Acetaminophen, a weak and mostly central COX inhibitor", "why": "Acetaminophen does not shunt arachidonic acid enough to trigger the reaction."}, {"a": "Safe anti-inflammatory alternative", "b": "A glucocorticoid such as hydrocortisone", "why": "Steroids lower leukotrienes as well as PGs (lipocortin-1 inhibits PLA2), so they cannot trigger a shunt."}, {"a": "Time course", "b": "Onset within minutes to hours after ingestion", "why": "Rapid onset after a dose is typical of this pseudoallergic reaction."}]}, {"id": "s08", "lec": "15", "lo": "15.6", "kind": "cause-effect", "title": "NSAID caution → reason", "left": "Caution", "right": "Reason", "pairs": [{"a": "NSAIDs avoided in the third trimester", "b": "Early ductus closure, prolonged labor, delivery bleeding", "why": "Fetal PGs keep the ductus open and support fetal renal flow (oligohydramnios risk); PGs drive labor. No proven human teratogenicity.", "hy": true}, {"a": "Aspirin avoided for fever in children and teens", "b": "Risk of Reye syndrome", "why": "Exception: Kawasaki disease. Use acetaminophen or ibuprofen."}, {"a": "Whole NSAID class avoided after aspirin bronchospasm", "b": "The reaction is a COX class effect, so all cross-react", "why": "Use acetaminophen for pain/fever and a glucocorticoid if anti-inflammatory action is needed.", "hy": true}, {"a": "Ketorolac limited to short-term use", "b": "GI ulceration and renal toxicity with longer courses", "why": "Analgesic-only indication, generally ≤5 days; also not for obstetric analgesia or routine use with other NSAIDs.", "hy": true}, {"a": "NSAIDs avoided in CHF or cirrhosis with ascites", "b": "PG-dependent renal perfusion → AKI and fluid retention", "why": "Low effective circulating volume makes GFR depend on PGE2/PGI2 afferent dilation."}, {"a": "NSAIDs avoided after surgery with bleeding risk", "b": "Antiplatelet effect prolongs bleeding time", "why": "Acetaminophen (no antiplatelet effect) plus opioids if needed is preferred."}, {"a": "Misoprostol avoided in pregnancy", "b": "PGE1 analog stimulates uterine contraction", "why": "The GI-protective PG analog is an abortifacient."}]}, {"id": "s09", "lec": "15", "lo": "15.8", "kind": "cause-effect", "title": "Drug + NSAID → consequence", "left": "Co-administered drug", "right": "Consequence", "pairs": [{"a": "Lithium", "b": "↓ Renal clearance → tremor, confusion, ataxia", "why": "Lithium is handled like Na+; NSAIDs ↓ GFR and ↑ proximal Na+/Li+ reabsorption. Thiazides and ACE inhibitors do the same.", "hy": true}, {"a": "Warfarin", "b": "Albumin displacement plus antiplatelet and GI injury → bleeding", "why": "Anticoagulants appear on both the pharmacokinetic and pharmacodynamic interaction lists.", "hy": true}, {"a": "Sulfonylurea (oral hypoglycemic)", "b": "Displacement from albumin → hypoglycemia", "why": "The transient rise in free drug matters only for narrow-range drugs."}, {"a": "High-dose methotrexate", "b": "↓ Renal clearance plus displacement → marrow toxicity", "why": "Pharmacokinetic interaction: avoid the combination or adjust the dose."}, {"a": "Hydrochlorothiazide or metoprolol", "b": "Blunted antihypertensive effect; BP rises", "why": "Pharmacodynamic: loss of PG-mediated natriuresis and vasodilation."}, {"a": "Phenytoin", "b": "Transient rise in free anticonvulsant from displacement", "why": "After displacement, free drug rises briefly, then a new steady state forms at a LOWER total level (the lab value may mislead)."}, {"a": "ACE inhibitor in chronic kidney disease", "b": "Additive hyperkalemia and fall in GFR", "why": "Both blunt renin–aldosterone and glomerular perfusion support; monitor K+ and creatinine."}]}, {"id": "s10", "lec": "15", "lo": "15.9", "kind": "drug-mech", "title": "Individual agent → pharmacology", "left": "Drug", "right": "Pharmacology", "pairs": [{"a": "Aspirin", "b": "Deacetylated in ~20 min to salicylate, the main active species", "why": "The acetyl group gives the irreversible platelet effect; salicylate carries most analgesic/anti-inflammatory action.", "hy": true}, {"a": "Diflunisal", "b": "Salicylic acid derivative not metabolized to salicylate; reversible", "why": "Difluorophenyl derivative; t½ ~12 h, higher analgesic ceiling than aspirin."}, {"a": "Sulindac", "b": "Sulfoxide prodrug reduced to an active sulfide; sulfone inactive", "why": "Hepatic activation → slower onset; anti-inflammatory indication only."}, {"a": "Nabumetone", "b": "Prodrug converted to naphthylacetic acid", "why": "Another \"GI-sparing\" prodrug that has not proven beneficial."}, {"a": "Ketorolac", "b": "Water-soluble acetic acid given orally, IV or IM", "why": "IM efficacy ≈ morphine; oral efficacy ≈ ibuprofen; t½ 4–6 h; analgesic only."}, {"a": "Acetaminophen", "b": "Mostly glucuronidated/sulfated; minor CYP2E1 path makes NAPQI", "why": "Max 4 g/day; ~38% of US acute liver failure. Alcohol (CYP2E1 induction, low glutathione) raises risk.", "hy": true}, {"a": "Celecoxib", "b": "About 30-fold more potent at COX-2 than COX-1", "why": "Used for arthritis and menstrual pain; black box CV warning. Analgesic efficacy similar to other NSAIDs."}]}, {"id": "s11", "lec": "15", "lo": "15.10", "kind": "drug-mech", "title": "NSAID → analgesic profile vs aspirin", "left": "Drug", "right": "Ceiling and half-life vs aspirin", "pairs": [{"a": "Ibuprofen", "b": "Higher ceiling; short t½ (2–4 h); lowest GI-bleed risk", "why": "Propionic acid; a good first choice for acute mild-moderate pain.", "hy": true}, {"a": "Naproxen", "b": "Higher ceiling; t½ ~12 h; propionic acid", "why": "Twice-daily dosing; prolongs bleeding time throughout the dosing interval.", "hy": true}, {"a": "Ketoprofen", "b": "Higher ceiling; t½ ≈ aspirin; high GI-bleed risk", "why": "Propionic acid with a high GI-bleeding risk."}, {"a": "Diflunisal", "b": "Higher ceiling; t½ ~12 h; salicylate derivative", "why": "Higher ceiling + long half-life suits chronic pain (twice daily)."}, {"a": "Indomethacin", "b": "Ceiling no higher than aspirin despite very high COX potency", "why": "Proof that COX potency does not predict the analgesic ceiling; anti-inflammatory indication only."}, {"a": "Sulindac", "b": "Ceiling equal to aspirin; slow onset from hepatic activation", "why": "Anti-inflammatory indication only, so a poor choice for chronic pain."}, {"a": "Acetaminophen", "b": "Ceiling similar to aspirin but weak anti-inflammatory action", "why": "Equivalent pain relief at 600 mg vs aspirin 600 mg; good antipyretic, no antiplatelet effect."}]}, {"id": "s12", "lec": "15", "lo": "15.11", "kind": "cause-effect", "title": "Overdose finding → mechanism", "left": "Finding", "right": "Mechanism", "pairs": [{"a": "Hyperventilation early in salicylate poisoning", "b": "Direct stimulation of the medullary respiratory center", "why": "This produces the early respiratory alkalosis; tinnitus and vomiting are other early CNS effects.", "hy": true}, {"a": "Fever in salicylate poisoning", "b": "Uncoupled oxidative phosphorylation → ↑ heat and CO2", "why": "\"Paradoxical\" hyperthermia: ATP falls while heat production rises."}, {"a": "Anion-gap acidosis in salicylate poisoning", "b": "Ketones and lactate from ↑ fat and carbohydrate metabolism", "why": "Mixed picture: respiratory alkalosis + AG metabolic acidosis (pH may be near normal).", "hy": true}, {"a": "Bicarbonate speeds salicylate excretion", "b": "Ion trapping of ionized salicylate in alkaline urine", "why": "Only un-ionized HS is reabsorbed. Most other NSAIDs are hepatically cleared, so alkalinization does not help them.", "hy": true}, {"a": "Salicylate t½ climbs to 20–30 h in overdose", "b": "Saturated hepatic conjugation (zero-order kinetics)", "why": "Glycine and glucuronide conjugation saturate; renal excretion of free salicylate becomes the major route."}, {"a": "Centrilobular necrosis after acetaminophen overdose", "b": "NAPQI binds hepatocyte proteins once glutathione is gone", "why": "Conjugation saturates → more CYP2E1/1A2 oxidation to NAPQI → glutathione depletion → zone 3 necrosis.", "hy": true}, {"a": "N-acetylcysteine prevents liver injury", "b": "Replenishes glutathione as a cysteine donor", "why": "Give as soon as toxicity is possible (ideally within 8–10 h), even if the patient looks well."}, {"a": "Chronic alcohol use raises acetaminophen risk", "b": "CYP2E1 induction with low glutathione stores", "why": "Fasting and malnutrition also lower glutathione."}]}, {"id": "s13", "lec": "16", "lo": "16.1", "kind": "term-def", "title": "Cortisol transport & metabolism → fact", "left": "Term", "right": "Fact", "pairs": [{"a": "Corticosteroid-binding globulin (CBG)", "b": "High-affinity, low-capacity carrier binding >70% of cortisol", "why": "CBG (transcortin) is a reservoir that buffers free cortisol and prolongs its half-life.", "hy": true}, {"a": "Albumin", "b": "Low-affinity, high-capacity carrier for the rest of bound cortisol", "why": "About 90% of cortisol is protein bound: mostly CBG, the remainder albumin."}, {"a": "Free cortisol (~10%)", "b": "Biologically active fraction held constant by HPA feedback", "why": "Changes in CBG alter total cortisol but feedback keeps the free fraction normal."}, {"a": "Estrogen therapy or pregnancy", "b": "↑ CBG: total cortisol rises, free cortisol unchanged", "why": "Explains a high total cortisol without Cushing features in a woman on an oral contraceptive.", "hy": true}, {"a": "Sepsis or severe burns", "b": "↓ CBG concentration, so total cortisol falls", "why": "CBG is regulated dynamically in illness."}, {"a": "Fever", "b": "↓ CBG affinity, unloading cortisol to inflamed tissue", "why": "Raising temperature releases more free hormone where it is needed."}, {"a": "Hepatic metabolism", "b": "Reduction, then glucuronide/sulfate conjugates excreted in urine", "why": "The liver is the main site of cortisol inactivation."}]}, {"id": "s14", "lec": "16", "lo": "16.2", "kind": "term-app", "title": "Timing question → circadian answer", "left": "Situation", "right": "Timing principle", "pairs": [{"a": "Peak of normal plasma cortisol", "b": "Early morning near waking (~6–8 AM)", "why": "Levels rise in the second half of the night and fall through the day (~2–20 µg/dL).", "hy": true}, {"a": "Nadir of normal plasma cortisol", "b": "Around midnight, early in sleep", "why": "The trough is why late-night salivary cortisol is a Cushing screening test."}, {"a": "Hydrocortisone replacement in Addison disease", "b": "Larger dose on waking, smaller dose in late afternoon", "why": "Mimics the circadian pattern; bedtime doses cause insomnia and unphysiologic night levels.", "hy": true}, {"a": "6-day prednisone course for poison ivy", "b": "One dose each morning", "why": "Morning dosing coincides with the peak, interferes least with the HPA axis and causes less insomnia."}, {"a": "Serial plasma cortisol measurements", "b": "Drawn at the same clock time each day", "why": "A value normal at 8 AM may look low at 4 PM; constant timing makes results comparable."}, {"a": "Dose given at bedtime", "b": "Suppresses the early-morning ACTH surge; insomnia", "why": "Night dosing hits the feedback-sensitive time of the HPA axis."}]}, {"id": "s15", "lec": "16", "lo": "16.3", "kind": "term-app", "title": "Indication → preferred glucocorticoid use", "left": "Indication", "right": "Preferred agent / route", "pairs": [{"a": "Persistent asthma, maintenance therapy", "b": "Inhaled corticosteroid (local delivery)", "why": "Local delivery limits systemic exposure and side effects.", "hy": true}, {"a": "Severe ulcerative colitis flare needing admission", "b": "IV methylprednisolone to induce remission", "why": "Systemic steroids induce remission in IBD, then are tapered; they are not maintenance drugs."}, {"a": "Vasogenic cerebral edema from a brain metastasis", "b": "Dexamethasone (no salt retention, long acting)", "why": "Dexamethasone: anti-inflammatory 30, salt-retaining 0, duration 36–72 h.", "hy": true}, {"a": "Acute lymphoblastic leukemia induction", "b": "Prednisone for lymphoid apoptosis", "why": "High-dose GCs are lymphocytolytic: used in ALL, CLL, lymphomas (CHOP) and myeloma.", "hy": true}, {"a": "Single osteoarthritic knee flare", "b": "Intra-articular triamcinolone injection", "why": "Triamcinolone is intermediate-acting and given intra-articularly, intralesionally and topically."}, {"a": "Severe widespread poison ivy dermatitis", "b": "Short systemic prednisone course, taken each morning", "why": "A single dose or a few days of therapy carries little risk."}, {"a": "Mild atopic dermatitis on the arm", "b": "Topical hydrocortisone (already 11β-OH active)", "why": "Skin cannot activate 11-keto prodrugs, so cortisone and prednisone have no topical activity."}]}, {"id": "s16", "lec": "16", "lo": "16.4", "kind": "drug-mech", "title": "GC-regulated molecule → role", "left": "Molecule", "right": "Role in glucocorticoid action", "pairs": [{"a": "Lipocortin-1 (annexin A1) — increased", "b": "Inhibits PLA2, lowering both PGs and leukotrienes", "why": "This upstream block is why steroids reduce leukotrienes and NSAIDs do not.", "hy": true}, {"a": "IκBα — increased", "b": "Keeps NF-κB out of the nucleus", "why": "NF-κB drives cytokine, chemokine, adhesion molecule, iNOS and COX-2 genes; the GR also directly blocks NF-κB and AP-1."}, {"a": "Heat shock protein 90", "b": "Holds unliganded GR in the cytoplasm; released on binding", "why": "Ligand binding releases hsp90 → GR dimerizes → nuclear translocation."}, {"a": "Glucocorticoid response element", "b": "DNA site where the GR dimer alters gene expression", "why": "Positive GREs increase anti-inflammatory genes; negative GREs decrease inflammatory genes."}, {"a": "COX-2 — decreased", "b": "Less inducible prostaglandin synthesis at inflamed sites", "why": "GCs reduce COX-2 expression; NSAIDs inhibit its activity."}, {"a": "iNOS — decreased", "b": "Less nitric oxide production by activated cells", "why": "One of many NF-κB-driven inflammatory genes that steroids turn down."}, {"a": "β2-Adrenoceptor — increased", "b": "More airway β2 receptors, aiding β2-agonist response", "why": "Explains steroid–β2-agonist synergy in asthma."}, {"a": "IL-1 receptor antagonist — increased", "b": "Competitively blocks IL-1 signaling", "why": "Along with the IL-1R2 decoy receptor, it dampens IL-1-driven inflammation."}]}, {"id": "s17", "lec": "16", "lo": "16.5", "kind": "structure-function", "title": "Steroid modification → effect", "left": "Structural feature", "right": "Effect (example)", "pairs": [{"a": "1,2 double bond", "b": "↑ GC activity: cortisol → prednisolone", "why": "Prednisone and prednisolone carry the 1,2 double bond (anti-inflammatory 4–5, salt-retaining 0.3).", "hy": true}, {"a": "6α-Methyl group", "b": "↑ GC activity and longer half-life: methylprednisolone", "why": "Substitutions change GC potency, MC potency and half-life."}, {"a": "9α-Fluorine", "b": "↑ Both GC and MC activity: fludrocortisone", "why": "Fludrocortisone: anti-inflammatory 10, salt-retaining 250 → used as the mineralocorticoid in replacement.", "hy": true}, {"a": "16-Methyl in a 9α-fluoro compound", "b": "Removes MC activity: dexamethasone", "why": "Dexamethasone keeps the fluorine's GC boost but loses salt retention.", "hy": true}, {"a": "11-Keto group", "b": "Inactive prodrug needing hepatic 11β-HSD1: prednisone", "why": "Cortisone and prednisone must be reduced to 11β-OH forms in the liver; no topical activity."}, {"a": "11β-Hydroxyl group", "b": "Required for GR activity; needed for topical use", "why": "Hydrocortisone, prednisolone and dexamethasone are already active and work topically."}]}, {"id": "s18", "lec": "16", "lo": "16.7", "kind": "cause-effect", "title": "Chronic GC effect → mechanism", "left": "Effect", "right": "Mechanism", "pairs": [{"a": "Proximal myopathy, thin skin, striae", "b": "Proteolysis and ↓ protein synthesis in muscle and skin", "why": "Proteolysis ↑ and synthesis ↓; amino acids flow to the liver.", "hy": true}, {"a": "Fasting hyperglycemia", "b": "↑ Hepatic gluconeogenesis and ↓ peripheral glucose use", "why": "Diabetes is a relative contraindication to steroid therapy."}, {"a": "Central obesity despite acute lipolysis", "b": "Hyperinsulinemia drives central fat deposition", "why": "Cushingoid habitus: moon face, buffalo hump, truncal fat."}, {"a": "Hypertension on dexamethasone", "b": "↑ Vascular α1 sensitivity (a non-MR effect)", "why": "Permissive effect on catecholamines and angiotensin; HTN is a contraindication even for non-mineralocorticoids.", "hy": true}, {"a": "Hypokalemia and edema on high-dose hydrocortisone", "b": "Renal 11β-HSD2 saturated → cortisol activates the MR", "why": "Cortisol binds the MR as avidly as aldosterone; 11β-HSD2 normally inactivates it.", "hy": true}, {"a": "Adrenal crisis after abrupt withdrawal", "b": "Suppressed CRH/ACTH with an atrophied adrenal", "why": "Taper chronic therapy; HPA recovery can take ~9–12 months."}, {"a": "Neutrophilia with lymphopenia and eosinopenia", "b": "Neutrophil demargination; lymphocyte apoptosis", "why": "Classic steroid blood count; macrophages are the most potently inhibited cells (~3× more GRs than lymphocytes)."}, {"a": "Perforated diverticulitis with minimal tenderness", "b": "Suppressed fever and inflammatory signs mask disease", "why": "Monitor for infection, including opportunistic organisms (Pneumocystis, TB reactivation, fungi)."}]}], "seqs": [{"id": "q01", "lec": "14", "lo": "14.2", "title": "Fever and its reversal", "prompt": "Put the events of fever generation in order (first → last).", "steps": ["Exogenous pyrogen (e.g., endotoxin) reaches the host", "Macrophages release IL-1, IL-6 and TNF-α", "Cytokines induce COX-2 and PGE2 in the hypothalamus", "The hypothalamic set point is raised", "Vasoconstriction and shivering raise core temperature"], "why": "NSAIDs act at the COX-2/PGE2 step; the set point falls and heat is lost by vasodilation and sweating. Without fever there is no excess PGE2, so normal temperature is unaffected.", "hy": true}, {"id": "q02", "lec": "14", "lo": "14.3", "title": "Primary dysmenorrhea", "prompt": "Put the steps by which prostaglandins cause primary dysmenorrhea in order (first → last).", "steps": ["Endometrial cell breakdown at menses", "Release of arachidonic acid", "Abnormally elevated prostaglandin synthesis", "Uterine contraction, ischemia and nociceptor sensitization", "Systemic spill causes nausea, diarrhea and headache"], "why": "PG levels in menstrual fluid track symptom severity; NSAIDs started at the onset of menses lower both PGs and intrauterine pressure."}, {"id": "q03", "lec": "15", "lo": "15.7", "title": "NSAID-induced prerenal AKI", "prompt": "Put the chain of events leading to NSAID-induced AKI in a volume-depleted patient in order (first → last).", "steps": ["Volume depletion raises angiotensin II and norepinephrine", "The kidney relies on PGE2/PGI2 to dilate the afferent arteriole", "The NSAID blocks renal COX", "Unopposed afferent constriction lowers renal blood flow", "GFR falls → prerenal AKI with Na+ and water retention"], "why": "Risk groups share PG-dependent perfusion: CHF, cirrhosis with ascites, CKD, nephrotic syndrome, SLE, diuretics, elderly. Treatment: stop the NSAID.", "hy": true}, {"id": "q04", "lec": "15", "lo": "15.9", "title": "Aspirin metabolism", "prompt": "Put the steps of aspirin metabolism and elimination at low doses in order (first → last).", "steps": ["Acetylsalicylic acid absorbed (t½ ≈ 20 min)", "Rapid deacetylation by esterases (gut wall, plasma, liver)", "Salicylate ion circulates (t½ 3–4 h)", "Hepatic conjugation with glycine or glucuronide", "Renal excretion of conjugates (~10% as free salicylate)"], "why": "At low doses conjugation is first-order. With higher doses it saturates (zero-order), t½ rises to ~12 h (anti-inflammatory) and 20–30 h (poisoning), and renal excretion of free salicylate becomes dominant."}, {"id": "q05", "lec": "15", "lo": "15.11", "title": "Acetaminophen hepatotoxicity", "prompt": "Put the steps of acetaminophen overdose hepatotoxicity in order (first → last).", "steps": ["Glucuronide and sulfate conjugation saturate", "More drug is oxidized by CYP2E1/CYP1A2", "NAPQI accumulates", "Hepatic glutathione is depleted", "NAPQI binds hepatocyte protein sulfhydryls", "Centrilobular (zone 3) hepatic necrosis"], "why": "Clinically: minor early complaints, few signs for 2–3 days, then rising transaminases and necrosis. N-acetylcysteine restores glutathione; treat early even if the patient looks well.", "hy": true}, {"id": "q06", "lec": "16", "lo": "16.1", "title": "HPA axis", "prompt": "Put the steps of the hypothalamic–pituitary–adrenal axis in order (first → last).", "steps": ["Hypothalamus releases CRH", "Anterior pituitary secretes ACTH", "Zona fasciculata releases cortisol", "Most cortisol circulates bound to CBG and albumin", "Free cortisol feeds back to inhibit CRH and ACTH"], "why": "Exogenous glucocorticoids exert the same negative feedback → suppressed CRH/ACTH → adrenal atrophy with chronic use.", "hy": true}, {"id": "q07", "lec": "16", "lo": "16.4", "title": "Glucocorticoid receptor signaling", "prompt": "Put the steps by which a glucocorticoid changes gene expression in order (first → last).", "steps": ["Free glucocorticoid diffuses across the cell membrane", "It binds the cytoplasmic GR, releasing hsp90", "The receptor complex dimerizes and enters the nucleus", "It binds glucocorticoid response elements", "Anti-inflammatory genes rise; NF-κB-driven genes fall"], "why": "Effects require new protein synthesis, so onset takes hours. Induced: lipocortin-1, IκBα, β2-receptors, IL-1Ra. Repressed: cytokines, chemokines, iNOS, COX-2, adhesion molecules."}, {"id": "q08", "lec": "16", "lo": "16.8", "title": "HPA suppression and recovery", "prompt": "Put the course of HPA suppression and recovery after long-term glucocorticoid therapy in order (first → last).", "steps": ["Exogenous steroid suppresses CRH and ACTH", "The adrenal cortex atrophies", "Steroid is tapered and stopped", "ACTH recovers first, overshooting at ~6–10 months", "Cortisol reaches normal at ~9 months; axis normal by ~12 months"], "why": "This is why chronic therapy is tapered and why stress-dose coverage may be needed for months after stopping."}], "grids": [{"id": "g01", "lec": "14", "lo": "14.1", "title": "NSAID class chart", "blurb": "Hard: read the key fact, name the drug, then fill its chemical class, COX selectivity and indication group.", "cols": [{"h": "Key fact"}, {"h": "Drug", "dep": 0}, {"h": "Chemical class", "dep": 1}, {"h": "COX inhibition", "dep": 1}, {"h": "Approved indication group", "dep": 1}], "rows": [["Only NSAID approved after MI", "Aspirin", "Salicylate", "Nonselective, irreversible", "Analgesic + anti-inflammatory"], ["Lowest GI-bleeding odds; t½ 2–4 h", "Ibuprofen", "Propionic acid", "Nonselective, reversible", "Analgesic + anti-inflammatory"], ["t½ ~12 h; bleeding time prolonged", "Naproxen", "Propionic acid", "Nonselective, reversible", "Analgesic + anti-inflammatory"], ["Closes a PDA; acute gout", "Indomethacin", "Acetic acid", "Nonselective, reversible", "Anti-inflammatory only"], ["IM efficacy ≈ morphine", "Ketorolac", "Acetic acid", "Nonselective, reversible", "Analgesic only"], ["Sulfoxide prodrug → sulfide", "Sulindac", "Acetic acid", "Nonselective, reversible", "Anti-inflammatory only"], ["Black box CV warning", "Celecoxib", "Coxib", "COX-2 selective (~30×)", "Anti-inflammatory only"], ["Max 4 g/day; NAPQI", "Acetaminophen", "Para-aminophenol", "Weak, mostly central", "Analgesic only"]], "easyGiven": [1], "hardGiven": [0], "decoys": {"1": ["Piroxicam", "Mefenamic acid", "Ketoprofen"], "2": ["Oxicam", "Anthranilic acid", "Enolic acid"], "3": ["COX-1 selective", "5-Lipoxygenase inhibitor", "PLA2 inhibitor"], "4": ["Antiplatelet only", "Antipyretic only"]}, "notes": ["Irreversible acetylation of platelet COX-1 → antiplatelet effect for the platelet's 8–10 day life.", "Short half-life and lowest GI-bleeding odds make ibuprofen the standard OTC choice.", "Naproxen's ~12 h half-life allows twice-daily dosing; it prolongs bleeding time throughout dosing.", "Very potent COX inhibitor but ceiling ≈ aspirin; also relatively high GI and CNS (headache) toxicity.", "Analgesic only and short term (≤5 days) because of GI, renal and bleeding risk.", "Hepatic activation → slow onset; the \"GI-sparing\" prodrug design has not proven beneficial.", "~30× COX-2 selective (rofecoxib/valdecoxib ~300×, withdrawn); similar analgesia, significant CV risk.", "Weak peripheral COX inhibition, <20% protein bound and no accumulation at inflamed sites → poor anti-inflammatory."], "hy": "Indication groups: analgesic only = acetaminophen, ketorolac; anti-inflammatory only = indomethacin, sulindac, celecoxib; both = aspirin, ibuprofen, naproxen, ketoprofen, diflunisal."}, {"id": "g02", "lec": "14", "lo": "14.2", "title": "Eicosanoid source → action chart", "blurb": "Hard: start from the action, name the eicosanoid, then place its enzyme source and main site.", "cols": [{"h": "Eicosanoid", "dep": 3}, {"h": "Enzyme source", "dep": 0}, {"h": "Main site", "dep": 0}, {"h": "Key action"}], "rows": [["Thromboxane A2", "COX-1", "Platelets", "Aggregation and vasoconstriction"], ["Prostacyclin (PGI2)", "COX-1 and COX-2", "Vascular endothelium", "Vasodilation; inhibits aggregation"], ["Gastric PGE2", "COX-1", "Gastric mucosa", "↑ Mucus, bicarbonate and blood flow"], ["Hypothalamic PGE2", "COX-2 (pyrogen-induced)", "Hypothalamus", "Raises the temperature set point"], ["Renal PGE2/PGI2", "COX-1 and COX-2", "Afferent arteriole", "Maintains GFR in low perfusion"], ["Fetal PGE2", "COX-1 and COX-2", "Ductus arteriosus", "Keeps the ductus open"], ["LTC4, LTD4, LTE4", "5-Lipoxygenase", "Airway mast cells, eosinophils", "Bronchoconstriction, ↑ permeability"], ["Leukotriene B4", "5-Lipoxygenase", "Neutrophils, macrophages", "Neutrophil chemotaxis"]], "easyGiven": [0], "hardGiven": [3], "decoys": {"0": ["PGF2α", "Lipoxin A4", "12-HETE"], "1": ["Phospholipase C", "12-Lipoxygenase", "Cytochrome P450"], "2": ["Collecting duct", "Bronchial smooth muscle", "Synovium"]}, "notes": ["Platelet TxA2 is purely COX-1; aspirin blocks it irreversibly.", "Endothelial PGI2 is lost with COX-2 inhibitors while TxA2 is spared → thrombosis.", "Loss of COX-1-derived gastric PGs is the core of NSAID ulcer disease; misoprostol replaces them.", "NSAIDs reset a raised set point only; they do not lower normal temperature.", "Afferent dilation counteracts Ang II and NE; NSAIDs → prerenal AKI in CHF, cirrhosis, volume depletion.", "Indomethacin closes a PDA in preemies; NSAIDs in late pregnancy close the fetal ductus too early.", "Not blocked by NSAIDs; COX blockade may shunt arachidonate here → AERD.", "Standard eicosanoid fact: LTB4 recruits neutrophils; steroids lower leukotrienes via PLA2 inhibition."], "hy": "TxA2 (platelet COX-1) vs PGI2 (endothelium) is the key balance: low-dose aspirin tilts toward PGI2 (protective), selective COX-2 inhibitors tilt toward TxA2 (thrombosis)."}, {"id": "g03", "lec": "15", "lo": "15.7", "title": "NSAID renal syndromes", "blurb": "Hard: read the clinical clue, name the renal effect, then supply its mechanism.", "cols": [{"h": "Clinical clue"}, {"h": "Renal effect", "dep": 0}, {"h": "Mechanism", "dep": 1}], "rows": [["CHF on furosemide; creatinine 1.1 → 2.4", "Prerenal AKI", "Loss of PG afferent dilation"], ["Diabetic CKD; K+ 6.1 on ibuprofen", "Hyperkalemia", "↓ Renin → ↓ aldosterone"], ["New ankle edema, 3 kg weight gain", "Na+ and water retention", "Loss of PG natriuresis"], ["Fenoprofen; WBC casts, heavy proteinuria", "Interstitial nephritis + nephrotic", "Lymphocyte activation, podocyte injury"], ["Years of aspirin–phenacetin; hematuria", "Papillary necrosis", "Chronic analgesic medullary injury"], ["Lithium on naproxen; tremor, ataxia", "Lithium accumulation", "↓ GFR, ↑ proximal Li+ reabsorption"]], "easyGiven": [1], "hardGiven": [0], "decoys": {"1": ["Renal tubular acidosis type 1", "Nephrogenic diabetes insipidus", "Hypokalemia"], "2": ["Direct glomerular immune-complex deposition", "Efferent arteriole dilation", "↑ Aldosterone secretion"]}, "notes": ["In a perfusion-dependent kidney, PGE2/PGI2 hold the afferent arteriole open against Ang II and NE.", "Macula densa COX-2 stimulates renin; NSAIDs cause hyporeninemic hypoaldosteronism.", "Collecting-duct and medullary PGs promote natriuresis; their loss → edema, weight gain, ↑BP.", "Rare syndrome classically with fenoprofen: sterile pyuria, WBC casts plus heavy proteinuria; stop the NSAID.", "Linked to chronic analgesic abuse, especially combination products.", "Lithium is handled like Na+; thiazides and ACE inhibitors raise levels the same way."], "hy": "NSAID renal toxicity mostly appears when renal perfusion is already poor (CHF, cirrhosis, CKD, diuretics, elderly): prerenal AKI, hyperkalemia, fluid retention."}, {"id": "g04", "lec": "15", "lo": "15.11", "title": "Aspirin vs acetaminophen overdose", "blurb": "Hard: use the salicylate column to name each feature, then fill the acetaminophen counterpart.", "cols": [{"h": "Feature", "dep": 1}, {"h": "Salicylate (aspirin)"}, {"h": "Acetaminophen", "dep": 0}], "rows": [["Early symptoms", "Tinnitus, vomiting, hyperventilation", "Mild nausea, malaise only"], ["Toxic mechanism", "Uncoupled oxidative phosphorylation", "NAPQI after glutathione depletion"], ["Acid–base picture", "Resp alkalosis + AG metabolic acidosis", "Usually normal early"], ["Main organ injured", "CNS, metabolism (fever, seizures)", "Liver: centrilobular necrosis"], ["Overdose kinetics", "Zero-order; t½ 20–30 h", "Conjugation saturates → CYP2E1"], ["Specific treatment", "IV bicarbonate; dialysis if severe", "N-acetylcysteine"], ["Time course", "Signs within hours", "Few signs for 2–3 days"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Antiplatelet duration", "Route of administration"], "2": ["Flumazenil", "Respiratory alkalosis", "Methemoglobinemia"]}, "notes": ["Salicylate stimulates the medullary respiratory center; acetaminophen overdose looks deceptively benign.", "Uncoupling → ↓ATP, ↑CO2 and heat; NAPQI binds hepatocyte protein sulfhydryls.", "A near-normal pH with very low PaCO2 and HCO3- signals the mixed salicylate disorder.", "Salicylism progresses to convulsions, CV collapse and coma; acetaminophen to hepatic failure.", "Saturated hepatic conjugation underlies both: salicylate t½ climbs; acetaminophen spills into the NAPQI path.", "Alkaline urine traps ionized salicylate; NAC is a cysteine donor that restores glutathione.", "Delay before liver injury is why every suspected acetaminophen overdose needs a timed level and early NAC."], "hy": "Salicylate: tinnitus + mixed resp alkalosis/AG acidosis + hyperthermia → bicarbonate (ion trapping). Acetaminophen: zone 3 necrosis via NAPQI → N-acetylcysteine."}, {"id": "g05", "lec": "16", "lo": "16.6", "title": "Corticosteroid potency & duration chart", "blurb": "Hard: read the clinical clue, name the steroid, then fill anti-inflammatory potency, salt retention and duration.", "cols": [{"h": "Clinical clue"}, {"h": "Steroid", "dep": 0}, {"h": "Anti-inflammatory (cortisol = 1)", "dep": 1}, {"h": "Salt-retaining", "dep": 1}, {"h": "Duration", "dep": 1}], "rows": [["Physiologic replacement drug of choice", "Hydrocortisone", "1", "1", "Short (8–12 h)"], ["11-Keto prodrug of cortisol itself", "Cortisone", "0.8", "0.8", "Short (8–12 h)"], ["Oral prodrug of prednisolone", "Prednisone", "4", "0.3", "Short (8–12 h)"], ["Preferred in decompensated cirrhosis", "Prednisolone", "5", "0.3", "Short (8–12 h)"], ["Intra-articular injection", "Triamcinolone", "5", "0", "Intermediate (12–36 h)"], ["Cerebral edema; suppression test", "Dexamethasone", "30", "0", "Long (36–72 h)"], ["Mineralocorticoid in Addison disease", "Fludrocortisone", "10", "250", "Short (8–12 h)"]], "easyGiven": [1], "hardGiven": [0], "decoys": {"1": ["Aldosterone", "Betamethasone"], "2": ["100", "0.1"], "3": ["50", "10"], "4": ["Ultra-long (>1 week)"]}, "notes": ["Endogenous cortisol: equal anti-inflammatory and salt-retaining activity; given morning and late afternoon.", "Inactive until hepatic 11β-HSD1 reduces it; no topical activity.", "1,2 double bond ↑ GC activity; 11-keto prodrug like cortisone.", "Active 11β-OH form; given when hepatic activation is unreliable. Board tables often list it as intermediate.", "Used orally, intra-articularly, intralesionally and topically; no salt retention.", "9α-F + 16α-methyl: GC 30, MC 0; no CBG binding and slow CYP3A4 clearance → 36–72 h.", "9α-fluorocortisol: the 9α-F boosts MC activity most; paired with hydrocortisone in primary AI."], "hy": "Dexamethasone = most potent, longest acting, no salt retention. Fludrocortisone = mineralocorticoid replacement. For steroids (unlike NSAIDs) anti-inflammatory efficacy tracks GR potency."}, {"id": "g06", "lec": "16", "lo": "16.8", "title": "Minimizing steroid side effects", "blurb": "Hard: from the clinical example, name the strategy, then explain why it works.", "cols": [{"h": "Clinical example"}, {"h": "Strategy", "dep": 0}, {"h": "Rationale", "dep": 1}], "rows": [["Asthma controlled with inhaled budesonide", "Local delivery", "Little systemic exposure"], ["RA kept at prednisone 5 mg, not 20 mg", "Lowest effective dose", "Toxicity is dose-related"], ["Prednisone 40 mg every other day", "Alternate-day therapy", "HPA axis recovers on off days"], ["Prednisone taken at 7 AM", "Morning dosing", "Coincides with the natural peak"], ["Dose cut slowly over months after 1 year", "Gradual taper", "Allows atrophied adrenal to recover"], ["IV hydrocortisone at hip replacement", "Stress dosing", "Suppressed adrenal can't surge"], ["TB screening before chronic therapy", "Monitor for infection", "Steroids mask infection signs"]], "easyGiven": [1], "hardGiven": [0], "decoys": {"1": ["Bedtime dosing", "Abrupt cessation", "Add fludrocortisone"], "2": ["Raises CBG binding", "Blocks 11β-HSD2"]}, "notes": ["Inhaled, nasal and intra-articular routes treat the target organ with little systemic steroid.", "Serious toxicity comes from chronic doses above replacement; use the le <script>

/* ---------- RAPID FIRE: play ---------- */
let RF=null, timerId=null;
function stopTimer(){if(timerId){cancelAnimationFrame(timerId);timerId=null;}}
function startRF(){
  let p=shuffle(pool());
  // interleave so the same set doesn't come back to back
  const out=[];while(p.length){let i=p.findIndex(x=>!out.length||sid(x)!==sid(out[out.length-1]));if(i<0)i=0;out.push(p.splice(i,1)[0]);}
  const n=F.len==="all"?out.length:Math.min(out.length,+F.len);
  RF={q:out.slice(0,n).map(it=>({it,retry:false})),i:0,score:0,streak:0,best:0,first:0,firstOk:0,misses:[],answered:false};
  go("rfplay");
}
const sid=it=>it.t==="pair"?it.set.id:it.q.id;
function topBar(){
  const tot=RF.q.length;
  return `<div class="rf-top">
    <div class="statrow">
      <div class="stat"><b>${Math.min(RF.i+1,tot)}/${tot}</b><span>Card</span></div>

}
function renderQ(){
  if(RF.i>=RF.q.length){go("rfend");return;}
  const cur=RF.q[RF.i]; RF.answered=false;
  if(cur.it.t==="seq")return renderSeq(cur);
  const it=cur.it,s=it.set,p=it.p;
  if(cur.rev===undefined)cur.rev=F.dir==="mixed"&&Math.random()<.3;
  if(!cur.opts){
    const others=shuffle(s.pairs.filter((_,j)=>j!==it.i)).slice(0,3);
    cur.opts=shuffle([p,...others]);
  }
  const K=KIND[s.kind]||KIND["term-def"];
  const promptLab=cur.rev?s.right:s.left, ansLab=cur.rev?s.left:s.right;
  $("#app").innerHTML=`${topBar()}
  <section class="qcard panel">
    <div class="qhead"><span class="kind" style="--kc:var(${K.c})">${cur.rev?esc(K.l.split(" → ").reverse().join(" → ")):K.l}</span>${lecTag(it.lec)}<span class="qset">${esc(s.title)}</span>${cur.retry?'<span class="hy" style="background:var(--once-bg);border-color:var(--once);color:var(--ink)">Retry</span>':""}</div>
    ${F.timer!=="off"?'<div class="timer" aria-hidden="true"><i id="tbar"></i></div>':""}
    <div><div class="prompt-lab">${esc(promptLab)}</div><p class="prompt">${esc(cur.rev?p.b:p.a)}</p></div>
    <p class="ask">Pick the matching ${esc(ansLab.toLowerCase())}.</p>
    <div class="options" role="group" aria-label="Answer choices">
      ${cur.opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}"><span class="key">${k+1}</span><span>${esc(cur.rev?o.a:o.b)}</span></button>`).join("")}
    </div>
    <div id="fbSlot"></div>
  </section>`;

  if(F.timer!=="off")runTimer(+F.timer,()=>answer(-1));
}
function runTimer(sec,onEnd){
  const t0=performance.now();
  const tick=now=>{const f=Math.max(0,1-(now-t0)/(sec*1000));const bar=$("#tbar");if(bar){bar.style.width=(f*100)+"%";bar.classList.toggle("low",f<.3);}RF.tleft=f;if(f<=0){timerId=null;onEnd();return;}timerId=requestAnimationFrame(tick);};
  timerId=requestAnimationFrame(tick);
}
function record(cur,ok){
  const st=itemStat(cur.it.key);st.n++;if(ok){st.ok++;st.run++;}else st.run=0;st.last=ok;
  if(!cur.retry){RF.first++;if(ok)RF.firstOk++;}
  if(ok){RF.streak++;RF.best=Math.max(RF.best,RF.streak);S.best=Math.max(S.best||0,RF.best);}else{RF.streak=0;}
  if(!ok){
    if(!RF.misses.includes(cur.it))RF.misses.push(cur.it);
    if(!cur.retry){const at=Math.min(RF.q.length,RF.i+3+Math.floor(Math.random()*3));RF.q.splice(at,0,{it:cur.it,retry:true});}
  }
  save();
}
function answer(k){
  if(RF.answered)return;RF.answered=true;stopTimer();

  const chosen=k>=0?cur.opts[k]:null, ok=chosen===p;
  let pts=0;if(ok){pts=100+Math.min(50,RF.streak*10);if(F.timer!=="off")pts+=Math.round(50*(RF.tleft||0));}
