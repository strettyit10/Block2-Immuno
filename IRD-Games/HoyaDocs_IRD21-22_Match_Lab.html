<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRD21–22 Match Lab · HoyaDocs</title>
<meta name="description" content="HoyaDocs IRD21–22 Match Lab: Rheumatologic Disease &amp; DMARDs. Rapid Fire matching and Grid Lock charts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* HoyaDocs Match Lab engine v1.0
   Layout: header + mode tabs; Home (mode cards, filters, mastery), Rapid Fire (one match per card), Grid Lock (chart + tile bank).
   Colors are tokens on :root with a dark set. Every view stacks to one column on phones. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#1A3363; --muted:#5B6274; --line:#D3D8E0; --chip:#E6E9EE;
  --navy:#0F2244; --navy2:#1A3363; --onnavy:#F4F1EA; --silver:#6E7787; --tan:#5AAEE6;
  --neuro:#5B4BC4; --path:#1F7F78; --drt:#C4631B; --pharm:#2368A8; --imm:#5B4BC4; --mic:#4D7C2A; --accent:#1D6FA8; --accent-ink:#ffffff;
  --ok:#1d7a3e; --ok-bg:#e3f4e8; --bad:#b3261e; --bad-bg:#fbe7e5; --once:#b7791f; --once-bg:#fdf1dc;
  --hy-bg:#FFF4C2; --hy-line:#D4A300; --hy-ink:#5E4700;
  --k1:#2c55a0; --k2:#6b46c1; --k3:#a02c4f; --k4:#b45309; --k5:#0f6b6b; --k6:#85600f; --k7:#1d7a3e; --k8:#0369a1;
  --given:#f5f7f9; --lock:#e9ecef; --clue-bg:#e3ecfa; --clue-ink:#1d3f7a; --clue-line:#9db6e3;
  --f-display:"Graduate","Rockwell","Georgia",serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#A99CF0; --path:#5CC2B8; --drt:#F0A060; --pharm:#7FB3EA; --imm:#A99CF0; --mic:#8CC06A; --navy:#0A1830; --navy2:#13284d; --onnavy:#F4F1EA; --silver:#9aa6b2; --tan:#5AAEE6; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#A99CF0; --path:#5CC2B8; --drt:#F0A060; --pharm:#7FB3EA; --imm:#A99CF0; --mic:#8CC06A; --navy:#0A1830; --navy2:#13284d; --onnavy:#F4F1EA; --silver:#9aa6b2; --tan:#5AAEE6; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15.5px/1.55 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 56px;display:grid;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:.03em}
h3{font-family:var(--f-mono);font-weight:800;letter-spacing:.03em}
/* HoyaDocs hub shell: wordmark bar, section nav, navy varsity hero */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 0 0}
.word{font-family:var(--f-display);font-size:24px;letter-spacing:.04em;text-decoration:none;color:var(--ink);line-height:1}
.word span{color:var(--silver)}
.rev{font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.topr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.themebtn{background:transparent;border:1.5px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:5px 14px;cursor:pointer}
.themebtn:hover{color:var(--ink);border-color:var(--ink)}
.hubnav{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;border-top:3px solid var(--ink);border-bottom:1px solid var(--line)}
.hubnav::-webkit-scrollbar{display:none}
.hubnav a{flex:none;text-decoration:none;font-family:var(--f-mono);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:11px 12px 9px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
.hubnav a:hover{color:var(--ink)}
.hubnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--tan)}
.hubnav a i{width:9px;height:9px;border-radius:2px;flex:none}
.hubnav .sep{flex:none;width:1px;background:var(--line);margin:9px 6px}
header.hero{background:var(--navy);color:var(--onnavy);border-radius:14px;padding:clamp(20px,3.5vw,36px) clamp(20px,4vw,40px);position:relative;overflow:hidden}
header.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(255,255,255,.045) calc(10% - 1px) 10%),radial-gradient(ellipse at 88% 115%, rgba(90,174,230,.34), transparent 58%)}
header.hero > *{position:relative}
.hero .k{font-family:var(--f-mono);font-weight:700;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:#8FCBF5}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5.4vw,52px);line-height:1.02;letter-spacing:.02em;margin:10px 0 4px;color:#F4F1EA;text-shadow:2px 2px 0 #1A3363,4px 4px 0 #5AAEE6}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.meta{font:500 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
header.top h1{font-size:clamp(1.5rem,3.4vw,2rem)}
header.top .lede{margin:4px 0 0;color:var(--muted);max-width:66ch}
.back{font:600 .8rem var(--f-body);text-decoration:none;color:var(--muted)}
.back:hover{color:var(--ink)}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .86rem var(--f-body);background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:.8rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:700 .82rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:1.15rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.mode-card{display:grid;gap:10px;align-content:start}
.mode-card .k{font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mode-card h2{font-size:1.45rem}
.mode-card p{margin:0;color:var(--muted)}
.opts{display:grid;gap:8px}
.optrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.optrow .lab{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:76px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:600 .8rem var(--f-body);border:0;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .78rem var(--f-body);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.chip[aria-pressed="false"]{opacity:.5;text-decoration:line-through;text-decoration-color:var(--muted)}
.chip .n{font:500 .7rem var(--f-mono);color:var(--muted)}
.statrow{display:flex;flex-wrap:wrap;gap:18px}
.stat b{display:block;font:700 1.25rem var(--f-body);font-variant-numeric:tabular-nums}
.stat span{font:500 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.lecrow{display:grid;grid-template-columns:auto minmax(0,1fr) 120px auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.lecrow:first-of-type{border-top:0}
.lecrow .pct{font:500 .75rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
@media (max-width:560px){.lecrow{grid-template-columns:auto minmax(0,1fr) auto}.lecrow .bar{grid-column:1/-1;order:5}}
.tag{font:600 .68rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;color:#fff;background:var(--lc,var(--neuro));white-space:nowrap}
:root[data-theme="dark"] .tag{color:#0d1520}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag{color:#0d1520} }
.hy{font:700 .66rem var(--f-mono);letter-spacing:.06em;background:var(--hy-bg);color:var(--hy-ink);border:1px solid var(--hy-line);border-radius:5px;padding:1px 6px}
.hybox{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.hybox b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
details.how{font-size:.9rem}
details.how summary{cursor:pointer;font-weight:700}
details.how ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
details.how li{margin:3px 0}

/* Rapid fire */
.rf-top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.timer{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.timer i.low{background:var(--bad)}
.qcard{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kind{font:700 .72rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--kc);border:1.5px solid var(--kc);border-radius:6px;padding:2px 8px}
.qset{font-size:.82rem;color:var(--muted)}
.prompt-lab{font:500 .7rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prompt{font:600 clamp(1.15rem,2.6vw,1.4rem)/1.35 var(--f-body);margin:2px 0 0}
.ask{font-size:.88rem;color:var(--muted);margin:0}
.options{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:.95rem;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .key{font:500 .75rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;height:24px;display:grid;place-items:center}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:8px;font-size:.92rem}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb h3{font:800 1.05rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.fb p{margin:0}
.fb .also{font-size:.86rem;color:var(--muted)}
.fb .also b{color:var(--ink)}
.navrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.kbd{font:500 .72rem var(--f-mono);color:var(--muted)}
/* sequence */
.seq-done{display:grid;gap:6px;counter-reset:s;padding:0;margin:0;list-style:none}
.seq-done li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;background:var(--ok-bg);border:1px solid var(--ok);border-radius:8px;padding:7px 10px;font-size:.92rem}
.seq-done li::before{content:counter(s);font:700 .8rem var(--f-mono);color:var(--ok);text-align:center}
.seq-done li.slot{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.seq-done li.slot::before{color:var(--muted)}
.seq-pool{display:grid;gap:6px}
.seq-pool .opt{grid-template-columns:minmax(0,1fr)}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
/* end */
.end{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.big{font:700 clamp(2rem,6vw,3rem)/1 var(--f-display)}
.misslist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.misslist li{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:8px 12px;font-size:.9rem;background:var(--surface)}
.misslist .a{font-weight:700}
.misslist .b{color:var(--muted)}

/* Grid list */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start}
.gcard:hover{border-color:var(--accent)}
.gcard h3{font-size:1.02rem}
.gcard p{margin:0;font-size:.84rem;color:var(--muted)}
.gcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 .72rem var(--f-mono);color:var(--muted)}
.stars{font-size:.85rem;letter-spacing:1px;color:var(--once)}
.stars .off{color:var(--line)}
/* Grid play */
.gwrap{display:grid;gap:12px}
.gtable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.gt{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
.gt th{font:700 .74rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--sunk);vertical-align:bottom}
.gt th small{display:block;font:500 .66rem var(--f-mono);letter-spacing:.03em;text-transform:none;color:var(--muted);margin-top:2px}
.gt th.clue{background:var(--clue-bg);color:var(--clue-ink)}
.gt th.clue small{color:var(--clue-ink)}
.gt td{padding:5px;border-bottom:1px solid var(--line);vertical-align:top;min-width:120px}
.gt tr:last-child td{border-bottom:0}
.gt td + td,.gt th + th{border-left:1px solid var(--line)}
.cell{width:100%;min-height:44px;border-radius:8px;padding:7px 9px;font-size:.88rem;line-height:1.3;text-align:left;display:flex;align-items:center;gap:6px}
.cell.given{background:var(--given);font-weight:600}
.cell.clue{background:var(--clue-bg);color:var(--clue-ink);border:1px solid var(--clue-line);font-weight:600}
.cell.empty{border:1.5px dashed var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.cell.empty:hover,.cell.empty.drop{border-color:var(--accent);color:var(--ink)}
.cell.sel{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink)}
.cell.locked{background:var(--lock);color:var(--muted);border:1px solid var(--line);cursor:not-allowed;font-size:.78rem}
.cell.locked svg{width:13px;height:13px;flex:none}
.cell.filled{background:var(--ok-bg);border:1px solid var(--ok);font-weight:600}
.cell.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.cell.err{animation:shake .32s;border-color:var(--bad)}
.bank{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:12px;display:grid;gap:8px;scroll-margin-bottom:16px}
.bank .bh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:.86rem}
.bank .bh b{font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow:auto}
.tile{font:600 .84rem var(--f-body);background:var(--sunk);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:grab;display:inline-flex;gap:6px;align-items:center;max-width:100%;text-align:left}
.tile:hover:not([disabled]){border-color:var(--accent)}
.tile .ct{font:500 .7rem var(--f-mono);color:var(--muted)}
.tile.out{opacity:.45;text-decoration:line-through;cursor:default}
.tile.dragging{opacity:.4}
.toast{font-size:.86rem;font-weight:600}
.toast:empty{display:none}
@media (max-width:560px){.tabs .long{display:none}}
.toast.bad{color:var(--bad)}
.toast.ok{color:var(--ok)}
.notes{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.notes li{border-left:3px solid var(--ok);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:.88rem}
.notes li b{font-weight:700}
.gdone{display:grid;gap:12px}
footer{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty-state{color:var(--muted);font-size:.9rem}
/* condensed label sizing (Barlow Condensed reads small) */
.mode-card .k,.optrow .lab,.stat span,.prompt-lab,.gcard .row{font-size:.82rem!important;font-weight:700!important;letter-spacing:.1em!important}
.tag{font-size:.8rem!important;font-weight:800!important}
.hy,.hybox b{font-size:.78rem!important;font-weight:800!important}
.kbd,.lecrow .pct,.chip .n,.tile .ct,.opt .key{font-size:.85rem!important;font-weight:600!important}
.gt th small{font-size:.76rem!important;font-weight:600!important}
.seq-done li::before{font-size:.95rem!important}
.btn,.seg button,.chip,.tabs button,.kind,.gt th{font-family:var(--f-mono)!important;letter-spacing:.06em;text-transform:uppercase}
.btn{font-size:.95rem!important;font-weight:700!important}
.btn.sm{font-size:.85rem!important}
.seg button{font-size:.88rem!important;font-weight:700!important}
.chip{font-size:.86rem!important;font-weight:700!important;text-transform:none;letter-spacing:.03em}
.tabs button{font-size:15px!important;letter-spacing:.08em}

<script>
const DATA = {"id": "ird21-22", "code": "IRD21–22", "prefix": "IRD", "title": "Rheumatologic Disease & DMARDs", "lectures": [{"k": "21", "name": "Rheumatologic Diseases", "disc": "path"}, {"k": "22", "name": "DMARDs & Biologics in Rheumatology", "disc": "pharm"}], "los": {"21.1": "Clinical features of systemic lupus erythematosus, Sjögren syndrome and scleroderma", "21.2": "Lab tests for diagnosis; interpret them in a case; use them to track activity and guide therapy", "21.3": "Mechanisms of autoimmunity in the pathogenesis of SLE, Sjögren syndrome and scleroderma", "21.4": "Primary organ systems involved and general pathologic findings in each disease", "21.5": "General treatment choices based on specific clinical manifestations", "22.1": "Why DMARDs and biologics are used; how class, structure and dominant pathway guide drug choice", "22.2": "Treat to target in RA: diagnosis criteria, response measures and responses to drug failure", "22.3": "Anti-drug antibodies: causes, consequences and prevention", "22.4": "Mechanisms, uses, key toxicities and pre-treatment screening of DMARDs and biologics"}, "sets": [{"id": "s01", "lec": "21", "lo": "21.2", "kind": "term-def", "title": "Lupus lab test → what it tells you", "left": "Test", "right": "Clinical meaning", "pairs": [{"a": "ANA", "b": "Sensitive screen: positive in essentially all SLE but nonspecific", "why": "A negative ANA nearly rules out SLE, but fewer than 1 in 100 people with a positive ANA has lupus. Use it to rule OUT, then confirm with specific antibodies.", "hy": true}, {"a": "Anti-dsDNA", "b": "Specific antibody whose titer rises with flares, especially nephritis", "why": "Anti-dsDNA is specific and fluctuates with activity (present in about half of patients), so it is used with C3/C4 to monitor lupus nephritis.", "hy": true}, {"a": "Anti-Smith", "b": "Highly specific for SLE but stays constant regardless of activity", "why": "Anti-Smith rules SLE in, but it is present in a minority and does not track disease activity, so it is not used for monitoring."}, {"a": "Anti-SSA/Ro", "b": "Maternal IgG that crosses the placenta and can block the fetal AV node", "why": "Anti-SSA/SSB occur in SLE and Sjögren. Transplacental IgG causes neonatal lupus with permanent congenital heart block.", "hy": true}, {"a": "Anti-histone", "b": "Present in most drug-induced lupus (hydralazine, procainamide)", "why": "Drug-induced lupus: arthralgia, fever, serositis; renal and CNS disease are rare and anti-dsDNA is usually negative. It resolves when the drug is stopped."}, {"a": "Antiphospholipid antibodies", "b": "Venous or arterial clots and recurrent pregnancy loss", "why": "Lupus anticoagulant, anti-cardiolipin and anti-β2-glycoprotein I: prolonged PTT in vitro but thrombosis in vivo; a poor prognostic factor in SLE."}, {"a": "Low C3 and C4", "b": "Complement consumed by immune complexes during active disease", "why": "SLE is a disease of hypocomplementemia. Falling C3/C4 with rising anti-dsDNA signals a flare; normalization signals response."}]}, {"id": "s02", "lec": "21", "lo": "21.1", "kind": "disease-finding", "title": "SLE manifestation → defining feature", "left": "Manifestation", "right": "Defining feature", "pairs": [{"a": "Malar rash (acute cutaneous lupus)", "b": "Photosensitive, non-scarring cheek rash sparing the nasolabial folds", "why": "The butterfly rash is acute cutaneous lupus: UV-triggered, non-scarring and usually part of systemic disease.", "hy": true}, {"a": "Discoid lupus (chronic cutaneous)", "b": "Scarring plaques with follicular plugging and permanent alopecia", "why": "Discoid lesions scar and favor the scalp, face and ears. Most patients never develop SLE (about 5% when lesions stay above the neck)."}, {"a": "Lupus oral ulcers", "b": "Painless ulcers of the palate or buccal mucosa", "why": "Oral ulcers in SLE are classically painless, so they must be looked for on exam."}, {"a": "Lupus serositis", "b": "Pleuritic chest pain with a rub, effusion or pericarditis", "why": "Lupus involves the pleura and pericardium far more often than lung tissue or heart muscle (pneumonitis, myocarditis are less common).", "hy": true}, {"a": "Lupus hematologic disease", "b": "Leukopenia, thrombocytopenia and hemolytic anemia", "why": "Cytopenias are antibody-mediated (type II). Anemia can also come from chronic disease or kidney disease."}, {"a": "Early cause of death in SLE", "b": "Active disease and infection", "why": "Early deaths reflect uncontrolled disease plus the infections that come with immunosuppression."}, {"a": "Late cause of death in SLE", "b": "Cardiovascular disease and end-stage renal disease", "why": "Lupus doubles coronary risk (accelerated atherosclerosis, unclear pathogenesis) and about 10% with nephritis reach ESRD over 10 years.", "hy": true}]}, {"id": "s03", "lec": "21", "lo": "21.1", "kind": "disease-finding", "title": "Sjögren feature → what it looks like", "left": "Feature", "right": "Presentation", "pairs": [{"a": "Keratoconjunctivitis sicca", "b": "Gritty foreign-body eye sensation; fluorescein shows corneal defects", "why": "Lacrimal gland destruction → dry eyes that persist despite artificial tears; fluorescein stains the damaged corneal epithelium."}, {"a": "Xerostomia", "b": "Dry mouth with caries on atypical surfaces and dysphagia", "why": "Saliva protects teeth; its loss causes caries at the gumline and atypical surfaces, candidiasis and trouble swallowing dry food.", "hy": true}, {"a": "Secondary Sjögren syndrome", "b": "Sicca occurring alongside RA, SLE or scleroderma", "why": "Sjögren is primary (alone) or secondary to another connective tissue disease."}, {"a": "Sjögren serology", "b": "Anti-SSA/Ro and anti-SSB/La in about 70%", "why": "ANA and RF are often positive too. Anti-SSA in a pregnant patient means fetal heart block risk.", "hy": true}, {"a": "Sjögren demographics", "b": "Women affected 10–20 times more often than men", "why": "Even more female-predominant than SLE (about 10:1)."}, {"a": "Persistent firm unilateral parotid swelling", "b": "Warning sign of MALT (marginal zone) lymphoma", "why": "Chronic antigen-driven B-cell stimulation in the glands selects a malignant clone: MALT lymphoma or diffuse large B-cell lymphoma.", "hy": true}, {"a": "Sjögren kidney involvement", "b": "Tubulointerstitial nephritis with distal RTA", "why": "Extraglandular Sjögren: arthritis, ILD, interstitial nephritis/RTA, neuropathy and lymphoma — not immune-complex GN like lupus."}]}, {"id": "s04", "lec": "21", "lo": "21.3", "kind": "cause-effect", "title": "SLE immune abnormality → consequence", "left": "Abnormality", "right": "Consequence", "pairs": [{"a": "NETosis", "b": "Neutrophils extrude DNA webs, adding nuclear autoantigen", "why": "Excess cell death (apoptosis, NETosis) plus poor clearance keeps nuclear antigens exposed long enough to break tolerance."}, {"a": "Homozygous C1q deficiency", "b": "Monogenic early-onset lupus from failed clearance of apoptotic debris", "why": "C1q tags apoptotic cells for removal. Paradox: early complement deficiency causes lupus, while in established SLE complement is consumed.", "hy": true}, {"a": "Nucleic acid–containing immune complexes", "b": "Activate endosomal TLR7/9 in pDCs and B cells", "why": "Internalized complexes deliver self-DNA/RNA to endosomal TLRs, driving interferon and B-cell activation — a vicious cycle."}, {"a": "Excess type I interferon", "b": "Blood 'interferon signature'; blocked at IFNAR by anifrolumab", "why": "SLE is a type I IFN (IFN-α) disease, not an IFN-γ disease. Type I IFN matures DCs and promotes autoreactive B cells.", "hy": true}, {"a": "↑ BAFF (BLyS)", "b": "Autoreactive B cells escape apoptosis and survive", "why": "BAFF is a B-cell survival factor; belimumab neutralizes it.", "hy": true}, {"a": "↑ T follicular helper cells", "b": "Germinal centers yield high-affinity class-switched autoantibodies", "why": "Tfh drive germinal center reactions. SLE also shows ↑ Th17 and ↓ Treg and CD8+ cells."}, {"a": "↓ Regulatory T cells", "b": "Weaker peripheral suppression of self-reactive T cells", "why": "Fewer Tregs contribute to loss of peripheral tolerance."}, {"a": "UV light exposure", "b": "Keratinocyte apoptosis that triggers skin and systemic flares", "why": "All lupus skin disease is photosensitive. Other triggers: estrogen, drugs (hydralazine, procainamide, INH), EBV, smoking."}]}, {"id": "s05", "lec": "21", "lo": "21.4", "kind": "disease-finding", "title": "Lesion (and test) → pathologic finding", "left": "Lesion / test", "right": "Pathologic finding", "pairs": [{"a": "Cutaneous lupus skin biopsy", "b": "Interface dermatitis: basal vacuolization with junctional lymphocytes", "why": "Inflammation at the dermal-epidermal junction with vacuolar change of basal keratinocytes. Direct IF shows the granular lupus band.", "hy": true}, {"a": "Lupus nephritis immunofluorescence", "b": "'Full house': IgG, IgA, IgM, C1q, C3, κ and λ", "why": "Polyclonal immune complexes with classical-pathway complement stain for everything — highly characteristic of lupus nephritis.", "hy": true}, {"a": "Class IV lupus nephritis light microscopy", "b": "Hypercellular glomeruli with subendothelial 'wire loop' deposits", "why": "Diffuse proliferative (membranoproliferative pattern) is the most common and severe class; nephritic with nephrotic-range proteinuria."}, {"a": "Sjögren minor salivary gland biopsy", "b": "Focal periductal lymphocytic foci beside normal acini", "why": "Focal lymphocytic sialadenitis; a focus score ≥1 (≥50 lymphocytes per 4 mm²) supports the diagnosis. Focal, not diffuse.", "hy": true}, {"a": "Scleroderma skin biopsy", "b": "Compact dermal collagen replacing fat and adnexa", "why": "TGF-β–driven fibroblast activation lays down excess collagen; appendages are trapped and lost and the epidermis thins."}, {"a": "Scleroderma small arteries", "b": "Intimal thickening with luminal narrowing", "why": "The vasculopathy reduces flow: Raynaud, digital ulcers and pitting, and renal crisis from narrowed renal arteries."}, {"a": "Secondary Raynaud nailfold capillaroscopy", "b": "Giant dilated capillary loops with areas of dropout", "why": "Primary Raynaud has normal nailfold capillaries; dilation plus dropout means structural microvascular disease (scleroderma)."}, {"a": "Libman-Sacks endocarditis", "b": "Sterile verrucous vegetations on both sides of mitral leaflets", "why": "Nonbacterial vegetations in SLE, associated with antiphospholipid antibodies; cultures are negative."}]}, {"id": "s06", "lec": "21", "lo": "21.5", "kind": "term-app", "title": "Manifestation → management choice", "left": "Manifestation", "right": "Management", "pairs": [{"a": "Scleroderma renal crisis", "b": "ACE inhibitor at once; avoid high-dose steroids", "why": "Narrowed renal arteries → renin surge → malignant hypertension and AKI. Prompt ACE inhibition transformed survival; high-dose steroids can precipitate crisis.", "hy": true}, {"a": "Frequent Raynaud attacks with a fingertip ulcer", "b": "Dihydropyridine calcium channel blocker (nifedipine)", "why": "After warmth and smoking cessation, nifedipine/amlodipine is first-line; refractory: PDE-5 inhibitors, prostacyclins, bosentan. Avoid β-blockers and triptans.", "hy": true}, {"a": "Sjögren dry mouth", "b": "Muscarinic agonist such as pilocarpine", "why": "M3 agonists (pilocarpine, cevimeline) stimulate residual glands; anticholinergics worsen dryness."}, {"a": "Background therapy for nearly every SLE patient", "b": "Hydroxychloroquine", "why": "Hydroxychloroquine reduces flares, thrombosis and mortality and lowers congenital heart block risk; monitor the retina.", "hy": true}, {"a": "Lupus nephritis induction", "b": "Mycophenolate (or cyclophosphamide) with steroids", "why": "Each flare permanently removes nephrons, so organ-threatening nephritis gets aggressive immunosuppression and close monitoring."}, {"a": "Antiphospholipid syndrome with DVT", "b": "Long-term anticoagulation (heparin in pregnancy)", "why": "Warfarin long term; heparin replaces it in pregnancy because warfarin is teratogenic."}, {"a": "Pregnant patient with anti-SSA/Ro", "b": "Serial mid-gestation fetal echocardiograms", "why": "Maternal anti-SSA crosses the placenta in the second trimester; PR-interval monitoring catches early conduction disease."}]}, {"id": "s07", "lec": "21", "lo": "21.1", "kind": "term-def", "title": "Scleroderma sign → description", "left": "Sign", "right": "Description", "pairs": [{"a": "Calcinosis", "b": "Chalky subcutaneous calcium deposits that can ulcerate", "why": "The C of CREST (limited cutaneous SSc, anti-centromere).", "hy": true}, {"a": "Raynaud phenomenon", "b": "Cold-triggered white → blue → red color change of the digits", "why": "Usually the first sign of scleroderma, often years before skin changes."}, {"a": "Esophageal dysmotility", "b": "Reflux, dysphagia and strictures from smooth-muscle fibrosis", "why": "GI dysmotility can occur anywhere from esophagus to bowel (bacterial overgrowth, pseudo-obstruction)."}, {"a": "Sclerodactyly", "b": "Tight, thickened, shiny skin of the fingers", "why": "Skin thickening limited to fingers, hands, forearms and face = limited disease; trunk and proximal limbs = diffuse disease.", "hy": true}, {"a": "Telangiectasias", "b": "Dilated small vessels on the face, lips and hands", "why": "The T of CREST; in limited SSc they travel with risk of pulmonary arterial hypertension."}, {"a": "Scleroderma facies", "b": "Pursed lips, small mouth and loss of facial wrinkles", "why": "Facial skin tightening; darker skin may also show salt-and-pepper pigment change."}, {"a": "Digital pitting", "b": "Fingertip scars and pulp loss from chronic ischemia", "why": "Vasculopathy causes digital ulcers in about half of patients, with pitting scars and resorption of fingertip bone."}]}, {"id": "s08", "lec": "22", "lo": "22.4", "kind": "drug-mech", "title": "Conventional DMARD → mechanism", "left": "Drug", "right": "Mechanism", "pairs": [{"a": "Methotrexate", "b": "Inhibits DHFR; also raises anti-inflammatory adenosine", "why": "↓ THF → ↓ purine and thymidylate synthesis. At low weekly RA doses the adenosine effect is a major part of its action.", "hy": true}, {"a": "Leflunomide", "b": "Inhibits dihydroorotate dehydrogenase (pyrimidine synthesis)", "why": "DHODH blockade → ↓ de novo pyrimidines → ↓ T-cell proliferation; an alternative to methotrexate.", "hy": true}, {"a": "Azathioprine", "b": "6-MP prodrug; purine analog incorporated into DNA", "why": "TPMT inactivates 6-MP — check activity before starting. Used more in lupus, vasculitis and lung disease than RA."}, {"a": "Mycophenolate mofetil", "b": "Inhibits IMP dehydrogenase (de novo guanosine synthesis)", "why": "Lymphocytes depend on de novo purine synthesis while other cells use salvage. Used for lupus nephritis and transplant, not RA joints.", "hy": true}, {"a": "Hydroxychloroquine", "b": "Raises lysosomal pH and dampens TLR signaling", "why": "Mechanism not fully known. Standard therapy in lupus, an add-on in RA."}, {"a": "Minocycline", "b": "Tetracycline thought to inhibit metalloproteinases", "why": "Safe but low potency; its antimicrobial action may contribute."}, {"a": "Sulfasalazine", "b": "Sulfa-containing drug of unclear mechanism, usually combined", "why": "Moderately helpful alone, so usually part of combination therapy; sulfa allergy is common."}]}, {"id": "s09", "lec": "22", "lo": "22.4", "kind": "drug-mech", "title": "Biologic or targeted drug → target", "left": "Drug", "right": "Target", "pairs": [{"a": "Infliximab", "b": "TNF-α", "why": "One of five anti-TNF drugs (with etanercept, adalimumab, certolizumab, golimumab); all are about equally effective in RA.", "hy": true}, {"a": "Rituximab", "b": "CD20 on B cells", "why": "Depletes B cells for 6 months or more; works in RA and GPA, not in psoriatic arthritis or AS.", "hy": true}, {"a": "Abatacept", "b": "CD80/86 on APCs, blocking CD28 signal 2", "why": "CTLA-4-Ig occupies CD80/86 so CD28 cannot deliver co-stimulation → T-cell anergy. Slow onset, well tolerated.", "hy": true}, {"a": "Anakinra", "b": "IL-1 receptor", "why": "Recombinant IL-1 receptor antagonist (also canakinumab, rilonacept block IL-1): Still disease, recurrent pericarditis, gout flares."}, {"a": "Tocilizumab", "b": "IL-6 receptor", "why": "IL-6 blockade controls systemic inflammatory states: RA, GCA/PMR, systemic JIA, cytokine release syndrome."}, {"a": "Belimumab", "b": "Soluble BLyS/BAFF", "why": "First new lupus drug in decades; helps skin and joints and may reduce long-term organ damage."}, {"a": "Tofacitinib", "b": "Janus kinases (JAK1/3 > JAK2)", "why": "A targeted small molecule, taken orally, that blocks signaling from many cytokine receptors."}, {"a": "Anifrolumab", "b": "Type I interferon receptor (IFNAR1)", "why": "Blocks the type I IFN signature that drives SLE."}, {"a": "Pegloticase", "b": "Uric acid, converted to allantoin", "why": "PEGylated recombinant uricase for refractory gout; about 50% develop anti-drug antibodies."}]}, {"id": "s10", "lec": "22", "lo": "22.4", "kind": "drug-mech", "title": "Biologic → signature risk", "left": "Drug", "right": "Signature risk", "pairs": [{"a": "Anti-TNF agents", "b": "Granuloma breakdown → latent TB reactivation", "why": "TNF maintains granulomas. Screen for latent TB (and hepatitis B) first; also drug-induced lupus, MS-like demyelination; safe in hepatitis C.", "hy": true}, {"a": "Rituximab", "b": "PML from JC virus reactivation", "why": "Rare but fatal. Also hepatitis B reactivation (check HBV core antibody) and infusion reactions.", "hy": true}, {"a": "Tocilizumab", "b": "GI perforation, especially with diverticulitis", "why": "IL-6 blockade also raises lipids and LFTs, causes neutropenia and blunts CRP, masking infection.", "hy": true}, {"a": "Anakinra", "b": "Very common, painful injection-site reactions", "why": "Daily SC injections; also bacterial infections, neutropenia and TB (lower risk than anti-TNF)."}, {"a": "Tofacitinib", "b": "Herpes zoster reactivation", "why": "JAK inhibitors suppress antiviral cytokine signaling; they also raise cholesterol. Congenital JAK3 loss = SCID, but the drugs only partially inhibit."}, {"a": "Pegloticase", "b": "Hemolysis and methemoglobinemia in G6PD deficiency", "why": "Uricase generates H₂O₂ — check G6PD first. Loss of efficacy from anti-drug antibodies is the other big problem."}, {"a": "IVIG", "b": "Anaphylaxis in IgA deficiency with anti-IgA antibodies", "why": "Pooled IgG contains trace IgA; IgA-deficient patients with anti-IgA react. Use IgA-depleted products."}]}, {"id": "s11", "lec": "22", "lo": "22.1", "kind": "term-def", "title": "Biologic name stem → structure", "left": "Stem", "right": "Structure", "pairs": [{"a": "-omab", "b": "Fully murine monoclonal antibody", "why": "Entirely mouse protein — the most immunogenic; largely replaced by engineered antibodies."}, {"a": "-ximab", "b": "Chimeric: mouse variable region on a human constant region", "why": "Infliximab, rituximab. About 25% mouse sequence → highest anti-drug antibody rates.", "hy": true}, {"a": "-zumab", "b": "Humanized: only the mouse CDRs remain", "why": "Tocilizumab, certolizumab. About 5–10% mouse sequence.", "hy": true}, {"a": "-umab", "b": "Fully human monoclonal antibody", "why": "Adalimumab, golimumab, belimumab. No mouse sequence, yet still can induce anti-drug antibodies.", "hy": true}, {"a": "-cept", "b": "Receptor domain fused to an IgG Fc", "why": "Etanercept = TNF receptor 2 + IgG1 Fc; abatacept = CTLA-4 + IgG1 Fc. Not antibodies.", "hy": true}, {"a": "-ra (anakinra)", "b": "Recombinant receptor antagonist protein", "why": "Anakinra is a recombinant IL-1 receptor antagonist (IL-1Ra)."}, {"a": "peg-", "b": "Polyethylene glycol attached to extend half-life", "why": "PEGylation also reduces immunogenicity (pegloticase, certolizumab pegol)."}, {"a": "-citinib", "b": "Oral small-molecule JAK inhibitor", "why": "Tofacitinib, baricitinib — targeted small molecules, not biologics, so they can be swallowed."}]}, {"id": "s12", "lec": "22", "lo": "22.1", "kind": "term-app", "title": "Non-RA disease → dominant pathway to target", "left": "Disease", "right": "Dominant pathway", "pairs": [{"a": "Psoriasis (skin)", "b": "IL-23 and IL-17 (over TNF)", "why": "The IL-23 → Th17 → IL-17 axis dominates skin; monoclonal anti-TNFs also work, better than the fusion receptor.", "hy": true}, {"a": "Ankylosing spondylitis", "b": "TNF and IL-17 (IL-23 blockade fails)", "why": "All anti-TNFs help AS joint pain, but only monoclonals treat the uveitis; B-cell depletion does not work.", "hy": true}, {"a": "Systemic lupus erythematosus", "b": "BLyS/BAFF and type I interferon", "why": "Belimumab (BAFF) and anifrolumab (IFNAR), with rituximab for B cells; TNF blockade is not used and can induce lupus.", "hy": true}, {"a": "Giant cell arteritis / PMR", "b": "IL-6 (tocilizumab)", "why": "IL-6 drives the acute-phase response; tocilizumab is the steroid-sparing first-line target.", "hy": true}, {"a": "Still disease / recurrent pericarditis", "b": "IL-1", "why": "IL-1–driven autoinflammation responds to anakinra, canakinumab or rilonacept."}, {"a": "Refractory tophaceous gout", "b": "Uric acid, degraded by uricase", "why": "Pegloticase converts urate to soluble allantoin; anti-drug antibodies limit it in about half of patients."}]}, {"id": "s13", "lec": "22", "lo": "22.1", "kind": "structure-function", "title": "Biologic → structure and consequence", "left": "Drug", "right": "Structure / consequence", "pairs": [{"a": "Infliximab", "b": "Chimeric IgG1 anti-TNF given IV; highest anti-drug antibody rates", "why": "Murine Fv makes it the most immunogenic anti-TNF (ADAb 6–61%); closed Crohn fistulas in about 60%.", "hy": true}, {"a": "Etanercept", "b": "TNFR2 (p75)–IgG1 Fc fusion; fails in Crohn disease and uveitis", "why": "All anti-TNFs work in RA, but only monoclonals treat Crohn disease and AS uveitis. Fully human sequence → low ADAb.", "hy": true}, {"a": "Adalimumab", "b": "Fully human anti-TNF IgG1 mAb given SC", "why": "No mouse sequence; still can provoke ADAb, especially without methotrexate."}, {"a": "Certolizumab pegol", "b": "PEGylated humanized Fab' with no Fc; minimal placental transfer", "why": "No Fc → no FcRn-mediated placental transport, so it is a preferred anti-TNF in pregnancy."}, {"a": "Abatacept", "b": "CTLA-4–IgG1 Fc fusion that occupies CD80/86", "why": "CTLA-4 binds CD80/86 more avidly than CD28, so co-stimulation (signal 2) is blocked."}, {"a": "Anakinra", "b": "Recombinant IL-1 receptor antagonist given daily SC", "why": "Short half-life → daily injections, which are often painful."}, {"a": "Pegloticase", "b": "PEGylated recombinant uricase", "why": "PEG extends half-life and lowers immunogenicity, yet about half of patients still make ADAb."}, {"a": "Tocilizumab", "b": "Humanized mAb against the IL-6 receptor", "why": "Blocks IL-6 signaling; because IL-6 drives CRP, CRP stays low on the drug even during infection."}]}, {"id": "s14", "lec": "22", "lo": "22.2", "kind": "term-def", "title": "RA treat-to-target term → meaning", "left": "Term", "right": "Meaning", "pairs": [{"a": "2010 ACR/EULAR criteria", "b": "Score ≥6 of 10 from joints, serology, duration and CRP/ESR", "why": "Joints 0–5, RF/ACPA 0–3, symptoms ≥6 weeks 1, abnormal CRP or ESR 1. Below 6, the patient may still qualify over time.", "hy": true}, {"a": "ACR20 response", "b": "≥20% fewer swollen and tender joints plus 3 of 5 other domains", "why": "The 5: patient global, physician global, pain, ESR/CRP, disability. ACR50/70 use 50% and 70%.", "hy": true}, {"a": "DAS28", "b": "Formula of joint counts, CRP and global health read like a thermometer", "why": "A single number tracked over time to judge activity."}, {"a": "RAPID3", "b": "Patient-reported function, pain and global with no joint count", "why": "Very quick to administer and score."}, {"a": "Treat to target", "b": "Measure repeatedly and change therapy until activity is low", "why": "Goal = low disease activity with low toxicity; consistent suppression improves long-term outcomes.", "hy": true}, {"a": "Primary failure", "b": "Drug never worked: switch class and review the diagnosis", "why": "Without an initial response, neutralizing antibodies are not the issue; consider a mimic.", "hy": true}, {"a": "Secondary failure", "b": "Drug worked then lost effect, often from anti-drug antibodies", "why": "Raise the dose or shorten the interval, switch within class, or choose another target.", "hy": true}, {"a": "Toxicity-limited failure", "b": "Drug works but a side effect such as drug-induced lupus stops it", "why": "Example: anti-TNF–induced lupus or MS-like demyelination."}]}, {"id": "s15", "lec": "22", "lo": "22.3", "kind": "cause-effect", "title": "Anti-drug antibody factor → effect", "left": "Factor", "right": "Effect", "pairs": [{"a": "Stop-start (episodic) infliximab dosing", "b": "More anti-drug antibodies than regular scheduled dosing", "why": "Early Crohn experience: dosing triggered by flares raised ADAb; regular dosing maintains tolerance. Low doses also raise risk.", "hy": true}, {"a": "Adding methotrexate or azathioprine to a biologic", "b": "Significantly fewer anti-drug antibodies", "why": "Concomitant immunosuppression is a key reason biologics are paired with methotrexate (which also adds efficacy).", "hy": true}, {"a": "Neutralizing anti-drug antibody", "b": "Occupies the drug's binding site so it cannot engage its target", "why": "Neutralization lowers effective drug activity → loss of response."}, {"a": "Drug–antibody immune complexes", "b": "Faster drug clearance and infusion reactions", "why": "Complexes are cleared quickly, so trough levels fall."}, {"a": "Murine sequence in the drug", "b": "Greater recognition as foreign protein", "why": "Chimeric > humanized > fully human/receptor-Fc in immunogenicity; etanercept (all human) has low ADAb rates."}, {"a": "Rising pre-infusion urate on pegloticase", "b": "Signals anti-drug antibodies; stop before infusion reactions", "why": "About 50% develop ADAb. Methotrexate co-therapy is now used to reduce them.", "hy": true}, {"a": "Host immune variation", "b": "Different ADAb rates in patients given the same regimen", "why": "Infliximab ADAb rates range 6–61%, partly from host genetic differences in immune response."}]}], "seqs": [{"id": "q01", "lec": "21", "lo": "21.3", "title": "Lupus pathogenesis loop", "prompt": "Put the steps of lupus pathogenesis in order (first → last).", "steps": ["Genetic susceptibility meets a trigger such as UV light", "Excess apoptosis/NETosis with poor clearance of nuclear debris", "Autoreactive B and T cells see nuclear antigens (loss of tolerance)", "Antinuclear immune complexes activate TLR7/9 in pDCs and B cells", "Type I interferon and BAFF drive more anti-nuclear IgG", "Tissue injury by antibody (type II) and immune complexes (type III)"], "why": "More debris → more autoantibody → more complexes and cell death → more debris: a vicious cycle. Belimumab (BAFF) and anifrolumab (IFNAR) target the amplifiers.", "hy": true}, {"id": "q02", "lec": "21", "lo": "21.1", "title": "Raynaud attack", "prompt": "Put the events of a Raynaud attack in order (first → last).", "steps": ["Cold or emotional stress", "White: intense digital arterial vasospasm", "Blue: stagnant, desaturated blood", "Red: reactive hyperemia on rewarming"], "why": "White → blue → red. Secondary Raynaud (scleroderma, SLE) adds structural damage: digital ulcers, pitting and abnormal nailfold capillaries.", "hy": true}, {"id": "q03", "lec": "21", "lo": "21.4", "title": "Scleroderma renal crisis", "prompt": "Put the events of scleroderma renal crisis in order (first → last).", "steps": ["Intimal thickening narrows renal arteries", "Renal perfusion falls", "Renin-angiotensin system surges", "Malignant hypertension with acute kidney injury", "Treated promptly with an ACE inhibitor"], "why": "Mostly early diffuse disease, especially anti-RNA polymerase III. High-dose steroids are a known trigger; ACE inhibitors are life-saving.", "hy": true}, {"id": "q04", "lec": "21", "lo": "21.2", "title": "Neonatal lupus", "prompt": "Put the events of neonatal lupus in order (first → last).", "steps": ["Mother carries anti-SSA/Ro (± anti-SSB/La) IgG", "IgG crosses the placenta in the second trimester", "Antibody binds fetal cardiac conduction tissue", "AV node inflammation and fibrosis", "Permanent congenital heart block at birth"], "why": "Only IgG crosses the placenta. The rash and cytopenias resolve by about 6 months as maternal IgG clears, but the heart block is permanent — hence serial fetal echos."}, {"id": "q05", "lec": "22", "lo": "22.2", "title": "Treat-to-target cycle", "prompt": "Put the treat-to-target steps for RA in order (first → last).", "steps": ["Make the right diagnosis (ACR/EULAR ≥6)", "Start a treatment, usually methotrexate", "Measure the response (ACR20, DAS28, RAPID3)", "Escalate the dose or add a drug", "Switch class if the target is still not met"], "why": "Diagnose → start → measure → adjust/add → switch class, repeated until disease activity is low with low toxicity. No single best drug exists, but no treatment is a bad idea.", "hy": true}, {"id": "q06", "lec": "22", "lo": "22.3", "title": "Anti-drug antibodies → secondary failure", "prompt": "Put the events leading to secondary failure of a biologic in order (first → last).", "steps": ["Biologic protein is recognized as foreign", "Patient produces anti-drug antibodies", "Antibodies neutralize the drug and speed its clearance", "Drug levels fall", "Clinical response is lost after initial benefit"], "why": "Prevent with regular dosing, adequate dose, concomitant methotrexate/azathioprine and less foreign structure; manage with ↑ dose/↓ interval or a switch.", "hy": true}, {"id": "q07", "lec": "22", "lo": "22.4", "title": "Methotrexate mechanism", "prompt": "Put the steps of methotrexate's antiproliferative action in order (first → last).", "steps": ["Low-dose weekly methotrexate enters the cell", "Dihydrofolate reductase is inhibited", "Tetrahydrofolate is depleted", "Purine and thymidylate synthesis fall", "Proliferating lymphocytes cannot make DNA"], "why": "Folic acid (or leucovorin) reduces toxicity. At RA doses, increased adenosine adds an anti-inflammatory effect."}, {"id": "q08", "lec": "22", "lo": "22.1", "title": "Antibody engineering", "prompt": "Order antibody types from MOST to LEAST mouse sequence (most → least).", "steps": ["Murine (-omab)", "Chimeric (-ximab, e.g., infliximab)", "Humanized (-zumab, e.g., certolizumab)", "Fully human (-umab, e.g., adalimumab)"], "why": "Less foreign sequence generally means fewer anti-drug antibodies, though even fully human drugs can be immunogenic.", "hy": true}], "grids": [{"id": "g01", "lec": "21", "lo": "21.2", "title": "Rheum disease → autoantibody → key finding", "blurb": "Hard: read the classic clue to name the disease, then fill its autoantibody and key finding.", "cols": [{"h": "Disease", "dep": 1}, {"h": "Classic clue"}, {"h": "Autoantibody", "dep": 0}, {"h": "Key finding / risk", "dep": 0}], "rows": [["SLE", "Malar rash, nephritis, low C3/C4", "Anti-dsDNA, anti-Smith", "Full-house immune complex GN"], ["Drug-induced lupus", "On hydralazine; no renal or CNS disease", "Anti-histone", "Resolves when the drug is stopped"], ["Neonatal lupus", "Newborn bradycardia, annular face rash", "Anti-SSA/Ro, anti-SSB/La", "Permanent congenital heart block"], ["Antiphospholipid syndrome", "DVT plus recurrent pregnancy loss", "Anti-cardiolipin, lupus anticoagulant", "Clots despite a prolonged PTT"], ["Sjögren syndrome", "Dry eyes, dry mouth, dental caries", "Anti-SSA/Ro, anti-SSB/La", "MALT lymphoma risk"], ["Limited SSc (CREST)", "Calcinosis, telangiectasia, sclerodactyly", "Anti-centromere", "Late pulmonary arterial hypertension"], ["Diffuse SSc with ILD", "Truncal skin thickening + dry crackles", "Anti-Scl-70 (topoisomerase I)", "Leading cause of SSc death"], ["Diffuse SSc with renal crisis", "Rapid skin thickening, then malignant HTN", "Anti-RNA polymerase III", "Renin-driven acute kidney injury"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Mixed connective tissue disease", "Rheumatoid arthritis", "Dermatomyositis"], "2": ["Anti-CCP", "Anti-U1 RNP", "Anti-Jo-1"], "3": ["Anti-GBM crescentic GN", "Erosive hand deformities", "Pauci-immune GN"]}, "notes": ["ANA screens (sensitive); anti-dsDNA (tracks activity) and anti-Smith (constant) confirm. Complement is consumed in flares.", "Hydralazine, procainamide, INH, minocycline, anti-TNF; slow acetylators at higher risk. Anti-dsDNA usually negative.", "Maternal anti-SSA/Ro (± SSB/La) IgG binds fetal conduction tissue; rash and cytopenias clear by ~6 months but the block is permanent.", "Lupus anticoagulant prolongs the PTT in vitro but clots in vivo; anticoagulate (heparin in pregnancy).", "Anti-SSA/SSB in ~70%; chronic B-cell stimulation → MALT or diffuse large B-cell lymphoma.", "Skin distal to elbows/knees plus face; long-standing Raynaud; PAH is the late killer.", "Topoisomerase I antibody → diffuse skin and ILD, the leading cause of SSc death. Anti-RNA pol III is the other diffuse-SSc antibody (renal crisis).", "RNA pol III → rapidly progressive skin and renal crisis: ACE inhibitor, avoid high-dose steroids."], "hy": "Step 1 pairs: dsDNA/Smith = SLE; histone = drug-induced; SSA/Ro = Sjögren + neonatal heart block; centromere = CREST; Scl-70 = diffuse + ILD; RNA pol III = renal crisis."}, {"id": "g02", "lec": "21", "lo": "21.4", "title": "Organ involvement & pathology", "blurb": "Hard: the classic clue is shown; name the manifestation, then its disease and underlying pathology.", "cols": [{"h": "Manifestation", "dep": 1}, {"h": "Classic clue"}, {"h": "Disease", "dep": 0}, {"h": "Pathology", "dep": 0}], "rows": [["Class IV lupus nephritis", "Hematuria, RBC casts, low C3", "SLE", "Subendothelial deposits (wire loops)"], ["Serositis", "Pleuritic pain with a friction rub", "SLE", "Immune complexes in pleura/pericardium"], ["Libman-Sacks endocarditis", "Culture-negative mitral vegetations", "SLE", "Sterile vegetations both leaflet sides"], ["Sicca", "Gritty eyes and caries", "Sjögren syndrome", "Periductal lymphocytic foci"], ["Marginal zone lymphoma", "Firm unilateral parotid + B symptoms", "Sjögren syndrome", "Antigen-driven malignant B-cell clone"], ["Interstitial lung disease", "Dry crackles in an Scl-70+ patient", "Systemic sclerosis", "Pulmonary interstitial fibrosis"], ["Renal crisis", "Abrupt malignant HTN and AKI", "Systemic sclerosis", "Intimal thickening of renal arteries"], ["GI dysmotility", "Reflux, dysphagia, bacterial overgrowth", "Systemic sclerosis", "Smooth-muscle atrophy and fibrosis"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Membranous nephropathy", "Rheumatoid nodule", "Sarcoid parotitis"], "2": ["Rheumatoid arthritis", "Drug-induced lupus", "Dermatomyositis"], "3": ["Linear IgG along the GBM", "Noncaseating granulomas", "Spongiosis with eosinophils"]}, "notes": ["~40% of SLE develop nephritis, usually early; class IV is most common and severe; full-house IF confirms.", "Lupus loves serosa: pleuritis/pericarditis are more common than pneumonitis or myocarditis.", "Nonbacterial verrucous endocarditis, linked to antiphospholipid antibodies; a source of emboli.", "Lacrimal and salivary destruction by CD4+ T and B cells; focus score ≥1 on lip biopsy.", "Persistent parotid enlargement, cryoglobulinemia or low C4 in Sjögren → biopsy for lymphoma.", "ILD (anti-Scl-70, diffuse disease) is the leading cause of death in scleroderma.", "Early diffuse disease, anti-RNA pol III; steroids can precipitate it; treat with ACE inhibitor.", "Anywhere from esophagus (reflux, strictures) to bowel (pseudo-obstruction, bacterial overgrowth)."], "hy": "SLE kidney = immune complex GN (type III); Sjögren kidney = interstitial nephritis/RTA; SSc kidney = vascular renal crisis (ACE inhibitor). SSc lung: ILD (Scl-70) vs PAH (centromere)."}, {"id": "g03", "lec": "21", "lo": "21.3", "title": "Lupus injury → hypersensitivity type", "blurb": "Hard: only the mechanism is shown; name the manifestation, then its hypersensitivity type.", "cols": [{"h": "Manifestation", "dep": 2}, {"h": "Hypersensitivity", "dep": 0}, {"h": "Mechanism"}], "rows": [["Autoimmune hemolytic anemia", "Type II", "IgG on RBCs → Coombs+, splenic clearance"], ["Thrombocytopenia", "Type II", "Anti-platelet IgG → splenic removal"], ["Congenital heart block", "Type II", "Maternal IgG binds fetal AV node tissue"], ["Lupus nephritis", "Type III", "Circulating complexes lodge in glomeruli"], ["Serositis", "Type III", "Complexes deposit in pleura and pericardium"], ["Lupus band on skin DIF", "Type III", "Granular Ig and C3 at the dermal junction"]], "easyGiven": [0], "hardGiven": [2], "decoys": {"0": ["Contact dermatitis", "Anaphylaxis", "Tuberculin reaction"], "1": ["Type I", "Type IV"]}, "notes": ["Antibody bound to a cell-surface antigen = type II: opsonization, complement lysis, splenic clearance.", "Same type II mechanism as ITP; leukopenia also occurs in SLE.", "Tissue-fixed antibody against fetal conduction antigens; only IgG crosses the placenta.", "Immune complexes activate complement in the glomerulus → low C3/C4 and full-house IF.", "Complex deposition in serosal membranes → pleuritis and pericarditis with effusions.", "Direct IF of lesional skin shows a granular band of IgG/IgM and C3 along the junction."], "hy": "SLE uses two antibody mechanisms: type II for cytopenias, type III for nephritis/serositis/arthritis. Both consume complement → low C3/C4."}, {"id": "g04", "lec": "22", "lo": "22.4", "title": "Conventional DMARD chart", "blurb": "Hard: use the mechanism to name the drug, then fill its signature toxicity and key caution.", "cols": [{"h": "Drug", "dep": 1}, {"h": "Mechanism"}, {"h": "Signature toxicity", "dep": 0}, {"h": "Key caution / monitoring", "dep": 0}], "rows": [["Methotrexate", "DHFR inhibitor; ↑ adenosine", "Hepatotoxicity; teratogen", "CBC + LFTs; avoid in renal failure"], ["Leflunomide", "DHODH inhibitor (pyrimidines)", "Hepatotoxicity; teratogen", "Cholestyramine washout (long t½)"], ["Azathioprine", "6-MP prodrug (purine analog)", "Myelosuppression; infection", "Check TPMT activity before starting"], ["Mycophenolate", "IMPDH inhibitor (guanosine)", "Myelosuppression; infection", "Lupus nephritis; not for RA joints"], ["Hydroxychloroquine", "↑ lysosomal pH; ↓ TLR signaling", "Retinopathy", "Periodic eye exams"], ["Sulfasalazine", "Unclear (sulfa drug)", "GI upset; agranulocytosis", "Avoid in sulfa allergy"], ["Minocycline", "Metalloproteinase inhibition", "Vestibular toxicity; p-ANCA lupus", "Low potency; watch for hepatitis"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Cyclosporine", "Cyclophosphamide", "Allopurinol"], "2": ["Hemorrhagic cystitis", "Gingival hyperplasia", "Nephrotoxicity"], "3": ["Check G6PD before starting", "Screen for latent TB first", "Monitor serum drug levels"]}, "notes": ["Weekly oral/IM with folic acid; also cytopenias, mucositis and pneumonitis; LFT rise common, fibrosis uncommon; category X; renally cleared.", "Alternative to MTX; enterohepatic recycling gives a very long half-life — wash out before pregnancy.", "TPMT deficiency shunts 6-MP to thioguanine nucleotides; also avoid xanthine oxidase inhibitors. Safe in pregnancy.", "Lymphocytes rely on de novo guanine synthesis; used in transplant and lupus nephritis.", "Standard in lupus, add-on in RA; bull's-eye maculopathy is the toxicity to screen for.", "Moderately helpful alone; GI and CNS effects common; idiosyncratic agranulocytosis is rare but serious.", "Tetracycline; rarely a lupus-like syndrome with p-ANCA, fever, arthritis and skin vasculitis."], "hy": "Match the monitor to the drug: TPMT → azathioprine; eye exam → hydroxychloroquine; LFT/CBC + folate → methotrexate; cholestyramine → leflunomide; sulfa allergy → sulfasalazine."}, {"id": "g05", "lec": "22", "lo": "22.4", "title": "Biologic → target → risk → use", "blurb": "Hard: only the target is shown; name the drug, then its key risk and signature use.", "cols": [{"h": "Drug", "dep": 1}, {"h": "Target"}, {"h": "Infection / key risk", "dep": 0}, {"h": "Signature use", "dep": 0}], "rows": [["Infliximab", "TNF-α", "TB and hepatitis B reactivation", "RA, Crohn disease, AS uveitis"], ["Rituximab", "CD20", "PML (JC virus), HBV reactivation", "RA, GPA vasculitis"], ["Abatacept", "CD80/86 (CTLA-4-Ig)", "Infections; well tolerated", "RA (co-stimulation blockade)"], ["Anakinra", "IL-1 receptor", "Bacterial infection, neutropenia", "Still disease, recurrent pericarditis"], ["Tocilizumab", "IL-6 receptor", "Respiratory infection, GI perforation", "GCA/PMR, cytokine release syndrome"], ["Tofacitinib", "JAK1/3", "Herpes zoster; ↑ cholesterol", "RA, ulcerative colitis, alopecia"], ["Belimumab", "BLyS/BAFF", "Infections; depression", "SLE skin and joint disease"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Ustekinumab", "Basiliximab", "Secukinumab"], "2": ["Retinal toxicity", "Agranulocytosis", "Hemorrhagic cystitis"], "3": ["Plaque psoriasis only", "Gout prophylaxis", "Transplant induction"]}, "notes": ["TNF holds granulomas together → screen latent TB and HBV first; avoid in MS and heart failure; safe in HCV.", "B cells stay depleted ≥6 months; check HBV core antibody; ineffective in PsA and AS.", "Blocks CD28 co-stimulation (signal 2); IV or SC; moderately effective.", "Recombinant IL-1Ra; painful daily injections; also gout flares (costly).", "IL-6 blockade: ↑ lipids, ↑ LFTs, cytopenias, CRP suppressed; perforation with diverticulitis.", "Oral small molecule; JAK3 deficiency = SCID, but drugs only partially inhibit.", "Removes a survival signal for autoreactive B cells; first new lupus drug in decades. Labeling also warns of depression/suicidality."], "hy": "Screen before biologics: latent TB (anti-TNF most of all) and HBV (rituximab, anti-TNF). Signature warnings: rituximab → PML; tocilizumab → GI perforation; JAK → zoster."}, {"id": "g06", "lec": "22", "lo": "22.1", "title": "Decode the drug name", "blurb": "Hard: only the target is shown; name the drug, then decode its stem and structure.", "cols": [{"h": "Drug", "dep": 3}, {"h": "Stem", "dep": 0}, {"h": "Structure", "dep": 0}, {"h": "Target"}], "rows": [["Infliximab", "-ximab", "Chimeric mAb", "TNF-α"], ["Rituximab", "-ximab", "Chimeric mAb", "CD20"], ["Tocilizumab", "-zumab", "Humanized mAb", "IL-6 receptor"], ["Belimumab", "-umab", "Fully human mAb", "BLyS/BAFF"], ["Anifrolumab", "-umab", "Fully human mAb", "Type I IFN receptor"], ["Abatacept", "-cept", "CTLA-4–Fc fusion protein", "CD80/86"], ["Anakinra", "-ra", "Recombinant receptor antagonist", "IL-1 receptor"], ["Pegloticase", "peg-", "PEGylated uricase enzyme", "Uric acid"]], "easyGiven": [0], "hardGiven": [3], "decoys": {"0": ["Etanercept", "Adalimumab", "Ustekinumab"], "1": ["-omab", "-tinib"], "2": ["Murine mAb", "Antibody–drug conjugate", "Small-molecule kinase inhibitor"]}, "notes": ["Chimeric = mouse variable region; highest ADAb rate among anti-TNFs; IV.", "Chimeric anti-CD20; infusion reactions, PML, HBV reactivation.", "Humanized = only mouse CDRs remain; blocks IL-6 signaling.", "Fully human anti-BLyS; for SLE.", "Fully human anti-IFNAR1; blocks the lupus interferon signature.", "-cept = receptor fused to Fc (also etanercept = TNFR2-Fc).", "-ra = receptor antagonist: recombinant IL-1Ra.", "PEG extends half-life and reduces (but does not abolish) immunogenicity."], "hy": "Stems: -ximab chimeric > -zumab humanized > -umab human (falling immunogenicity); -cept = receptor-Fc fusion; -ra = receptor antagonist; peg- = PEGylated."}, {"id": "g07", "lec": "22", "lo": "22.2", "title": "2010 ACR/EULAR RA criteria", "blurb": "Hard: only the finding is shown; name its domain and the points it scores (≥6 of 10 = definite RA).", "cols": [{"h": "Domain"}, {"h": "Finding"}, {"h": "Points"}], "rows": [["Joint distribution", "2–10 large joints", "1"], ["Joint distribution", "1–3 small joints", "2"], ["Joint distribution", "4–10 small joints", "3"], ["Joint distribution", ">10 joints (≥1 small)", "5"], ["Serology", "Low-positive RF or ACPA", "2"], ["Serology", "High-positive RF or ACPA", "3"], ["Symptom duration", "Symptoms ≥6 weeks", "1"], ["Acute-phase reactants", "Abnormal CRP or ESR", "1"]], "easyGiven": [1, 0], "hardGiven": [1], "decoys": {"0": ["Morning stiffness", "Radiographic erosions", "Rheumatoid nodules"], "2": ["0", "4", "6"]}, "notes": ["One large joint scores 0; large joints are not counted once small joints are involved.", "Small joints = MCPs, PIPs, 2nd–5th MTPs, thumb IP, wrists.", "More and smaller joints score higher.", "Maximum joint score; requires at least one small joint.", "Negative RF and ACPA = 0; ACPA = anti-CCP antibody.", "High-positive = >3× the upper limit of normal; serology maxes at 3.", "Under 6 weeks scores 0.", "Normal CRP and ESR score 0."], "hy": "≥6/10 = definite RA. Serology alone (max 3) can never classify RA; anti-CCP is the specific RA antibody. A score <6 can still qualify prospectively or retrospectively."}]};

$("#heroK").textContent=`${DATA.code} · ${[...new Set(DATA.lectures.map(l=>DISCN[l.disc]||l.disc))].join(" · ")} · Match Lab`;

/* ---------- item pool ---------- */
const ITEMS=[];
DATA.sets.forEach(s=>s.pairs.forEach((p,i)=>ITEMS.push({t:"pair",key:s.id+":"+i,set:s,p,i,lec:s.lec,kind:s.kind,lo:s.lo})));
DATA.seqs.forEach(q=>ITEMS.push({t:"seq",key:q.id,q,lec:q.lec,kind:"sequence",lo:q.lo}));

/* ---------- filters / settings ---------- */
const F={lecs:new Set(DATA.lectures.map(l=>l.k)),kinds:new Set(Object.keys(KIND)),len:"20",timer:"off",dir:"mixed",focus:"all",diff:"easy"};
const pool=()=>ITEMS.filter(it=>F.lecs.has(it.lec)&&F.kinds.has(it.kind)&&(F.focus==="all"||(F.focus==="new"?!mastered(it.key):(S.items[it.key]&&S.items[it.key].last===false))));

/* ---------- router ---------- */
let view="home";
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>go(b.dataset.view));
function go(v,arg){
  stopTimer();
  view=v;
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===(v==="rfplay"||v==="rfend"?"rf":v==="grid"?"glist":v))));
  if(v==="home")renderHome();
  else if(v==="rf")renderRFSetup();
  else if(v==="rfplay")renderQ();
  else if(v==="rfend")renderEnd();
  else if(v==="glist")renderGList();
  else if(v==="grid")startGrid(arg);
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- shared bits ---------- */
function segHTML(name,label,opts,cur){return `<div class="optrow"><span class="lab">${label}</span><div class="seg" role="group" aria-label="${label}">${opts.map(([v,t])=>`<button type="button" data-${name}="${v}" aria-pressed="${v===cur}">${t}</button>`).join("")}</div></div>`;}
function bindSeg(root,name,cb){root.querySelectorAll(`[data-${name}]`).forEach(b=>b.onclick=()=>{F[name]=b.dataset[name];root.querySelectorAll(`[data-${name}]`).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));cb&&cb();});}
function lecChips(){return `<div class="optrow"><span class="lab">Lectures</span><div class="chips">${DATA.lectures.map(l=>`<button type="button" class="chip" data-lec="${l.k}" aria-pressed="${F.lecs.has(l.k)}" style="--c:var(--${l.disc})"><i></i>${esc(lecLabel(l.k))} · ${esc(l.name)}</button>`).join("")}</div></div>`;}
function kindChips(){const present=[...new Set(ITEMS.map(i=>i.kind))];return `<div class="optrow"><span class="lab">Match types</span><div class="chips">${present.map(k=>`<button type="button" class="chip" data-kind="${k}" aria-pressed="${F.kinds.has(k)}" style="--c:var(${KIND[k].c})"><i></i>${KIND[k].l} <span class="n">${ITEMS.filter(i=>i.kind===k).length}</span></button>`).join("")}</div></div>`;}
function bindChips(root,cb){
  root.querySelectorAll("[data-lec]").forEach(b=>b.onclick=()=>{const k=b.dataset.lec;if(F.lecs.has(k)){if(F.lecs.size>1)F.lecs.delete(k);}else F.lecs.add(k);b.setAttribute("aria-pressed",String(F.lecs.has(k)));cb&&cb();});
  root.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{const k=b.dataset.kind;if(F.kinds.has(k)){const vis=[...F.kinds].filter(x=>ITEMS.some(i=>i.kind===x));if(vis.length>1)F.kinds.delete(k);}else F.kinds.add(k);b.setAttribute("aria-pressed",String(F.kinds.has(k)));cb&&cb();});
}
function stars(n){return `<span class="stars" aria-label="${n} of 3 stars">${[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("")}</span>`;}

/* ---------- RAPID FIRE: setup ---------- */
function renderRFSetup(){
  $("#app").innerHTML=`
  <section class="panel opts">
    <h2>Rapid Fire setup</h2>
    ${lecChips()}
    ${kindChips()}
    ${segHTML("len","Length",[["10","10"],["20","20"],["40","40"],["all","All"]],F.len)}
    ${segHTML("timer","Shot clock",[["off","Off"],["20","20 s"],["10","10 s"]],F.timer)}
    ${segHTML("dir","Direction",[["fwd","Forward"],["mixed","Mixed"]],F.dir)}
    ${segHTML("focus","Focus",[["all","Everything"],["new","Not mastered"],["miss","Last missed"]],F.focus)}
    <div class="navrow"><span class="ask" id="poolCt"></span><button class="btn primary" id="startRF" type="button">Start &rarr;</button></div>
  </section>`;
  const root=$("#app");
  const upd=()=>{const n=pool().length;$("#poolCt").textContent=`${n} item${n===1?"":"s"} match these filters.`;$("#startRF").disabled=!n;};
  bindChips(root,upd);["len","timer","dir","focus"].forEach(n=>bindSeg(root,n,upd));upd();

/* ---------- RAPID FIRE: play ---------- */
let RF=null, timerId=null;
function stopTimer(){if(timerId){cancelAnimationFrame(timerId);timerId=null;}}
function startRF(){
  let p=shuffle(pool());
  // interleave so the same set doesn't come back to back
  const out=[];while(p.length){let i=p.findIndex(x=>!out.length||sid(x)!==sid(out[out.length-1]));if(i<0)i=0;out.push(p.splice(i,1)[0]);}
  const n=F.len==="all"?out.length:Math.min(out.length,+F.len);
  RF={q:out.slice(0,n).map(it=>({it,retry:false})),i:0,score:0,streak:0,best:0,first:0,firstOk:0,misses:[],answered:false};
  go("rfplay");
}
const sid=it=>it.t==="pair"?it.set.id:it.q.id;
function topBar(){
  const tot=RF.q.length;
  return `<div class="rf-top">
    <div class="statrow">
      <div class="stat"><b>${Math.min(RF.i+1,tot)}/${tot}</b><span>Card</span></div>
      <div class="stat"><b>${RF.score}</b><span>Score</span></div>
      <div class="stat"><b>${RF.streak}</b><span>Streak</span></div>
      <div class="stat"><b>${RF.first?Math.round(100*RF.firstOk/RF.first)+"%":"—"}</b><span>First-try accuracy</span></div>
    </div>
    <button class="btn sm" type="button" id="quitRF">End round</button>
  </div>
  <div class="bar"><i style="width:${100*RF.i/tot}%;background:var(--accent)"></i></div>`;
}
function renderQ(){
  if(RF.i>=RF.q.length){go("rfend");return;}
  const cur=RF.q[RF.i]; RF.answered=false;
  if(cur.it.t==="seq")return renderSeq(cur);
  const it=cur.it,s=it.set,p=it.p;
  if(cur.rev===undefined)cur.rev=F.dir==="mixed"&&Math.random()<.3;
  if(!cur.opts){
    const others=shuffle(s.pairs.filter((_,j)=>j!==it.i)).slice(0,3);
    cur.opts=shuffle([p,...others]);
  }
  const K=KIND[s.kind]||KIND["term-def"];
  const promptLab=cur.rev?s.right:s.left, ansLab=cur.rev?s.left:s.right;
  $("#app").innerHTML=`${topBar()}
  <section class="qcard panel">
    <div class="qhead"><span class="kind" style="--kc:var(${K.c})">${cur.rev?esc(K.l.split(" → ").reverse().join(" → ")):K.l}</span>${lecTag(it.lec)}<span class="qset">${esc(s.title)}</span>${cur.retry?'<span class="hy" style="background:var(--once-bg);border-color:var(--once);color:var(--ink)">Retry</span>':""}</div>
    ${F.timer!=="off"?'<div class="timer" aria-hidden="true"><i id="tbar"></i></div>':""}
    <div><div class="prompt-lab">${esc(promptLab)}</div><p class="prompt">${esc(cur.rev?p.b:p.a)}</p></div>
    <p class="ask">Pick the matching ${esc(ansLab.toLowerCase())}.</p>
    <div class="options" role="group" aria-label="Answer choices">
      ${cur.opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}"><span class="key">${k+1}</span><span>${esc(cur.rev?o.a:o.b)}</span></button>`).join("")}
    </div>
    <div id="fbSlot"></div>
  </section>`;
  $("#quitRF").onclick=()=>go("rfend");
  document.querySelectorAll(".opt[data-k]").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if(F.timer!=="off")runTimer(+F.timer,()=>answer(-1));
}
function runTimer(sec,onEnd){
  const t0=performance.now();
  const tick=now=>{const f=Math.max(0,1-(now-t0)/(sec*1000));const bar=$("#tbar");if(bar){bar.style.width=(f*100)+"%";bar.classList.toggle("low",f<.3);}RF.tleft=f;if(f<=0){timerId=null;onEnd();return;}timerId=requestAnimationFrame(tick);};
  timerId=requestAnimationFrame(tick);
}
function record(cur,ok){
  const st=itemStat(cur.it.key);st.n++;if(ok){st.ok++;st.run++;}else st.run=0;st.last=ok;
  if(!cur.retry){RF.first++;if(ok)RF.firstOk++;}
  if(ok){RF.streak++;RF.best=Math.max(RF.best,RF.streak);S.best=Math.max(S.best||0,RF.best);}else{RF.streak=0;}
  if(!ok){
    if(!RF.misses.includes(cur.it))RF.misses.push(cur.it);
    if(!cur.retry){const at=Math.min(RF.q.length,RF.i+3+Math.floor(Math.random()*3));RF.q.splice(at,0,{it:cur.it,retry:true});}
  }
  save();
}
function answer(k){
  if(RF.answered)return;RF.answered=true;stopTimer();
  const cur=RF.q[RF.i],it=cur.it,s=it.set,p=it.p;
  const chosen=k>=0?cur.opts[k]:null, ok=chosen===p;
  let pts=0;if(ok){pts=100+Math.min(50,RF.streak*10);if(F.timer!=="off")pts+=Math.round(50*(RF.tleft||0));}
  RF.score+=pts;record(cur,ok);
  document.querySelectorAll(".opt[data-k]").forEach(b=>{const o=cur.opts[+b.dataset.k];b.disabled=true;if(o===p)b.classList.add("correct");else if(o===chosen)b.classList.add("wrong");else b.classList.add("dim");});
  const ansTxt=cur.rev?p.a:p.b;
  let also="";
  if(chosen&&!ok)also=`<p class="also">You picked <b>${esc(cur.rev?chosen.a:chosen.b)}</b>, which matches <b>${esc(cur.rev?chosen.b:chosen.a)}</b>.</p>`;
  $("#fbSlot").innerHTML=`<div class="fb ${ok?"ok":"bad"}">
    <h3>${ok?`Correct · +${pts}`:k<0?"Time's up":"Not quite"}</h3>
    ${ok?"":`<p>Correct match: <b>${esc(ansTxt)}</b></p>`}
    ${p.why?`<p>${esc(p.why)}</p>`:""}
    ${also}
    ${p.hy?`<div class="hybox"><b>High yield · Step 1</b>${esc(p.a)} → ${esc(p.b)}</div>`:""}
    <div class="navrow"><span class="kbd">${ok?"":"This one comes back later in the round. "}Enter = next</span><button class="btn primary" id="nextQ" type="button">Next &rarr;</button></div>
  </div>`;
  $("#nextQ").onclick=next;$("#nextQ").focus({preventScroll:true});
  $("#fbSlot").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){RF.i++;renderQ();}
function renderSeq(cur){
  const q=cur.it.q;
  if(!cur.order){cur.order=shuffle(q.steps.map((_,i)=>i));if(cur.order.every((v,i)=>v===i)&&q.steps.length>1)cur.order.reverse();}
  cur.placed=0;cur.err=0;
  const draw=()=>{
    $("#app").innerHTML=`${topBar()}
    <section class="qcard panel">
      <div class="qhead"><span class="kind" style="--kc:var(${KIND.sequence.c})">${KIND.sequence.l}</span>${lecTag(q.lec)}<span class="qset">${esc(q.title)}</span>${cur.retry?'<span class="hy" style="background:var(--once-bg);border-color:var(--once);color:var(--ink)">Retry</span>':""}</div>
      ${F.timer!=="off"?'<div class="timer" aria-hidden="true"><i id="tbar"></i></div>':""}
      <p class="prompt">${esc(q.prompt)}</p>
      <ol class="seq-done">${q.steps.map((s,i)=>i<cur.placed?`<li>${esc(s)}</li>`:i===cur.placed?`<li class="slot">Tap step ${i+1}…</li>`:"").join("")}</ol>
      <div class="seq-pool" role="group" aria-label="Steps to place">${cur.order.filter(i=>i>=cur.placed).map(i=>`<button type="button" class="opt" data-s="${i}"><span>${esc(q.steps[i])}</span></button>`).join("")}</div>
      <div class="navrow"><span class="kbd">Mistakes: ${cur.err}</span><button class="btn sm" type="button" id="giveUp">Show order</button></div>
      <div id="fbSlot"></div>
    </section>`;
    $("#quitRF").onclick=()=>go("rfend");
    $("#giveUp").onclick=()=>{cur.err=Math.max(cur.err,3);cur.placed=q.steps.length;finishSeq(cur,true);};
    document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.s;
      if(i===cur.placed){cur.placed++;if(cur.placed>=q.steps.length){finishSeq(cur);}else draw();}
      else{cur.err++;b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");$(".navrow .kbd").textContent="Mistakes: "+cur.err;}
    });
  };
  draw();
  if(F.timer!=="off")runTimer(+F.timer*2,()=>{cur.err=Math.max(cur.err,3);cur.placed=q.steps.length;finishSeq(cur,true);});
}
function finishSeq(cur,gaveUp){
  if(RF.answered)return;RF.answered=true;stopTimer();
  const q=cur.it.q, ok=!gaveUp&&cur.err===0;
  const pts=gaveUp?0:Math.max(0,100-25*cur.err)+(ok?Math.min(50,RF.streak*10):0);
  RF.score+=pts;record(cur,ok);
  $("#app").querySelector(".seq-done").innerHTML=q.steps.map(s=>`<li>${esc(s)}</li>`).join("");
  $("#app").querySelector(".seq-pool").innerHTML="";
  $("#giveUp").remove();
  $("#fbSlot").innerHTML=`<div class="fb ${ok?"ok":"bad"}">
    <h3>${ok?`Perfect order · +${pts}`:gaveUp?"Here's the order":`Done with ${cur.err} mistake${cur.err===1?"":"s"} · +${pts}`}</h3>
    ${q.why?`<p>${esc(q.why)}</p>`:""}
    ${q.hy?`<div class="hybox"><b>High yield · Step 1</b>${esc(q.title)}: know this order cold.</div>`:""}
    <div class="navrow"><span class="kbd">${ok?"":"This one comes back later in the round. "}Enter = next</span><button class="btn primary" id="nextQ" type="button">Next &rarr;</button></div>
  </div>`;
  $("#nextQ").onclick=next;$("#nextQ").focus({preventScroll:true});
}
document.addEventListener("keydown",e=>{
  if(view!=="rfplay"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-4]$/.test(e.key)&&!RF.answered){const b=$(`.opt[data-k="${+e.key-1}"]`);if(b){e.preventDefault();b.click();}}
  else if(e.key==="Enter"&&RF.answered&&document.activeElement&&document.activeElement.id!=="quitRF"){const n=$("#nextQ");if(n&&document.activeElement!==n){e.preventDefault();n.click();}}
});

/* ---------- RAPID FIRE: end ---------- */
function renderEnd(){
  if(!RF){go("rf");return;}
  S.rounds=(S.rounds||0)+1;save();
  const acc=RF.first?Math.round(100*RF.firstOk/RF.first):0;
  $("#app").innerHTML=`<section class="end panel">
    <h2>Round complete</h2>
    <div class="statrow">
      <div class="stat"><b class="big">${acc}%</b><span>First-try accuracy</span></div>
      <div class="stat"><b class="big">${RF.score}</b><span>Score</span></div>
      <div class="stat"><b class="big">${RF.best}</b><span>Best streak</span></div>
    </div>
    ${RF.misses.length?`<h3>Review your misses</h3><ul class="misslist">${RF.misses.map(it=>it.t==="pair"?`<li>${lecTag(it.lec)} <span class="a">${esc(it.p.a)}</span> → <span class="b">${esc(it.p.b)}</span></li>`:`<li>${lecTag(it.lec)} <span class="a">${esc(it.q.title)}</span><br><span class="b">${it.q.steps.map(esc).join(" → ")}</span></li>`).join("")}</ul>`:`<p>No misses. Try a longer round, the shot clock, or Hard Grid Lock.</p>`}
    <div class="navrow">
      <button class="btn" type="button" id="home2">Home</button>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${RF.misses.length?'<button class="btn" type="button" id="drill">Drill these misses</button>':""}<button class="btn primary" type="button" id="again">New round &rarr;</button></div>
    </div>
  </section>`;
  $("#home2").onclick=()=>go("home");
  $("#again").onclick=startRF;
  const d=$("#drill");if(d)d.onclick=()=>{RF={q:shuffle(RF.misses).map(it=>({it,retry:false})),i:0,score:0,streak:0,best:0,first:0,firstOk:0,misses:[],answered:false};go("rfplay");};
}

/* ---------- GRID LOCK: list ---------- */
function renderGList(){
  const gs=DATA.grids.filter(g=>F.lecs.has(g.lec));
  $("#app").innerHTML=`<section class="panel opts">
    <h2>Grid Lock</h2>
    ${segHTML("diff","Difficulty",[["easy","Easy · anchors + some cells given"],["hard","Hard · clue column only, locked chain"]],F.diff)}
    ${lecChips()}
  </section>
  <div class="glist">${gs.length?gs.map(g=>{const st=S.grids[g.id]||{};return `<button type="button" class="gcard" data-g="${g.id}">
    <div class="row">${lecTag(g.lec)}<span>${g.rows.length} rows × ${g.cols.length} cols</span></div>
    <h3>${esc(g.title)}</h3><p>${esc(g.blurb)}</p>
    <div class="row"><span>Easy ${stars(st.easy||0)}</span><span>Hard ${stars(st.hard||0)}</span></div>
  </button>`;}).join(""):'<p class="empty-state">No grids for the selected lectures.</p>'}</div>`;
  const root=$("#app");
  bindSeg(root,"diff");bindChips(root,renderGList);
  root.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>go("grid",b.dataset.g));
