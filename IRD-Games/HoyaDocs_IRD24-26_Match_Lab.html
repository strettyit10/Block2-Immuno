<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRD24–26 Match Lab · HoyaDocs</title>
<meta name="description" content="HoyaDocs IRD24–26 Match Lab: Cancer Drugs &amp; Immunosuppressants. Rapid Fire matching and Grid Lock charts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* HoyaDocs Match Lab engine v1.0
   Layout: header + mode tabs; Home (mode cards, filters, mastery), Rapid Fire (one match per card), Grid Lock (chart + tile bank).
   Colors are tokens on :root with a dark set. Every view stacks to one column on phones. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#1A3363; --muted:#5B6274; --line:#D3D8E0; --chip:#E6E9EE;
  --navy:#0F2244; --navy2:#1A3363; --onnavy:#F4F1EA; --silver:#6E7787; --tan:#5AAEE6;
  --neuro:#5B4BC4; --path:#1F7F78; --drt:#C4631B; --pharm:#2368A8; --imm:#5B4BC4; --mic:#4D7C2A; --accent:#1D6FA8; --accent-ink:#ffffff;
  --ok:#1d7a3e; --ok-bg:#e3f4e8; --bad:#b3261e; --bad-bg:#fbe7e5; --once:#b7791f; --once-bg:#fdf1dc;
  --hy-bg:#FFF4C2; --hy-line:#D4A300; --hy-ink:#5E4700;
  --k1:#2c55a0; --k2:#6b46c1; --k3:#a02c4f; --k4:#b45309; --k5:#0f6b6b; --k6:#85600f; --k7:#1d7a3e; --k8:#0369a1;
  --given:#f5f7f9; --lock:#e9ecef; --clue-bg:#e3ecfa; --clue-ink:#1d3f7a; --clue-line:#9db6e3;
  --f-display:"Graduate","Rockwell","Georgia",serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#A99CF0; --path:#5CC2B8; --drt:#F0A060; --pharm:#7FB3EA; --imm:#A99CF0; --mic:#8CC06A; --navy:#0A1830; --navy2:#13284d; --onnavy:#F4F1EA; --silver:#9aa6b2; --tan:#5AAEE6; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#A99CF0; --path:#5CC2B8; --drt:#F0A060; --pharm:#7FB3EA; --imm:#A99CF0; --mic:#8CC06A; --navy:#0A1830; --navy2:#13284d; --onnavy:#F4F1EA; --silver:#9aa6b2; --tan:#5AAEE6; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15.5px/1.55 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 56px;display:grid;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:.03em}
h3{font-family:var(--f-mono);font-weight:800;letter-spacing:.03em}
/* HoyaDocs hub shell: wordmark bar, section nav, navy varsity hero */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 0 0}
.word{font-family:var(--f-display);font-size:24px;letter-spacing:.04em;text-decoration:none;color:var(--ink);line-height:1}
.word span{color:var(--silver)}
.rev{font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.topr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.themebtn{background:transparent;border:1.5px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:5px 14px;cursor:pointer}
.themebtn:hover{color:var(--ink);border-color:var(--ink)}
.hubnav{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;border-top:3px solid var(--ink);border-bottom:1px solid var(--line)}
.hubnav::-webkit-scrollbar{display:none}
.hubnav a{flex:none;text-decoration:none;font-family:var(--f-mono);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:11px 12px 9px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
.hubnav a:hover{color:var(--ink)}
.hubnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--tan)}
.hubnav a i{width:9px;height:9px;border-radius:2px;flex:none}
.hubnav .sep{flex:none;width:1px;background:var(--line);margin:9px 6px}
header.hero{background:var(--navy);color:var(--onnavy);border-radius:14px;padding:clamp(20px,3.5vw,36px) clamp(20px,4vw,40px);position:relative;overflow:hidden}
header.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(255,255,255,.045) calc(10% - 1px) 10%),radial-gradient(ellipse at 88% 115%, rgba(90,174,230,.34), transparent 58%)}
header.hero > *{position:relative}
.hero .k{font-family:var(--f-mono);font-weight:700;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:#8FCBF5}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5.4vw,52px);line-height:1.02;letter-spacing:.02em;margin:10px 0 4px;color:#F4F1EA;text-shadow:2px 2px 0 #1A3363,4px 4px 0 #5AAEE6}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.meta{font:500 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
header.top h1{font-size:clamp(1.5rem,3.4vw,2rem)}
header.top .lede{margin:4px 0 0;color:var(--muted);max-width:66ch}
.back{font:600 .8rem var(--f-body);text-decoration:none;color:var(--muted)}
.back:hover{color:var(--ink)}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .86rem var(--f-body);background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:.8rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:700 .82rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:1.15rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.mode-card{display:grid;gap:10px;align-content:start}
.mode-card .k{font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mode-card h2{font-size:1.45rem}
.mode-card p{margin:0;color:var(--muted)}
.opts{display:grid;gap:8px}
.optrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.optrow .lab{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:76px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:600 .8rem var(--f-body);border:0;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .78rem var(--f-body);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.chip[aria-pressed="false"]{opacity:.5;text-decoration:line-through;text-decoration-color:var(--muted)}
.chip .n{font:500 .7rem var(--f-mono);color:var(--muted)}
.statrow{display:flex;flex-wrap:wrap;gap:18px}
.stat b{display:block;font:700 1.25rem var(--f-body);font-variant-numeric:tabular-nums}
.stat span{font:500 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.lecrow{display:grid;grid-template-columns:auto minmax(0,1fr) 120px auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.lecrow:first-of-type{border-top:0}
.lecrow .pct{font:500 .75rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
@media (max-width:560px){.lecrow{grid-template-columns:auto minmax(0,1fr) auto}.lecrow .bar{grid-column:1/-1;order:5}}
.tag{font:600 .68rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;color:#fff;background:var(--lc,var(--neuro));white-space:nowrap}
:root[data-theme="dark"] .tag{color:#0d1520}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag{color:#0d1520} }
.hy{font:700 .66rem var(--f-mono);letter-spacing:.06em;background:var(--hy-bg);color:var(--hy-ink);border:1px solid var(--hy-line);border-radius:5px;padding:1px 6px}
.hybox{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.hybox b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
details.how{font-size:.9rem}
details.how summary{cursor:pointer;font-weight:700}
details.how ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
details.how li{margin:3px 0}

/* Rapid fire */
.rf-top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.timer{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.timer i.low{background:var(--bad)}
.qcard{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kind{font:700 .72rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--kc);border:1.5px solid var(--kc);border-radius:6px;padding:2px 8px}
.qset{font-size:.82rem;color:var(--muted)}
.prompt-lab{font:500 .7rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prompt{font:600 clamp(1.15rem,2.6vw,1.4rem)/1.35 var(--f-body);margin:2px 0 0}
.ask{font-size:.88rem;color:var(--muted);margin:0}
.options{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:.95rem;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .key{font:500 .75rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;height:24px;display:grid;place-items:center}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:8px;font-size:.92rem}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb h3{font:800 1.05rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.fb p{margin:0}
.fb .also{font-size:.86rem;color:var(--muted)}
.fb .also b{color:var(--ink)}
.navrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.kbd{font:500 .72rem var(--f-mono);color:var(--muted)}
/* sequence */
.seq-done{display:grid;gap:6px;counter-reset:s;padding:0;margin:0;list-style:none}
.seq-done li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;background:var(--ok-bg);border:1px solid var(--ok);border-radius:8px;padding:7px 10px;font-size:.92rem}
.seq-done li::before{content:counter(s);font:700 .8rem var(--f-mono);color:var(--ok);text-align:center}
.seq-done li.slot{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.seq-done li.slot::before{color:var(--muted)}
.seq-pool{display:grid;gap:6px}
.seq-pool .opt{grid-template-columns:minmax(0,1fr)}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
/* end */
.end{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.big{font:700 clamp(2rem,6vw,3rem)/1 var(--f-display)}
.misslist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.misslist li{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:8px 12px;font-size:.9rem;background:var(--surface)}
.misslist .a{font-weight:700}
.misslist .b{color:var(--muted)}

/* Grid list */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start}
.gcard:hover{border-color:var(--accent)}
.gcard h3{font-size:1.02rem}
.gcard p{margin:0;font-size:.84rem;color:var(--muted)}
.gcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 .72rem var(--f-mono);color:var(--muted)}
.stars{font-size:.85rem;letter-spacing:1px;color:var(--once)}
.stars .off{color:var(--line)}
/* Grid play */
.gwrap{display:grid;gap:12px}
.gtable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.gt{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
.gt th{font:700 .74rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--sunk);vertical-align:bottom}
.gt th small{display:block;font:500 .66rem var(--f-mono);letter-spacing:.03em;text-transform:none;color:var(--muted);margin-top:2px}
.gt th.clue{background:var(--clue-bg);color:var(--clue-ink)}
.gt th.clue small{color:var(--clue-ink)}
.gt td{padding:5px;border-bottom:1px solid var(--line);vertical-align:top;min-width:120px}
.gt tr:last-child td{border-bottom:0}
.gt td + td,.gt th + th{border-left:1px solid var(--line)}
.cell{width:100%;min-height:44px;border-radius:8px;padding:7px 9px;font-size:.88rem;line-height:1.3;text-align:left;display:flex;align-items:center;gap:6px}
.cell.given{background:var(--given);font-weight:600}
.cell.clue{background:var(--clue-bg);color:var(--clue-ink);border:1px solid var(--clue-line);font-weight:600}
.cell.empty{border:1.5px dashed var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.cell.empty:hover,.cell.empty.drop{border-color:var(--accent);color:var(--ink)}
.cell.sel{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink)}
.cell.locked{background:var(--lock);color:var(--muted);border:1px solid var(--line);cursor:not-allowed;font-size:.78rem}
.cell.locked svg{width:13px;height:13px;flex:none}
.cell.filled{background:var(--ok-bg);border:1px solid var(--ok);font-weight:600}
.cell.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.cell.err{animation:shake .32s;border-color:var(--bad)}
.bank{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:12px;display:grid;gap:8px;scroll-margin-bottom:16px}
.bank .bh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:.86rem}
.bank .bh b{font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow:auto}
.tile{font:600 .84rem var(--f-body);background:var(--sunk);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:grab;display:inline-flex;gap:6px;align-items:center;max-width:100%;text-align:left}
.tile:hover:not([disabled]){border-color:var(--accent)}
.tile .ct{font:500 .7rem var(--f-mono);color:var(--muted)}
.tile.out{opacity:.45;text-decoration:line-through;cursor:default}
.tile.dragging{opacity:.4}
.toast{font-size:.86rem;font-weight:600}
.toast:empty{display:none}
@media (max-width:560px){.tabs .long{display:none}}
.toast.bad{color:var(--bad)}
.toast.ok{color:var(--ok)}
.notes{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.notes li{border-left:3px solid var(--ok);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:.88rem}
.notes li b{font-weight:700}
.gdone{display:grid;gap:12px}
footer{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty-state{color:var(--muted);font-size:.9rem}
/* condensed label sizing (Barlow Condensed reads small) */
.mode-card .k,.optrow .lab,.stat span,.prompt-lab,.gcard .row{font-size:.82rem!important;font-weight:700!important;letter-spacing:.1em!important}
.tag{font-size:.8rem!important;font-weight:800!important}
.hy,.hybox b{font-size:.78rem!important;font-weight:800!important}
.kbd,.lecrow .pct,.chip .n,.tile .ct,.opt .key{font-size:.85rem!important;font-weight:600!important}
.gt th small{font-size:.76rem!important;font-weight:600!important}
.seq-done li::before{font-size:.95rem!important}
.btn,.seg button,.chip,.tabs button,.kind,.gt th{font-family:var(--f-mono)!important;letter-spacing:.06em;text-transform:uppercase}
.btn{font-size:.95rem!important;font-weight:700!important}
.btn.sm{font-size:.85rem!important}
.seg button{font-size:.88rem!important;font-weight:700!important}
.chip{font-size:.86rem!important;font-weight:700!important;text-transform:none;letter-spacing:.03em}
.tabs button{font-size:15px!important;letter-spacing:.08em}

<script>
const DATA = {"id": "ird24-26", "code": "IRD24–26", "prefix": "IRD", "title": "Cancer Drugs & Immunosuppressants", "lectures": [{"k": "24", "name": "Cancer Drugs I", "disc": "pharm"}, {"k": "25", "name": "Cancer Drugs II", "disc": "pharm"}, {"k": "26", "name": "Cancer Drugs III & Immunosuppressant Drugs", "disc": "pharm"}], "los": {"24.1": "Role of chemotherapy (cure vs long-term survival) and limits to effective drug treatment", "24.2": "Assess efficacy of anticancer drugs in clinical trials", "24.3": "Mechanisms of cytotoxic classes: anti-mitotics, alkylators/platins, antimetabolites, topo drugs", "24.4": "Adverse effects of cytotoxic drugs by class/mechanism and by individual drug", "24.5": "Drug interactions and rational combinations (CMF, AC, FOLFIRI, FOLFIRINOX, leucovorin)", "25.1": "Cancer signaling (RTK → RAS–RAF–MEK–ERK → CDK4/6–Rb) and tumor genetics guiding therapy", "25.2": "How therapeutic mAbs are made, named and formatted, and how they kill tumor cells", "25.3": "Cetuximab/panitumumab, trastuzumab/pertuzumab, bevacizumab: mechanism, use, toxicity", "25.4": "Small-molecule kinase inhibitors (EGFR, BCR-ABL, ALK, BRAF, MEK, CDK4/6)", "25.5": "Select drugs based on molecular analysis of the cancer (companion diagnostics)", "25.6": "Drug resistance mechanisms and rational combinations of targeted drugs", "26.1": "How immunity recognizes and fails to eliminate cancer: neoantigens, mutational load, TME", "26.2": "Mechanisms of checkpoint inhibitors (anti-CTLA-4, anti-PD-1, anti-PD-L1)", "26.3": "Clinical uses of checkpoint inhibitors and predictors of response (TMB, dMMR, PD-L1)", "26.4": "Immune-related adverse effects of checkpoint inhibitors", "26.5": "Cell-based and other immunotherapies: CAR T cells, bispecific T-cell engagers, vaccines", "26.6": "Sketch and describe T-cell activation pathways targeted for immunosuppression", "26.7": "Classify immunosuppressant drugs and describe their mechanisms of action"}, "sets": [{"id": "s01", "lec": "24", "lo": "24.3", "kind": "drug-mech", "title": "Cytotoxic drug → mechanism", "left": "Drug", "right": "Mechanism", "pairs": [{"a": "Vincristine", "b": "Binds tubulin and blocks microtubule polymerization", "why": "Vinca alkaloid (periwinkle): no spindle forms → M-phase arrest. Neurotoxicity is dose-limiting; it is relatively marrow-sparing.", "hy": true}, {"a": "Paclitaxel", "b": "Binds microtubules and blocks their depolymerization", "why": "Taxane (Pacific yew): freezes the spindle → M-phase arrest. Opposite action to the vincas, same phase and same neuropathy risk.", "hy": true}, {"a": "Cyclophosphamide", "b": "Prodrug whose mustard metabolite cross-links DNA at guanine N7", "why": "Hepatic CYPs → 4-OH-cyclophosphamide → aldophosphamide → phosphoramide mustard (alkylator) + acrolein (bladder toxin). Cell-cycle nonspecific.", "hy": true}, {"a": "Cisplatin", "b": "Forms platinum–guanine N7 adducts with no metabolic activation", "why": "Platins act like alkylators (adducts, cross-links) but are active as given. Cisplatin is the most nephrotoxic platin; all platins cause neuropathy."}, {"a": "Methotrexate", "b": "Inhibits dihydrofolate reductase, blocking FH2 → FH4", "why": "No FH4 → no N5,10-methylene-FH4 for dTMP and no formyl-FH4 for purines → S-phase arrest. Polyglutamation traps it in cells.", "hy": true}, {"a": "5-Fluorouracil", "b": "Its metabolite FdUMP inhibits thymidylate synthase", "why": "FdUMP + TS + N5,10-methylene-FH4 form a covalent ternary complex → no dTMP → thymineless death. Capecitabine is the oral prodrug.", "hy": true}, {"a": "Irinotecan", "b": "Traps topoisomerase I–DNA cleavage complexes", "why": "Camptothecin family: blocks re-ligation of single-strand nicks, so replication forks create permanent breaks. Signature toxicity: severe diarrhea."}, {"a": "Doxorubicin", "b": "Inhibits topoisomerase II, intercalates DNA and makes free radicals", "why": "Anthracycline (Adriamycin, the A in AC). Free radicals and doxorubicin–iron complexes underlie its cumulative cardiotoxicity."}]}, {"id": "s02", "lec": "24", "lo": "24.4", "kind": "cause-effect", "title": "Cytotoxic drug → signature toxicity", "left": "Drug", "right": "Signature toxicity", "pairs": [{"a": "Vincristine", "b": "Dose-limiting neuropathy with constipation and jaw pain; marrow spared", "why": "Blocks microtubules in long axons: sensory/motor neuropathy, autonomic (constipation, ileus) and cranial nerve (jaw pain) effects. Vinblastine is more myelosuppressive.", "hy": true}, {"a": "Cyclophosphamide", "b": "Hemorrhagic cystitis from a metabolite concentrated in urine", "why": "Acrolein injures the bladder urothelium. Prevent with hydration, frequent voiding and mesna (same for ifosfamide).", "hy": true}, {"a": "Doxorubicin", "b": "Cumulative-dose dilated cardiomyopathy, sometimes years later", "why": "Iron complexes + free radicals damage myocytes. Cap the lifetime dose, monitor EF, give dexrazoxane. Additive with trastuzumab.", "hy": true}, {"a": "Cisplatin", "b": "Nephrotoxicity with Mg²⁺ wasting, plus ototoxicity", "why": "Proximal tubular injury with Mg²⁺/K⁺ wasting; prevent with aggressive saline hydration (amifostine is a cytoprotectant).", "hy": true}, {"a": "Oxaliplatin", "b": "Cold-induced dysesthesias with little nephrotoxicity", "why": "All platins cause neuropathy; oxaliplatin's is acute and cold-triggered, then cumulative. It is far less nephrotoxic than cisplatin (the O in FOLFIRINOX/FOLFOX)."}, {"a": "Irinotecan", "b": "Severe, sometimes life-threatening diarrhea", "why": "Irinotecan's prominent toxicity is GI, not cardiac — a classic distractor against doxorubicin, the other topoisomerase drug."}]}, {"id": "s03", "lec": "24", "lo": "24.4", "kind": "cause-effect", "title": "Toxicity → why it happens", "left": "Toxicity", "right": "Underlying cause", "pairs": [{"a": "Hemorrhagic cystitis on cyclophosphamide", "b": "Acrolein concentrated in urine injures the urothelium", "why": "Acrolein forms nonenzymatically with phosphoramide mustard. Mesna's free thiol binds it in the urine.", "hy": true}, {"a": "Doxorubicin cardiomyopathy", "b": "Drug–iron complexes generate oxidative stress in myocytes", "why": "Cumulative-dose dependent; dexrazoxane (iron chelator) reduces the injury. Different mechanism from trastuzumab (loss of HER2 repair signaling)."}, {"a": "Stocking-glove neuropathy on a taxane or vinca", "b": "Impaired microtubule-based axonal transport", "why": "Long axons depend on microtubule transport; freezing or preventing assembly impairs it. No antidote — reduce the dose.", "hy": true}, {"a": "Febrile neutropenia ~10 days after a cycle", "b": "Short-lived neutrophils not replaced once progenitors die", "why": "Neutrophils live hours to days, so the nadir falls ~7–14 days after a dose; RBCs live ~120 days, so anemia is slow. G-CSF shortens the nadir."}, {"a": "AML years after alkylator therapy", "b": "Mutagenesis of surviving hematopoietic stem cells", "why": "Alkylators and topo II inhibitors can cause therapy-related MDS/AML, part of the long-term risk–benefit calculation."}, {"a": "Alopecia, mucositis and diarrhea", "b": "Killing of rapidly renewing hair follicle and gut epithelial cells", "why": "Class effects of all cytotoxics follow tissue turnover: marrow, GI, hair, gonads, fetus."}, {"a": "Fetal loss or malformation with methotrexate", "b": "Blocked nucleotide synthesis in rapidly dividing embryonic cells", "why": "Same property used to treat ectopic pregnancy (kills trophoblast); all cytotoxics are teratogenic."}]}, {"id": "s04", "lec": "24", "lo": "24.1", "kind": "term-def", "title": "Chemotherapy principle → meaning", "left": "Principle", "right": "Meaning", "pairs": [{"a": "Tumor heterogeneity", "b": "Subclones differ, so one drug spares a pre-existing resistant clone", "why": "Darwinian selection creates branched subclones that differ between patients; this is why combinations and molecular profiling are needed.", "hy": true}, {"a": "Narrow therapeutic window", "b": "Normal dividing tissue toxicity limits dose before all tumor cells die", "why": "Cytotoxics hit any proliferating cell (marrow, GI, hair, gonads, fetus), so toxicity caps the dose — the core limitation of chemotherapy.", "hy": true}, {"a": "Late effects of childhood chemotherapy", "b": "Premature aging: cardiac, gonadal, endocrine, cognitive, second cancers", "why": "Survival in childhood leukemia/lymphoma has improved greatly, at the price of lasting organ damage in survivors."}, {"a": "Fatality ratio", "b": "Deaths ÷ diagnoses: about 78% for pancreas vs about 14% for breast", "why": "Prostate ~13%, colorectal ~35%, lung ~50–57%, pancreas ~76–79%. Lethality shapes how much late toxicity is acceptable."}, {"a": "DHFR gene amplification", "b": "Target overexpression that makes a tumor resistant to methotrexate", "why": "So much DHFR is made that achievable MTX levels cannot block it all. Other MTX resistance: less uptake, less polyglutamation, altered DHFR.", "hy": true}, {"a": "Gain of DNA repair capacity", "b": "Resistance mechanism despite tumors' frequent repair defects", "why": "Many tumors have defective repair or checkpoints (part of their sensitivity), but up-regulating repair (e.g., of platinum adducts) causes resistance."}]}, {"id": "s05", "lec": "24", "lo": "24.2", "kind": "term-app", "title": "Trial observation → lesson", "left": "Observation", "right": "Lesson", "pairs": [{"a": "High-dose adjuvant CMF at 20 years", "b": "About 52% alive vs about 25% with observation", "why": "Adjuvant chemotherapy after mastectomy raised long-term survival in node-positive breast cancer.", "hy": true}, {"a": "Low-dose adjuvant CMF at 20 years", "b": "Survival no better than observation, so dose matters", "why": "A dose–response exists: an inadequate dose gives no benefit (medium ~32%, high ~52%)."}, {"a": "Tumor shrinkage in a single-arm study", "b": "Suggests activity but does not prove patient benefit", "why": "Response is not outcome. Only well-controlled randomized trials show that a drug improves survival.", "hy": true}, {"a": "Overall survival in a randomized trial", "b": "The benchmark that proves a new drug beats standard care", "why": "A new treatment must be better than, or at least as good as, the existing one."}, {"a": "20 years of follow-up in node-positive breast cancer", "b": "Needed because relapses and late harms appear slowly", "why": "Follow-up length depends on natural history; early breast cancer recurs late."}, {"a": "Months of follow-up in metastatic pancreatic cancer", "b": "Enough, because a rapidly fatal cancer separates curves fast", "why": "With ~78% fatality and short survival, differences emerge within months."}, {"a": "Control arm of the adjuvant CMF trial", "b": "Radical mastectomy followed by observation alone", "why": "CMF (cyclophosphamide, methotrexate, 5-FU) was compared with surgery plus no chemotherapy."}]}, {"id": "s06", "lec": "24", "lo": "24.3", "kind": "structure-function", "title": "Molecule → role in drug action", "left": "Molecule", "right": "Role", "pairs": [{"a": "Phosphoramide mustard", "b": "Cyclophosphamide product that alkylates and cross-links DNA", "why": "Formed nonenzymatically from aldophosphamide alongside acrolein."}, {"a": "Acrolein", "b": "Cyclophosphamide by-product that injures bladder urothelium", "why": "Bound in urine by mesna."}, {"a": "Carboxyphosphamide", "b": "Inactive product made by aldehyde dehydrogenase in protected cells", "why": "Marrow stem cells and liver have high aldehyde dehydrogenase, so they detoxify aldophosphamide better than many tumors."}, {"a": "Aziridinium ion", "b": "Reactive ring formed by a mustard arm that attacks guanine N7", "why": "Each chloroethyl arm loses chloride to form it; two arms → interstrand cross-link."}, {"a": "FdUMP", "b": "5-FU metabolite locked onto thymidylate synthase", "why": "Fluorine at C5 stops methyl transfer; the ternary complex with methylene-FH4 blocks dTMP synthesis."}, {"a": "Methotrexate polyglutamates", "b": "Trapped intracellular forms that also inhibit TS and purine enzymes", "why": "Folylpolyglutamate synthetase adds glutamates; reduced polyglutamation is a resistance mechanism."}, {"a": "N5,10-methylene-FH4", "b": "Folate that donates the carbon for dUMP → dTMP", "why": "Thymidylate synthase uses it and releases FH2, which DHFR must reduce again — so MTX and 5-FU hit sequential steps."}, {"a": "Leucovorin (N5-formyl-FH4)", "b": "Reduced folate that enters the pool without needing DHFR", "why": "Rescues normal cells from MTX; folic acid cannot, because it needs DHFR. With 5-FU it instead potentiates TS inhibition.", "hy": true}]}, {"id": "s07", "lec": "24", "lo": "24.5", "kind": "term-def", "title": "Regimen → components", "left": "Regimen", "right": "Components", "pairs": [{"a": "CMF", "b": "Cyclophosphamide + methotrexate + 5-fluorouracil", "why": "Breast cancer: one DNA adduct former + two antimetabolites hitting DHFR and TS — different mechanisms, non-overlapping toxicities.", "hy": true}, {"a": "AC", "b": "Doxorubicin (Adriamycin) + cyclophosphamide", "why": "Breast cancer backbone, often followed by a taxane. Watch cardiotoxicity and hemorrhagic cystitis.", "hy": true}, {"a": "FOLFIRI", "b": "Leucovorin + 5-fluorouracil + irinotecan", "why": "Colorectal cancer; adding bevacizumab prolonged survival. FOL = folinic acid, which potentiates 5-FU."}, {"a": "FOLFIRINOX", "b": "Leucovorin + 5-fluorouracil + irinotecan + oxaliplatin", "why": "Metastatic pancreatic (and colon) cancer. Expect myelosuppression, diarrhea (irinotecan, 5-FU) and neuropathy (oxaliplatin).", "hy": true}, {"a": "FOLFOX", "b": "Leucovorin + 5-fluorouracil + oxaliplatin", "why": "Colorectal regimen without irinotecan; oxaliplatin adds cold-induced neuropathy."}, {"a": "MOPP", "b": "Mechlorethamine + vincristine + procarbazine + prednisone", "why": "Historic Hodgkin lymphoma regimen built on nitrogen mustard (mechlorethamine), derived from the WWI mustard-gas marrow observation."}]}, {"id": "s08", "lec": "25", "lo": "25.1", "kind": "structure-function", "title": "Signaling component → role", "left": "Component", "right": "Role", "pairs": [{"a": "EGFR/HER2 receptor tyrosine kinase", "b": "Dimerizes and cross-phosphorylates its kinase domains when activated", "why": "Ligand binding (or HER2 overexpression) drives dimerization; the phosphorylated tail recruits adaptors that activate RAS."}, {"a": "RAS", "b": "GTP-bound switch just below the receptor that turns on RAF", "why": "Constitutively active KRAS signals without EGFR, so anti-EGFR drugs fail in KRAS-mutant tumors.", "hy": true}, {"a": "MEK", "b": "Kinase phosphorylated by RAF that activates ERK", "why": "Target of trametinib, added to BRAF inhibitors to block the pathway at a second node."}, {"a": "ERK", "b": "Final MAPK of the cascade; induces cyclin D", "why": "RAF → MEK → ERK; ERK drives cyclin D expression, linking growth signals to the cell cycle."}, {"a": "Cyclin D–CDK4/6", "b": "Phosphorylates Rb to release E2F", "why": "Blocked by palbociclib, ribociclib, abemaciclib (-ciclib) → G1 arrest."}, {"a": "Unphosphorylated Rb", "b": "Holds E2F inactive, blocking the G1 → S transition", "why": "Rb is the brake; CDK4/6 phosphorylation releases it."}, {"a": "E2F", "b": "Transcription factor that switches on S-phase genes", "why": "Free E2F pushes the cell from G1 into S."}, {"a": "PTEN", "b": "Phosphatase restraining PI3K–AKT; its loss activates growth", "why": "Loss of a negative regulator is one of the ways cancers switch on growth signaling."}]}, {"id": "s09", "lec": "25", "lo": "25.3", "kind": "drug-mech", "title": "Anti-growth-factor mAb → binding and action", "left": "Antibody", "right": "Binding and action", "pairs": [{"a": "Cetuximab", "b": "Chimeric IgG1 binding EGFR domain III, blocking ligand binding", "why": "Ligand-binding domain III; also ADCC. Rash and diarrhea are on-target. Requires RAS wild-type colorectal tumor.", "hy": true}, {"a": "Panitumumab", "b": "Fully human IgG2 binding EGFR domain III, blocking ligand binding", "why": "Same epitope region as cetuximab but fully human (-u-) and IgG2 (weaker effector function)."}, {"a": "Trastuzumab", "b": "Binds HER2 domain IV, blocking its activity and triggering ADCC", "why": "HER2 has no ligand; it signals by dimerizing. Cardiotoxicity = loss of HER2 survival/repair signaling in myocytes.", "hy": true}, {"a": "Pertuzumab", "b": "Binds HER2 domain II, blocking heterodimerization with other HERs", "why": "Dual HER2 blockade with trastuzumab + docetaxel added ~15.7 months of median overall survival."}, {"a": "Bevacizumab", "b": "Binds circulating VEGF-A so it cannot reach endothelial receptors", "why": "Normalizes leaky tumor vessels → better drug and immune-cell delivery. Toxicity: hypertension, thrombosis, GI perforation, poor wound healing.", "hy": true}, {"a": "Ranibizumab", "b": "Anti-VEGF Fab with no Fc, injected into the eye", "why": "Wet AMD. No Fc → no FcRn recycling (short systemic half-life) and no effector function."}]}, {"id": "s10", "lec": "25", "lo": "25.4", "kind": "drug-mech", "title": "Small-molecule inhibitor → target", "left": "Drug", "right": "Target", "pairs": [{"a": "Imatinib", "b": "BCR-ABL kinase (also c-KIT and PDGFR)", "why": "CML t(9;22) and c-KIT+ GIST. Myelosuppression (leukopenia, thrombocytopenia), edema. Resistance: kinase mutations such as T315I.", "hy": true}, {"a": "Gefitinib", "b": "EGFR kinase, including wild-type EGFR in skin", "why": "First-generation EGFR TKI for exon 19 del/L858R lung cancer; blocks wild-type EGFR too → acneiform rash. T790M causes resistance."}, {"a": "Osimertinib", "b": "T790M-mutant EGFR, largely sparing wild-type", "why": "Designed for the T790M gatekeeper (and sensitizing) mutants; sparing wild-type EGFR means less skin toxicity.", "hy": true}, {"a": "Alectinib", "b": "EML4-ALK fusion kinase", "why": "Chromosome 2 inversion → constitutively active ALK fusion; often younger non-smokers with lung adenocarcinoma (crizotinib also)."}, {"a": "Vemurafenib", "b": "BRAF V600E kinase", "why": "V-E-MU-RAF-enib = V600E MUtant RAF inhibitor. Rapid responses in melanoma, but resistance within ~6 months.", "hy": true}, {"a": "Trametinib", "b": "MEK, just downstream of RAF", "why": "-metinib = MEK. Combined with a BRAF inhibitor to block two sequential nodes and delay resistance."}, {"a": "Palbociclib", "b": "CDK4/6, keeping Rb unphosphorylated", "why": "-ciclib. HR⁺/HER2⁻ metastatic breast cancer with letrozole. Neutropenia is the main toxicity.", "hy": true}]}, {"id": "s11", "lec": "25", "lo": "25.2", "kind": "term-def", "title": "Antibody concept → definition", "left": "Concept", "right": "Definition", "pairs": [{"a": "ADCC", "b": "Fc engages FcγRIIIa (CD16) so NK cells lyse the coated cell", "why": "Fcγ receptors bind the lower hinge–CH2 of Fc; NK cells kill with perforin/granzyme.", "hy": true}, {"a": "CDC", "b": "C1q binds CH2 of clustered IgG → classical pathway → MAC lysis", "why": "IgG1 and IgG3 fix complement best; IgG4 cannot activate the classical pathway.", "hy": true}, {"a": "CDCC", "b": "Deposited C3b opsonizes the cell for phagocytes with C3b receptors", "why": "Complement-dependent cell-mediated cytotoxicity: macrophages and NK cells act via C3b receptors."}, {"a": "FcRn", "b": "Recycles IgG, giving mAbs a half-life of days to weeks", "why": "Binds the CH2–CH3 interface. Fab fragments (ranibizumab) lack Fc and are cleared quickly."}, {"a": "Hybridoma", "b": "Immunized-mouse B cell fused with an immortal myeloma cell", "why": "Secretes one antibody indefinitely; mouse antibodies are immunogenic, hence chimeric/humanized engineering."}, {"a": "Transgenic human-Ig mouse", "b": "Source of fully human mAbs such as panitumumab", "why": "Mouse Ig loci replaced by human genes (phage display is the other route)."}, {"a": "Humanized mAb (-zu-)", "b": "Only the mouse CDRs grafted into a human IgG", "why": "-xi- chimeric (mouse V + human C), -zu- humanized, -u- fully human. More human = less immunogenic."}, {"a": "IgG4 format", "b": "Cannot fix classical complement; suits a pure receptor blocker", "why": "Used for anti-PD-1 (nivolumab, pembrolizumab): we want to block PD-1, not kill the T cells carrying it."}]}, {"id": "s12", "lec": "25", "lo": "25.6", "kind": "cause-effect", "title": "Resistance finding → mechanism", "left": "Finding", "right": "Mechanism", "pairs": [{"a": "EGFR T790M after gefitinib", "b": "Second mutation in the drug's own target kinase", "why": "Gatekeeper threonine → methionine restores ATP affinity; ~50% of resistant tumors. Switch to osimertinib.", "hy": true}, {"a": "KRAS mutation after gefitinib", "b": "Constitutive signaling below the blocked receptor", "why": "A mutation downstream of the drug's target bypasses it — same reason cetuximab fails in KRAS-mutant colorectal cancer.", "hy": true}, {"a": "MET amplification after gefitinib", "b": "A parallel receptor pathway takes over growth signaling", "why": "Bypass pathways (MET, EML4-ALK) drive growth in parallel to the inhibited receptor."}, {"a": "BCL-2 overexpression", "b": "Inactivation of mitochondrial apoptosis signals", "why": "BCL-2 restrains BAX/BAK → no cytochrome c release. t(14;18) in follicular lymphoma; venetoclax inhibits BCL-2."}, {"a": "P-glycoprotein up-regulation", "b": "Enhanced drug efflux from the cell", "why": "Altered drug transport/distribution is a general resistance mechanism."}, {"a": "Different MAPK mutations in different metastases", "b": "Branched evolution of heterogeneous subclones", "why": "NRAS in one site, MEK1 in another, BRAF amplification in a third: monitor (rebiopsy, ctDNA) and combine rationally."}, {"a": "Adding trametinib to dabrafenib", "b": "Blocking a second, downstream node to delay escape", "why": "Rational targeted combination: inhibit the same pathway at a downstream step (also dual HER2 blockade)."}]}, {"id": "s13", "lec": "26", "lo": "26.1", "kind": "term-def", "title": "Tumor immunity concept → meaning", "left": "Concept", "right": "Meaning", "pairs": [{"a": "Neoantigen", "b": "Mutated peptide on MHC I seen as non-self by CD8⁺ T cells", "why": "~150 non-synonymous mutations per typical tumor form the neoantigen pool; CD8 CTLs dominate anti-tumor immunity.", "hy": true}, {"a": "Elimination phase", "b": "T and NK cells destroy most newly transformed cells", "why": "First phase of immunoediting: elimination → equilibrium → escape."}, {"a": "Equilibrium phase", "b": "Surviving variants held in check by immunity, sometimes for years", "why": "Killing balances growth while mutation keeps selecting more evasive clones."}, {"a": "MHC class I loss", "b": "Hides tumor from CTLs but exposes it to NK missing-self killing", "why": "Without MHC I, inhibitory KIRs on NK cells are not engaged → NK lysis.", "hy": true}, {"a": "Tregs, TGF-β and IL-10", "b": "Subvert the response by suppressing effector T cells", "why": "'Subverting' strategy, along with myeloid suppressor cells and IDO."}, {"a": "Non-inflamed (cold) tumor", "b": "T cells excluded from the tumor bed by stroma and abnormal vessels", "why": "Shielding/excluding strategy; these respond poorly to checkpoint inhibitors."}, {"a": "Inflamed (hot) tumor", "b": "T cells present but suppressed; best checkpoint responders", "why": "Checkpoint blockade releases T cells that are already in the tumor."}, {"a": "High mutational load", "b": "Many neoantigens, as in UV-driven melanoma and smokers' lung cancer", "why": "Mutational load varies ~1000-fold; pediatric cancers and some leukemias are at the bottom."}]}, {"id": "s14", "lec": "26", "lo": "26.2", "kind": "structure-function", "title": "Checkpoint molecule → role", "left": "Molecule", "right": "Role", "pairs": [{"a": "CTLA-4", "b": "On activated T cells and Tregs; outcompetes CD28 for B7 at priming", "why": "Early brake in the lymph node. Ipilimumab blocks it → broader priming (and more autoimmunity).", "hy": true}, {"a": "PD-1", "b": "On activated T cells; recruits SHP-2 to damp effector function in tissue", "why": "Later brake in peripheral tissue/tumor (exhaustion). Nivolumab, pembrolizumab, cemiplimab block it.", "hy": true}, {"a": "PD-L1", "b": "Ligand induced on tumor and myeloid cells, often by IFN-γ", "why": "Atezolizumab, durvalumab, avelumab block it. Reed–Sternberg cells overexpress it (9p24.1 amplification)."}, {"a": "CD28", "b": "Costimulatory receptor on naive T cells delivering signal 2", "why": "Signal 1 without CD28 costimulation → anergy."}, {"a": "B7 (CD80/CD86)", "b": "APC ligand shared by CD28 and CTLA-4", "why": "CTLA-4 binds B7 with much higher affinity than CD28 and removes it."}, {"a": "Abatacept", "b": "CTLA-4–Ig fusion that occupies B7 to suppress T cells", "why": "Opposite of ipilimumab: mimics CTLA-4 → immunosuppression for RA."}, {"a": "PD-1 knockout mouse", "b": "Lupus-like nephritis, arthritis or cardiomyopathy", "why": "Shows PD-1 maintains peripheral tolerance — the basis of both efficacy and irAEs of PD-1 blockade."}]}, {"id": "s15", "lec": "26", "lo": "26.3", "kind": "term-app", "title": "Checkpoint observation → explanation", "left": "Observation", "right": "Explanation", "pairs": [{"a": "~87% response to nivolumab in relapsed Hodgkin", "b": "9p24.1 amplification: Reed–Sternberg cells overexpress PD-L1", "why": "The surrounding infiltrate is present but switched off; anti-PD-1 reactivates it.", "hy": true}, {"a": "Pembrolizumab response in MSI-high colon cancer", "b": "Mismatch-repair loss → hypermutation → many neoantigens", "why": "Lynch syndrome (MLH1, MSH2, MSH6, PMS2). Anti-PD-1 is approved for any dMMR/MSI-high solid tumor.", "hy": true}, {"a": "Lesions larger at 8 weeks; biopsy shows T cells", "b": "Pseudoprogression from immune infiltration; keep treating", "why": "Confirm with repeat imaging in a stable patient; checkpoint responses can be delayed and durable."}, {"a": "Longer PFS with diverse gut flora", "b": "Microbiome diversity favors checkpoint response", "why": "FMT from responders overcame anti-PD-1 resistance in some patients; antibiotics worsen outcomes."}, {"a": "Ipilimumab + nivolumab in melanoma", "b": "Blocking priming and effector brakes together is synergistic", "why": "≥80% shrinkage in ~53% of patients; stage IV melanoma 5-year survival >50%, at the cost of more irAEs."}, {"a": "Best anti-PD-1 response in melanoma and smokers' NSCLC", "b": "UV and tobacco mutational signatures give a high TMB", "why": "More non-synonymous mutations → more neoantigens → more T-cell targets."}]}, {"id": "s16", "lec": "26", "lo": "26.4", "kind": "cause-effect", "title": "Immune-related adverse event → key fact", "left": "irAE", "right": "Key fact", "pairs": [{"a": "Hypophysitis", "b": "Pituitary inflammation most characteristic of anti-CTLA-4", "why": "CTLA-4 pattern: hypophysitis, dermatitis, enterocolitis. CTLA-4 and combination blockade give more frequent, severe irAEs.", "hy": true}, {"a": "Immune colitis", "b": "Bloody diarrhea; steroid-refractory cases get infliximab or vedolizumab", "why": "Rule out infection, hold the drug, give high-dose glucocorticoids first.", "hy": true}, {"a": "Myocarditis", "b": "Rare and early, often with myositis — the most lethal irAE", "why": "Incidence and lethality are inverse: rash/arthralgia common and mild; myocarditis and neuro irAEs rare but deadly.", "hy": true}, {"a": "Thyroiditis", "b": "Transient thyrotoxicosis that progresses to hypothyroidism", "why": "Typical of PD-1/PD-L1 blockade; treat with thyroid hormone replacement."}, {"a": "Pneumonitis", "b": "Cough and ground-glass opacities on chest CT", "why": "PD-1/PD-L1 pattern; intermediate frequency and lethality."}, {"a": "Autoimmune diabetes", "b": "Abrupt insulin-dependent diabetes from β-cell destruction", "why": "T cells freed from PD-1 restraint destroy islets; managed with insulin."}]}, {"id": "s17", "lec": "26", "lo": "26.5", "kind": "term-def", "title": "Engineered immunotherapy → feature", "left": "Therapy or problem", "right": "Feature", "pairs": [{"a": "Anti-CD19 CAR T cell", "b": "scFv + CD28/4-1BB + CD3ζ; kills without MHC", "why": "Autologous T cells transduced with a viral vector; 70–90% CR in refractory B-ALL and DLBCL.", "hy": true}, {"a": "Blinatumomab", "b": "Bispecific engager linking CD3 to CD19; continuous infusion", "why": "BiTE: two linked scFvs. Short half-life → continuous IV infusion. Toxicities resemble CAR T."}, {"a": "Teclistamab", "b": "Bispecific engager linking CD3 to BCMA in myeloma", "why": "Second BiTE example; BCMA is on plasma cells."}, {"a": "Personalized mRNA vaccine", "b": "Encodes the patient's neoantigens to prime new CD8⁺ T cells", "why": "Tumor sequencing → mRNA → DC presentation; often combined with anti-PD-1."}, {"a": "Cytokine release syndrome", "b": "IL-6–driven fever, hypotension and hypoxia after T-cell expansion", "why": "Most common serious CAR T toxicity; macrophages release IL-6.", "hy": true}, {"a": "Tocilizumab", "b": "Anti-IL-6 receptor mAb used to treat CRS", "why": "± glucocorticoids. Also used in RA."}, {"a": "B-cell aplasia after CAR T", "b": "On-target, off-tumor loss of normal CD19⁺ cells; give IVIG", "why": "Normal B cells express CD19 → hypogammaglobulinemia."}, {"a": "CD19-negative relapse", "b": "Antigen escape by loss of the CAR target", "why": "Resistance mechanism; standard autologous CAR T does not cause GVHD."}]}, {"id": "s18", "lec": "26", "lo": "26.7", "kind": "drug-mech", "title": "Immunosuppressant → mechanism", "left": "Drug", "right": "Mechanism", "pairs": [{"a": "Cyclosporine", "b": "Binds cyclophilin; the complex inhibits calcineurin", "why": "NFAT stays phosphorylated → no IL-2 transcription. Nephrotoxic; gingival hyperplasia and hirsutism.", "hy": true}, {"a": "Tacrolimus", "b": "Binds FKBP12; the complex inhibits calcineurin", "why": "FK506. Same downstream effect as cyclosporine; more diabetes and neurotoxicity. Topical form for eczema.", "hy": true}, {"a": "Sirolimus", "b": "Binds FKBP12; the complex inhibits mTOR", "why": "IL-2 is still made, but IL-2R signaling cannot drive G1 → S (signal 3). Not nephrotoxic; hyperlipidemia, poor wound healing.", "hy": true}, {"a": "Azathioprine", "b": "Prodrug of 6-mercaptopurine that blocks purine synthesis", "why": "Check TPMT; allopurinol blocks xanthine oxidase → 6-MP buildup → pancytopenia."}, {"a": "Mycophenolate", "b": "Inhibits IMP dehydrogenase, starving lymphocytes of guanine", "why": "Lymphocytes depend on de novo purine synthesis."}, {"a": "Basiliximab", "b": "Anti-CD25 that blocks IL-2 binding without depleting cells", "why": "Non-depleting induction agent at transplant (daclizumab is the withdrawn humanized relative)."}, {"a": "Alemtuzumab", "b": "Anti-CD52 that profoundly depletes T and B cells", "why": "Transplant induction, CLL, MS; prolonged lymphopenia and infection risk."}, {"a": "Belatacept", "b": "CTLA-4–Ig that blocks B7 costimulation in transplant", "why": "Signal 2 blockade; abatacept is the RA counterpart."}]}], "seqs": [{"id": "q01", "lec": "24", "lo": "24.3", "title": "Cyclophosphamide activation", "prompt": "Put cyclophosphamide activation in order (first → last).", "steps": ["Oral cyclophosphamide (inactive prodrug)", "Hepatic CYP hydroxylation → 4-hydroxycyclophosphamide", "Ring opening to aldophosphamide", "Spontaneous split → phosphoramide mustard + acrolein", "Phosphoramide mustard cross-links guanine N7"], "why": "Liver activation, then nonenzymatic breakdown. Aldehyde dehydrogenase diverts aldophosphamide to inactive carboxyphosphamide in protected cells; acrolein causes hemorrhagic cystitis (mesna).", "hy": true}, {"id": "q02", "lec": "24", "lo": "24.3", "title": "Thymidylate supply and its drug blocks", "prompt": "Put the steps that supply thymidine for DNA in order (first → last).", "steps": ["Dihydrofolate (FH2)", "DHFR reduces it to tetrahydrofolate (FH4)", "FH4 picks up a carbon as N5,10-methylene-FH4", "Thymidylate synthase methylates dUMP → dTMP", "dTMP → dTTP is incorporated into DNA"], "why": "Methotrexate blocks DHFR (step 2); 5-FU/FdUMP blocks thymidylate synthase (step 4). Leucovorin enters as a reduced folate after the DHFR block.", "hy": true}, {"id": "q03", "lec": "25", "lo": "25.1", "title": "Growth-factor signaling cascade", "prompt": "Put the growth-signaling cascade in order (cell surface → nucleus).", "steps": ["Growth factor binds receptor tyrosine kinase", "Receptor dimerizes and cross-phosphorylates", "RAS is activated (GTP-bound)", "RAF → MEK → ERK kinase cascade", "Cyclin D/CDK4/6 phosphorylates Rb", "Free E2F drives G1 → S genes"], "why": "Drug at each step: cetuximab/trastuzumab (receptor), gefitinib/osimertinib (EGFR kinase), vemurafenib (BRAF), trametinib (MEK), palbociclib (CDK4/6).", "hy": true}, {"id": "q04", "lec": "25", "lo": "25.5", "title": "Companion diagnostic workflow", "prompt": "Put the steps of molecularly guided lung cancer treatment in order (first → last).", "steps": ["Biopsy the tumor or sample circulating tumor DNA", "Sequence for actionable drivers (EGFR, ALK, BRAF)", "Find an EGFR L858R mutation", "Start an EGFR tyrosine kinase inhibitor", "At progression, re-test for resistance (e.g., T790M)"], "why": "Tumors evolve under treatment, so re-analysis at progression identifies the next drug (T790M → osimertinib)."}, {"id": "q05", "lec": "26", "lo": "26.1", "title": "Cancer immunoediting", "prompt": "Put the phases of tumor–immune interaction in order (first → last).", "steps": ["Elimination: T and NK cells destroy most transformed cells", "Equilibrium: surviving variants held in check", "Further mutations select immune-evasive clones", "Escape: tumor grows despite the immune response"], "why": "Escape uses hiding (MHC I loss), defending (PD-L1), subverting (Tregs, TGF-β, IL-10) and excluding T cells. Checkpoint inhibitors push back toward elimination.", "hy": true}, {"id": "q06", "lec": "26", "lo": "26.2", "title": "Cancer–immunity cycle", "prompt": "Put the steps of the cancer–immunity cycle in order (first → last).", "steps": ["Dying tumor cells release antigens", "APCs capture and process the antigens", "APCs prime T cells in lymph nodes (MHC + B7–CD28)", "Effector T cells traffic to and infiltrate the tumor", "T cells recognize MHC–neoantigen and kill", "Killing releases more antigen for a new round"], "why": "CTLA-4 acts at priming (step 3); PD-1/PD-L1 at the killing step in the tumor (step 5). Vaccines boost priming; anti-VEGF aids infiltration."}, {"id": "q07", "lec": "26", "lo": "26.5", "title": "Making CAR T-cell therapy", "prompt": "Put the steps of CAR T-cell therapy in order (first → last).", "steps": ["Harvest the patient's T cells (leukapheresis)", "Transduce them with a viral vector encoding the CAR", "Expand the CAR T cells in culture", "Lymphodeplete the patient and reinfuse the cells", "CAR T cells kill CD19⁺ cells and persist"], "why": "Autologous 'living drug' (e.g., tisagenlecleucel). Watch for CRS (tocilizumab), neurotoxicity, B-cell aplasia and CD19-negative relapse."}, {"id": "q08", "lec": "26", "lo": "26.6", "title": "T-cell activation and drug targets", "prompt": "Put T-cell activation in order, from antigen recognition to proliferation.", "steps": ["Signal 1: TCR/CD3 binds MHC–peptide", "Calcineurin dephosphorylates NFAT, which enters the nucleus", "IL-2 and CD25 genes are switched on", "Signal 3: IL-2 binds its receptor → mTOR", "Nucleotide synthesis and clonal expansion"], "why": "Calcineurin: cyclosporine/tacrolimus. IL-2R: basiliximab. mTOR: sirolimus/everolimus. Purines: azathioprine, mycophenolate. Signal 2 (CD28–B7): abatacept/belatacept.", "hy": true}], "grids": [{"id": "g01", "lec": "24", "lo": "24.3", "title": "Cytotoxic drug chart", "blurb": "Hard: use the signature toxicity to name the drug, then fill its class and cell-cycle phase.", "cols": [{"h": "Drug", "dep": 3}, {"h": "Class", "dep": 0}, {"h": "Cell-cycle phase", "dep": 0}, {"h": "Signature toxicity"}], "rows": [["Vincristine", "Vinca alkaloid", "M phase", "Neuropathy, constipation, jaw pain"], ["Paclitaxel", "Taxane", "M phase", "Neuropathy, hypersensitivity"], ["Cyclophosphamide", "Nitrogen mustard prodrug", "Cell-cycle nonspecific", "Hemorrhagic cystitis"], ["Cisplatin", "Platinum compound", "Cell-cycle nonspecific", "Nephrotoxicity, ototoxicity"], ["Methotrexate", "Antifolate (DHFR inhibitor)", "S phase", "Teratogen; leucovorin-rescuable"], ["5-Fluorouracil", "Pyrimidine analog (TS inhibitor)", "S phase", "Mucositis, hand–foot syndrome"], ["Irinotecan", "Topoisomerase I inhibitor", "S phase", "Severe diarrhea"]], "easyGiven": [0], "hardGiven": [3], "decoys": {"0": ["Vinblastine", "Carboplatin", "Etoposide"], "1": ["Anthracycline", "Purine analog", "Topoisomerase II inhibitor"], "2": ["G1 phase", "G0 only"], "3": ["Cumulative cardiomyopathy", "Pulmonary fibrosis", "Acneiform rash"]}, "notes": ["Blocks tubulin polymerization; neurotoxicity is dose-limiting and it is relatively marrow-sparing.", "Stabilizes microtubules; neuropathy plus myelosuppression and hypersensitivity reactions.", "Hepatic activation to phosphoramide mustard; acrolein → cystitis (mesna).", "Active without metabolism; nephrotoxicity with Mg²⁺ wasting (hydration, amifostine) and ototoxicity.", "DHFR block → no FH4; teratogenic/abortifacient; leucovorin bypasses the block.", "FdUMP inhibits TS; leucovorin potentiates it. Capecitabine is the oral prodrug.", "Traps topo I–DNA complexes; GI toxicity, not cardiotoxicity."], "hy": "Spindle poisons = M phase; antimetabolites = S phase; alkylators/platins = nonspecific. Vincristine neuropathy, cyclophosphamide cystitis, cisplatin nephrotoxicity, irinotecan diarrhea, doxorubicin cardiomyopathy."}, {"id": "g02", "lec": "24", "lo": "24.4", "title": "Rescue and protective agents", "blurb": "Hard: use the toxicity prevented to name the protective agent, then fill the culprit drug and how it works.", "cols": [{"h": "Protective agent", "dep": 1}, {"h": "Toxicity prevented"}, {"h": "Culprit drug", "dep": 0}, {"h": "How it works", "dep": 0}], "rows": [["Leucovorin", "Folate-depletion mucositis, cytopenias", "Methotrexate", "Reduced folate bypasses DHFR"], ["Mesna", "Hemorrhagic cystitis", "Cyclophosphamide, ifosfamide", "Urinary thiol binds acrolein"], ["Amifostine", "Nephrotoxicity", "Cisplatin", "Free-radical scavenger"], ["Dexrazoxane", "Cardiomyopathy", "Doxorubicin", "Iron chelator"], ["Filgrastim (G-CSF)", "Prolonged neutropenic nadir", "Myelosuppressive regimens", "Stimulates neutrophil production"], ["Glucarpidase", "Toxic drug levels in renal failure", "Methotrexate", "Enzyme cleaves circulating drug"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Folic acid", "Allopurinol", "Ondansetron"], "2": ["Paclitaxel", "Irinotecan", "Bleomycin"], "3": ["Inhibits xanthine oxidase", "Alkalinizes urine", "Blocks DHFR"]}, "notes": ["Folic acid fails because it needs DHFR; leucovorin (N5-formyl-FH4) does not.", "Mesna is concentrated in urine; hydration and frequent voiding also help.", "Aggressive saline hydration is the mainstay; amifostine is a cytoprotectant.", "Doxorubicin–iron complexes drive oxidative injury; also cap the cumulative dose.", "Neutrophil nadir is ~7–14 days after a dose; G-CSF shortens it.", "Used with leucovorin when high-dose methotrexate clearance fails in AKI."], "hy": "Rescue pairs are classic: leucovorin–MTX, mesna–cyclophosphamide, amifostine–cisplatin, dexrazoxane–doxorubicin. No antidote for vinca/taxane neuropathy."}, {"id": "g03", "lec": "25", "lo": "25.2", "title": "Antibody naming and format", "blurb": "Hard: use the target to name the antibody, then fill its name stem/origin and IgG format.", "cols": [{"h": "Antibody", "dep": 1}, {"h": "Target"}, {"h": "Stem → origin", "dep": 0}, {"h": "IgG format", "dep": 0}], "rows": [["Cetuximab", "EGFR", "-xi- chimeric", "IgG1"], ["Rituximab", "CD20", "-xi- chimeric", "IgG1"], ["Trastuzumab", "HER2", "-zu- humanized", "IgG1"], ["Bevacizumab", "VEGF-A", "-zu- humanized", "IgG1"], ["Alemtuzumab", "CD52", "-zu- humanized", "IgG1"], ["Nivolumab", "PD-1", "-u- fully human", "IgG4"], ["Ipilimumab", "CTLA-4", "-u- fully human", "IgG1"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Infliximab", "Basiliximab", "Daclizumab"], "2": ["-o- murine", "-ki- cytokine"], "3": ["IgG3", "IgM", "IgA"]}, "notes": ["Mouse variable + human constant regions; binds EGFR domain III.", "Chimeric anti-CD20 for B-cell lymphomas; classic -xi- example.", "Only mouse CDRs are grafted (humanized); ADCC is part of its action.", "Humanized anti-VEGF; binds the ligand, not the receptor.", "Humanized anti-CD52 that depletes lymphocytes (transplant induction, CLL, MS).", "Fully human IgG4 — weak effector function suits a pure PD-1 blocker.", "Fully human IgG1 anti-CTLA-4 that releases the priming brake."], "hy": "-ximab = chimeric, -zumab = humanized, -umab = fully human; -mab = antibody, -nib = small-molecule kinase inhibitor. IgG1 = most anticancer mAbs; IgG4 = anti-PD-1 blockers."}, {"id": "g04", "lec": "25", "lo": "25.3", "title": "Anti-EGFR, HER2 and VEGF antibodies", "blurb": "Hard: use the binding site to name the antibody, then fill its main use and clinical pearl.", "cols": [{"h": "Antibody", "dep": 1}, {"h": "Binding site"}, {"h": "Main use", "dep": 0}, {"h": "Clinical pearl", "dep": 0}], "rows": [["Cetuximab", "EGFR domain III", "Colorectal cancer, only if RAS wild type", "Acneiform rash tracks response"], ["Trastuzumab", "HER2 domain IV", "HER2-amplified breast cancer", "↓EF; avoid with doxorubicin"], ["Pertuzumab", "HER2 domain II", "HER2-amplified breast cancer", "Paired with trastuzumab + docetaxel"], ["Bevacizumab", "Circulating VEGF-A", "Colorectal cancer, regardless of RAS", "Hypertension, GI perforation"], ["Ranibizumab", "VEGF-A (Fab, no Fc)", "Wet macular degeneration", "Intravitreal; short systemic t½"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Rituximab", "Ipilimumab", "Alemtuzumab"], "2": ["BRAF V600E melanoma", "Chronic myeloid leukemia", "KRAS-mutant lung cancer"], "3": ["Hemorrhagic cystitis", "Hypophysitis", "Gingival hyperplasia"]}, "notes": ["Blocks ligand binding; rash = on-target EGFR blockade in basal keratinocytes. Useless if RAS is mutated.", "Cardiotoxicity from loss of HER2 repair signaling (usually reversible); additive with doxorubicin, so pair with a taxane.", "Domain II is the dimerization arm; dual blockade + docetaxel added ~15.7 months of OS.", "Normalizes leaky vessels → better drug delivery; also thromboembolism and poor wound healing.", "Fab only: no FcRn recycling and no effector function."], "hy": "Cetuximab/panitumumab → rash (needs RAS wild type); trastuzumab → reversible ↓EF; bevacizumab → hypertension, bleeding/clots, GI perforation, poor wound healing."}, {"id": "g05", "lec": "25", "lo": "25.5", "title": "Targeted drugs by molecular finding", "blurb": "Hard: use the biomarker/tumor to pick the drug, then fill its target and key point.", "cols": [{"h": "Drug", "dep": 1}, {"h": "Biomarker / tumor"}, {"h": "Target", "dep": 0}, {"h": "Key point", "dep": 0}], "rows": [["Imatinib", "t(9;22) CML; c-KIT GIST", "BCR-ABL kinase", "Myelosuppression; T315I resistance"], ["Gefitinib", "EGFR exon 19 del or L858R NSCLC", "Wild-type and mutant EGFR", "Rash; T790M resistance"], ["Osimertinib", "EGFR T790M NSCLC", "Mutant EGFR, spares wild type", "Less rash than gefitinib"], ["Alectinib", "EML4-ALK NSCLC", "ALK kinase", "Fusion from chromosome 2 inversion"], ["Vemurafenib", "BRAF V600E melanoma", "Mutant BRAF", "Resistance within ~6 months"], ["Trametinib", "Add-on to a BRAF inhibitor", "MEK", "Delays BRAF-inhibitor resistance"], ["Palbociclib", "HR⁺/HER2⁻ breast, with letrozole", "CDK4/6", "Neutropenia; G1 arrest"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Lapatinib", "Venetoclax", "Everolimus"], "2": ["KRAS", "PI3K", "BCL-2"], "3": ["Hemorrhagic cystitis", "Needs hepatic activation", "Hypophysitis"]}, "notes": ["Philadelphia chromosome kinase; imatinib also hits PDGFR and c-KIT.", "Exon 19 del (~45%) and L858R (~40%) make tumors EGFR-addicted; T790M in ~50% of resistant tumors.", "Third-generation TKI built for T790M; sparing wild-type EGFR means less skin toxicity.", "Often younger non-smokers; crizotinib is the other ALK inhibitor.", "~50% of melanomas carry V600E; MAPK reactivation causes resistance.", "Dabrafenib + trametinib blocks two sequential nodes; also adjuvant use.", "-ciclib keeps Rb active; HER2-negative is required."], "hy": "Match drug to driver: BCR-ABL → imatinib; EGFR mutant → gefitinib/osimertinib (T790M); EML4-ALK → alectinib; BRAF V600E → BRAF-i + MEK-i; HR⁺/HER2⁻ → CDK4/6-i + endocrine; RAS wild type → anti-EGFR mAb."}, {"id": "g06", "lec": "26", "lo": "26.2", "title": "Checkpoint antibody chart", "blurb": "Hard: use the clue to name the drug, then fill its target and where the block acts.", "cols": [{"h": "Drug", "dep": 1}, {"h": "Classic clue"}, {"h": "Target", "dep": 0}, {"h": "Where it acts", "dep": 0}], "rows": [["Ipilimumab", "IgG1; hypophysitis and colitis", "CTLA-4", "Lymph-node priming"], ["Nivolumab", "Fully human IgG4; relapsed Hodgkin", "PD-1", "Tumor / peripheral tissue"], ["Pembrolizumab", "Humanized IgG4; MSI-high tumors", "PD-1", "Tumor / peripheral tissue"], ["Atezolizumab", "Binds the tumor-cell side of synapse", "PD-L1", "Tumor / peripheral tissue"], ["Abatacept", "CTLA-4–Ig fusion used in RA", "B7 (CD80/CD86)", "APC costimulation (suppresses)"]], "easyGiven": [0], "hardGiven": [1], "decoys": {"0": ["Basiliximab", "Tocilizumab", "Blinatumomab"], "2": ["CD28", "CD19", "CD25"], "3": ["Thymic selection", "IL-2 receptor signaling"]}, "notes": ["Releases the early brake during priming; more frequent and severe irAEs than anti-PD-1.", "Reed–Sternberg cells overexpress PD-L1 (9p24.1); ~87% response in refractory disease.", "Approved for any dMMR/MSI-high solid tumor regardless of tissue of origin.", "Anti-PD-L1 (also durvalumab, avelumab); blocking either side of PD-1–PD-L1 restores killing.", "Mimics CTLA-4 to block CD28 costimulation — the immunosuppressive opposite of ipilimumab."], "hy": "Anti-CTLA-4 = ipilimumab (priming
